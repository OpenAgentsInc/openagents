# Managed with cargo-hakari 0.9.39. Regenerate after dependency changes.
hakari-package = "openagents-workspace-hack"
resolver = "2"
dep-format-version = "4"
# Unify shared build-script dependencies without adding target-only dependencies to the host.
unify-target-host = "unify-if-both"
# Each consuming workspace selects its own generated crate with [patch.crates-io].
workspace-hack-line-style = "version-only"
platforms = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]

[traversal-excludes]
# pay-host needs serde_json's arbitrary_precision. Unified into every crate,
# it turns numbers read through untagged or buffered values into maps, which
# breaks the Verse packs and the spell checkpoint replays (#12183).
workspace-members = ["pay-host"]
# These optional backends must remain opt-in on supported platforms.
third-party = [
    { name = "candle-core" },
    { name = "candle-nn" },
    { name = "candle-transformers" },
    # The renderer stack stays out of the workspace-hack, so a crate without
    # a renderer (openagents-web, #12183) doesn't build it.
    { name = "wgpu" },
    { name = "wgpu-core" },
    { name = "wgpu-hal" },
    { name = "wgpu-types" },
    { name = "naga" },
    # Wallet test helpers must not become normal dependencies.
    { name = "breez-sdk-spark", git = "https://github.com/breez/spark-sdk", tag = "0.26.0" },
    { name = "spark", git = "https://github.com/breez/spark-sdk", tag = "0.26.0" },
    { name = "spark-wallet", git = "https://github.com/breez/spark-sdk", tag = "0.26.0" },
]

[final-excludes]
# This tiny build dependency must not pull the application graph onto the host.
# The design tokens, the Aethyr view-tree schema, and the device profile are
# small leaf crates the website, the engine (wasm), and the mobile app all
# link; they must not pull the application graph.
workspace-members = ["oa-tokens", "aethyr-ui", "aethyr-profile"]
