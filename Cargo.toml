[workspace]
members = [
    "crates/coderbench","crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
publish = false
edition = "2024"
rust-version = "1.97.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# The profile `scripts/build-plugin-guests.sh` builds Wasm guests with. The
# guests are checked in and inlined into `programs/evidence-guests.json`,
# so size is a review cost. No native build uses it.
[profile.guest]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
