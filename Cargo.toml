# OpenAgents Rust workspace
# The released CLI is the terminal authority. Managed-computer services remain
# here pending the deployment inventory in the codebase deletion audit. Their
# source came from the private OpenAgentsInc/cloud repository;
# docs/cloud/MIGRATION.md records that migration.

[workspace]
members = [
    "crates/openagents-cli",
    "crates/openagents-cloud-contract",
    "crates/oa-codex-control",
    "crates/oa-node",
    "crates/oa-workroomd",
    "crates/oa-cloud-run-bridge",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/OpenAgentsInc/openagents"

[workspace.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.37"
