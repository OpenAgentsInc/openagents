[workspace]
members = [
    "crates/coderbench","crates/*"]
exclude = [
    # Its own workspace, for Breez's SQLite; see its Cargo.toml.
    "crates/openagents-mobile",
    # Psionic, the ML and inference stack, is its own workspace: CUDA and
    # Metal backends, its own lints and dependency versions. See its README.
    "crates/psionic",
    # Vendored third-party workspaces, patched in by path; see each one.
    "vendor",
]
resolver = "2"

[workspace.dependencies]
# Pinned exactly; reviewed in docs/dependencies.md (iroh). Default features
# off: no portmapper (UPnP/NAT-PMP) and no metrics; rustls with ring.
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring", "fast-apple-datapath"] }
iroh-relay = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
# Nearby approval: mDNS on _openagents._udp (docs/dependencies.md, iroh).
# 0.5.0 is the newest release at least seven days old.
iroh-mdns-address-lookup = { version = "=0.5.0", default-features = false }

[workspace.package]
version = "0.1.0"
publish = false
edition = "2024"
rust-version = "1.97.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
# macOS ld's "__eh_frame section too large ... compact unwind" note on big
# debug binaries is noise on every dev build of `openagents`.
linker_messages = "allow"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# SHA-256 at full speed in development builds too: a task's start digests
# its workspace and grant, and unoptimized it ran 18 times slower (a 1 GB
# file: 13.1 s against 0.74 s on CoderOS).
[profile.dev.package.sha2]
opt-level = 3

# Grow Little Bunny's bot playtests run hundreds of whole gardens.
[profile.dev.package.bunny-rules]
opt-level = 3

# Real-time movement and GPU command submission must meet the frame budget in
# development builds, including the binary used by the local verse-play alias.
[profile.dev.package.verse]
opt-level = 3
[profile.dev.package.verse-content]
opt-level = 3
[profile.dev.package.verse-core]
opt-level = 3
[profile.dev.package.verse-gym]
opt-level = 3
[profile.dev.package.verse-imported]
opt-level = 3
[profile.dev.package.verse-host]
opt-level = 3
[profile.dev.package.verse-engine]
opt-level = 3
[profile.dev.package.verse-gfx]
opt-level = 3
[profile.dev.package.verse-net]
opt-level = 3
[profile.dev.package.verse-pbr]
opt-level = 3
[profile.dev.package.verse-bake]
opt-level = 3
[profile.dev.package.verse-world]
opt-level = 3
[profile.dev.package.verse-zone-everglade]
opt-level = 3
[profile.dev.package.verse-zone-grove]
opt-level = 3
[profile.dev.package.verse-zone-lab]
opt-level = 3
[profile.dev.package.verse-zone-lagrange]
opt-level = 3
[profile.dev.package.physics]
opt-level = 3
[profile.dev.package.wgpu]
opt-level = 3
[profile.dev.package.wgpu-core]
opt-level = 3
[profile.dev.package.wgpu-hal]
opt-level = 3
[profile.dev.package.naga]
opt-level = 3

# Metal command encoding repeatedly checks Objective-C method signatures.
# Optimize the bridge and encoding parser while retaining debug assertions.
[profile.dev.package.objc2]
opt-level = 3
[profile.dev.package.objc2-encode]
opt-level = 3

# Large chamber frames use a bounded lossless codec on the real-time transport.
[profile.dev.package.miniz_oxide]
opt-level = 3

# Crowded replication spends server time parsing strings and formatting numbers.
[profile.dev.package.serde_json]
opt-level = 3
[profile.dev.package.memchr]
opt-level = 3
[profile.dev.package.zmij]
opt-level = 3

# The profile `scripts/build-plugin-guests.sh` builds Wasm guests with. The
# guests are checked in and inlined into `programs/evidence-guests.json`,
# so size is a review cost. No native build uses it.
[profile.guest]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false

# breez/boltz-client, a git dependency of breez-sdk-spark, is no longer
# published (404 on 2026-10-04); build its pinned revision from the vendored
# copy. See vendor/boltz-client/VENDORED.md.
[patch."https://github.com/breez/boltz-client"]
boltz-client = { path = "vendor/boltz-client/crates/lib" }
macros = { path = "vendor/boltz-client/crates/macros" }
platform-utils = { path = "vendor/boltz-client/crates/platform-utils" }
