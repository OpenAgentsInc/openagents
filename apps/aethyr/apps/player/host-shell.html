<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a1a1a" />
    <title>Play · OpenAgents</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1a1a1a;
      }
      #preview-frame {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
      #ui-root {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #ui-root button,
      #ui-root input,
      #ui-root select,
      #ui-root textarea,
      #ui-root [role="dialog"] {
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <iframe
      id="preview-frame"
      title="Medieval Town world"
      allow="
        fullscreen;
        camera 'none';
        microphone 'none';
        clipboard-read 'none';
        clipboard-write 'none';
      "
      sandbox="allow-scripts allow-same-origin allow-pointer-lock"
      src="about:blank"
    ></iframe>
    <div id="ui-root"></div>
    <script type="module" src="/apps/editor/main.tsx"></script>
  </body>
</html>
