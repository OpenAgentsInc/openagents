<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aethyrforge world</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #191919;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
      #notice {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        color: #eeeeee;
        font: 14px system-ui;
        text-align: center;
        pointer-events: none;
      }
      /* Character labels: brown cards, orange names, black text shadow. */
      .npc-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .npc-label {
        position: absolute;
        transform: translate(-50%, -100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        max-width: 260px;
        font: 13px system-ui;
      }
      .npc-name {
        background: #2a1a10d9;
        color: #f2a640;
        border: 1px solid #5c3b20;
        border-radius: 4px;
        padding: 2px 8px;
        white-space: nowrap;
        text-shadow: 0 1px 0 #000;
      }
      .npc-label[data-nearby] .npc-name {
        border-color: #f2a640;
      }
      .npc-line {
        margin: 0;
        background: #f1e2c8;
        color: #1a0f08;
        border: 1px solid #5c3b20;
        border-radius: 8px;
        padding: 6px 10px;
        line-height: 1.35;
        text-align: center;
      }
      .npc-line[data-kind="emote"] {
        font-style: italic;
      }
      .npc-actions {
        display: flex;
        gap: 4px;
        pointer-events: auto;
      }
      .npc-actions button {
        background: #1a0f08e6;
        color: #f1e2c8;
        border: 1px solid #8a5a2b;
        border-radius: 4px;
        padding: 3px 8px;
        font: 12px system-ui;
        cursor: pointer;
      }
      .npc-actions button:hover,
      .npc-actions button:focus-visible {
        border-color: #f2a640;
        color: #f2a640;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <canvas
      id="world"
      tabindex="0"
      aria-label="Walkable Medieval Town"
    ></canvas>
    <div id="notice">Preparing the world…</div>
    <script type="module" src="/apps/preview/main.ts"></script>
  </body>
</html>
