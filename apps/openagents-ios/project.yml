name: OpenAgents
options:
  bundleIdPrefix: com.openagents
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    DEVELOPMENT_TEAM: HQWSG26L43
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1418"
    OA_IOS_BUNDLE_ID: com.openagents.app
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    CLANG_ENABLE_MODULES: YES
targets:
  OpenAgents:
    type: application
    platform: iOS
    sources:
      # Clean-sheet native SwiftUI/UIKit shell for Antigravity over Tailscale (#13993, Option 2).
      - Sources
      # Shared Tailscale IP/MagicDNS/TXT/admission/direct wire rules (Foundation-only).
      - ../shared/native/AppTailnet.swift
      # Lean compiled Coax C bridge (mobile-core.coax -> Generated/mobile_core.c) + opaque C ABI shim.
      - path: Generated/mobile_core.c
        compilerFlags: "-Wno-unused-function -Wno-unused-variable -Wno-unknown-attributes -ffp-contract=off -fno-fast-math"
      - path: mobile-core-bridge.c
        compilerFlags: "-IGenerated -I../shared/native"
      - OpenAgents/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(OA_IOS_BUNDLE_ID)"
        PRODUCT_NAME: OpenAgents
        PROVISIONING_PROFILE_SPECIFIER: "$(OA_APP_PROVISIONING_PROFILE)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: OpenAgents/Info.plist
        CODE_SIGN_ENTITLEMENTS: OpenAgents/OpenAgents.entitlements
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: OpenAgents
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "OpenAgents discovers your Mac nearby so it can connect to Antigravity over Tailscale."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SWIFT_OBJC_BRIDGING_HEADER: Bridge.h
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Generated", "$(SRCROOT)/../shared/native"]
        GCC_OPTIMIZATION_LEVEL: "2"
        # Frame budget (#13747): no C function in the app may hold a stack frame over 512 KB.
        # Large Coax records live in heap-allocated MobileCoreWork; no 64 MB stack hack needed.
        OTHER_CFLAGS: ["$(inherited)", "-Wframe-larger-than=524288", "-Werror=frame-larger-than"]
        DEAD_CODE_STRIPPING: YES
        ENABLE_DEBUG_DYLIB: NO
  OpenAgentsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/MobileCoreTests.swift
    dependencies:
      - target: OpenAgents
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openagents.app.tests
        GENERATE_INFOPLIST_FILE: YES
  OpenAgentsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests/AntigravityUITests.swift
    dependencies:
      - target: OpenAgents
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openagents.app.ui-tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  OpenAgents:
    build:
      targets:
        OpenAgents: all
    test:
      targets:
        - OpenAgentsTests
  OpenAgentsTests:
    build:
      targets:
        OpenAgents: all
        OpenAgentsTests: [test]
    test:
      targets: [OpenAgentsTests]
  OpenAgentsUITests:
    build:
      targets:
        OpenAgents: all
        OpenAgentsUITests: [test]
    test:
      targets: [OpenAgentsUITests]
