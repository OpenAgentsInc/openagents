name: OpenAgents
options:
  bundleIdPrefix: com.openagents
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    DEVELOPMENT_TEAM: HQWSG26L43
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    CLANG_ENABLE_MODULES: YES
packages:
  BreezSdkSpark:
    url: https://github.com/breez/breez-sdk-spark-swift.git
    exactVersion: 0.27.2
targets:
  OpenAgents:
    type: application
    platform: iOS
    sources:
      - StarterApp.swift
      - ../shared/native
      - ../shared/host/apple/AppAuth.swift
      - ../shared/host/apple/DeviceKey.swift
      - ../shared/host/apple/Deep.swift
      - ../shared/host/apple/PhoneTurn.swift
      - ../../metaverse-engine/host/apple/PageHost.m
      - NativeWorldUnit.c
      - path: Generated/NativePlayerBind.c
        compilerFlags: "-Wno-unused-function -Wno-unused-variable"
      - NativeAudioUnit.c
      - path: Generated/native-audio.c
        compilerFlags: "-Wno-unused-function -Wno-unused-variable -Wno-unknown-attributes -ffp-contract=off -fno-fast-math"
      - ../../metaverse-engine/host/apple/PageAudio.swift
      - ../metaverse-engine-desktop/Sources/MetalAudio.swift
      - path: Generated/engine-core-face.c
        compilerFlags: "-Wno-unused-function -Wno-unused-variable -DS_hash=engine_core_S_hash -DS_hex=engine_core_S_hex"
      - path: Generated/WorldShaders
        type: folder
        buildPhase: resources
      - path: Generated/WorldRuntimes.plist
        buildPhase: resources
      - OpenAgents/SignIn/PhoneSignIn.swift
      - OpenAgents/SignIn/NostrKey.swift
      - OpenAgents/Platform/AppAnalytics.swift
      - OpenAgents/Platform/NostrSign.c
      - OpenAgents/Assets.xcassets
      - OpenAgents/Wallet/SparkHost.swift
      - OpenAgents/Wallet/WalletKeychain.swift
      - OpenAgents/Wallet/BIP39.swift
      - OpenAgents/Wallet/BreezKey.swift
      - path: OpenAgents/Resources/bip39-english.txt
        buildPhase: resources
      - path: ../../components/fonts/DMSans-Regular.ttf
        buildPhase: resources
      - path: ../../components/fonts/DMSans-Medium.ttf
        buildPhase: resources
      - path: ../../components/fonts/DMSans-Italic.ttf
        buildPhase: resources
      - path: ../../components/fonts/DMSans-BoldItalic.ttf
        buildPhase: resources
      - path: ../../components/fonts/DMSans-Bold.ttf
        buildPhase: resources
      - path: Generated/NativeText.c
        compilerFlags: "-Wno-unused-function -Wno-unused-variable"
      - path: Generated/NativeComposer.c
        compilerFlags: "-Wno-unused-function -Wno-unused-variable"
      - path: Generated/WalletBalance.c
        compilerFlags: "-Wno-unused-function -Wno-unused-variable"
      - path: Generated/NativePolicy.c
        compilerFlags: "-Wno-unused-function -Wno-unused-variable"
      - path: Generated/NativeWire.c
        compilerFlags: "-Wno-unused-function -Wno-unused-variable"
      - path: Generated/PhoneSignin.c
        compilerFlags: "-Wno-unused-function -Wno-unused-variable"
      # The book's first milestone (#13516): the shared app (apps/shared/openagents-app.coax, compiled through
      # OpenagentsAppUnit.c) drawn with UIKit controls, opened with -OASharedApp YES or -OADrive SOCKET, and
      # the phone's half of coax drive (apps/shared/host/drive.c on that socket).
      - OpenAgents/Shared
      - path: ../shared/host/apple/phone-drive.c
        compilerFlags: "-Wno-unused-function"
      - path: Vendor/secp256k1/src/secp256k1.c
        compilerFlags: "-DENABLE_MODULE_EXTRAKEYS=1 -DENABLE_MODULE_SCHNORRSIG=1 -DECMULT_WINDOW_SIZE=8"
      - path: Vendor/secp256k1/src/precomputed_ecmult.c
        compilerFlags: "-DECMULT_WINDOW_SIZE=8"
      - path: Vendor/secp256k1/src/precomputed_ecmult_gen.c
        compilerFlags: "-DECMULT_WINDOW_SIZE=8"
      - path: Starter
        type: folder
        buildPhase: resources
      - path: Native.plist
        buildPhase: resources
    dependencies:
      - package: BreezSdkSpark
      - target: SpliceBotsRuntime
        embed: true
      - target: EvergladeRuntime
        embed: true
      - target: EvergladeForestRuntime
        embed: true
      - target: MadeRealmRuntime
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openagents.app
        PRODUCT_NAME: OpenAgents
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1075"
        PROVISIONING_PROFILE_SPECIFIER: "$(OA_APP_PROVISIONING_PROFILE)"
        OTHER_LDFLAGS: ["$(inherited)", "-Wl,-export_dynamic"]
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) COAX_NATIVE_BALANCE"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: OpenAgents/Info.plist
        CODE_SIGN_ENTITLEMENTS: OpenAgents/OpenAgents.entitlements
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: OpenAgents
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSCameraUsageDescription: "OpenAgents uses the camera when you choose to scan a code."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "OpenAgents verifies your identity when you approve a protected action."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "OpenAgents listens only when you turn voice on."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SWIFT_OBJC_BRIDGING_HEADER: NativeBridge.h
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Generated"]
        GCC_OPTIMIZATION_LEVEL: "2"
  SpliceBotsRuntime:
    type: framework
    platform: iOS
    sources:
      - Generated/Worlds/splice-bots/splice-bots.c
      - Generated/Worlds/splice-bots/Animelab-style.c
      - Generated/Worlds/splice-bots/splice-bots.face.c
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openagents.runtime.splice-bots
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: NO
        GCC_SYMBOLS_PRIVATE_EXTERN: NO
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "COAXIAL_NATIVE_ADDRESS=1"]
        OTHER_CFLAGS: ["$(inherited)", "-Wno-unknown-attributes", "-Wno-unused-function", "-ffp-contract=off", "-fno-fast-math"]
        OTHER_LDFLAGS: ["$(inherited)", "-Wl,-undefined,dynamic_lookup"]
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Generated/Worlds/splice-bots"]
  EvergladeForestRuntime:
    type: framework
    platform: iOS
    sources:
      - Generated/Worlds/everglade2/client.c
      - Generated/Worlds/everglade2/Everglade-step.c
      - Generated/Worlds/everglade2/Sticks.c
      - Generated/Worlds/everglade2/everglade2.face.c
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openagents.runtime.everglade-forest
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: NO
        GCC_SYMBOLS_PRIVATE_EXTERN: NO
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "COAXIAL_NATIVE_ADDRESS=1"]
        OTHER_CFLAGS: ["$(inherited)", "-Wno-unknown-attributes", "-Wno-unused-function", "-ffp-contract=off", "-fno-fast-math"]
        OTHER_LDFLAGS: ["$(inherited)", "-Wl,-undefined,dynamic_lookup"]
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Generated/Worlds/everglade2"]
  EvergladeRuntime:
    type: framework
    platform: iOS
    sources:
      - Generated/Worlds/everglade/everglade5e.c
      - Generated/Worlds/everglade/Everglade-step.c
      - Generated/Worlds/everglade/Grid.c
      - Generated/Worlds/everglade/River.c
      - path: Generated/Worlds/everglade/Guard-guide-policy.c
        compilerFlags: "-Dinput_runs=guard_guide_input_runs"
      - Generated/Worlds/everglade/Everglade5e-rules.c
      - Generated/Worlds/everglade/everglade5e.face.c
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openagents.runtime.everglade
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: NO
        GCC_SYMBOLS_PRIVATE_EXTERN: NO
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "COAXIAL_NATIVE_ADDRESS=1"]
        OTHER_CFLAGS: ["$(inherited)", "-Wno-unknown-attributes", "-Wno-unused-function", "-ffp-contract=off", "-fno-fast-math"]
        OTHER_LDFLAGS: ["$(inherited)", "-Wl,-undefined,dynamic_lookup"]
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Generated/Worlds/everglade"]
  MadeRealmRuntime:
    type: framework
    platform: iOS
    sources:
      - Generated/Worlds/myrealm/myrealm.c
      - Generated/Worlds/myrealm/myrealm.face.c
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openagents.runtime.myrealm
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: NO
        GCC_SYMBOLS_PRIVATE_EXTERN: NO
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "COAXIAL_NATIVE_ADDRESS=1"]
        OTHER_CFLAGS: ["$(inherited)", "-Wno-unknown-attributes", "-Wno-unused-function", "-ffp-contract=off", "-fno-fast-math"]
        OTHER_LDFLAGS: ["$(inherited)", "-Wl,-undefined,dynamic_lookup"]
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Generated/Worlds/myrealm"]
  OpenAgentsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [StarterTests]
    dependencies:
      - target: OpenAgents
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.openagents.app.starter.tests
  OpenAgentsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [StarterUITests]
    dependencies:
      - target: OpenAgents
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.openagents.app.starter.uitests
schemes:
  OpenAgents:
    build:
      targets:
        OpenAgents: all
    test:
      targets:
        - name: OpenAgentsTests
          selectedTests: [NativePackageTests, NativeProgramTests, SparkBalanceTests]
        - name: OpenAgentsUITests
          selectedTests: [StarterUITests/testEmbeddedCoaxAccountModuleRuns, BalanceUITests]
  CoaxNativeLive:
    build:
      targets:
        OpenAgents: all
    test:
      targets:
        - name: OpenAgentsUITests
          selectedTests: [StarterUITests/testLiveSignedCoaxUpdateChangesInstalledApp]
  CoaxNativeBalanceLive:
    build:
      targets:
        OpenAgents: all
    test:
      targets:
        - name: OpenAgentsTests
          selectedTests: [SparkBalanceLiveTests]

  CoaxNativeChat:
    build:
      targets:
        OpenAgents: all
    test:
      targets:
        - name: OpenAgentsTests
          selectedTests: [NativeMarkdownTests]
        - name: OpenAgentsUITests
          selectedTests: [ChatUITests]

  CoaxNativeWorlds:
    build:
      targets:
        OpenAgents: all
    test:
      targets:
        - name: OpenAgentsTests
          selectedTests: [NativeWorldTests, NativeWorldDownloadTests, NativeWorldProgramTests]

  CoaxNativeWorldsLive:
    build:
      targets:
        OpenAgents: all
    test:
      targets:
        - name: OpenAgentsUITests
          selectedTests: [WorldsUITests]
