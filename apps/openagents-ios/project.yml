name: OpenAgents
options:
  bundleIdPrefix: com.openagents
  deploymentTarget:
    iOS: "18.0"
packages:
  BreezSdkSpark:
    url: https://github.com/breez/breez-sdk-spark-swift.git
    exactVersion: 0.27.2
settings:
  base:
    DEVELOPMENT_TEAM: HQWSG26L43
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    CLANG_ENABLE_MODULES: YES
targets:
  OpenAgents:
    type: application
    platform: iOS
    sources:
      - path: OpenAgents
        excludes: [Platform/Stages.metal, Info.plist, OpenAgents.entitlements]
      - path: Generated/Home.c
        compilerFlags: "-Wno-comma -Wno-unused-function -Wno-unused-variable -Wno-unused-but-set-variable"
      - path: Generated/Player.c
        compilerFlags: "-Wno-comma -Wno-unused-function -Wno-unused-variable -Wno-unused-but-set-variable"
      - path: Generated/Grid.c
        compilerFlags: "-Wno-comma -Wno-unused-function -Wno-unused-variable -Wno-unused-but-set-variable"
      - path: Generated/Cast.c
        compilerFlags: "-Wno-comma -Wno-unused-function -Wno-unused-variable -Wno-unused-but-set-variable"
      - path: Generated/Benchmarks.c
        compilerFlags: "-Wno-comma -Wno-unused-function -Wno-unused-variable -Wno-unused-but-set-variable"
      - path: Generated/Camera.c
        compilerFlags: "-Wno-comma -Wno-unused-function -Wno-unused-variable -Wno-unused-but-set-variable"
      - path: Generated/Wallet.c
        compilerFlags: "-Wno-comma -Wno-unused-function -Wno-unused-variable -Wno-unused-but-set-variable"
      - path: Generated/Haunt.c
        compilerFlags: "-Wno-comma -Wno-unused-function -Wno-unused-variable -Wno-unused-but-set-variable"
      - path: Generated/HauntBuffer.c
        compilerFlags: "-Wno-comma -Wno-unused-function -Wno-unused-variable -Wno-unused-but-set-variable"
      - path: Generated/Hud.c
        compilerFlags: "-Wno-comma -Wno-unused-function -Wno-unused-variable -Wno-unused-but-set-variable"
      - path: Generated/VoiceEngine.c
        compilerFlags: "-Wno-comma -Wno-unused-function -Wno-unused-variable -Wno-unused-but-set-variable"
      - path: Generated/VoiceWire.c
        compilerFlags: "-Wno-comma -Wno-unused-function -Wno-unused-variable -Wno-unused-but-set-variable"
      - path: Generated/VoiceFloor.c
        compilerFlags: "-Wno-comma -Wno-unused-function -Wno-unused-variable -Wno-unused-but-set-variable"
      - path: Generated/VoiceMeter.c
        compilerFlags: "-Wno-comma -Wno-unused-function -Wno-unused-variable -Wno-unused-but-set-variable"
      - path: Generated/PhoneSignin.c
        compilerFlags: "-Wno-comma -Wno-unused-function -Wno-unused-variable -Wno-unused-but-set-variable"
      # libsecp256k1 v0.6.0 for the phone's Nostr signatures (Vendor/secp256k1/README.md)
      - path: Vendor/secp256k1/src/secp256k1.c
        compilerFlags: "-DENABLE_MODULE_EXTRAKEYS=1 -DENABLE_MODULE_SCHNORRSIG=1 -DECMULT_WINDOW_SIZE=8 -Wno-unused-function -Wno-shorten-64-to-32"
      - path: Vendor/secp256k1/src/precomputed_ecmult.c
        compilerFlags: "-DECMULT_WINDOW_SIZE=8"
      - path: Vendor/secp256k1/src/precomputed_ecmult_gen.c
      - path: ../../verse/platform/host.c
      - path: ../../verse/platform/voice.c
      - path: Generated/HomeShaders.txt
        buildPhase: resources
    dependencies:
      - package: BreezSdkSpark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openagents.app
        PRODUCT_NAME: OpenAgents
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1057"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: OpenAgents/Info.plist
        CODE_SIGN_ENTITLEMENTS: OpenAgents/OpenAgents.entitlements
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: OpenAgents
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "OpenAgents uses the camera to scan bitcoin and Lightning payment QR codes."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "OpenAgents asks for Face ID before it sends bitcoin."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "OpenAgents listens while voice is on, so you can talk to agents hands-free."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SWIFT_OBJC_BRIDGING_HEADER: OpenAgents/Platform/Bridge.h
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Generated", "$(SRCROOT)/../../verse/platform"]
        GCC_OPTIMIZATION_LEVEL: "2"
      configs:
        # Voice test recordings (OpenAgents/Voice/Fixtures) ship in Debug only.
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: "*.wav"
    preBuildScripts:
      - name: Generate Coax product code
        script: '"$SRCROOT/generate.sh"'
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Generated/Home.c
          - $(SRCROOT)/Generated/Home.h
          - $(SRCROOT)/Generated/Player.c
          - $(SRCROOT)/Generated/Player.h
          - $(SRCROOT)/Generated/Grid.c
          - $(SRCROOT)/Generated/Grid.h
          - $(SRCROOT)/Generated/Cast.c
          - $(SRCROOT)/Generated/Cast.h
          - $(SRCROOT)/Generated/Camera.c
          - $(SRCROOT)/Generated/Camera.h
          - $(SRCROOT)/Generated/Wallet.c
          - $(SRCROOT)/Generated/Wallet.h
          - $(SRCROOT)/Generated/Haunt.c
          - $(SRCROOT)/Generated/Haunt.h
          - $(SRCROOT)/Generated/HauntBuffer.c
          - $(SRCROOT)/Generated/HauntBuffer.h
          - $(SRCROOT)/Generated/Hud.c
          - $(SRCROOT)/Generated/Hud.h
          - $(SRCROOT)/Generated/VoiceEngine.c
          - $(SRCROOT)/Generated/VoiceEngine.h
          - $(SRCROOT)/Generated/VoiceWire.c
          - $(SRCROOT)/Generated/VoiceWire.h
          - $(SRCROOT)/Generated/VoiceFloor.c
          - $(SRCROOT)/Generated/VoiceFloor.h
          - $(SRCROOT)/Generated/VoiceMeter.c
          - $(SRCROOT)/Generated/VoiceMeter.h
          - $(SRCROOT)/Generated/PhoneSignin.c
          - $(SRCROOT)/Generated/PhoneSignin.h
          - $(SRCROOT)/Generated/HomeShaders.txt
  OpenAgentsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests
      # SignInUITests checks the app's signatures with the same shim and library.
      - path: OpenAgents/Platform/NostrSign.c
      - path: Vendor/secp256k1/src/secp256k1.c
        compilerFlags: "-DENABLE_MODULE_EXTRAKEYS=1 -DENABLE_MODULE_SCHNORRSIG=1 -DECMULT_WINDOW_SIZE=8 -Wno-unused-function -Wno-shorten-64-to-32"
      - path: Vendor/secp256k1/src/precomputed_ecmult.c
        compilerFlags: "-DECMULT_WINDOW_SIZE=8"
      - path: Vendor/secp256k1/src/precomputed_ecmult_gen.c
    dependencies:
      - target: OpenAgents
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Tests/TestBridge.h
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.openagents.app.uitests
schemes:
  OpenAgents:
    build:
      targets:
        OpenAgents: all
    run:
      config: Debug
    test:
      targets: [OpenAgentsUITests]
    archive:
      config: Release
