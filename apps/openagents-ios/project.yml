name: OpenAgents
options:
  bundleIdPrefix: com.openagents
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    DEVELOPMENT_TEAM: HQWSG26L43
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1425"
    OA_IOS_BUNDLE_ID: com.openagents.app
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    CLANG_ENABLE_MODULES: YES
targets:
  OpenAgents:
    type: application
    platform: iOS
    sources:
      # iOS GPU surface controller + pure-black native modal sheets (GitHub #14023).
      - Sources
      # Shared cross-Apple Antigravity client engine & modal inspector sheets.
      - ../shared/antigravity/Swift
      # Shared Tailscale IP/MagicDNS/TXT/direct-grant/push wire rules (Foundation-only).
      - ../shared/native/AppTailnet.swift
      # Shared UIKit text editor overlay & VoiceOver bridge over the Metal GPU surface.
      - ../shared/native/KitEditor.swift
      - ../shared/native/KitAccess.swift
      # Unified compiled Coax C library (client-core + host-tables + gpu-page -> Generated/gallery.c).
      - path: Generated/gallery.c
        compilerFlags: "-Wno-unused-function -Wno-unused-variable -Wno-unknown-attributes -ffp-contract=off -fno-fast-math"
      - path: ../shared/antigravity/client-core-bridge.c
        compilerFlags: "-IGenerated -I../shared/native -I../shared/antigravity"
      # Shared Coax GPU component carrier, glyph/SVG atlas setup, and Apple Metal UIKit host.
      - path: gpu-carrier.c
        compilerFlags: "-IGenerated -I../shared/host/linux -I../shared/host/apple -Wno-unused-function"
      - path: ComponentsHost.m
        compilerFlags: "-I../shared/host/linux -I../shared/host/apple"
      - path: Generated/Components
        type: folder
        buildPhase: resources
      - OpenAgents/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(OA_IOS_BUNDLE_ID)"
        PRODUCT_NAME: OpenAgents
        PROVISIONING_PROFILE_SPECIFIER: "$(OA_APP_PROVISIONING_PROFILE)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: OpenAgents/Info.plist
        CODE_SIGN_ENTITLEMENTS: OpenAgents/OpenAgents.entitlements
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: OpenAgents
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "OpenAgents discovers your Mac nearby so it can connect to Antigravity over Tailscale."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "OpenAgents uses the microphone when you tap Voice Dictation to speak prompts to Antigravity."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "OpenAgents transcribes spoken prompts into the Antigravity composer when you use Voice Dictation."
        INFOPLIST_KEY_NSCameraUsageDescription: "OpenAgents uses the camera to scan Tailscale pairing QR codes from your Mac."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SWIFT_OBJC_BRIDGING_HEADER: Bridge.h
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Generated", "$(SRCROOT)/../shared/native", "$(SRCROOT)/../shared/antigravity", "$(SRCROOT)/../shared/host/linux", "$(SRCROOT)/../shared/host/apple"]
        GCC_OPTIMIZATION_LEVEL: "2"
        # Frame budget (#13747): no C function in the app may hold a stack frame over 512 KB.
        OTHER_CFLAGS: ["$(inherited)", "-Wframe-larger-than=524288", "-Werror=frame-larger-than"]
        # 64 MB main-thread stack headroom for nested Coax GPU frames on iOS.
        OTHER_LDFLAGS: ["$(inherited)", "-Wl,-stack_size,0x4000000"]
        DEAD_CODE_STRIPPING: YES
        ENABLE_DEBUG_DYLIB: NO
  OpenAgentsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/MobileCoreTests.swift
    dependencies:
      - target: OpenAgents
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openagents.app.tests
        GENERATE_INFOPLIST_FILE: YES
  OpenAgentsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests/AntigravityUITests.swift
    dependencies:
      - target: OpenAgents
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openagents.app.ui-tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  OpenAgents:
    build:
      targets:
        OpenAgents: all
    test:
      targets:
        - OpenAgentsTests
  OpenAgentsTests:
    build:
      targets:
        OpenAgents: all
        OpenAgentsTests: [test]
    test:
      targets: [OpenAgentsTests]
  OpenAgentsUITests:
    build:
      targets:
        OpenAgents: all
        OpenAgentsUITests: [test]
    test:
      targets: [OpenAgentsUITests]
