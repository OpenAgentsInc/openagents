name: OpenAgents
options:
  bundleIdPrefix: com.openagents
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    DEVELOPMENT_TEAM: HQWSG26L43
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    CLANG_ENABLE_MODULES: YES
packages:
  BreezSdkSpark:
    url: https://github.com/breez/breez-sdk-spark-swift.git
    exactVersion: 0.27.2
targets:
  OpenAgents:
    type: application
    platform: iOS
    sources:
      - StarterApp.swift
      - ../shared/native
      - ../shared/host/apple/AppAuth.swift
      - ../shared/host/apple/DeviceKey.swift
      - OpenAgents/SignIn/PhoneSignIn.swift
      - OpenAgents/SignIn/NostrKey.swift
      - OpenAgents/Platform/AppAnalytics.swift
      - OpenAgents/Platform/NostrSign.c
      - OpenAgents/Assets.xcassets
      - OpenAgents/Wallet/SparkHost.swift
      - OpenAgents/Wallet/WalletKeychain.swift
      - OpenAgents/Wallet/BIP39.swift
      - OpenAgents/Wallet/BreezKey.swift
      - path: OpenAgents/Resources/bip39-english.txt
        buildPhase: resources
      - path: ../../components/fonts/DMSans-Regular.ttf
        buildPhase: resources
      - path: ../../components/fonts/DMSans-Medium.ttf
        buildPhase: resources
      - path: ../../components/fonts/DMSans-Italic.ttf
        buildPhase: resources
      - path: ../../components/fonts/DMSans-BoldItalic.ttf
        buildPhase: resources
      - path: ../../components/fonts/DMSans-Bold.ttf
        buildPhase: resources
      - path: Generated/NativeText.c
        compilerFlags: "-Wno-unused-function -Wno-unused-variable"
      - path: Generated/NativeComposer.c
        compilerFlags: "-Wno-unused-function -Wno-unused-variable"
      - path: Generated/WalletBalance.c
        compilerFlags: "-Wno-unused-function -Wno-unused-variable"
      - path: Generated/NativePolicy.c
        compilerFlags: "-Wno-unused-function -Wno-unused-variable"
      - path: Generated/NativeWire.c
        compilerFlags: "-Wno-unused-function -Wno-unused-variable"
      - path: Generated/PhoneSignin.c
        compilerFlags: "-Wno-unused-function -Wno-unused-variable"
      # The book's first milestone (#13516): the shared app (apps/shared/openagents-app.coax, compiled through
      # OpenagentsAppUnit.c) drawn with UIKit controls, opened with -OASharedApp YES or -OADrive SOCKET, and
      # the phone's half of coax drive (apps/shared/host/drive.c on that socket).
      - OpenAgents/Shared
      - path: ../shared/host/apple/phone-drive.c
        compilerFlags: "-Wno-unused-function"
      - path: Vendor/secp256k1/src/secp256k1.c
        compilerFlags: "-DENABLE_MODULE_EXTRAKEYS=1 -DENABLE_MODULE_SCHNORRSIG=1 -DECMULT_WINDOW_SIZE=8"
      - path: Vendor/secp256k1/src/precomputed_ecmult.c
        compilerFlags: "-DECMULT_WINDOW_SIZE=8"
      - path: Vendor/secp256k1/src/precomputed_ecmult_gen.c
        compilerFlags: "-DECMULT_WINDOW_SIZE=8"
      - path: Starter
        type: folder
        buildPhase: resources
      - path: Native.plist
        buildPhase: resources
    dependencies:
      - package: BreezSdkSpark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openagents.app
        PRODUCT_NAME: OpenAgents
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1074"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) COAX_NATIVE_BALANCE"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: OpenAgents/Info.plist
        CODE_SIGN_ENTITLEMENTS: OpenAgents/OpenAgents.entitlements
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: OpenAgents
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSCameraUsageDescription: "OpenAgents uses the camera when you choose to scan a code."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "OpenAgents verifies your identity when you approve a protected action."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "OpenAgents listens only when you turn voice on."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SWIFT_OBJC_BRIDGING_HEADER: NativeBridge.h
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Generated"]
        GCC_OPTIMIZATION_LEVEL: "2"
  OpenAgentsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [StarterTests]
    dependencies:
      - target: OpenAgents
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.openagents.app.starter.tests
  OpenAgentsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [StarterUITests]
    dependencies:
      - target: OpenAgents
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.openagents.app.starter.uitests
schemes:
  OpenAgents:
    build:
      targets:
        OpenAgents: all
    test:
      targets:
        - name: OpenAgentsTests
          selectedTests: [NativePackageTests, NativeProgramTests, SparkBalanceTests]
        - name: OpenAgentsUITests
          selectedTests: [StarterUITests/testEmbeddedCoaxAccountModuleRuns, BalanceUITests]
  CoaxNativeLive:
    build:
      targets:
        OpenAgents: all
    test:
      targets:
        - name: OpenAgentsUITests
          selectedTests: [StarterUITests/testLiveSignedCoaxUpdateChangesInstalledApp]
  CoaxNativeBalanceLive:
    build:
      targets:
        OpenAgents: all
    test:
      targets:
        - name: OpenAgentsTests
          selectedTests: [SparkBalanceLiveTests]

  CoaxNativeChat:
    build:
      targets:
        OpenAgents: all
    test:
      targets:
        - name: OpenAgentsTests
          selectedTests: [NativeMarkdownTests]
        - name: OpenAgentsUITests
          selectedTests: [ChatUITests]
