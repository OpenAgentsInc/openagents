name: OpenAgents
options:
  bundleIdPrefix: com.openagents
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    DEVELOPMENT_TEAM: HQWSG26L43
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    OA_MAC_BUNDLE_ID: com.openagents.desktop
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    CLANG_ENABLE_MODULES: YES
targets:
  OpenAgents:
    type: application
    platform: macOS
    sources:
      # Clean-sheet SwiftUI macOS client + Tailscale host server + menu bar companion (#13993).
      - Sources
      # Shared cross-Apple Antigravity client engine & OLED views (shared 1:1 with OpenAgents iOS).
      - ../shared/antigravity/Swift
      # Shared Tailscale IP/MagicDNS/TXT/direct-grant/push wire rules (Foundation-only).
      - ../shared/native/AppTailnet.swift
      # Lean compiled Coax C bridge (apps/shared/antigravity/client-core.coax -> Generated/client_core.c).
      - path: Generated/client_core.c
        compilerFlags: "-Wno-unused-function -Wno-unused-variable -Wno-unknown-attributes -ffp-contract=off -fno-fast-math"
      - path: ../shared/antigravity/client-core-bridge.c
        compilerFlags: "-IGenerated -I../shared/native -I../shared/antigravity"
      - OpenAgents/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(OA_MAC_BUNDLE_ID)"
        PRODUCT_NAME: OpenAgents
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: OpenAgents/Info.plist
        CODE_SIGN_ENTITLEMENTS: OpenAgents/OpenAgents.entitlements
        INFOPLIST_KEY_CFBundleName: OpenAgents
        INFOPLIST_KEY_CFBundleDisplayName: OpenAgents
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "OpenAgents advertises and discovers Macs over Bonjour so your iPhone and Macs connect to Antigravity over Tailscale."
        SWIFT_OBJC_BRIDGING_HEADER: Bridge.h
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Generated", "$(SRCROOT)/../shared/native", "$(SRCROOT)/../shared/antigravity"]
        GCC_OPTIMIZATION_LEVEL: "2"
        OTHER_CFLAGS: ["$(inherited)", "-Wframe-larger-than=524288", "-Werror=frame-larger-than"]
        DEAD_CODE_STRIPPING: YES
        ENABLE_DEBUG_DYLIB: NO
  OpenAgentsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/MacClientTests.swift
    dependencies:
      - target: OpenAgents
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openagents.desktop.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  OpenAgents:
    build:
      targets:
        OpenAgents: all
    test:
      targets:
        - OpenAgentsTests
  OpenAgentsTests:
    build:
      targets:
        OpenAgents: all
        OpenAgentsTests: [test]
    test:
      targets: [OpenAgentsTests]
