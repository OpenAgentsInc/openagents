<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenAgents — v1.0.0 Coming Soon</title>
<meta name="description" content="OpenAgents v1.0.0 — open-source agent workspace across Web, macOS, and iOS. Launching Monday, November 30 at 12:00 PM CT.">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="canonical" href="https://openagents.com/">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="alternate" type="text/markdown" href="/index.md">
<meta property="og:type" content="website">
<meta property="og:site_name" content="OpenAgents">
<meta property="og:title" content="OpenAgents — v1.0.0 Coming Soon">
<meta property="og:description" content="Open-source agent workspace across Web, macOS, and iOS. Launching Monday, November 30 at 12:00 PM CT.">
<meta property="og:url" content="https://openagents.com/">
<meta property="og:image" content="https://openagents.com/og/home.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="OpenAgents — v1.0.0 Coming Soon">
<meta name="twitter:description" content="Open-source agent workspace across Web, macOS, and iOS. Launching Monday, November 30 at 12:00 PM CT.">
<meta name="twitter:image" content="https://openagents.com/og/home.jpg">
<style>
  :root {
    --bg: #000000;
    --surface: #0c0c0e;
    --elevated: #141417;
    --fg: #ffffff;
    --muted: #8e8e93;
    --dim: #636366;
    --border: rgba(255, 255, 255, 0.13);
    --border-strong: rgba(255, 255, 255, 0.22);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    overflow-x: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", system-ui, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  body {
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: clamp(32px, 5vh, 64px) clamp(18px, 4vw, 40px) clamp(40px, 6vh, 72px);
  }
  body > main {
    width: 100%;
    max-width: 1120px;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 14px;
  }
  .brand img {
    width: 40px;
    height: 40px;
    display: block;
  }
  h1 {
    margin: 0;
    font-size: clamp(34px, 5vw, 48px);
    font-weight: 600;
    letter-spacing: -0.035em;
    line-height: 1.05;
    color: var(--fg);
  }
  .subtitle {
    margin: 0 0 28px;
    max-width: 640px;
    font-size: clamp(15px, 1.8vw, 17px);
    line-height: 1.5;
    color: var(--muted);
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .launch-card {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 20px 28px 22px;
    margin-bottom: clamp(28px, 4.5vh, 44px);
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 18px;
    max-width: 100%;
  }
  .launch-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--fg);
  }
  .launch-dot {
    width: 7px;
    height: 7px;
    border-radius: 999px;
    background: #ffffff;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.75);
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.85); }
  }
  .countdown {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: clamp(8px, 2vw, 16px);
    font-variant-numeric: tabular-nums;
  }
  .unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: clamp(54px, 12vw, 76px);
  }
  .unit-val {
    font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    font-size: clamp(28px, 5vw, 44px);
    font-weight: 600;
    line-height: 1;
    letter-spacing: -0.03em;
    color: var(--fg);
  }
  .unit-label {
    margin-top: 6px;
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .sep {
    font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    font-size: clamp(22px, 4vw, 34px);
    font-weight: 400;
    line-height: 1;
    color: var(--dim);
    transform: translateY(-9px);
    user-select: none;
  }
  .launch-date {
    margin: 0;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: -0.005em;
  }
  .showcase {
    width: 100%;
    max-width: 1080px;
    margin: 0 auto;
  }
  .showcase picture,
  .showcase img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 14px;
  }
  footer {
    margin-top: clamp(28px, 4.5vh, 48px);
    font-size: 12.5px;
    color: var(--dim);
    letter-spacing: -0.01em;
    text-align: center;
  }
  @media (max-width: 600px) {
    .brand img { width: 34px; height: 34px; }
    .launch-card { width: 100%; padding: 18px 16px 20px; }
    .sep { transform: translateY(-7px); }
  }
  .inside body { overflow: auto; display: block; padding: 0; }
  .inside body > main, .inside body > footer { display: none; }
  .inside #home-root { position: fixed; inset: 0; overflow-y: auto; background: #000; z-index: 30; text-align: left; }
</style>
</head>
<body>
<main>
  <div class="brand">
    <img src="/mark.svg" alt="OpenAgents logo" width="40" height="40">
    <h1>OpenAgents</h1>
  </div>

  <p class="subtitle">Open-source agent workspace across Web, macOS, and iOS.</p>

  <section class="launch-card" aria-label="OpenAgents v1.0.0 launch countdown">
    <div class="launch-badge">
      <span class="launch-dot" aria-hidden="true"></span>
      <span id="launch-status">v1.0.0 Coming Soon</span>
    </div>
    <div class="countdown" id="countdown" role="timer" aria-live="off">
      <div class="unit">
        <span class="unit-val" id="cd-days">--</span>
        <span class="unit-label">Days</span>
      </div>
      <span class="sep" aria-hidden="true">:</span>
      <div class="unit">
        <span class="unit-val" id="cd-hours">--</span>
        <span class="unit-label">Hours</span>
      </div>
      <span class="sep" aria-hidden="true">:</span>
      <div class="unit">
        <span class="unit-val" id="cd-mins">--</span>
        <span class="unit-label">Min</span>
      </div>
      <span class="sep" aria-hidden="true">:</span>
      <div class="unit">
        <span class="unit-val" id="cd-secs">--</span>
        <span class="unit-label">Sec</span>
      </div>
    </div>
    <p class="launch-date">Monday, November 30 &middot; 12:00 PM CT</p>
  </section>

  <div class="showcase">
    <picture>
      <source srcset="/app-preview.webp" type="image/webp">
      <img src="/app-preview.jpg" alt="OpenAgents on macOS and iOS showing a live agent session, unified git diff, and approval card" width="2400" height="1420">
    </picture>
  </div>
</main>
<footer>&copy; 2026 OpenAgents, Inc.</footer>
<script>
(() => {
  // Monday, November 30, 2026 at 12:00:00 PM CST (UTC-06:00)
  const targetMs = Date.parse('2026-11-30T12:00:00-06:00');
  const dEl = document.getElementById('cd-days');
  const hEl = document.getElementById('cd-hours');
  const mEl = document.getElementById('cd-mins');
  const sEl = document.getElementById('cd-secs');
  const statusEl = document.getElementById('launch-status');
  const pad = (n) => String(n).padStart(2, '0');
  const tick = () => {
    const diff = Math.max(0, targetMs - Date.now());
    const totalSec = Math.floor(diff / 1000);
    const days = Math.floor(totalSec / 86400);
    const hours = Math.floor((totalSec % 86400) / 3600);
    const mins = Math.floor((totalSec % 3600) / 60);
    const secs = totalSec % 60;
    dEl.textContent = pad(days);
    hEl.textContent = pad(hours);
    mEl.textContent = pad(mins);
    sEl.textContent = pad(secs);
    if (diff === 0 && statusEl) {
      statusEl.textContent = 'v1.0.0 Launching Now';
    }
  };
  tick();
  setInterval(tick, 1000);
})();
</script>
<script type="module">
let inside = false;
try {
  const r = await fetch("/api/auth/account", { credentials: "same-origin", cache: "no-store", signal: AbortSignal.timeout(3000) });
  inside = r.ok && (await r.json()).logged_in === true;
} catch {}
if (inside) {
  document.documentElement.classList.add("inside");
  const root = document.createElement("div"); root.id = "home-root"; document.body.appendChild(root);
  const shell = document.createElement("script"); shell.type = "module"; shell.src = "/coaxial/dom-host.js";
  shell.dataset.app = "chat-web"; shell.dataset.root = "home-root";
  document.body.appendChild(shell);
}
</script>
</body>
</html>
