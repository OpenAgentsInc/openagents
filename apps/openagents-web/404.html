<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Not found · OpenAgents</title>
<meta name="description" content="404: this page doesn't exist on OpenAgents.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="alternate" type="text/markdown" href="/index.md">
<script>
// On a realm's own domain (docs/verse/everglade-domain.md) an unknown address shows that domain's
// 404 page, still with status 404 and the same address: this page stops and writes it in its place.
if (/(^|\.)everglade\.world$/.test(location.hostname)) {
  document.currentScript.insertAdjacentHTML("afterend", "<style>html,body{background:#0d1a10}body>*{display:none}</style>");
  for (const s of document.querySelectorAll("script[type=module]")) s.remove();
  new MutationObserver((ms) => { for (const m of ms) for (const n of m.addedNodes) if (n.tagName === "SCRIPT" && n.type === "module") n.remove(); }).observe(document.documentElement, { childList: true, subtree: true });
  fetch("/worlds/everglade2/domain/404.html").then((r) => r.text()).then((t) => { const d = new DOMParser().parseFromString(t, "text/html"); document.head.replaceWith(document.adoptNode(d.head)); document.body.replaceWith(document.adoptNode(d.body)); });
}
</script>
<script>if ("gpu" in navigator) document.documentElement.classList.add("gpu")</script>
<style>
html,body{margin:0;height:100%;background:#000;color:#ededed}
body{display:grid;place-items:center;overflow:hidden;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas[data-cursor=pointer]{cursor:pointer}
main{position:relative;text-align:center;padding:0 16px}
h1{margin:0 0 12px;font-size:13px;font-weight:500;letter-spacing:.6em;text-indent:.6em;text-transform:uppercase;line-height:1}
p{margin:0;font-size:13px;color:#9a9a9a}
a{color:#ededed}
/* When the GPU draws the words, the text stays for agents, search engines and screen readers only. */
.gpu main{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
</style>
</head>
<body>
<canvas id="coaxial" aria-hidden="true"></canvas>
<main>
<h1>404 Not found</h1>
<p>Status 404: there is no page at this address. Go to <a href="/">openagents.com</a>, or read <a href="/index.md">/index.md</a> for a plain-text summary.</p>
</main>
<script type="module" src="/coaxial/host.js" data-app="splash" data-page="1"></script>
</body>
</html>
