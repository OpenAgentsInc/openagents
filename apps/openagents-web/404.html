<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Not found · OpenAgents</title>
<meta name="description" content="404: this page doesn't exist on OpenAgents.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="alternate" type="text/markdown" href="/index.md">
<script>
if (/(^|\.)everglade\.world$/.test(location.hostname)) {
  document.currentScript.insertAdjacentHTML("afterend", "<style>html,body{background:#0d1a10}body>*{display:none}</style>");
  for (const s of document.querySelectorAll("script[type=module]")) s.remove();
  new MutationObserver((ms) => { for (const m of ms) for (const n of m.addedNodes) if (n.tagName === "SCRIPT" && n.type === "module") n.remove(); }).observe(document.documentElement, { childList: true, subtree: true });
  fetch("/worlds/everglade2/domain/404.html").then((r) => r.text()).then((t) => { const d = new DOMParser().parseFromString(t, "text/html"); document.head.replaceWith(document.adoptNode(d.head)); document.body.replaceWith(document.adoptNode(d.body)); });
}
</script>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#000000;color:#ededed;color-scheme:dark;font-family:ui-sans-serif,-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;align-items:center;justify-content:center;padding:24px}
main{width:100%;max-width:360px;text-align:center}
h1{margin:0 0 8px;font-size:28px;font-weight:600;letter-spacing:-.025em;color:#ededed}
p{margin:0 0 22px;font-size:14px;line-height:1.5;color:#818181}
ul{list-style:none;margin:0;padding:0;display:flex;align-items:center;justify-content:center;gap:10px}
a{display:inline-flex;align-items:center;justify-content:center;height:38px;padding:0 18px;border-radius:8px;font-size:13.5px;font-weight:500;text-decoration:none}
a.primary{background:#ededed;color:#0a0a0a;font-weight:600}
a.primary:hover{background:#ffffff}
a.secondary{background:#111111;color:#ededed;border:1px solid #2c2c2c}
a.secondary:hover{background:#191919;border-color:#404040}
</style>
</head>
<body>
<main>
<h1>404</h1>
<p>This page could not be found.</p>
<ul>
<li><a class="primary" href="/">Go home</a></li>
<li><a class="secondary" href="/login">Log in</a></li>
</ul>
</main>
</body>
</html>
