<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat · OpenAgents</title>
<meta name="description" content="OpenAgents Cloud Chat — persistent, real-time multi-device chat across Web, Desktop, and Mobile.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="alternate" type="text/markdown" href="/chat/index.md">
<style>
:root{color-scheme:dark}
html,body{margin:0;background:#000000;color:#ededed}
body{font-family:ui-sans-serif,-apple-system,system-ui,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
#chat{display:flex;flex-direction:column;min-height:100dvh;background:#000000}
.cc-hud{display:flex;align-items:center;gap:8px;padding:12px 24px;border-bottom:1px solid #1b1b1b;background:#000000}
.cc-pill{display:inline-flex;align-items:center;height:26px;padding:0 11px;border-radius:9999px;background:#0e0e0e;border:1px solid #2c2c2c;color:#9a9a9a;font:500 12px/1 ui-sans-serif,-apple-system,system-ui,sans-serif}
.comp{margin:auto auto 20px;width:calc(100% - 32px);max-width:760px;padding:12px 16px;border-radius:20px;border:1px solid #2c2c2c;background:#0e0e0e;display:flex;gap:10px;align-items:flex-end;box-sizing:border-box}
#composer{flex:1;background:transparent;color:#ededed;border:0;outline:0;padding:4px 0;font:400 15px/1.55 inherit;resize:none}
#composer\.send{height:34px;padding:0 16px;border-radius:9999px;background:#ededed;color:#000000;border:0;font:600 13px/1 inherit}
#composer\.send[disabled]{background:#191919;color:#656565}
</style>
</head>
<body>
<main id="coaxial-root" data-coax-ssr="1"><main id="chat" class="chat"><header id="cc.hud" class="cc-hud" aria-label="Cloud chat status and usage"><span id="cc.hud.tier" class="cc-pill">Cloud · OpenAgents Auto</span></header><div id="log" class="log vl-scroll" role="list" aria-label="Conversation transcript" data-state="pinned" tabindex="0"><div id="thread" class="thread"></div></div><div id="composer.box" class="comp"><textarea id="composer" placeholder="Ask anything" rows="1" autofocus></textarea><button id="composer.send" class="btn" disabled><span id="composer.send.l">Send</span></button></div></main></main>
<script type="module" src="/coaxial/dom-host.js" data-app="chat-web" data-root="coaxial-root"></script>
</body>
</html>
