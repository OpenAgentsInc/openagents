<style>
  :root {
    --ground: #000000;
    --surface: rgba(255, 255, 255, 0.02);
    --border-subtle: #222222;
    --border-active: #333333;
    --ink: #f1efe8;
    --white-70: rgba(255, 255, 255, 0.70);
    --white-50: rgba(255, 255, 255, 0.50);
    --white-45: rgba(255, 255, 255, 0.45);
    --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", system-ui, "Segoe UI", Roboto, sans-serif;
    --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  *, *::before, *::after { box-sizing: border-box; border-radius: 0; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font-sans);
    color-scheme: dark;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }
  body {
    position: fixed;
    inset: 0;
    height: 100dvh;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    display: flex;
    justify-content: center;
    background: #000000;
  }
  a, button { cursor: default; font-family: inherit; }
  :focus-visible { outline: 2px solid rgba(255, 255, 255, 0.35); outline-offset: 2px; }

  #grid-bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
    z-index: 0;
  }

  .frame {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 672px;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    border-left: 1px solid var(--border-subtle);
    border-right: 1px solid var(--border-subtle);
    background: #000000;
  }

  .hero {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 28px clamp(18px, 4vw, 36px);
  }
  .brand-row {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 14px;
    color: var(--ink);
  }
  .brand-row svg {
    width: 38px;
    height: 38px;
    display: block;
    flex: none;
  }
  h1 {
    margin: 0;
    font-size: clamp(34px, 5vw, 46px);
    font-weight: 600;
    letter-spacing: -0.035em;
    line-height: 1.05;
    color: var(--ink);
  }
  .subtitle {
    margin: 0 0 30px;
    max-width: 44ch;
    font-size: clamp(15px, 1.8vw, 17px);
    line-height: 1.5;
    letter-spacing: -0.01em;
    color: var(--white-50);
    text-wrap: balance;
  }

  .launch-card {
    width: 100%;
    max-width: 520px;
    border: 1px solid var(--border-subtle);
    background: var(--surface);
  }
  .launch-head {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border-subtle);
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink);
  }
  .launch-sq {
    width: 6px;
    height: 6px;
    background: var(--ink);
    box-shadow: 0 0 8px rgba(241, 239, 232, 0.55);
    animation: pulse 2.4s ease-in-out infinite;
    flex: none;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  .countdown {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    font-variant-numeric: tabular-nums;
    background: #000000;
  }
  .unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 22px 10px;
    border-right: 1px solid var(--border-subtle);
  }
  .unit:last-child { border-right: 0; }
  .unit-val {
    font-family: var(--font-mono);
    font-size: clamp(28px, 5vw, 42px);
    font-weight: 600;
    line-height: 1;
    letter-spacing: -0.03em;
    color: var(--ink);
  }
  .unit-label {
    margin-top: 8px;
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--white-45);
  }
  .launch-foot {
    padding: 12px 18px;
    border-top: 1px solid var(--border-subtle);
    text-align: center;
  }
  .launch-date {
    margin: 0;
    font-size: 13px;
    letter-spacing: -0.005em;
    color: var(--white-50);
  }

  .bottombar {
    height: 48px;
    min-height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-top: 1px solid var(--border-subtle);
    background: #000000;
  }
  .foot-copy {
    display: flex;
    align-items: center;
    padding: 0 18px;
    font-size: 12.5px;
    letter-spacing: -0.01em;
    color: var(--white-45);
  }

  @media (max-width: 672px) {
    #grid-bg { display: none; }
    .frame { border-left: 0; border-right: 0; }
    .brand-row svg { width: 32px; height: 32px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .launch-sq { animation: none; }
  }

  .inside, .inside body { position: static; height: auto; overflow: auto; overscroll-behavior: auto; touch-action: auto; display: block; padding: 0; }
  .inside #grid-bg, .inside .frame { display: none; }
  .inside #home-root { position: fixed; inset: 0; overflow-y: auto; background: #000000; z-index: 30; text-align: left; }
</style>
<script>
try {
  const v = localStorage.getItem("oa_logged_in");
  const ref = document.referrer || "";
  const fromApp = ref.startsWith(location.origin + "/chat") || ref.startsWith(location.origin + "/login") || ref.startsWith(location.origin + "/onboarding") || ref.startsWith(location.origin + "/settings");
  if (v === "1" || fromApp || (v === null && localStorage.getItem("coaxial.dom.chat-web.kept"))) {
    document.documentElement.classList.add("inside");
  }
} catch {}
window.__oaAccountP = fetch("/api/auth/account", { credentials: "same-origin", cache: "no-store", signal: AbortSignal.timeout(3000) })
  .then((r) => (r.ok ? r.json() : null))
  .then((j) => ({ logged_in: Boolean(j && j.logged_in === true), onboarding_required: Boolean(j && j.onboarding_required === true) }))
  .catch(() => ({ logged_in: false, onboarding_required: false }));
</script>
</head>
<body>
<canvas id="grid-bg" aria-hidden="true"></canvas>
<div class="frame">
  <main class="hero">
    <div class="brand-row">
      <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" aria-hidden="true"><path d="M21 17a19 19 0 1 0 22 0"/><path d="M32 8v24"/></svg>
      <h1>OpenAgents</h1>
    </div>

    <p class="subtitle">One agent workspace for web, mobile &amp; desktop</p>

    <section class="launch-card" aria-label="OpenAgents v1.0.0 launch countdown">
      <div class="launch-head">
        <span class="launch-sq" aria-hidden="true"></span>
        <span id="launch-status">v1.0.0 Coming Soon</span>
      </div>
      <div class="countdown" id="countdown" role="timer" aria-live="off">
        <div class="unit">
          <span class="unit-val" id="cd-days">--</span>
          <span class="unit-label">Days</span>
        </div>
        <div class="unit">
          <span class="unit-val" id="cd-hours">--</span>
          <span class="unit-label">Hours</span>
        </div>
        <div class="unit">
          <span class="unit-val" id="cd-mins">--</span>
          <span class="unit-label">Min</span>
        </div>
        <div class="unit">
          <span class="unit-val" id="cd-secs">--</span>
          <span class="unit-label">Sec</span>
        </div>
      </div>
      <div class="launch-foot">
        <p class="launch-date">Monday, November 30 &middot; 1:00 PM CT</p>
      </div>
    </section>
  </main>

  <footer class="bottombar">
    <span class="foot-copy">&copy; 2026 OpenAgents, Inc.</span>
  </footer>
</div>
<script>
(() => {
  // Monday, November 30, 2026 at 1:00:00 PM CST (UTC-06:00)
  const targetMs = Date.parse('2026-11-30T13:00:00-06:00');
  const dEl = document.getElementById('cd-days');
  const hEl = document.getElementById('cd-hours');
  const mEl = document.getElementById('cd-mins');
  const sEl = document.getElementById('cd-secs');
  const statusEl = document.getElementById('launch-status');
  const pad = (n) => String(n).padStart(2, '0');
  const tick = () => {
    const diff = Math.max(0, targetMs - Date.now());
    const totalSec = Math.floor(diff / 1000);
    dEl.textContent = pad(Math.floor(totalSec / 86400));
    hEl.textContent = pad(Math.floor((totalSec % 86400) / 3600));
    mEl.textContent = pad(Math.floor((totalSec % 3600) / 60));
    sEl.textContent = pad(totalSec % 60);
    if (diff === 0 && statusEl) statusEl.textContent = 'v1.0.0 Launching Now';
  };
  tick();
  setInterval(tick, 1000);

  // OpenAgents 3D Grid background (just the monochrome Grid floor, camera slowly gliding through it).
  const canvas = document.getElementById('grid-bg');
  if (!canvas || document.documentElement.classList.contains('inside')) return;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const gl = canvas.getContext('webgl2', { alpha: false, antialias: false, depth: false, stencil: false, powerPreference: 'low-power' })
          || canvas.getContext('webgl', { alpha: false, antialias: false, depth: false, stencil: false, powerPreference: 'low-power' });

  if (gl) {
    const isGL2 = typeof WebGL2RenderingContext !== 'undefined' && gl instanceof WebGL2RenderingContext;
    if (!isGL2 && !gl.getExtension('OES_standard_derivatives')) {
      start2DFallback();
      return;
    }
    const vsSrc = isGL2
      ? `#version 300 es
         in vec2 p;
         void main(){ gl_Position = vec4(p, 0.0, 1.0); }`
      : `attribute vec2 p;
         void main(){ gl_Position = vec4(p, 0.0, 1.0); }`;
    const fsSrc = isGL2
      ? `#version 300 es
         precision highp float;
         uniform vec2 u_res;
         uniform float u_time;
         out vec4 fragColor;
         float gridBand(vec2 p, float scale, float lineWidth) {
           vec2 c = p / scale;
           vec2 deriv = max(fwidth(c), vec2(0.0005));
           vec2 g = abs(fract(c - 0.5) - 0.5) / deriv;
           float d = min(g.x, g.y);
           return 1.0 - clamp((d - lineWidth) / 1.15, 0.0, 1.0);
         }
         void main() {
           vec2 uv = (gl_FragCoord.xy - 0.5 * u_res) / u_res.y;
           float t = u_time;
           float yaw = 0.785398 + 0.06 * sin(t * 0.07);
           float pitch = 0.44;
           float speed = 0.55;
           vec3 fwd = normalize(vec3(-sin(yaw) * cos(pitch), -sin(pitch), -cos(yaw) * cos(pitch)));
           vec3 right = normalize(cross(fwd, vec3(0.0, 1.0, 0.0)));
           vec3 up = cross(right, fwd);
           vec3 ro = vec3(-0.70710678 * t * speed, 4.6, -0.70710678 * t * speed);
           vec3 rd = normalize(fwd * 1.45 + right * uv.x + up * uv.y);
           if (rd.y >= -0.002) { fragColor = vec4(0.0, 0.0, 0.0, 1.0); return; }
           float dist = -ro.y / rd.y;
           if (dist > 140.0) { fragColor = vec4(0.0, 0.0, 0.0, 1.0); return; }
           vec2 p = ro.xz + rd.xz * dist;
           float fine = gridBand(p, 1.0, 0.18);
           float major = gridBand(p, 4.0, 0.25);
           // Soft monochrome glow around lines (newland.coax INK_DIM / GREY_MID)
           vec2 c = p;
           vec2 d1 = abs(fract(c - 0.5) - 0.5);
           float glow = exp(-min(d1.x, d1.y) * 26.0) * 0.14;
           float fog = exp(-dist * 0.040) * smoothstep(130.0, 22.0, dist);
           float nearFade = smoothstep(1.2, 5.0, dist);
           vec2 ndc = (gl_FragCoord.xy / u_res) * 2.0 - 1.0;
           float vig = clamp(1.08 - 0.38 * dot(ndc, ndc), 0.15, 1.0);
           float intensity = (fine * 0.34 + major * 0.18 + glow) * fog * nearFade * vig;
           vec3 col = vec3(0.76, 0.77, 0.80) * intensity;
           fragColor = vec4(col, 1.0);
         }`
      : `#extension GL_OES_standard_derivatives : enable
         precision highp float;
         uniform vec2 u_res;
         uniform float u_time;
         float gridBand(vec2 p, float scale, float lineWidth) {
           vec2 c = p / scale;
           vec2 deriv = max(fwidth(c), vec2(0.0005));
           vec2 g = abs(fract(c - 0.5) - 0.5) / deriv;
           float d = min(g.x, g.y);
           return 1.0 - clamp((d - lineWidth) / 1.15, 0.0, 1.0);
         }
         void main() {
           vec2 uv = (gl_FragCoord.xy - 0.5 * u_res) / u_res.y;
           float t = u_time;
           float yaw = 0.785398 + 0.06 * sin(t * 0.07);
           float pitch = 0.44;
           float speed = 0.55;
           vec3 fwd = normalize(vec3(-sin(yaw) * cos(pitch), -sin(pitch), -cos(yaw) * cos(pitch)));
           vec3 right = normalize(cross(fwd, vec3(0.0, 1.0, 0.0)));
           vec3 up = cross(right, fwd);
           vec3 ro = vec3(-0.70710678 * t * speed, 4.6, -0.70710678 * t * speed);
           vec3 rd = normalize(fwd * 1.45 + right * uv.x + up * uv.y);
           if (rd.y >= -0.002) { gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0); return; }
           float dist = -ro.y / rd.y;
           if (dist > 140.0) { gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0); return; }
           vec2 p = ro.xz + rd.xz * dist;
           float fine = gridBand(p, 1.0, 0.18);
           float major = gridBand(p, 4.0, 0.25);
           vec2 d1 = abs(fract(p - 0.5) - 0.5);
           float glow = exp(-min(d1.x, d1.y) * 26.0) * 0.14;
           float fog = exp(-dist * 0.040) * smoothstep(130.0, 22.0, dist);
           float nearFade = smoothstep(1.2, 5.0, dist);
           vec2 ndc = (gl_FragCoord.xy / u_res) * 2.0 - 1.0;
           float vig = clamp(1.08 - 0.38 * dot(ndc, ndc), 0.15, 1.0);
           float intensity = (fine * 0.34 + major * 0.18 + glow) * fog * nearFade * vig;
           vec3 col = vec3(0.76, 0.77, 0.80) * intensity;
           gl_FragColor = vec4(col, 1.0);
         }`;

    const compile = (type, src) => {
      const sh = gl.createShader(type);
      gl.shaderSource(sh, src);
      gl.compileShader(sh);
      return gl.getShaderParameter(sh, gl.COMPILE_STATUS) ? sh : null;
    };
    const vs = compile(gl.VERTEX_SHADER, vsSrc);
    const fs = compile(gl.FRAGMENT_SHADER, fsSrc);
    const prog = vs && fs ? gl.createProgram() : null;
    if (prog) {
      gl.attachShader(prog, vs);
      gl.attachShader(prog, fs);
      gl.linkProgram(prog);
    }
    if (!prog || !gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      start2DFallback();
      return;
    }
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    gl.useProgram(prog);
    const locP = gl.getAttribLocation(prog, 'p');
    gl.enableVertexAttribArray(locP);
    gl.vertexAttribPointer(locP, 2, gl.FLOAT, false, 0, 0);
    const locRes = gl.getUniformLocation(prog, 'u_res');
    const locTime = gl.getUniformLocation(prog, 'u_time');

    const resize = () => {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = Math.max(1, Math.floor(window.innerWidth * dpr));
      const h = Math.max(1, Math.floor(window.innerHeight * dpr));
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
      }
      gl.viewport(0, 0, w, h);
    };
    const start = performance.now();
    const render = (now) => {
      if (document.documentElement.classList.contains('inside')) return;
      resize();
      gl.uniform2f(locRes, canvas.width, canvas.height);
      gl.uniform1f(locTime, reduced ? 0.0 : (now - start) * 0.001);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      if (!reduced) requestAnimationFrame(render);
    };
    window.addEventListener('resize', () => { resize(); if (reduced) render(start); });
    requestAnimationFrame(render);
    return;
  }

  function start2DFallback() {
    const ctx = canvas.getContext('2d');
    if (!ctx) return;
    let w = 0, h = 0;
    const resize = () => {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth; h = window.innerHeight;
      canvas.width = Math.max(1, Math.floor(w * dpr));
      canvas.height = Math.max(1, Math.floor(h * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    const start = performance.now();
    const draw = (now) => {
      if (document.documentElement.classList.contains('inside')) return;
      const t = reduced ? 0 : (now - start) * 0.001;
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, w, h);
      const yaw = 0.785398 + 0.06 * Math.sin(t * 0.07);
      const pitch = 0.44;
      const sp = 0.55 * t;
      const rox = -0.70710678 * sp, roy = 4.6, roz = -0.70710678 * sp;
      const fx = -Math.sin(yaw) * Math.cos(pitch), fy = -Math.sin(pitch), fz = -Math.cos(yaw) * Math.cos(pitch);
      const rx = -fz, rz = fx, rl = Math.hypot(rx, rz) || 1;
      const R = [rx / rl, 0, rz / rl];
      const U = [R[1] * fz - R[2] * fy, R[2] * fx - R[0] * fz, R[0] * fy - R[1] * fx];
      const focal = h * 1.45, cx = w * 0.5, cy = h * 0.5;
      const proj = (x, z) => {
        const vx = x - rox, vy = -roy, vz = z - roz;
        const cz = vx * fx + vy * fy + vz * fz;
        if (cz < 0.8) return null;
        return [cx + ((vx * R[0] + vz * R[2]) / cz) * focal, cy - ((vx * U[0] + vy * U[1] + vz * U[2]) / cz) * focal, cz];
      };
      const ox = Math.floor(rox - 10), oz = Math.floor(roz - 10);
      const N = 30;
      ctx.lineWidth = 1;
      for (let i = -N; i <= N; i++) {
        const major = ((ox + i) % 4 === 0);
        for (let axis = 0; axis < 2; axis++) {
          const p0 = axis === 0 ? proj(ox + i, oz - N) : proj(ox - N, oz + i);
          const p1 = axis === 0 ? proj(ox + i, oz + N) : proj(ox + N, oz + i);
          if (!p0 || !p1) continue;
          const d = 0.5 * (p0[2] + p1[2]);
          const a = Math.min(0.4, (major ? 0.34 : 0.22) * Math.exp(-d * 0.032));
          if (a < 0.01) continue;
          ctx.strokeStyle = `rgba(194,196,204,${a.toFixed(3)})`;
          ctx.beginPath();
          ctx.moveTo(p0[0], p0[1]);
          ctx.lineTo(p1[0], p1[1]);
          ctx.stroke();
        }
      }
      if (!reduced) requestAnimationFrame(draw);
    };
    window.addEventListener('resize', () => { resize(); if (reduced) draw(start); });
    resize();
    requestAnimationFrame(draw);
  }
})();
</script>
<script type="module">
const acct = await (window.__oaAccountP ?? Promise.resolve({ logged_in: false, onboarding_required: false }));
const inside = acct.logged_in;
try { localStorage.setItem("oa_logged_in", inside ? "1" : "0"); } catch {}
if (inside && acct.onboarding_required) {
  location.replace("/onboarding");
} else if (inside) {
  document.documentElement.classList.add("inside");
  const root = document.createElement("div"); root.id = "home-root"; document.body.appendChild(root);
  const shell = document.createElement("script"); shell.type = "module"; shell.src = "/coaxial/dom-host.js";
  shell.dataset.app = "chat-web"; shell.dataset.root = "home-root";
  document.body.appendChild(shell);
} else {
  document.documentElement.classList.remove("inside");
}
</script>
</body>
