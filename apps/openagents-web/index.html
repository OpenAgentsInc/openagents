<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#000000;color:#ededed;font-family:ui-sans-serif,-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;align-items:center;justify-content:center;padding:32px 20px}
.inside body{overflow:auto;display:block;padding:0}.inside body>main{display:none}.inside #home-root{position:fixed;inset:0;overflow-y:auto;background:#000000;z-index:30}
main{width:100%;max-width:460px;text-align:center}
h1{margin:0 0 10px;font-size:36px;font-weight:600;letter-spacing:-.03em;line-height:1.1;color:#ededed}
.sub{margin:0 0 24px;font-size:15px;line-height:1.5;color:#818181}
.cd{margin:0 0 26px;padding:16px 20px;border-radius:12px;background:#0a0a0a;border:1px solid #2c2c2c;font:500 13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#ededed}
.cd strong{display:block;margin-bottom:4px;font:600 11px/1.2 ui-sans-serif,-apple-system,system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#818181}
ul{list-style:none;margin:0;padding:0;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
a{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 20px;border-radius:8px;font-size:13.5px;font-weight:500;text-decoration:none}
a.primary{background:#ededed;color:#0a0a0a;font-weight:600}
a.primary:hover{background:#ffffff}
a.secondary{background:#111111;color:#ededed;border:1px solid #2c2c2c}
a.secondary:hover{background:#191919;border-color:#404040}
</style>
</head>
<body>
<main>
<h1>OpenAgents</h1>
<p class="sub">Your agents, everywhere. Cloud workspace across Web, macOS, and iOS.</p>
<p class="cd"><strong>v1.0.0 Launch</strong><code id="oa-cd">Monday, November 30 · 12:00 PM CT</code></p>
<ul>
<li><a class="primary" href="/login">Log in</a></li>
<li><a class="secondary" href="/chat">Open Chat</a></li>
<li><a class="secondary" href="/components">Components</a></li>
</ul>
</main>
<script type="module">
const el = document.getElementById("oa-cd");
const target = Date.parse("2026-11-30T18:00:00Z");
const tick = () => {
  if (!el) return;
  const rem = Math.max(0, target - Date.now());
  if (rem === 0) { el.textContent = "Live now"; return; }
  const d = Math.floor(rem / 86400000);
  const h = Math.floor((rem % 86400000) / 3600000);
  const m = Math.floor((rem % 3600000) / 60000);
  const s = Math.floor((rem % 60000) / 1000);
  el.textContent = `${d}d ${String(h).padStart(2, "0")}h ${String(m).padStart(2, "0")}m ${String(s).padStart(2, "0")}s · Mon Nov 30, 12:00 PM CT`;
};
tick();
setInterval(tick, 1000);
let inside = false;
try {
  const r = await fetch("/api/auth/account", { credentials: "same-origin", cache: "no-store", signal: AbortSignal.timeout(3000) });
  inside = r.ok && (await r.json()).logged_in === true;
} catch {}
if (inside) {
  document.documentElement.classList.add("inside");
  const root = document.createElement("main"); root.id = "home-root"; document.body.appendChild(root);
  const shell = document.createElement("script"); shell.type = "module"; shell.src = "/coaxial/dom-host.js";
  shell.dataset.app = "chat-web"; shell.dataset.root = "home-root";
  document.body.appendChild(shell);
}
</script>
</body>
</html>
