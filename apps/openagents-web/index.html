<style>
html,body,#coaxial-root{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#000000;color:#ededed;color-scheme:dark}
body{font-family:ui-sans-serif,-apple-system,system-ui,"Segoe UI",sans-serif;font-size:14px;line-height:1.5}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.inside,.inside body,.inside #coaxial-root{overflow:auto}
</style>
</head>
<body>
<main id="coaxial-root"><h1 class="sr-only">OpenAgents</h1><p class="sr-only">Log in or create an account.</p></main>
<script type="module">
let inside = false;
try {
  const r = await fetch("/api/auth/account", { credentials: "same-origin", cache: "no-store", signal: AbortSignal.timeout(1500) });
  inside = r.ok && (await r.json()).logged_in === true;
} catch {}
const root = document.getElementById("coaxial-root");
if (root) root.innerHTML = "";
if (inside) document.documentElement.classList.add("inside");
const s = document.createElement("script");
s.type = "module";
s.src = "/coaxial/dom-host.js";
s.dataset.app = inside ? "chat-web" : "login-web";
s.dataset.root = "coaxial-root";
document.body.appendChild(s);
</script>
</body>
</html>
