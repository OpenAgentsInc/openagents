<!doctype html>
<html lang="en">
  <head>

      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=0"
    />
    <meta
      name="description"

    />
    <meta name="theme-color" content="#05070d" />

<script type="module">
import init, * as bindings from '/demo/market_demo_web.js';
const wasm = await init({ module_or_path: '/demo/market_demo_web_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
    <style>
      * { box-sizing: border-box; }

        #boot p { animation: pulse 2.4s ease-in-out infinite; }
