<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=0"
    />
    <meta
      name="description"
      content="Operation Diamond Hands project state, read directly from the OpenAgents Nostr relay."
    />
    <meta name="theme-color" content="#05070d" />
    <title>Operation Diamond Hands — OpenAgents</title>

<script type="module">
import init, * as bindings from '/dh/diamond_hands_web.js';
const wasm = await init({ module_or_path: '/dh/diamond_hands_web_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #05070d; }
      body { color: #c9d2dd; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #05070d; }
      #boot p { max-width: 34rem; margin: 0; padding: 1.5rem; color: #aeb9c6; line-height: 1.65; text-align: center; }
      @media (prefers-reduced-motion: no-preference) {
        #boot p { animation: pulse 2.4s ease-in-out infinite; }
      }
      @keyframes pulse { 50% { color: #8fb6ff; } }
    </style>
  <link rel="modulepreload" href="/dh/diamond_hands_web.js" crossorigin="anonymous" integrity="sha384-vAjX4+MU6cDT4DFLgPu9ZTU3TMJg96ptWdg0GbMZ1SZHznPw3MakV22KOkMk2vq+"><link rel="preload" href="/dh/diamond_hands_web_bg.wasm" crossorigin="anonymous" integrity="sha384-TnT17bxNV86belapakAgGaQOjrUF9ElPQpzw2xGCaWbt2LnMrG3O3h1UeHotsiIc" as="fetch" type="application/wasm"></head>
  <body>
    <div id="boot" role="status">
      <p>Opening the signed project stream from relay.openagents.com…</p>
    </div>
  </body>
</html>
