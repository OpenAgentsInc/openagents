<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=0"
    />
    <meta
      name="description"
      content="OpenAgents work items demo: a read-only NIP-WK/NIP-PI issue projection from the Immortal relay, rendered by the Omega design system in your browser."
    />
    <meta name="theme-color" content="#000000" />
    <title>Work Items Demo — OpenAgents</title>
    <link
      data-trunk
      rel="rust"
      data-bin="work_demo_web"
      data-bindgen-target="web"
      data-wasm-opt="z"
    />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000000; }
      body { color: #d8d4c8; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #000000; }
      #boot p { max-width: 34rem; margin: 0; padding: 1.5rem; color: #9a958a; line-height: 1.65; text-align: center; }
      @media (prefers-reduced-motion: no-preference) {
        #boot p { animation: pulse 2.4s ease-in-out infinite; }
      }
      @keyframes pulse { 50% { color: #ff9f0a; } }
    </style>
  </head>
  <body>
    <div id="boot" role="status">
      <p>Loading the OpenAgents work items demo…</p>
    </div>
  </body>
</html>
