# Omega hosted-identity self-provisioning (POST /api/omega/auth/session).
#
# ARMED (owner decision, 2026-07-31). Any valid NIP-98 proof now mints a session
# and a `nostr:<pubkey>` account with no operator step. That is what a brand-new
# Omega install needs — without it every fresh install signed a perfectly valid
# proof and got a permanent 401 on its first turn — and it is also what lets a
# stranger who downloads the DMG draw on owner-funded hosted inference
# (including gpt-5.6-luna, an OpenAI passthrough billed to us). Commit
# 3d796a4fc5 (2026-07-29) had REPLACED self-provisioning with explicit operator
# admission (scripts/admit-sarah-voice-npub.ts); this reverses that policy
# deliberately, on the owner's instruction, because operator admission does not
# scale to "download the app and it works".
#
# The per-identity ceiling is enforced on BOTH the google-gemini
# provider-accounts proxy and POST /api/v1/chat/completions (the route that
# serves Omega turns), reading the same token_usage_events ledger and UTC-day
# window, so alternating routes cannot double an allowance. The per-IP limit is
# friction only: the x-forwarded-for first hop is client-prependable, so
# GLOBAL_DAILY_LIMIT is the real bound.
#
# WHAT IP_HOURLY_LIMIT ACTUALLY IS. It is an ACCOUNT-CREATION budget: at most N
# brand-new `nostr:` identities per hour per source IP. It is NOT a token
# limiter, and no per-IP token limiter exists on any serving path. The "tokens
# per hour from one IP" figure below is a DERIVED product, not an enforced gate
# (`omegaNostrSelfProvisionAbuseBound.tokensPerHourSingleIp`). A returning
# install charges only the mint budget, so this number bounds onboarding rate,
# not usage.
#
# ARITHMETIC AT THESE VALUES:
#   new-cohort/day  = GLOBAL_DAILY_LIMIT x DAILY_TOKEN_CEILING
#                   = 20 x 50000000 = 1,000,000,000 served tokens/day
#                     across identities newly admitted by the daily bucket
#   derived/hour    = IP_HOURLY_LIMIT x DAILY_TOKEN_CEILING
#                   = 30 x 50000000 = 1,500,000,000 tokens from one source IP
#
# HEADROOM RETUNE (owner direction, 2026-07-31). The free tier was far too
# restrictive per tester: 200000 tokens/day is a couple of real sessions, and a
# tester who hit it was done for the day. DAILY_TOKEN_CEILING goes 200000 ->
# 1000000 (5x per-tester headroom, back to the module default), and
# GLOBAL_DAILY_LIMIT goes 50 -> 20 to pay for part of it.
#
# The trade is deliberate and is NOT a 5x spend increase. Aggregate exposure is
# the product of the two, so it moves 10M -> 20M tokens/day: a 2x increase,
# accepted knowingly. The reasoning is that an alpha needs generous room per
# tester far more than it needs a high account count. 20 NEW identities per day
# is ample before launch — it bounds onboarding rate, not returning testers,
# who charge only the mint budget and keep their own full 1000000/day. If the
# count ever binds, the owner can raise GLOBAL_DAILY_LIMIT on its own without
# touching per-tester room, and each +1 there is now worth 1M/day rather than
# 200k, so raise it in smaller steps than before.
#
# EMERGENCY HEADROOM RETUNE (owner direction, 2026-08-02). The observed Omega
# identity reached the configured 1000000 token ceiling and repeated hosted
# model, fallback, and title requests failed with
# `free_tier_daily_token_ceiling_reached`. DAILY_TOKEN_CEILING goes 1000000 ->
# 50000000, exactly 50x. GLOBAL_DAILY_LIMIT remains 20, so the newly admitted
# identity exposure represented by the product above moves 20M -> 1B served
# tokens/day. This is a production-only override; staging and the compiled
# fallback stay conservative.
#
# WHICH BOUND ACTUALLY BINDS. IP_HOURLY_LIMIT (raised 3 -> 30 earlier on
# 2026-07-31) still does NOT set total spend exposure: a source IP cannot mint
# accounts the global daily budget has already spent. At 30/hour one NAT
# exhausts the global 20/day account budget in the first hour, so
# GLOBAL_DAILY_LIMIT is the first bound for any multi-tester address and the
# 1,500,000,000/hour derivation is unreachable in practice (it would need 30
# identities each burning a full day's allowance inside one hour, against a
# 20-identity/day global budget).
#   - ONE tester on one IP: bound by DAILY_TOKEN_CEILING (50000000/day). They
#     create exactly one identity, so IP_HOURLY_LIMIT never applies to them.
#     This ceiling is the only number that moves that tester, which is why it
#     is the one the owner raised.
#   - MANY testers behind one NAT: bound by IP_HOURLY_LIMIT up to the global
#     20/day. The earlier 3/hour value refused a fourth simultaneous
#     onboarding; 30/hour removes that refusal.
# Do not treat the per-IP bucket as spend protection. The x-forwarded-for first
# hop is client-prependable, so an attacker bypasses it outright.
# GLOBAL_DAILY_LIMIT x DAILY_TOKEN_CEILING bounds only the cohort newly admitted
# that UTC day. Returning identities do not consume the creation bucket, so the
# accumulated cohort has no deployment-wide token ceiling here; the per-identity
# ceiling is its only token bound.
#
# WHO THIS NUMBER APPLIES TO. FREE-TIER identities only — that is, `nostr:`
# identities with NO active row in `sarah_voice_alpha_memberships`. An
# operator-admitted alpha member is exempt, by membership lookup, on both the
# chat-completions gate and the google-gemini proxy gate
# (workers/api/src/inference/admitted-identity.ts).
#
# That distinction is not cosmetic and must not be removed. This ceiling keys on
# the `nostr:` id prefix, and scripts/admit-sarah-voice-npub.ts gives an admitted
# member the SAME id form a self-provisioned install gets, so prefix alone
# conflates "stranger who downloaded the DMG" with "identity the owner
# deliberately admitted". The conflation was invisible for three days because
# the ledger read behind both ceilings returned 0 unconditionally; when
# 460e7eb80f made the read real, the owner's own admitted identity was refused
# `free_tier_daily_token_ceiling_reached` on EVERY turn in his own app
# (10,410,253 served against a 1,000,000 ceiling he was never the subject of),
# across gpt-5.6-luna, the gemini-3.6-flash fallback, and thread titles.
# Regression coverage lives beside both gates.
#
# So this number bounds strangers, not the alpha cohort. Lowering it does not
# touch an admitted member; raising it does not widen their (separate, credit-
# bounded) allowance. An admitted member who somehow still needs an env-level
# exemption can be added to INFERENCE_INTERNAL_ACCOUNT_REFS as
# `openauth:nostr:<pubkey>`, but that is the BROADER grant — it also confers
# internal demand classification and internal-neutral lane access — so it is an
# owner call, not an operator convenience.
#
# Ref: docs/audits/2026-07-28-omega-nostr-self-provisioning-abuse-bounds.md
