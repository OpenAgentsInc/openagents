# Intended steady state for the 0.2.0 LiveKit alpha, reconciled with the
# serving revision on 2026-07-31 (EP263-LK H3, #9282). Production had been
# armed out of band while this file still said "false", so `main` described a
# closed alpha that was in fact open, and every redeploy silently closed
# admissions until a second revision re-armed them.
#
# The two-phase fail-closed rollout is NOT removed — it is now carried by the
# deploy instead of by a stale committed value. A fresh cluster bring-up
# deploys with `SARAH_LIVEKIT_ADMISSIONS=off`, observes SFU/Redis/TURN/worker
# readiness, then redeploys (or arms) once. Routine redeploys of an already
# live alpha carry this state atomically in one revision. The runtime default
# stays fail-closed: an absent or malformed value is disabled.
