<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000"><title>OpenAgents</title>
<style>
@font-face{font-family:Michroma;src:url("Michroma-Regular.ttf") format("truetype");font-display:swap}
html,body{margin:0;width:100%;height:100%;background:#000;color:#ededed;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{font-family:Michroma,system-ui,sans-serif;display:grid;place-items:center}
canvas{position:fixed;inset:0;width:100%;height:100%;opacity:0;transition:opacity 1s;pointer-events:none}
canvas.on{opacity:1}
h1{position:relative;margin:0;padding:0 20px;font-size:11px;font-weight:400;letter-spacing:.48em;text-indent:.48em;text-transform:uppercase;line-height:1.8;text-align:center}
button{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 32px);left:50%;transform:translateX(-50%);width:min(340px,calc(100% - 64px));min-height:54px;padding:16px 22px;border:0;border-radius:99px;background:#ededed;color:#000;font:13px Michroma,system-ui,sans-serif;letter-spacing:.08em;touch-action:none;-webkit-tap-highlight-color:transparent}
button:active{background:#fff}
</style></head><body><canvas aria-hidden="true"></canvas><h1>Coming soon</h1><button id="grid-enter">Enter the Grid</button><script src="home.js"></script></body></html>
