[package]
name = "zeron"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Without `ui` the binary is the headless engine only (no window, no GPU or
# desktop libraries): the build Our cloud runs on a cloud computer (#11852).
default = ["ui"]
ui = ["dep:zeron-ui"]

[[bin]]
name = "zeron"
path = "src/main.rs"

[dependencies]
coder-account.workspace = true
zeron-engine.workspace = true
zeron-rpc.workspace = true
zeron-ui = { workspace = true, optional = true }
zeron-update.workspace = true
zeron-mcp.workspace = true
coder-brand.workspace = true
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
libc.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# The custom allocator is macOS-only (see main.rs): glibc measured flat on the
# same streaming/scroll workloads, so Linux keeps the system allocator.
[target.'cfg(target_os = "macos")'.dependencies]
mimalloc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
embed-resource = "3.0.11"
