[package]
name = "openagents-account"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
agent-lab = { path = "../../../../crates/agent-lab", features = ["views"] }
lab-kit = { path = "../../../../crates/lab-kit" }
lab-ui = { path = "../../../../crates/lab-ui" }
openagents-dashboard = { path = "../../../../crates/openagents-dashboard", features = ["views"] }
rust-native = { path = "../../../../crates/rust-native", default-features = false }
serde = { version = "1", features = ["derive"] }
openagents-doc.workspace = true
openagents-proto.workspace = true
openagents-brand.workspace = true
openagents = { package = "openagents-sdk", path = "../../../../crates/openagents-sdk" }
tokio.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
security-framework = "3"

[dev-dependencies]
oa-copy = { path = "../../../../crates/oa-copy" }
axum = "0.8"
tempfile.workspace = true
