# AgentGraph's GPUI view, shared by the desktop's Agent Lab and the web
# build in web/agent-graph: an agent's graph (crates/agent-graph) with pan,
# zoom, drag and select, and, where the host allows, edits asked for from
# the side panel.
[package]
name = "openagents-agent-graph-view"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
agent-graph = { path = "../../../../crates/agent-graph", default-features = false }
gpui.workspace = true
web-time = "1.1.0"

[dev-dependencies]
oa-copy = { path = "../../../../crates/oa-copy" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
openagents-workspace-hack = { version = "0.1" }
