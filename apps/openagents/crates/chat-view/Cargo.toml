# The desktop's GPUI views that need no native platform, shared with the web
# apps in `apps/openagents/web` (#12216). Keep native-only dependencies out:
# this crate also builds for wasm32-unknown-unknown.
[package]
name = "openagents-chat-view"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gpui.workspace = true
serde.workspace = true
openagents-theme.workspace = true
# The span and language types only; grammars stay native (`highlight`).
openagents-syntax = { path = "../syntax", default-features = false }
openagents-brand.workspace = true
openagents-proto.workspace = true
web-time = "1.1.0"
rust-native = { path = "../../../../crates/rust-native", default-features = false }

[target.'cfg(windows)'.dependencies]
# The pulse loaders' high-resolution clock (motion/windows_pulse.rs).
futures.workspace = true
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
serde_json.workspace = true
gpui = { workspace = true, features = ["test-support"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
openagents-workspace-hack = { version = "0.1" }
