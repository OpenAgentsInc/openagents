# The desktop's GPUI views that need no native platform, shared with the web
# apps in `apps/openagents/web` (#12216). Keep native-only dependencies out:
# this crate also builds for wasm32-unknown-unknown.
[package]
name = "openagents-chat-view"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The markdown link fixture hooks the desktop's browser capture reads.
browser-fixture = []
# Selection probes the desktop's transcript tests read.
test-support = []

[dependencies]
gpui.workspace = true
serde.workspace = true
openagents-theme.workspace = true
# The span and language types only; grammars stay native (`highlight`).
openagents-syntax = { path = "../syntax", default-features = false }
openagents-brand.workspace = true
openagents-proto.workspace = true
# The chat entries the question wizard and the transcript read.
openagents-doc.workspace = true
chrono.workspace = true
web-time = "1.1.0"
rust-native = { path = "../../../../crates/rust-native", default-features = false }
# A Lab document's card, as the chat and the site draw it (#12333).
lab-kit = { path = "../../../../crates/lab-kit" }
lab-ui = { path = "../../../../crates/lab-ui" }
openagents-markdown.workspace = true
# The composer's Markdown editing helpers (`composer_markdown`).
pulldown-cmark.workspace = true
openagents-veil.workspace = true
unicode-segmentation.workspace = true
serde_json.workspace = true
roxmltree = "0.21.1"
sha2.workspace = true
tracing.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
# The pulse loaders' high-resolution clock (motion/windows_pulse.rs).
futures.workspace = true
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
openagents-gpui-test = { path = "../gpui-test" }
# The markdown tests highlight code fences with the bundled grammars.
openagents-syntax = { path = "../syntax" }
tempfile.workspace = true
oa-copy = { path = "../../../../crates/oa-copy" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
openagents-workspace-hack = { version = "0.1" }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
# Tool diffs; the web pairs lines without it (transcript::diff_to_file).
similar.workspace = true
# The embedded file-icon theme and the task checkbox. The web ships its own
# icon masks and draws a plain checkbox.
rust-embed = "=8.7.2"
gpui-base.workspace = true
# Web address checks; the browser parses them on the web.
url = "2"

# The browser parses web addresses; `url`'s domain tables stay native.
[target.'cfg(target_family = "wasm")'.dependencies]
web-sys = { version = "0.3", features = ["Url"] }
