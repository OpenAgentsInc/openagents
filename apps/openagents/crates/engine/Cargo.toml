[package]
name = "openagents-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# One test binary (tests/all.rs) plus the few below (#12199).
autotests = false

[features]
# Upstream compatibility only; never enabled by our application builds.
upstream-workos = []

[dependencies]
secp256k1 = { version = "0.31.1", features = ["rand"] }
coder-access = { path = "../../../../crates/coder-access", default-features = false }
coder-host = { path = "../../../../crates/coder-host" }
coder-lease = { path = "../../../../crates/coder-lease" }
coder-service = { path = "../../../../crates/coder-service" }
openagents-connect = { path = "../../../../crates/openagents-connect" }
chat-home = { path = "../../../../crates/chat-home" }
# Moving chats to a cloud computer (#11932).
openagents-sdk = { path = "../../../../crates/openagents-sdk" }
coder-cloud = { path = "../../../../crates/coder-cloud" }
# The capacity book picks each Claude chat's login (#12215).
microcoder-loop = { path = "../../../../crates/microcoder-loop" }
openagents-account.workspace = true
openagents-mcp.workspace = true
openagents-brand.workspace = true
openagents-preview.workspace = true
openagents-proto.workspace = true
openagents-doc.workspace = true
openagents-host-upgrade.workspace = true
openagents-sync.workspace = true
openagents-harness.workspace = true
openagents-rpc.workspace = true
openagents-update.workspace = true
openagents-visual.workspace = true
loro.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
notify.workspace = true
portable-pty.workspace = true
base64 = "0.22"
# Dictation from a paired browser, with the desktop's model (#12292).
openagents-voice = { path = "../voice" }
toml = "0.8"
libc.workspace = true
gethostname.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
sha2.workspace = true
reqwest.workspace = true
ignore.workspace = true
fff-search.workspace = true

same-file = "1"
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
dunce = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
futures-util = "0.3"
nostr = { path = "../../../../crates/nostr" }
axum = "0.8"
oa-copy = { path = "../../../../crates/oa-copy" }
tracing-subscriber.workspace = true
openagents-harness = { workspace = true, features = ["installer-fixture"] }
# Paused-clock tests (the 30-minute idle reaper).
tokio = { workspace = true, features = ["test-util"] }
zip.workspace = true
tokio-tungstenite.workspace = true
# In-process registry server for the two-engine workspace integration tests.
openagents-sync = { workspace = true, features = ["mock-server"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
openagents-workspace-hack = { version = "0.1" }

[[test]]
name = "all"
path = "tests/all.rs"

[[test]]
name = "acp_lifecycle"
path = "tests/acp_lifecycle.rs"

[[test]]
name = "codex_login_resolver"
path = "tests/codex_login_resolver.rs"

[[test]]
name = "github_cli_login_shell"
path = "tests/github_cli_login_shell.rs"

[[test]]
name = "m5c_accounts_uploads_titles"
path = "tests/m5c_accounts_uploads_titles.rs"

[[test]]
name = "m5_repos_diffs_terminals"
path = "tests/m5_repos_diffs_terminals.rs"

[[test]]
name = "runtime_survival_live"
path = "tests/runtime_survival_live.rs"

[[test]]
name = "self_continued_quiesce"
path = "tests/self_continued_quiesce.rs"

[[test]]
name = "subagent_idle_reap"
path = "tests/subagent_idle_reap.rs"

[[test]]
name = "turn_quiesce"
path = "tests/turn_quiesce.rs"
