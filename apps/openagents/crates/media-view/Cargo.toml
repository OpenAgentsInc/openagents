[package]
name = "openagents-media-view"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
test-support = []

[dependencies]
openagents-brand.workspace = true
openagents-account.workspace = true
openagents-orb.workspace = true
openagents-proto.workspace = true
# The views shared with the web apps (#12216).
openagents-chat-view = { workspace = true, features = ["visuals"] }
openagents-visual.workspace = true
openagents-visual-gpu.workspace = true
gpui.workspace = true
serde_json.workspace = true
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
usvg = "0.46"
chrono.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
objc2 = "0.6"
objc2-foundation = "0.3.2"
core-foundation = "0.10"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "AVPlayer", "AVPlayerItem", "AVPlayerItemOutput", "objc2-core-media", "objc2-core-video"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMTime"] }
core-video = { version = "0.5.2", features = ["metal"] }

[dev-dependencies]
openagents-chat-view = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
openagents-workspace-hack = { version = "0.1" }
