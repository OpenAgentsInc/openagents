[package]
name = "openagents-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The mobile core: one UniFFI library that iOS (Swift) and Android (Kotlin)
# link. Platform code paints, scrolls and handles gestures; everything that
# decides *what* to paint and *where* lives here.
[lib]
name = "openagents_mobile"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
# Dedicated loopback credential delivery for simulator acceptance tests only.
account-fixture = []
bindgen = ["uniffi/cli"]

[dependencies]
chat-home = { path = "../../../../crates/chat-home", features = ["ui"] }
uuid.workspace = true
coder-ui = { path = "../../../../crates/coder-ui", default-features = false }
openagents-brand.workspace = true
coder-sharing = { path = "../../../../crates/coder-sharing" }
coder-access = { path = "../../../../crates/coder-access", default-features = false }
push-gateway = { path = "../../../../crates/push-gateway", default-features = false, features = ["client"] }
secp256k1 = { version = "0.31.1", features = ["rand"] }
computer-driver = { path = "../../../../crates/computer-driver" }
rust-native = { path = "../../../../crates/rust-native", default-features = false }
# Zones: the website's release pins and the native bridge transport (ADR 0010).
aethyrforge-host = { path = "../../../../crates/aethyrforge-host" }
lab-kit = { path = "../../../../crates/lab-kit" }
lab-ui = { path = "../../../../crates/lab-ui" }
# The autonomy card every shell shares (#12045).
agent-lab = { path = "../../../../crates/agent-lab", features = ["views"] }
agent-contract = { path = "../../../../crates/agent-contract" }
openagents-account.workspace = true
openagents-connect = { path = "../../../../crates/openagents-connect" }
sha2.workspace = true
wgpu = { version = "29", default-features = false, features = ["metal", "wgsl"] }
pollster = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
bytemuck = { version = "1", features = ["derive"] }
glam = "0.30"
image = { version = "0.25.10", default-features = false, features = ["png"] }
reqwest.workspace = true
openagents-voice-session.workspace = true
openagents-orb.workspace = true
openagents-veil.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
uniffi = { version = "0.32", features = ["tokio"] }
openagents-markdown.workspace = true
openagents-text.workspace = true
openagents-visual.workspace = true
openagents-visual-gpu.workspace = true
openagents-doc.workspace = true
openagents-proto.workspace = true
openagents-client.workspace = true
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
unicode-segmentation.workspace = true
openagents-syntax.workspace = true
thiserror.workspace = true
# The Wallet screen: the person's Spark wallet (Breez SDK, mainnet), shared
# with computers (`crates/spark-wallet`). The phone keeps Breez's records in
# its SQLite store, which needs `libsqlite3-sys` 0.30: this workspace's lock
# holds it, while the root's `ldk-node` holds 0.28, so the feature is turned
# on here and never in `crates/spark-wallet` (a lock file resolves every
# optional dependency of its members).
openagents-spark = { path = "../../../../crates/spark-wallet" }
breez-sdk-spark = { git = "https://github.com/breez/spark-sdk", tag = "0.26.0", default-features = false, features = ["sqlite"] }
bitcoin-amount = { path = "../../../../crates/bitcoin-amount" }

[target.'cfg(target_os = "android")'.dependencies]
tracing-subscriber.workspace = true
jni = "0.22.4"
ndk-context = "0.1.1"
rustls-platform-verifier = "0.7.1"

[dev-dependencies]
naga = { version = "29", features = ["wgsl-in"] }
# Signed test invoices for the browser payment tests (src/wallet/browser).
nostr = { path = "../../../../crates/nostr", features = ["test-invoice"] }
oa-copy = { path = "../../../../crates/oa-copy" }
tempfile.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
openagents-workspace-hack = { version = "0.1" }
