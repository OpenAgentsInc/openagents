[package]
name = "zeron-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The mobile core: one UniFFI library that iOS (Swift) and Android (Kotlin)
# link. Platform code paints, scrolls and handles gestures; everything that
# decides *what* to paint and *where* lives here.
[lib]
name = "zeron_mobile"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
# Dedicated loopback credential delivery for simulator acceptance tests only.
account-fixture = ["dep:reqwest"]
bindgen = ["uniffi/cli"]

[dependencies]
openagents-dashboard = { path = "../../../../crates/openagents-dashboard", features = ["views"] }
rust-native = { path = "../../../../crates/rust-native", default-features = false }
coder-account.workspace = true
sha2.workspace = true
reqwest = { workspace = true, optional = true }
zeron-voice-session.workspace = true
zeron-orb.workspace = true
zeron-veil.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
uniffi = "0.32"
zeron-markdown.workspace = true
zeron-text.workspace = true
zeron-visual.workspace = true
zeron-visual-gpu.workspace = true
zeron-doc.workspace = true
zeron-proto.workspace = true
zeron-client.workspace = true
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
zeron-syntax.workspace = true
thiserror.workspace = true

[dev-dependencies]
oa-copy = { path = "../../../../crates/oa-copy" }
tempfile.workspace = true
