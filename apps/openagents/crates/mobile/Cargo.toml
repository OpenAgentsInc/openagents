[package]
name = "openagents-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The mobile core: one UniFFI library that iOS (Swift) and Android (Kotlin)
# link. Platform code paints, scrolls and handles gestures; everything that
# decides *what* to paint and *where* lives here.
[lib]
name = "openagents_mobile"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
# Dedicated loopback credential delivery for simulator acceptance tests only.
account-fixture = ["dep:reqwest"]
bindgen = ["uniffi/cli"]

[dependencies]
chat-home = { path = "../../../../crates/chat-home", features = ["ui"] }
uuid.workspace = true
coder-sharing = { path = "../../../../crates/coder-sharing" }
coder-access = { path = "../../../../crates/coder-access", default-features = false }
push-gateway = { path = "../../../../crates/push-gateway", default-features = false, features = ["client"] }
secp256k1 = { version = "0.31.1", features = ["rand"] }
computer-driver = { path = "../../../../crates/computer-driver" }
rust-native = { path = "../../../../crates/rust-native", default-features = false }
lab-kit = { path = "../../../../crates/lab-kit" }
lab-ui = { path = "../../../../crates/lab-ui" }
openagents-account.workspace = true
sha2.workspace = true
reqwest = { workspace = true, optional = true }
openagents-voice-session.workspace = true
openagents-orb.workspace = true
openagents-veil.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
uniffi = "0.32"
openagents-markdown.workspace = true
openagents-text.workspace = true
openagents-visual.workspace = true
openagents-visual-gpu.workspace = true
openagents-doc.workspace = true
openagents-proto.workspace = true
openagents-client.workspace = true
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
openagents-syntax.workspace = true
thiserror.workspace = true

[dev-dependencies]
oa-copy = { path = "../../../../crates/oa-copy" }
tempfile.workspace = true
