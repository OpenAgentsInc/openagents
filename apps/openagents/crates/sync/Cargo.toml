[package]
name = "openagents-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nostr = { path = "../../../../crates/nostr" }
coder-link = { path = "../../../../crates/coder-link" }
coder-reach = { path = "../../../../crates/coder-reach" }
secp256k1 = { version = "0.31.1", features = ["rand"] }
coder-access = { path = "../../../../crates/coder-access", default-features = false }
coder-host = { path = "../../../../crates/coder-host", default-features = false }
# Connect a computer: what a scanned code is, and its account-link request.
coder-computers = { path = "../../../../crates/coder-computers", default-features = false }
base64 = "0.22"
async-trait.workspace = true
openagents-brand.workspace = true
openagents-doc.workspace = true
loro.workspace = true
loro-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures.workspace = true
rusqlite = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

# NWPathMonitor bridge (net_path.rs) — the update handler is an ObjC block.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"

# Paired computers' grants live in the Keychain.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
security-framework = "3"

[features]
default = ["store"]
store = ["dep:rusqlite"]
# In-process registry server speaking the DO's JSON WS protocol — test
# infrastructure for this crate's tests and openagents-engine's integration tests.
mock-server = []

[dev-dependencies]
chrono.workspace = true
# chat2_live example only (live checkpoint fetch against a deployed worker).
reqwest.workspace = true
openagents-proto.workspace = true
tempfile.workspace = true
# `start_paused` virtual-clock tests (the 2026-07-30 sync-stall regressions).
tokio = { workspace = true, features = ["test-util"] }
