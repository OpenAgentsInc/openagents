[package]
name = "openagents-visual"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Sandboxed Luau runtime for agent visuals: scripts build a native element tree, canvas drawings, and 3D scenes"

[features]
# Exercise the browser interpreter natively as well as in wasm.
portable-runtime = ["dep:luau"]

[dependencies]
web-time = "1.1.0"
luau = { version = "=0.739.0", optional = true }
# The GLSL compiler wgpu uses, so a shader is validated exactly as it will run.
naga = { version = "29", features = ["glsl-in"] }
# glTF models (`s:model`): `.glb` or self-contained `.gltf`.
gltf = { version = "1", default-features = false, features = ["import", "utils", "names", "KHR_materials_transmission", "KHR_materials_ior", "KHR_materials_emissive_strength"] }
# Texture and environment-map assets.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "hdr", "webp"] }
thiserror.workspace = true
# Images embedded in glTF models as data URIs.
base64 = "0.22"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
openagents-workspace-hack = { version = "0.1" }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
mlua = { version = "0.12", features = ["luau"] }

[target.'cfg(target_family = "wasm")'.dependencies]
luau = { version = "=0.739.0" }

[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen-test = "=0.3.78"
