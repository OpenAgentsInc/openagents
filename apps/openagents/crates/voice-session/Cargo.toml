[package]
name = "openagents-voice-session"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["runtime"]
runtime = ["dep:openagents-rpc", "dep:async-trait", "dep:tokio", "dep:tokio-util", "dep:serde", "dep:serde_json", "dep:futures", "dep:tracing"]

[dependencies]
web-time = "1.1.0"
openagents-proto.workspace = true
openagents-orb.workspace = true
openagents-rpc = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
openagents-workspace-hack = { version = "0.1" }
