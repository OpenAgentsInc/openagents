# OpenAgents on the web: GPUI compiled to wasm32-unknown-unknown.
#
# Its own Cargo workspace (like `crates/psionic` in the root), so the
# wasm-only dependencies stay out of the desktop app's lock and its hakari
# crate. Build it with `scripts/build-web-demo.sh` from `apps/openagents`.
[workspace]
resolver = "2"
members = [
    "gpui-web",
    "chat-view",
    "client",
    "chat",
    "files",
    "room",
    "agent-lab",
    "voice",
    "visuals",
    "dictation",
    "page-host",
    "traces",
    "agents",
    "projects",
    "lab",
    "work",
    "settings",
    "demo",
    "agent-graph",
    "first-frame",
    "first-frame-paint",
    "first-frame-capture",
    "first-frame-record",
    "card",
    "graph-card",
    "pylon-card",
    "lander-chat",
    "hands",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
gpui = { git = "https://github.com/zeronsh/zui", rev = "361ff20b919fdfb80199ee6d9aed725300cb7d54" }
gpui_wgpu = { git = "https://github.com/zeronsh/zui", rev = "361ff20b919fdfb80199ee6d9aed725300cb7d54" }
http_client = { git = "https://github.com/zeronsh/zui", rev = "361ff20b919fdfb80199ee6d9aed725300cb7d54" }
openagents-gpui-web = { path = "gpui-web" }
openagents-web-chat-view = { path = "chat-view" }
# The desktop's own portable views (#12216).
openagents-chat-view = { path = "../crates/chat-view" }
openagents-web-client = { path = "client" }
openagents-first-frame = { path = "first-frame" }
openagents-first-frame-record = { path = "first-frame-record" }
anyhow = "1.0.86"
futures = "0.3.32"
log = "0.4.16"
raw-window-handle = "0.6"
smallvec = { version = "1.6", features = ["union", "const_new"] }
uuid = { version = "1.1.2", features = ["v4", "js"] }
web-time = "1.1.0"
wasm-bindgen = "=0.2.128"

[patch.crates-io]
# The shared domain crates name the desktop workspace's hakari crate; its
# native feature set does not build for wasm32.
openagents-workspace-hack = { path = "hack-stub" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# The first-frame painter rides inline in the page: smallest over fastest.
[profile.release.package.openagents-first-frame-paint]
opt-level = "z"

[profile.release.package.openagents-first-frame]
opt-level = "z"

# The first-frame capture runs natively at build time and on the site for
# window sizes no class covers: optimized, without the release profile's
# whole-program link, so the image builds it in reasonable time.
[profile.capture]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
panic = "unwind"
strip = true
