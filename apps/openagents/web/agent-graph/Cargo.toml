# AgentGraph on the web: any agent's graph (`crates/agent-graph`) drawn by
# GPUI in a browser canvas, with pan, zoom, drag and select. The page hands
# it the graph's JSON; /agent/foreman serves it.
[package]
name = "openagents-web-agent-graph"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
agent-graph = { path = "../../../../crates/agent-graph", default-features = false }
serde_json = "1"
openagents-agent-graph-view = { path = "../../crates/agent-graph-view" }
# The view builds natively too, so `first-frame-capture` can lay out and
# paint its first frame without a browser.
gpui.workspace = true
web-time.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
anyhow.workspace = true
openagents-gpui-web.workspace = true
wasm-bindgen.workspace = true
console_error_panic_hook = "0.1.7"
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
uuid.workspace = true
js-sys = "0.3"
web-sys = { version = "0.3", features = ["DomRect", "Window", "Document", "Element", "HtmlElement", "CssStyleDeclaration", "KeyboardEvent", "Event"] }
