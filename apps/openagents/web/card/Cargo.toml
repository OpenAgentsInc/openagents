# The agent demo card on openagents.com/lander6: one demo chat, drawn by
# the shared GPUI chat views, playing the desktop demo's scripted reply in a
# loop inside a box on the page. Built twice by
# `scripts/build-web-card.sh`: WebGPU-only (the `webgpu/` workspace beside
# this crate) and with the WebGL2 scene renderer (this workspace).
[package]
name = "openagents-web-card"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
webgpu = ["openagents-gpui-web/webgpu"]
webgl = ["openagents-gpui-web/webgl"]

default = ["export", "webgpu"]
# Exports `mount` to the page. The WebGPU-only build (`webgpu/`) links this
# crate without it and exports its own.
export = []

[dependencies]
gpui.workspace = true
openagents-web-chat-view.workspace = true
openagents-doc = { path = "../../crates/doc" }
openagents-proto = { path = "../../crates/proto" }
anyhow.workspace = true
# The demo visuals the transcripts name.
openagents-brand = { path = "../../crates/brand" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
web-time.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
openagents-gpui-web.workspace = true
wasm-bindgen.workspace = true
console_error_panic_hook = "0.1.7"
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
uuid.workspace = true
chrono = { version = "0.4", features = ["wasmbind"] }
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Document", "Element", "Event", "EventTarget", "Window"] }
