# The card's WebGPU-only build: the same crate, linked with a wgpu that has
# no WebGL2 (GLES) backend. wgpu's GL backend and the shader translator it
# needs are most of the size of a GPUI module (#12237), and a browser with
# WebGPU never uses them; the page loads the other build when it has none.
#
# Its own workspace, because the only way to leave wgpu's default `gles`
# feature out is to patch wgpu for the whole build: `wgpu/` is wgpu
# 29.0.4 from crates.io with its default feature list changed and its
# WebGPU surface offering a premultiplied canvas besides an opaque one, which
# `scripts/build-web-card.sh` writes before building (it is not checked in).
[workspace]
resolver = "2"

[package]
name = "openagents-web-card-webgpu"
version = "1.0.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
openagents-web-card = { path = "..", default-features = false }
wasm-bindgen = "=0.2.128"

[patch.crates-io]
wgpu = { path = "wgpu" }
# As in ../../Cargo.toml.
openagents-workspace-hack = { path = "../../hack-stub" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
