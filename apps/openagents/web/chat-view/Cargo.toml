# The chat views both web apps draw: the transcript (markdown, code, tool
# groups with diff stats, question cards), the composer's text field, the
# sidebar's rows, the dark theme, and the bundled fonts and icons. Pure
# GPUI over the desktop's `doc`, `proto`, and `markdown` crates, so the
# offline demo (`openagents-web-demo`) and the signed-in chat
# (`openagents-web-chat`) draw from one copy.
[package]
name = "openagents-web-chat-view"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"

[features]
# Agent charts and 3D visuals drawn inline (#12287): Luau and the visual
# runtime, about 1 MB raw. Off for the chat and the demo, which stay under
# their size budgets; a visual there shows as a line naming it.
visuals = ["dep:openagents-visual", "openagents-chat-view/visuals"]

[dependencies]
openagents-visual = { path = "../../crates/visual", optional = true }
gpui.workspace = true
openagents-chat-view.workspace = true
anyhow.workspace = true
serde_json = "1"
openagents-doc = { path = "../../crates/doc" }
openagents-proto = { path = "../../crates/proto" }
openagents-markdown = { path = "../../crates/markdown" }
unicode-segmentation = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(target_family = "wasm")'.dependencies]
chrono = { version = "0.4", features = ["wasmbind"] }
openagents-gpui-web.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Response"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[build-dependencies]
resvg = { version = "0.46", default-features = false }
