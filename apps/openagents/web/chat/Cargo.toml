# The signed-in OpenAgents chat on the web: GPUI drawing the account's
# chats into a canvas at openagents.com/gpui, over the site's JSON API.
# Built by apps/openagents/scripts/build-web-chat.sh; served by
# openagents-web (`--gpui-chat DIR`).
[package]
name = "openagents-web-chat"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gpui.workspace = true
anyhow.workspace = true
futures.workspace = true
log.workspace = true
openagents-web-chat-view.workspace = true
# The composer's tokens and the question wizard (#12267, #12268).
openagents-chat-view.workspace = true
openagents-web-client.workspace = true
openagents-doc = { path = "../../crates/doc" }
openagents-proto = { path = "../../crates/proto" }
serde_json = "1"
web-time.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
# The browser shapes and draws text (#12299): no cosmic-text or swash.
openagents-gpui-web = { workspace = true, features = ["first-frame", "browser-text"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1.7"
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
uuid.workspace = true
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Notification", "NotificationOptions", "NotificationPermission", "EventSource", "MessageEvent", "AudioContext", "AudioBuffer", "AudioBufferSourceNode", "AudioNode", "AudioDestinationNode", "History", "Location", "PopStateEvent", "Window", "Document", "Element", "HtmlElement", "Storage", "Navigator", "CustomEvent", "CustomEventInit", "Event", "EventTarget"] }
