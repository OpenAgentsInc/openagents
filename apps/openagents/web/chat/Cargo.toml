# The signed-in OpenAgents chat on the web: GPUI drawing the account's
# chats into a canvas at openagents.com/gpui, over the site's JSON API.
# Built by apps/openagents/scripts/build-web-chat.sh; served by
# openagents-web (`--gpui-chat DIR`).
[package]
name = "openagents-web-chat"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gpui.workspace = true
anyhow.workspace = true
futures.workspace = true
log.workspace = true
openagents-web-chat-view.workspace = true
# The composer's tokens and the question wizard (#12267, #12268).
openagents-chat-view.workspace = true
openagents-web-client.workspace = true
# A Coder chat's question in the canvas (#12316).
decision-panel = { path = "../../../../crates/decision-panel" }
rust-native = { path = "../../../../crates/rust-native", default-features = false }
openagents-doc = { path = "../../crates/doc" }
openagents-proto = { path = "../../crates/proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
agent-lab = { path = "../../../../crates/agent-lab", features = ["views"] }
web-time.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
# The browser shapes and draws text (#12299): no cosmic-text or swash.
openagents-gpui-web = { workspace = true, features = ["first-frame", "browser-text"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1.7"
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
uuid.workspace = true
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Url", "HtmlDialogElement", "File", "FileList", "Blob", "HtmlInputElement", "ClipboardEvent", "DataTransfer", "DragEvent", "MediaDevices", "MediaStream", "MediaStreamTrack", "HtmlVideoElement", "HtmlMediaElement", "HtmlCanvasElement", "CanvasRenderingContext2d", "Notification", "NotificationOptions", "NotificationPermission", "EventSource", "MessageEvent", "AudioContext", "AudioBuffer", "AudioBufferSourceNode", "AudioNode", "AudioDestinationNode", "History", "Location", "PopStateEvent", "Window", "Document", "Element", "HtmlElement", "Storage", "Navigator", "CustomEvent", "CustomEventInit", "Event", "EventTarget"] }
