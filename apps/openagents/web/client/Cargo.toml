# The web chat's transport for the chat API: the account's (or a signed-out
# visitor's) chats, projects, messages, and live answers from
# openagents.com's own JSON API (`/v1/threads`, `/v1/threads/{id}/events`,
# `/v1/projects`), over the browser's `fetch` and `EventSource` with the
# site's cookie. The values and their rules are openagents-sdk's
# (`chats::wire`), as the desktop and phone apps read them; this crate adds
# the browser transport (wasm32 only) and the site-only shapes.
[package]
name = "openagents-web-client"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"

[dependencies]
# The chat API's values and rules, shared with the desktop and phone apps;
# without its native transport.
openagents-sdk = { path = "../../../../crates/openagents-sdk", default-features = false }
anyhow.workspace = true
log.workspace = true
futures.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The browser's own NIP-HOST key (#12264): BIP-340 Schnorr, pure Rust.
k256 = { version = "0.13", default-features = false, features = ["schnorr", "arithmetic"] }
sha2 = { version = "0.10", default-features = false }
# The workspace registry (#12265): its rows, merge, and pending writes, and
# the values a new session writes, as the desktop and phone apps keep them.
openagents-doc = { path = "../../crates/doc" }
# A chat room's session doc (#12224); the version the desktop links.
loro = "1.13"
openagents-proto = { path = "../../crates/proto" }
chat-home = { path = "../../../../crates/chat-home" }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "wasmbind"] }

[dev-dependencies]
# The computer checks a browser's hello with this crate.
nostr = { path = "../../../../crates/nostr" }

[target.'cfg(target_family = "wasm")'.dependencies]
# The workspace's uuid turns on its browser randomness for proto.
uuid.workspace = true
js-sys = "0.3"
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "EventSource",
    "EventSourceInit",
    "Headers",
    "HtmlMetaElement",
    "Location",
    "MessageEvent",
    "Request",
    "RequestCredentials",
    "RequestInit",
    "Response",
    "Window",
    # The browser as a client of a computer (#12264).
    "BinaryType",
    "console",
    "Crypto",
    "DomStringList",
    "Event",
    "IdbDatabase",
    "IdbFactory",
    "IdbObjectStore",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    # Settings' choices and the new-thread background (#12288, #12289).
    "Storage",
    "CustomEvent",
    "CustomEventInit",
    "Navigator",
    "WebSocket",
    "CloseEvent",
    "Storage",
] }
