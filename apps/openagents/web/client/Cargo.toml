# The web chat's transport for the chat API: the account's (or a signed-out
# visitor's) chats, projects, messages, and live answers from
# openagents.com's own JSON API (`/v1/threads`, `/v1/threads/{id}/events`,
# `/v1/projects`), over the browser's `fetch` and `EventSource` with the
# site's cookie. The values and their rules are openagents-sdk's
# (`chats::wire`), as the desktop and phone apps read them; this crate adds
# the browser transport (wasm32 only) and the site-only shapes.
[package]
name = "openagents-web-client"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"

[dependencies]
# The chat API's values and rules, shared with the desktop and phone apps;
# without its native transport.
openagents-sdk = { path = "../../../../crates/openagents-sdk", default-features = false }
anyhow.workspace = true
futures.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The browser's own NIP-HOST key (#12264): BIP-340 Schnorr, pure Rust.
k256 = { version = "0.13", default-features = false, features = ["schnorr", "arithmetic"] }
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
# The computer checks a browser's hello with this crate.
nostr = { path = "../../../../crates/nostr" }

[target.'cfg(target_family = "wasm")'.dependencies]
# The browser as a client of a computer (#12264): the device room's frame
# codec.
openagents-proto = { path = "../../crates/proto" }
# The workspace's uuid turns on its browser randomness for proto.
uuid.workspace = true
js-sys = "0.3"
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "EventSource",
    "EventSourceInit",
    "Headers",
    "HtmlMetaElement",
    "Location",
    "MessageEvent",
    "Request",
    "RequestCredentials",
    "RequestInit",
    "Response",
    "Window",
    # The browser as a client of a computer (#12264).
    "BinaryType",
    "console",
    "Crypto",
    "DomStringList",
    "Event",
    "IdbDatabase",
    "IdbFactory",
    "IdbObjectStore",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "Navigator",
    "MediaDevices", "MediaStream", "MediaStreamConstraints", "MediaStreamTrack",
    "RtcDataChannel", "RtcDataChannelState", "RtcRtpSender", "MediaStreamTrackState", "AudioContext", "AudioNode", "AudioDestinationNode", "MediaStreamAudioSourceNode", "AnalyserNode", "BaseAudioContext",
    "RtcPeerConnection", "RtcSessionDescription", "RtcSessionDescriptionInit",
    "RtcSdpType", "RtcTrackEvent", "RtcIceGatheringState", "RtcPeerConnectionState",
    "HtmlAudioElement", "HtmlMediaElement", "EventTarget",
    "WebSocket",
] }
