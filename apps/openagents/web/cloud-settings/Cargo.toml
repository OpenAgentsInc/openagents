[package]
name = "openagents-web-cloud-settings"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"

[dependencies]
gpui.workspace = true
anyhow.workspace = true
openagents-chat-view.workspace = true
openagents-web-client.workspace = true
openagents-web-page-host = { path = "../page-host" }
serde_json = "1"
rust-native = { path = "../../../../crates/rust-native", default-features = false }

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Blob", "Clipboard", "Document", "Element", "HtmlAnchorElement", "HtmlElement", "Navigator", "Node", "Url", "Window"] }
