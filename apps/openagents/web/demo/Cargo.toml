# The desktop chat UI on the web: the offline demo chats drawn by GPUI in a
# browser canvas. Served locally at /demo/gpui; see README.md.
[package]
name = "openagents-web-demo"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gpui.workspace = true
openagents-web-chat-view.workspace = true
openagents-doc = { path = "../../crates/doc" }
openagents-proto = { path = "../../crates/proto" }
anyhow.workspace = true
openagents-brand = { path = "../../crates/brand" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-time.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
openagents-gpui-web.workspace = true
wasm-bindgen.workspace = true
console_error_panic_hook = "0.1.7"
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
uuid.workspace = true
chrono = { version = "0.4", features = ["wasmbind"] }
js-sys = "0.3"

# The imported fixture tests validate their Luau visual scripts natively.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
openagents-visual = { path = "../../crates/visual" }
