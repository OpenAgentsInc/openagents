# Dictation for the GPUI web chat (#12292): records the microphone and
# sends the audio to the chat's own computer, which transcribes it with its
# Parakeet model; the text comes back to the page. Its own module, which the
# chat page loads the first time dictation starts, so the chat's module
# stays under its budget. Built beside the chat by
# `scripts/build-web-chat.sh`.
[package]
name = "openagents-web-dictation"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
futures.workspace = true
serde_json = "1"

[target.'cfg(target_family = "wasm")'.dependencies]
openagents-web-client.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1.7"
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
js-sys = "0.3"
web-sys = { version = "0.3", features = ["AudioContext", "AudioContextState", "AudioNode", "AudioDestinationNode", "AudioBuffer", "AudioProcessingEvent", "BaseAudioContext", "MediaDevices", "MediaStream", "MediaStreamTrack", "MediaStreamConstraints", "MediaStreamAudioSourceNode", "ScriptProcessorNode", "Navigator", "CustomEvent", "CustomEventInit", "Event", "EventTarget", "Window"] }
