# The file panel beside the GPUI web chat (#12271, #12272): a chat's files
# on the computer it runs on, read and edited over host RPC through the
# device room. Its own module, which the chat page loads the first time the
# panel opens, so the chat's module stays under its budget. Built beside the
# chat by `scripts/build-web-chat.sh`.
[package]
name = "openagents-web-files"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gpui.workspace = true
anyhow.workspace = true
futures.workspace = true
openagents-web-chat-view.workspace = true
openagents-web-client.workspace = true
openagents-proto = { path = "../../crates/proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
web-time.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
openagents-gpui-web = { workspace = true, features = ["browser-text"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1.7"
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
uuid.workspace = true
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Blob", "BlobPropertyBag", "CustomEvent", "CustomEventInit", "Document", "Element", "Event", "EventTarget", "HtmlAnchorElement", "HtmlElement", "Storage", "Url", "Window"] }
