# GPUI's browser platform: the canvas is the window, requestAnimationFrame is
# the frame loop, DOM events are input, and separate WebGPU and WebGL2
# builds paint the scene. Text uses the browser or bundled fonts. Ported from zui's
# `gpui_web` (Apache-2.0, see LICENSE-APACHE and NOTICE); the changes are
# listed in `apps/openagents/docs/downstream-patches.md`.
[package]
name = "openagents-gpui-web"
version = "0.1.0"
publish.workspace = true
edition.workspace = true
license = "Apache-2.0"

[features]
default = ["webgpu"]
webgpu = ["dep:gpui_wgpu"]
# The fallback has no wgpu dependency and uses the browser text system.
webgl = ["browser-text", "dep:openagents-first-frame-paint", "dep:etagere", "dep:serde_json"]
# Background threads over SharedArrayBuffer. Needs a nightly compiler with
# wasm atomics and cross-origin isolation headers; off by default.
multithreaded = ["dep:wasm_thread"]
# Record the frame an app announces as ready (`announce_ready`) as an
# `openagents-first-frame` scene, which a page keeps and paints before the
# module on the next visit (`recorded_frame`).
first-frame = ["dep:openagents-first-frame", "dep:openagents-first-frame-record"]
# Shape, measure, and draw text with the browser instead of cosmic-text,
# swash, and the module's own font database (#12299): about 360 KB less
# with brotli, grayscale text, no kerning between clusters.
browser-text = ["dep:unicode-segmentation"]

[lib]
path = "src/gpui_web.rs"

[target.'cfg(target_family = "wasm")'.dependencies]
gpui.workspace = true
image = { version = "0.25", default-features = false }
parking_lot = { version = "0.12.1", features = ["nightly"] }
gpui_wgpu = { workspace = true, optional = true }
http_client.workspace = true
anyhow.workspace = true
futures.workspace = true
log.workspace = true
smallvec.workspace = true
uuid.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4"
getrandom = { version = "0.3", features = ["wasm_js"] }
web-time.workspace = true
console_error_panic_hook = "0.1.7"
js-sys = "0.3"
raw-window-handle.workspace = true
wasm_thread = { version = "0.3", features = ["es_modules"], optional = true }
openagents-first-frame = { workspace = true, optional = true }
unicode-segmentation = { version = "1.10", optional = true }
openagents-first-frame-record = { workspace = true, optional = true }
openagents-first-frame-paint = { path = "../first-frame-paint", optional = true, default-features = false }
etagere = { version = "0.2", optional = true }
serde_json = { version = "1", optional = true }
web-sys = { version = "0.3", features = [
    "WebGl2RenderingContext",
    "WebGlBuffer",
    "WebGlContextAttributes",
    "WebGlFramebuffer",
    "WebGlProgram",
    "WebGlRenderbuffer",
    "WebGlShader",
    "WebGlTexture",
    "WebGlUniformLocation",
    "Blob",
    "CanvasRenderingContext2d",
    "ImageBitmap",
    "ImageData",
    "console",
    "Clipboard",
    "ClipboardEvent",
    "CompositionEvent",
    "CssStyleDeclaration",
    "DataTransfer",
    "Document",
    "DomRect",
    "DragEvent",
    "Element",
    "Event",
    "EventInit",
    "FontFace",
    "FontFaceDescriptors",
    "FontFaceSet",
    "ImageData",
    "OffscreenCanvas",
    "OffscreenCanvasRenderingContext2d",
    "TextMetrics",
    "EventTarget",
    "File",
    "FileList",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "KeyboardEvent",
    "MediaQueryList",
    "MediaQueryListEvent",
    "MouseEvent",
    "Navigator",
    "Performance",
    "PointerEvent",
    "ResizeObserver",
    "ResizeObserverBoxOptions",
    "ResizeObserverEntry",
    "ResizeObserverSize",
    "ResizeObserverOptions",
    "Screen",
    "Storage",
    "VisualViewport",
    "Headers",
    "Request",
    "RequestInit",
    "RequestRedirect",
    "Response",
    "WheelEvent",
    "WheelEventInit",
    "Window",
] }

[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen-test = "=0.3.78"

[[example]]
name = "renderer-fixture"
required-features = ["webgl"]
crate-type = ["cdylib"]
