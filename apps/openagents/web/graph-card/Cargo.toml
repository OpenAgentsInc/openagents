# The AgentGraph demo on openagents.com/lander7: a demo chat, drawn by the
# shared GPUI chat views, at the center of a graph of what it uses (Google
# and GitHub tools, web search, a relay, a Pylon, and a Spark wallet), with
# data and sats moving along the links as the scripted chat plays, and the
# chat composer's text field at the bottom. One module for both views.
# Built twice by `scripts/build-web-graph-card.sh`: WebGPU-only (the
# `webgpu/` workspace beside this crate) and with wgpu's WebGL2 fallback
# (this workspace).
[package]
name = "openagents-web-graph-card"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["export"]
# Exports `mount` to the page. The WebGPU-only build (`webgpu/`) links this
# crate without it and exports its own.
export = []

[dependencies]
gpui.workspace = true
openagents-web-chat-view.workspace = true
openagents-doc = { path = "../../crates/doc" }
openagents-proto = { path = "../../crates/proto" }
agent-graph = { path = "../../../../crates/agent-graph", default-features = false }
web-time.workspace = true

[dev-dependencies]
# The step test reads each streamed prefix as the chat views parse it.
openagents-markdown = { path = "../../crates/markdown" }
oa-copy = { path = "../../../../crates/oa-copy" }

[target.'cfg(target_family = "wasm")'.dependencies]
openagents-gpui-web.workspace = true
wasm-bindgen.workspace = true
console_error_panic_hook = "0.1.7"
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
uuid.workspace = true
chrono = { version = "0.4", features = ["wasmbind"] }
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Document", "Element", "Event", "EventTarget", "Window"] }
