# Account credentials in their own lazily loaded GPUI module (#12326).
[package]
name = "openagents-web-keys"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"

[features]
default = ["webgpu"]
webgpu = ["openagents-gpui-web/webgpu"]
webgl = ["openagents-gpui-web/webgl"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gpui.workspace = true
anyhow.workspace = true
openagents-web-client.workspace = true
openagents-web-page-host = { path = "../page-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
openagents-chat-view.workspace = true
rust-native = { path = "../../../../crates/rust-native", default-features = false }

[target.'cfg(target_family = "wasm")'.dependencies]
openagents-gpui-web = { workspace = true, features = ["browser-text"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1.7"
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
uuid.workspace = true
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Clipboard", "Navigator", "Event", "EventTarget", "Window", "Location"] }
