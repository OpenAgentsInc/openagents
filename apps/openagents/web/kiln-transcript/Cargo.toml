# Kiln's transcript (crates/kiln, docs/kiln/): the Kiln page's agent run,
# drawn with the desktop's transcript (`openagents_web_chat_view::
# desktop_transcript`) in the page's `#gpui-mount` box. Kiln hands it the
# run as JSON (`show`) whenever the run changes; this crate maps that onto
# the desktop's message parts (thinking, text, and tool calls with diffs),
# so Kiln draws with the same components as the OpenAgents app.
# Built by `apps/openagents/scripts/build-web-kiln-transcript.sh`.
[package]
name = "openagents-web-kiln-transcript"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["webgl", "export"]
# Exports `mount` and `show` to Kiln's page. The Grid's chat links this
# crate without them and embeds the view itself (#12456).
export = []
webgpu = ["openagents-gpui-web/webgpu"]
webgl = ["openagents-gpui-web/webgl"]

[dependencies]
gpui.workspace = true
openagents-web-chat-view.workspace = true
openagents-chat-view.workspace = true
openagents-doc = { path = "../../crates/doc" }
openagents-proto = { path = "../../crates/proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-time.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
openagents-gpui-web = { workspace = true, features = ["browser-text"] }
wasm-bindgen.workspace = true
console_error_panic_hook = "0.1.7"
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
uuid.workspace = true
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Document", "Element", "Event", "EventTarget", "Window"] }
