# A Lab document in the GPUI web app (#12333): the same Rust Native card
# the chat and the site draw (`lab_ui::card`, through the shared forms),
# with the document's player (a video, an image, a 3D model, or a
# playable) in its own frame over the canvas. Its own module, which the
# page's start script loads at `?page=labs`. Built beside the chat by
# `scripts/build-web-chat.sh`.
[package]
name = "openagents-web-lab"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gpui.workspace = true
openagents-chat-view.workspace = true
openagents-web-client.workspace = true
openagents-web-page-host = { path = "../page-host" }
serde_json = "1"
lab-kit = { path = "../../../../crates/lab-kit" }
rust-native = { path = "../../../../crates/rust-native", default-features = false }

[target.'cfg(target_family = "wasm")'.dependencies]
openagents-gpui-web = { workspace = true, features = ["browser-text"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1.7"
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
uuid.workspace = true
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlElement", "HtmlIFrameElement", "Node", "Window"] }
