# The pylon card's WebGPU-only build: the same crate, linked with a wgpu
# that has no WebGL2 (GLES) backend, as `web/card/webgpu` builds /lander6's
# card. `wgpu/` is written by `scripts/build-web-pylon-card.sh` before
# building (it is not checked in).
[workspace]
resolver = "2"

[package]
name = "openagents-web-pylon-card-webgpu"
version = "1.0.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
openagents-web-pylon-card = { path = "..", default-features = false }
wasm-bindgen = "=0.2.128"

[patch.crates-io]
wgpu = { path = "wgpu" }
# As in ../../Cargo.toml.
openagents-workspace-hack = { path = "../../hack-stub" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
