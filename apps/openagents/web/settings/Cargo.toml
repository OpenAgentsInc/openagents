# Settings beside the GPUI web chat (#12288, #12289, #12290): the desktop's
# pages as Rust Native forms, in a window over the chat. Its own module,
# which the chat page loads the first time Settings opens, so the chat's
# module stays under its budget. Built beside the chat by
# `scripts/build-web-chat.sh`.
[package]
name = "openagents-web-settings"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gpui.workspace = true
anyhow.workspace = true
futures.workspace = true
openagents-web-chat-view.workspace = true
openagents-chat-view.workspace = true
openagents-web-client.workspace = true
openagents-proto = { path = "../../crates/proto" }
openagents-theme = { path = "../../crates/theme" }
rust-native = { path = "../../../../crates/rust-native", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
base64 = "0.22"
web-time.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
openagents-gpui-web = { workspace = true, features = ["browser-text"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1.7"
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
uuid.workspace = true
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Blob", "Clipboard", "HtmlAnchorElement", "Url", "Document", "Element", "Event", "EventTarget", "File", "FileList", "HtmlElement", "HtmlFormElement", "HtmlInputElement", "Location", "MediaQueryList", "Navigator", "Node", "Notification", "NotificationPermission", "Window"] }
