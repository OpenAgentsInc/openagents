[package]
name = "openagents-web-terminal"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openagents-web-connection-pages = { path = "../connection-pages" }
gpui.workspace = true
openagents-chat-view.workspace = true
openagents-web-client.workspace = true
openagents-web-page-host = { path = "../page-host" }
serde_json = "1"
rust-native = { path = "../../../../crates/rust-native", default-features = false }

[target.'cfg(target_family = "wasm")'.dependencies]
openagents-gpui-web = { workspace = true, features = ["browser-text"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1.7"
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
uuid.workspace = true
js-sys = "0.3"
