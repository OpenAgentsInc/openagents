[package]
name = "openagents-web-transcript-extras"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["webgpu"]
webgpu = ["openagents-gpui-web/webgpu"]
webgl = ["openagents-gpui-web/webgl"]

[dependencies]
gpui.workspace = true
anyhow.workspace = true
futures.workspace = true
openagents-chat-view.workspace = true
openagents-web-chat-view.workspace = true
openagents-web-client.workspace = true
openagents-proto = { path = "../../crates/proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
postcard = { version = "1.1.3", default-features = false }
openagents-theme = { path = "../../crates/theme" }

[target.'cfg(target_family = "wasm")'.dependencies]
openagents-gpui-web = { workspace = true, features = ["browser-text"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1.7"
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
uuid.workspace = true
js-sys = "0.3"
