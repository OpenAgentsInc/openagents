[package]
name = "openagents-web-visuals"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gpui.workspace = true
openagents-web-client.workspace = true
base64 = "0.22"
openagents-web-chat-view = { workspace = true, features = ["visuals"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
openagents-doc = { path = "../../crates/doc" }
openagents-brand = { path = "../../crates/brand" }

[target.'cfg(target_family = "wasm")'.dependencies]
openagents-gpui-web = { workspace = true, features = ["browser-text"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlElement", "Window", "CssStyleDeclaration", "CustomEvent", "CustomEventInit"] }
console_error_panic_hook = "0.1.7"
