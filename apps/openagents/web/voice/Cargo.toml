# The voice call stage in the GPUI web chat (#12293): the full-window call,
# its orb, and the browser's microphone and speaker over the computer's
# voice agent. Its own module, which the page's start script loads when the
# chat's Voice button asks (`oa-page-open`), so the chat's module stays under
# its budget. Built beside the chat by `scripts/build-web-chat.sh`.
[package]
name = "openagents-web-voice"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["webgpu"]
webgpu = ["openagents-gpui-web/webgpu"]
webgl = ["openagents-gpui-web/webgl"]

[dependencies]
gpui.workspace = true
anyhow.workspace = true
openagents-web-chat-view.workspace = true
openagents-web-client.workspace = true
openagents-voice-session = { path = "../../crates/voice-session", default-features = false }
openagents-orb = { path = "../../crates/orb" }
openagents-proto = { path = "../../crates/proto" }
web-time.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
openagents-gpui-web = { workspace = true, features = ["browser-text"] }
wasm-bindgen.workspace = true
console_error_panic_hook = "0.1.7"
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
uuid.workspace = true
js-sys = "0.3"
web-sys = { version = "0.3", features = ["CustomEvent", "CustomEventInit", "Event", "EventTarget", "Window"] }
