# What an arcing meteor leaves in the air: a short tongue of fire that
# cools into a long column of dark smoke, and embers streaming off. Moved
# with the meteor (`Particles::place`), its axis back along the flight;
# stopped when it lands, so the smoke hangs where it flew.
description = "An arcing meteor's fire, its long trail of dark smoke, and streaming embers."

# Fire shed where the meteor passes, cooling fast.
[[emitter]]
name = "fire"
sheet = "fireball"
frames = [2, 14]
animate = "life"
luminance = 12.0
rate = 190.0
life = [0.22, 0.4]
inherit = 0.15
spread = 180.0
speed = [0.2, 0.8]
gravity = 1.0
drag = 2.0
size = [0.45, 0.65]
scale = [[0.0, 0.9], [0.4, 1.4], [1.0, 1.8]]
color = [[1.0, 0.78, 0.45], [1.0, 0.42, 0.1], [0.45, 0.2, 0.12]]
alpha = [[0.0, 0.95], [0.5, 0.6], [1.0, 0.0]]
additive = [1.0, 0.7, 0.2]
spin = [-1.5, 1.5]
priority = 6

# Dark smoke that hangs along the arc, swells, and drifts up.
[[emitter]]
name = "smoke"
sheet = "smoke"
animate = "life"
blend = "alpha"
light = "lit"
lit = true
density = 1.2
rate = 40.0
life = [1.6, 2.4]
inherit = 0.02
spread = 180.0
speed = [0.2, 0.6]
gravity = 0.35
drag = 1.0
size = [0.7, 1.0]
scale = [[0.0, 1.0], [0.4, 2.4], [1.0, 3.4]]
color = [[0.0, [0.26, 0.21, 0.18]], [0.4, [0.25, 0.24, 0.23]], [1.0, [0.4, 0.39, 0.38]]]
alpha = [[0.0, 0.0], [0.1, 0.55], [0.6, 0.35], [1.0, 0.0]]
spin = [-0.5, 0.5]
priority = 4

# Embers flung back off the head, laid along their flight.
[[emitter]]
name = "embers"
sheet = "sparks"
frames = [0, 0]
luminance = 80.0
rate = 50.0
life = [0.3, 0.6]
spread = 50.0
speed = [4.0, 9.0]
gravity = -6.0
drag = 1.2
size = [0.05, 0.09]
stretch = 0.05
stretch_max = 1.2
rotate = false
color = [[1.0, 0.9, 0.6], [1.0, 0.55, 0.15], [0.9, 0.2, 0.04]]
alpha = [1.0, 1.0, 0.0]
priority = 5
