# A falling meteor's burning head. Started at the meteor and moved with it
# every frame (`Particles::place`); stopped when it lands. The effect's
# axis points back along the flight, so +Y throws fire behind it.
description = "The white-hot glow and churning fire around a falling meteor."

# A hot glow, re-emitted every few frames and carried with the meteor.
[[emitter]]
name = "glow"
sheet = "sparks"
frames = [1, 1]
animate = "random"
luminance = 120.0
rate = 40.0
life = [0.08, 0.1]
inherit = 1.0
size = [1.7, 2.0]
scale = [0.9, 1.0, 1.1]
color = [1.0, 0.82, 0.55]
alpha = [1.0, 0.8, 0.0]
priority = 9

# Fire tongues that roll off the rock and fall behind it.
[[emitter]]
name = "fire"
sheet = "fireball"
frames = [0, 9]
animate = "life"
luminance = 30.0
rate = 70.0
life = [0.16, 0.26]
inherit = 0.85
spread = 70.0
speed = [1.0, 3.0]
size = [0.9, 1.3]
scale = [0.7, 1.1, 1.3]
color = [[1.0, 0.9, 0.7], [1.0, 0.6, 0.25], [1.0, 0.35, 0.1]]
alpha = [1.0, 0.85, 0.0]
spin = [-3.0, 3.0]
priority = 8
