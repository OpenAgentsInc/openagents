# Existing Coder app identity. The public native reader replaces the rendering
# implementation while retaining the app, team, versions, and signing setup.
name: Coder
options:
  bundleIdPrefix: com.openagents
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  Coder:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openagents.coder
        PRODUCT_NAME: Coder
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: HQWSG26L43
        CODE_SIGN_STYLE: Manual
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Distribution"
        "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": "OpenAgents Coder App Store"
        CURRENT_PROJECT_VERSION: 38
        MARKETING_VERSION: 0.5.0
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: App/CoderMobile.h
        OTHER_LDFLAGS: "$(inherited) -lcoder_mobile"
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": "$(CODER_RUST_LIBRARY_DIR)"
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": "$(CODER_RUST_LIBRARY_DIR)"
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        DEAD_CODE_STRIPPING: YES
  CoderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Coder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openagents.coder.uitests
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: HQWSG26L43
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Coder
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
schemes:
  Coder:
    build:
      targets:
        Coder: all
        CoderUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CoderUITests
    archive:
      config: Release
