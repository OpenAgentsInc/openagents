# The Ice Cream Man for iPhone and iPad: a thin UIKit app around one
# WKWebView running the game's wasm/js bundle, copied into App/game by
# ../build.sh from scripts/build-icecream-web.sh --with-page.
name: IceCreamMan
options:
  bundleIdPrefix: com.openagents
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  IceCreamMan:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - game
      # The game bundle as a folder, so it lands at <app>/game/.
      - path: App/game
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openagents.icecreamman
        PRODUCT_NAME: IceCreamMan
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: HQWSG26L43
        CODE_SIGN_STYLE: Manual
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Distribution"
        "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": "The Ice Cream Man App Store"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        DEAD_CODE_STRIPPING: YES
  # Simulator UI tests: build.sh test runs them.
  IceCreamManUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: IceCreamMan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openagents.icecreamman.uitests
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: HQWSG26L43
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: IceCreamMan
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
schemes:
  IceCreamMan:
    build:
      targets:
        IceCreamMan: all
        IceCreamManUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - IceCreamManUITests
    archive:
      config: Release
