# The OpenAgents app. It shares Rust Native's SwiftUI renderer with Coder
# and links its own Rust library, openagents-mobile.
name: OpenAgents
options:
  bundleIdPrefix: com.openagents
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  OpenAgents:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: ../../coder-ios/host/App/NativeView.swift
        group: App/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openagents.app
        PRODUCT_NAME: OpenAgents
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: HQWSG26L43
        CODE_SIGN_STYLE: Manual
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Distribution"
        "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": "OpenAgents App Store"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: App/OpenAgentsMobile.h
        OTHER_LDFLAGS: '$(inherited) "$(OPENAGENTS_RUST_LIBRARY_DIR)/libopenagents_mobile.a"'
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        DEAD_CODE_STRIPPING: YES
schemes:
  OpenAgents:
    build:
      targets:
        OpenAgents: all
    run:
      config: Debug
    archive:
      config: Release
