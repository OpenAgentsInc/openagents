# Keys that may use POST /api/v1/inference besides the admins' (coax/web/api/inference.c):
# Nostr public keys, 64 hex, one a line. deploy.sh passes them to the service as
# OA_INFERENCE_PUBKEYS. Each is still held to the route's daily caps.
# GameBuilder's hosted server (gamebuilder.org's cloud agents, gamebuilder issue 7) signs
# its model calls with its own key: the owner adds the line `gamebuilder cloud-key FILE`
# prints ("pubkey") here, then releases.
