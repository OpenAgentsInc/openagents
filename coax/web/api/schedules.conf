# Scheduled jobs (jobs.c), as schedules.sh puts them in Cloud Scheduler:
# job  minute hour day-of-month month day-of-week, in America/Chicago.
heartbeat 0 7 * * *
# Our login's housekeeping: old limit windows, spent logins, aged audit rows (#13203).
auth-sweep 30 3 * * *
# The service watch, every minute: the rooms' and the database's alerts (service.c, #13297).
service-watch * * * * *
