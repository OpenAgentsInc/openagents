[package]
name = "acp-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The Agent Client Protocol as Coder speaks it to a local coding agent: typed frames, one client over an agent's stdio, the agent process in its own group, and the Devin CLI's, OpenCode's, and Grok Build's specifics."
publish.workspace = true

[dependencies]
coder-lease = { path = "../coder-lease" }
# The one credential-name policy every env scrubber shares.
secret-screen = { path = "../secret-screen" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }

# Unix: the agent's process group and its signals.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows: the job object the agent and its tools run in.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time", "rt-multi-thread"] }

[lints]
workspace = true
