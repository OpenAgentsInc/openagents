[package]
name = "acp-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The Agent Client Protocol as Coder speaks it to a local coding agent: typed frames, one client over an agent's stdio, the agent process in its own group, and the Devin CLI's and OpenCode's specifics."
publish.workspace = true

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time", "rt-multi-thread"] }

[lints]
workspace = true
