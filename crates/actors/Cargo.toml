[package]
name = "actors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Transactional Rust actors with durable PostgreSQL inboxes, alarms, effects, and fenced work."

[features]
# The PostgreSQL store, the background runtime, and the HTTP routes. Without
# it the crate is the actor definitions and wire types only, which a domain
# crate or a client can use without a database driver.
default = ["server"]
server = ["dep:tokio", "dep:tokio-postgres", "dep:axum", "dep:futures-util", "dep:getrandom"]
# The network client a remote executor uses (`net::Client`).
net = ["dep:reqwest"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = { version = "0.4", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"], optional = true }
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1"], optional = true }
axum = { version = "0.8", features = ["json", "query", "tokio", "http1"], optional = true }
futures-util = { version = "0.3", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process"] }

[[bin]]
name = "actors-admin"
required-features = ["server"]

[[bin]]
name = "actors-load"
required-features = ["server"]

[[bin]]
name = "actors-crash"
required-features = ["server"]

[lints]
workspace = true
