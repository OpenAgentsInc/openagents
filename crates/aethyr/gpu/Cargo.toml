[package]
name = "af-gpu"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A thin GPU interface shaped like webgpu.h, with a browser backend and a native webgpu.h backend."

[features]
default = []
# Link a native webgpu.h implementation (Dawn or wgpu-native). See build.rs.
native = ["dep:bindgen"]

[dependencies]
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
bindgen = { version = "0.73", optional = true, default-features = false, features = ["runtime"] }

[package.metadata.af]
note = "The native feature generates bindings from the header of the selected webgpu.h implementation."

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(af_dawn)', 'cfg(af_wgpu_native)'] }
