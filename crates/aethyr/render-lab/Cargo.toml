[package]
name = "af-render-lab"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Standalone renderer lab for decisions 0006-0008: one Rust renderer on browser WebGPU and native webgpu.h."

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "render-lab-native"
required-features = ["native"]

[[bin]]
name = "render-lab-window"
required-features = ["window"]

[features]
default = []
native = ["af-gpu/native"]
# The windowed runner: winit for the window, plus a CAMetalLayer on macOS.
window = ["native", "dep:winit", "dep:raw-window-metal"]

[dependencies]
af-gpu = { path = "../gpu" }
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.30", features = ["bytemuck"] }
serde.workspace = true
serde_json.workspace = true
winit = { version = "0.30", optional = true, default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-metal = { version = "1", optional = true }

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
