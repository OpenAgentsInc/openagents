[package]
name = "af-world-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
af-mmorpg-core = { path = "../mmorpg-core" }
af-kernel = { path = "../kernel" }
serde.workspace = true
serde_json.workspace = true
axum = { version = "=0.8.9", features = ["ws"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "signal"] }
futures-util = "=0.3.34"

[dev-dependencies]
tokio-tungstenite = "=0.29.0"
