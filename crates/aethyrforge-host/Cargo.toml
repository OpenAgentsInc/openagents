[package]
name = "aethyrforge-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Public, engine-independent Aethyrforge host protocol and browser adapter."

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
sha2 = "0.10"
url = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "KeyboardEvent", "Document", "Element", "Node", "HtmlElement", "HtmlIFrameElement", "Event", "EventTarget", "MessageEvent", "MessagePort", "MessageChannel", "Crypto", "Performance", "Location", "Storage", "HtmlDialogElement", "HtmlInputElement", "HtmlSelectElement", "FileList", "File", "Blob", "HtmlTextAreaElement", "Request", "RequestInit", "RequestCredentials", "Response", "Headers", "BroadcastChannel"] }

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
openagents-workspace-hack = { version = "0.1" }

[lints]
workspace = true
