<!doctype html><html lang="en"><meta charset="utf-8"><meta name="host-origin" content="http://127.0.0.1:55306"><title>Synthetic engine fixture</title><style>body{background:#102a34;color:#d8eeec;font:24px system-ui;padding:60px}</style><p>Synthetic world. No private engine or assets.</p><p id="frames"></p>
<script type="module">
// Deliberately synthetic engine behavior, using the same Rust protocol endpoint.
import init,{EngineEndpoint} from './aethyrforge_host.js';await init();
const q=new URLSearchParams(location.search);let observing=false,opened=false,frame=0,timer,checkpoint={eye:[2,1.7,4],target:[2,1.7,3],mode:'walk'},project,generation=crypto.randomUUID();
const status=()=>({project,generation,frame,save:'unsaved',checkpoint});

</script></html>
