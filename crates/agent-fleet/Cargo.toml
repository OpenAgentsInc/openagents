[package]
name = "agent-fleet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Background agents: one registry and lifecycle (start, list, stop, message, resume, finish notices) shared by the terminal, the website, and the apps."

[dependencies]
coder-lease = { path = "../coder-lease" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
openagents-workspace-hack = { version = "0.1" }
