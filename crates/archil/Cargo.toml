[package]
name = "archil"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Rust port of Archil's official TypeScript SDK (the `disk` npm package)"
license = "MIT"
publish = false
readme = "README.md"
keywords = ["archil", "sandbox", "disk", "sdk"]
categories = ["api-bindings"]

[lints.rust]
unsafe_code = "forbid"

[dependencies]
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
percent-encoding = "2"
quick-xml = "0.38"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "charset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "net", "io-util"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
wiremock = "0.6"
