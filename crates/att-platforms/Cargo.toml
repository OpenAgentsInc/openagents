[package]
name = "att-platforms"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "NIP-ATT verification for raw Intel TDX (DCAP) quotes, AMD SEV-SNP reports, and NVIDIA NRAS GPU evidence."

[dependencies]
oa-att = { path = "../oa-att" }
nostr = { path = "../nostr" }
p256 = { version = "0.13", features = ["ecdsa"] }
p384 = { version = "0.13", features = ["ecdsa"] }
rsa = { version = "0.9", default-features = false, features = ["std", "sha2"] }
x509-cert = { version = "0.2.5", default-features = false }
sha2 = { version = "0.10", features = ["oid"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[dev-dependencies]
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
p384 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }

[lints]
workspace = true
