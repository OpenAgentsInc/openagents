[package]
name = "att-release"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "NIP-ATT release assurance: Rekor inclusion and checkpoint verification, independent rebuild statements, the personal approval set, and sealed-job 3201 receipts, with an `att-release` CLI."

[[bin]]
name = "att-release"
path = "src/main.rs"

[dependencies]
nostr = { path = "../nostr" }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
base64 = "0.22"
secp256k1 = "0.31.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lints]
workspace = true
