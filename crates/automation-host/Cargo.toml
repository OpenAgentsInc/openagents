[package]
name = "automation-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Finite NIP-AUTO plans over shared standing-job admission and NIP-COORD dispatch."
[dependencies]
nostr = { path = "../nostr" }
standing-jobs = { path = "../standing-jobs" }
coordination-host = { path = "../coordination-host" }
workspace-host = { path = "../workspace-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secp256k1 = { version = "0.31.1", features = ["rand"] }
[dev-dependencies]
tempfile = "3"
[lints]
workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
openagents-workspace-hack = { version = "0.1" }
