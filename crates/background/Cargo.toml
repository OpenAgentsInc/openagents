[package]
name = "background"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Background processes: durable rules the host runs without a conversation, starting with the disk cleanup monitor (docs/background)."

[dependencies]
atif = { path = "../atif" }
# The places macOS guards with a privacy prompt, which no walk enters.
coder-boundary = { path = "../coder-boundary" }
# Log and trace rotation compresses old files.
flate2 = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
