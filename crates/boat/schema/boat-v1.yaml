        type:
          type: string
          enum: [personal, org]
        role:
          type: string
          enum: [owner, member]
        memberCount:
          type: integer
        subscriptionStatus:
          type: string
          description: Stripe status of the organization's plan; absent on the personal row.
        active:
          type: boolean
          description: The wallet new sandboxes bill when a request names none.
    OrgListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [orgs, activeWalletChosen]
          properties:
            type:
              type: string
              const: org.list
