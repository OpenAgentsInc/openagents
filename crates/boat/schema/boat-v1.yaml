              description: Whether this account ever set its active wallet. `false` means personal by default, never a choice.
            orgs:
              type: array
              items: { $ref: '#/components/schemas/Org' }
    ActiveOrgUpdateRequest:
      type: object
      required: [org]
      properties:
        org:
          type: [string, 'null']
          description: Organization id or name you belong to; `personal`, your own id or `null` for personal.
    ActiveOrgResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [active]
          properties:
            type:
              type: string
              const: org.active_updated
            active:
              type: object
              required: [id, name, type]
              properties:
                id: { type: string }
                name: { type: string }
                type:
                  type: string
                  enum: [personal, org]
    LimitsResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - $ref: '#/components/schemas/LimitsFields'
    ReposResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [installations, environmentId, selectedRepositories]
          properties:
            installations:
              type: array
              items:
                $ref: '#/components/schemas/RepositoryInstallation'
            environmentId:
              type: string
            subenvironmentId:
              type: [string, 'null']
              description: Id of the default environment. `environmentId` is the id of its latest version.
            selectedRepositories:
              type: array
              items:
                $ref: '#/components/schemas/SelectedRepository'
            pageInfo:
              $ref: '#/components/schemas/PageInfo'
    RepoSelectionResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [success, environmentId, selectedRepositories]
          properties:
            success:
              type: boolean
            environmentId:
              type: string
            subenvironmentId:
              type: [string, 'null']
              description: Id of the default environment. `environmentId` is the id of its new version.
            selectedRepositories:
              type: array
              items:
                $ref: '#/components/schemas/SelectedRepository'
    SecretsResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [environmentId, envContents, secretFiles]
          properties:
            success:
              type: boolean
            environmentId:
              type: string
            subenvironmentId:
              type: string
              description: Id of the default environment. `environmentId` is the id of its latest version.
            envContents:
              type: string
            secretFiles:
              type: array
              items:
                $ref: '#/components/schemas/SecretFile'
            pushed:
              type: object
              additionalProperties: true
              description: Present on update; counts how many active sandboxes received the new environment.
    SandboxListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [sandboxes]
          properties:
            type:
              type: string
              const: sandbox.list
            sandboxes:
              type: array
              items:
                $ref: '#/components/schemas/Sandbox'
            pageInfo:
              $ref: '#/components/schemas/PageInfo'
    SandboxInfoResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [sandbox]
          properties:
            type:
              type: string
              examples: [sandbox.info]
            sandbox:
              $ref: '#/components/schemas/Sandbox'
            giftLimitNotice:
              type: string
              description: Present when a fair-use cap on a gifted account shortened the requested auto-stop time.
    CreateSandboxResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [status, ttlSeconds, sandbox]
          properties:
            type:
              type: string
              const: sandbox.created
            status:
              type: string
              enum: [provisioning, ready]
              description: '`ready` only when an idempotent retry finds a sandbox that is already past provisioning.'
            ttlSeconds:
              type: [integer, 'null']
            sandbox:
              $ref: '#/components/schemas/Sandbox'
            giftLimitNotice:
              type: string
              description: Present when a fair-use cap on a gifted account shortened the requested auto-stop time.
    SandboxActionResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [id, status]
          properties:
            type:
              type: string
              examples: [sandbox.stopping]
            id:
              type: string
            status:
              type: string
              examples: [archiving]
            sandbox:
              oneOf:
                - $ref: '#/components/schemas/Sandbox'
                - type: 'null'
            giftLimitNotice:
              type: string
              description: Present on resume or fork when a fair-use cap on a gifted account shortened the requested auto-stop time.
            conversationId:
              type: string
              description: On interrupt, the conversation whose turn was interrupted.
    PageInfo:
      type: object
      required: [nextCursor, hasMore, limit]
      properties:
        nextCursor:
          type: [string, 'null']
        hasMore:
          type: boolean
        limit:
          type: integer
    PromptRun:
      type: object
      required: [id, promptId, sandboxId, status, done]
      properties:
        id: { type: string }
        promptId: { type: string }
        sandboxId: { type: string }
        status:
          type: string
          enum: [sending, queued, running, finished, failed, interrupted]
        done:
          type: boolean
        createdAt:
          type: [string, 'null']
          format: date-time
        model:
          type: [string, 'null']
        reasoningEffort:
          type: [string, 'null']
        fast:
          type: [boolean, 'null']
          description: The prompt runs in fast mode. `null` means no speed is set yet. The prompt waits without a speed choice, or it ended without running (`done` is true). The speed is set when the prompt starts, for the model that runs.
        conversationId:
          type: [string, 'null']
          description: The conversation this prompt ran in. A Sandbox runs many conversations in parallel; see [Integrated agents](/integrated-agents).
    PromptRunResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [id, promptRun]
          properties:
            type:
              type: string
              const: prompt.run
            id:
              type: string
            promptRun:
              $ref: '#/components/schemas/PromptRun'
    SandboxEvent:
      type: object
      required: [type]
      additionalProperties: true
      properties:
        id:
          type: string
        type:
          type: string
        timestamp:
          type: integer
        taskId:
          type: [string, 'null']
        conversationId:
          type: [string, 'null']
          description: The conversation this event belongs to. Filter the stream with `?conversation=<id>`. See [Integrated agents](/integrated-agents).
        data:
          type: object
          additionalProperties: true
    UnknownEvent:
      type: object
      required: [type]
      additionalProperties: true
      properties:
        type: { type: string }
    PromptEvent:
      type: object
      required: [id, type, timestamp, data]
      properties:
        id: { type: string }
        type: { type: string, const: prompt }
        timestamp: { type: integer }
        taskId: { type: [string, 'null'] }
        conversationId: { type: [string, 'null'], description: 'The conversation this prompt belongs to.' }
        data:
          type: object
          required: [prompt, status]
          properties:
            prompt: { type: string }
            status: { type: string, enum: [sending, queued, running, finished, failed, interrupted] }
            is_reverted: { type: boolean }
            error:
              type: string
              description: Why the prompt failed. Present only when `status` is `failed`.
            attachments:
              type: array
              items:
                type: object
                properties:
                  filename: { type: string }
                  mimeType: { type: string }
                  base64Data: { type: string }
            citations:
              type: array
              description: Earlier chat events quoted in this prompt.
              items:
                type: object
                properties:
                  eventId: { type: string }
                  type: { type: string }
                  author: { type: string }
                  text: { type: string }
    SteerEvent:
      type: object
      required: [id, type, timestamp, data]
      description: A message sent into a turn that was already running, via `POST /sandboxes/{sandboxId}/steer`. It is not a prompt run; the output it causes belongs to the turn that was already running.
      properties:
        id: { type: string }
        type: { type: string, const: steer }
        timestamp: { type: integer }
        taskId: { type: [string, 'null'], description: 'Id of the steer record, as returned by POST /steer.' }
        conversationId: { type: [string, 'null'], description: 'The conversation whose running turn was steered.' }
        data:
          type: object
          required: [message, native, mode]
          properties:
            message: { type: string }
            native:
              type: boolean
              description: True when the turn that was already running took the message (both native modes); false when Boat interrupted that turn and immediately continued the same conversation with it.
            mode:
              type: string
              enum: [native, native-continued, fallback, late]
              description: >-
                `native`: the harness folded the message into the running turn. `native-continued`: the harness accepted it but its turn ended without acting on it, so Boat ran it immediately as its own turn on the same session (nothing interrupted, the instruction lands one turn boundary later). `fallback`: the harness has no mid-turn primitive, so Boat interrupted that turn and continued the same conversation with the instruction. `late`: the turn had already finished, so it ran as an ordinary new turn.
    ResponseEvent:
      type: object
      required: [id, type, timestamp, data]
      description: Agent response event. Text deltas/finals and tool-call batches are both represented as response events; tool-call batches have `data.tools`.
      properties:
        id: { type: string }
        type: { type: string, const: response }
        timestamp: { type: integer }
        taskId: { type: [string, 'null'] }
        conversationId: { type: [string, 'null'], description: 'The conversation this response belongs to.' }
        data:
          type: object
          required: [content]
          properties:
            content: { type: string }
            model: { type: [string, 'null'] }
            tools:
              type: array
              description: Tool call/result records emitted by the agent. Present for tool-call events and omitted for text-only response events.
              items: { type: object, additionalProperties: true }
            is_streaming:
              type: boolean
              description: True when this response is a streaming partial rather than the final assistant message.
            is_reverted: { type: boolean }
    ErrorEvent:
      type: object
      required: [id, type, timestamp, data]
      properties:
        id: { type: string }
        type: { type: string, const: usage_limit }
        timestamp: { type: integer }
        taskId: { type: [string, 'null'] }
        data: { type: object, additionalProperties: true }
    CompletionEvent:
      type: object
      required: [id, type, timestamp, data]
      properties:
        id: { type: string }
        type: { type: string, const: compaction_complete }
        timestamp: { type: integer }
        taskId: { type: [string, 'null'] }
        data: { type: object, additionalProperties: true }
    FileReadResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [success, path, encoding, size, content]
          properties:
            type: { type: string, const: file.read }
            success: { type: boolean }
            path: { type: string }
            encoding: { type: string, enum: [utf8, base64] }
            size: { type: integer }
            content: { type: string }
    FileWriteRequest:
      type: object
      required: [path, content]
      properties:
        path: { type: string, description: "Absolute path, or path relative to the sandbox work directory (/home/user). The canonicalized path must resolve under /home/user or /tmp; anything else is rejected with a 400 invalid_path error." }
        content: { type: string }
        encoding: { type: string, enum: [utf8, base64], default: utf8 }
    FileWriteResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [success, path, encoding, size]
          properties:
            type: { type: string, const: file.written }
            success: { type: boolean }
            path: { type: string }
            encoding: { type: string, enum: [utf8, base64] }
            size: { type: integer }
    CommandRequest:
      type: object
      required: [command]
      properties:
        command: { type: string }
        cwd: { type: string, description: Relative working directory inside the sandbox work directory. }
        timeoutSeconds: { type: integer, minimum: 1, maximum: 600, default: 30, description: Command timeout in seconds. Values outside 1-600 are rejected with a 400 invalid_timeout error. }
        detached: { type: boolean, default: false, description: Start the command in the background and return a process id immediately instead of waiting for it to finish. Output goes to a log file on the sandbox; poll the status endpoint for it. }
        stream: { type: boolean, default: false, description: 'Stream the output as the command writes it: the response is newline-delimited JSON (application/x-ndjson), one CommandStreamFrame per line. Ignored with detached.' }
    CommandStreamFrame:
      type: object
      description: One line of a streamed command. `started` first, then `stdout`/`stderr` chunks, then exactly one `exit` (the synchronous result, without stdout/stderr) or `error`.
      required: [type]
      properties:
        type: { type: string, enum: [started, stdout, stderr, exit, error] }
        data: { type: string, description: 'stdout/stderr: the chunk of output, UTF-8.' }
        exitCode: { type: [integer, 'null'] }
        success: { type: boolean }
        timedOut: { type: boolean }
        error: { type: string }
        message: { type: string }
        retryable: { type: boolean, description: 'error: true when the command provably never ran (the sandbox is still restoring its disk), so sending it again is safe.' }
    CommandResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [success, exitCode, stdout, stderr, timedOut]
          properties:
            type: { type: string, const: command.finished }
            success: { type: boolean }
            exitCode: { type: [integer, 'null'] }
            signal: { type: [string, 'null'] }
            oomKilled: { type: boolean, description: 'True when the memory ceiling killed the command or one of its processes and the command failed.' }
            stdout: { type: string }
            stderr: { type: string }
            stdoutTruncated: { type: boolean }
            stderrTruncated: { type: boolean }
            timedOut: { type: boolean }
            cwd: { type: string }
            startedAt: { type: string, format: date-time }
            finishedAt: { type: string, format: date-time }
    CommandStartedResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [success, processId, pid, command, startedAt]
          properties:
            type: { type: string, const: command.started }
            success: { type: boolean }
            processId: { type: integer, description: Process id to poll with the command status endpoint. }
            pid: { type: integer }
            command: { type: string }
            cwd: { type: string }
            startedAt: { type: string, format: date-time }
            logPath: { type: string, description: Stdout log file on the sandbox (~/.ascii/processes/<pid>.log). }
            errLogPath: { type: string, description: Stderr log file on the sandbox. }
    CommandStatusResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [success, processId, status, running, exitCode, stdout, stderr]
          properties:
            type: { type: string, const: command.status }
            success: { type: boolean }
            processId: { type: integer }
            pid: { type: integer }
            status:
              type: string
              enum: [running, exited, lost]
              description: "lost: the sandbox agent restarted and forgot the process; running/exitCode are then a best-effort probe and the logs come from the on-disk files."
            known: { type: boolean, description: Whether the process is still tracked by the sandbox agent. }
            running: { type: boolean }
            exitCode: { type: [integer, 'null'] }
            signal: { type: [string, 'null'] }
            oomKilled: { type: boolean, description: 'True when the memory ceiling killed the command or one of its processes and the command failed.' }
            command: { type: [string, 'null'] }
            cwd: { type: [string, 'null'] }
            startedAt: { type: [string, 'null'], format: date-time }
            finishedAt: { type: [string, 'null'], format: date-time }
            stdout: { type: string, description: Tail of the stdout log file. }
            stderr: { type: string, description: Tail of the stderr log file. }
            stdoutTruncated: { type: boolean }
            stderrTruncated: { type: boolean }
            logPath: { type: string }
            errLogPath: { type: string }
    PromptResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [id, promptId, promptRun, status, provider]
          properties:
            type:
              type: string
              const: prompt.queued
            id:
              type: string
              description: Sandbox id.
            promptId:
              type: string
            conversationId:
              type: [string, 'null']
              description: The conversation this prompt was queued in. A new one when `new` was set, the one named by `conversationId`, or the sandbox's most-recently-active conversation. See [Integrated agents](/integrated-agents).
            promptRun:
              $ref: '#/components/schemas/PromptRun'
            status:
              type: string
              enum: [queued]
            provider:
              type: string
            model:
              type: [string, 'null']
            reasoningEffort:
              type: [string, 'null']
            fast:
              type: boolean
              description: The prompt runs in fast mode.
    EventsResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [id, events]
          properties:
            type:
              type: string
              const: events.list
            id:
              type: string
            events:
              type: array
              description: Sandbox work and lifecycle event objects. Event shapes are intentionally extensible; branch on each event `type` when present.
              items:
                $ref: '#/components/schemas/SandboxEvent'
            pageInfo:
              $ref: '#/components/schemas/PageInfo'
    Conversation:
      type: object
      required: [id, createdAt, lastPromptAt, prompts, running, lastHarness, lastModel, lastPromptPreview, current]
      properties:
        id:
          type: string
          description: Conversation id. Pass it as `conversationId` on `POST /prompt` to continue this thread.
        createdAt:
          type: [string, 'null']
          format: date-time
          description: When the first prompt of this conversation was queued.
        lastPromptAt:
          type: [string, 'null']
          format: date-time
          description: When its most recent prompt was queued. The list is sorted by this, newest first.
        prompts:
          type: integer
          description: Number of prompts sent to this conversation.
        running:
          type: boolean
          description: '`true` while a turn is queued or running in this conversation.'
        lastHarness:
          type: [string, 'null']
          description: Harness the most recent prompt ran on (`claude`, `codex`, `pi`, `opencode`, `prime-agent`, `kimi`).
        lastModel:
          type: [string, 'null']
          description: Model id of the most recent prompt that chose one, or `null` when every prompt used the harness default.
        lastPromptPreview:
          type: [string, 'null']
          description: The first 80 characters of the most recent prompt.
        current:
          type: boolean
          description: '`true` on the conversation a `POST /prompt` without `new` or `conversationId` would continue: the sandbox''s most recently prompted one. Exactly one conversation is current unless the list is empty.'
    ConversationsResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [id, conversations]
          properties:
            type:
              type: string
              const: conversation.list
            id:
              type: string
              description: Sandbox id.
            conversations:
              type: array
              items:
                $ref: '#/components/schemas/Conversation'
    DesktopResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          additionalProperties: true
          properties:
            type:
              type: string
              examples: [desktop.url]
            success:
              type: boolean
            desktopUrl:
              type: [string, 'null']
              format: uri
              description: Secret-bearing desktop or noVNC URL. Redact from logs.
            ip:
              type: [string, 'null']
            mode:
              type: string
              examples: [vnc]
            provisioning:
              type: boolean
              description: For `?vnc=1`, true means VNC is still being prepared; poll again.
            message:
              type: string
    HostPortResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          additionalProperties: true
          properties:
            type:
              type: string
              examples: [port.hosted]
            success:
              type: boolean
            port:
              type: integer
            url:
              type: string
              format: uri
              description: Public HTTPS URL. Carries the `_token` query parameter unless the port is public; redact from logs.
            isProtected:
              type: boolean
            access:
              type: string
              enum: [private, public]
    SshKeyResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          properties:
            success:
              type: boolean
            machineIp:
              type: [string, 'null']
            sshUser:
              type: string
              examples: [user]
            sshEndpoint:
              type: [string, 'null']
              description: >-
                Public IPv4 `host:port` that forwards to the sandbox SSH server, set only when the
                machine has no public IPv4 of its own. Connect with `ssh -p <port> user@<host>`.
              examples: ['203.0.113.10:22001']
            hostKey:
              type: string
              description: The sandbox SSH server's public host key. Pin it in `known_hosts`.
              examples: [ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA...]
    ApiKeyScopeResource:
      type: object
      required: [id, name, organizationId, organizationName]
      properties:
        id: { type: string }
        name: { type: string }
        organizationId: { type: string }
        organizationName: { type: string }
    ApiKeyCatalog:
      type: object
      required: [actions, presets, defaultTtl, maxTtl, scopedCreationEnabled]
      properties:
        actions:
          type: array
          items: { type: string }
        presets:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        defaultTtl: { type: string, examples: [90d] }
        maxTtl: { type: string, examples: [365d] }
        scopedCreationEnabled:
          type: boolean
          description: Whether POST /api-keys/scoped currently accepts creation requests.
        scopeResources:
          type: object
          description: Session-only selector resources. Omitted when the caller authenticates with an API key.
          required: [sandboxes, environments]
          properties:
            sandboxes:
              type: array
              items: { $ref: '#/components/schemas/ApiKeyScopeResource' }
            environments:
              type: array
              items: { $ref: '#/components/schemas/ApiKeyScopeResource' }
    ApiKeysResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [apiKeys, catalog]
          properties:
            apiKeys:
              type: array
              items:
                $ref: '#/components/schemas/ApiKey'
            catalog:
              $ref: '#/components/schemas/ApiKeyCatalog'
    ApiKeySecretResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [apiKey, secret, apiKeys]
          properties:
            apiKey: { $ref: '#/components/schemas/ApiKey' }
            secret:
              type: string
              description: Raw secret returned once. Store it before closing the response.
            apiKeys:
              type: array
              items: { $ref: '#/components/schemas/ApiKey' }
    ApiKeyRevokeResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [apiKeys]
          properties:
            apiKeys:
              type: array
              items: { $ref: '#/components/schemas/ApiKey' }
    SandboxUsageResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [sandboxId, sandboxType, billingMultiplier, since, until, seconds, dollars, secondsPerDollar, running]
          properties:
            type:
              type: string
              examples: [sandbox.usage]
            sandboxId:
              type: string
              pattern: '^bx_[23456789abcdefghjkmnpqrstuvwxyz]{8}$'
              examples: [bx_23456789]
            sandboxType:
              type: string
              enum: [small, default, large]
              description: The sandbox's current machine size, which sets `billingMultiplier`.
            billingMultiplier:
              type: number
              description: Rate at which this sandbox consumes machine time. 0.5 for `small`, 1 for `default`, and 2 for `large`.
              examples: [1]
            since:
              type: string
              format: date-time
              description: Start of the window the figures cover. The sandbox's creation time when the request did not pass `since`.
            until:
              type: string
              format: date-time
              description: End of the window. Now when the request did not pass `until`, or passed one in the future.
            seconds:
              type: integer
              description: >-
                Billable machine-seconds inside the window, the type multiplier already applied: a `large`
                sandbox that ran ten minutes reads 1200. Includes a running sandbox's time up to `until`. Time
                while stopped is never counted and time past a refused stop is excluded.
              examples: [4980]
            dollars:
              type: number
              description: '`seconds` at list price (`seconds / secondsPerDollar`), whatever plan, trial or gift actually paid for it. Up to six decimals.'
              examples: [0.0498]
            secondsPerDollar:
              type: integer
              description: How many billable seconds one dollar buys, so you can price `seconds` yourself.
              examples: [100000]
            running:
              type: boolean
              description: >-
                The meter is still moving: the sandbox is up and no refused stop is holding it paused. Read
                again after it stops for the final figure. `false` on a sandbox that is up but paused past a
                refused stop, whose figure will not change until it is used again.
    ApiKeyUsageResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required: [createdResources]
          properties:
            createdResources:
              type: array
              items:
                $ref: '#/components/schemas/ApiKeyCreatedResource'
    WebhookListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [webhooks]
          properties:
            webhooks:
              type: array
              items:
                $ref: '#/components/schemas/Webhook'
    WebhookResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [webhook]
          properties:
            webhook:
              $ref: '#/components/schemas/Webhook'
    WebhookSecretResponse:
      allOf:
        - $ref: '#/components/schemas/WebhookResponse'
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              pattern: '^whsec_[a-f0-9]{64}$'
              description: Signing secret returned only when created or rotated.
    WebhookDeleteResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [id]
          properties:
            id:
              type: string
    SnapshotSummary:
      type: object
      required: [id, sandboxId, status, generation, createdAt, sizeBytes, fileCount]
      properties:
        id:
          type: string
          format: uuid
        sandboxId:
          type: string
          description: Public Sandbox id this snapshot belongs to.
        status:
          type: string
          enum: [completed]
        kind:
          type: [string, 'null']
          enum: [base, incremental, null]
          description: '`base` (full) or `incremental` (delta on a base). `null` for legacy snapshots.'
        generation:
          type: [integer, 'null']
          description: Position in the incremental chain (0 = base).
        chainId:
          type: [string, 'null']
          format: uuid
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time
        sizeBytes:
          type: [integer, 'null']
          description: Bytes this snapshot added (its delta), not the full restored size.
        fileCount:
          type: [integer, 'null']
          description: Inventory entries alive in the chain at this generation (includes base-image system entries).
        contentSizeBytes:
          type: [integer, 'null']
          description: Total bytes of your data restored by this snapshot (what resume/download returns; base image excluded). `null` on legacy snapshots.
        contentFileCount:
          type: [integer, 'null']
          description: Number of your files restored by this snapshot (base image excluded). `null` on legacy snapshots.
    SnapshotListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [snapshots]
          properties:
            type:
              type: string
              const: snapshot.list
            snapshots:
              type: array
              items:
                $ref: '#/components/schemas/SnapshotSummary'
            pageInfo:
              $ref: '#/components/schemas/PageInfo'
    SnapshotLatestResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [snapshot]
          properties:
            type:
              type: string
              const: snapshot.latest
            snapshot:
              oneOf:
                - $ref: '#/components/schemas/SnapshotSummary'
                - type: 'null'
    NamedSnapshot:
      type: object
      description: >-
        A named snapshot: a frozen copy of a sandbox's disk at one moment, saved under a
        name you pick. Independent of the source sandbox's later life: the sandbox can change,
        stop, or be deleted and the named snapshot still deploys. Named snapshots never
        expire; re-saving a name replaces its artifact.
      required: [name, status, sourceSandboxId, createdAt]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
          description: The user-chosen handle, unique within your account.
        status:
          type: string
          enum: [saving, ready, failed]
          description: >-
            `saving` while the capture and pin are in flight (a live source sandbox takes a
            fresh snapshot first, which can run minutes), `ready` when deployable,
            `failed` if the save did not complete (see `error`; save again to retry).
        error:
          type: string
          description: Failure reason. Only present when `status` is `failed`.
        sourceSandboxId:
          type: string
          description: The sandbox this snapshot was saved from (display only).
        snapshotId:
          type: string
          description: >-
            The frozen artifact behind the name. Present once `status` is `ready`.
            Accepted by `GET /api/boat/snapshots/{snapshotId}/tree` to browse its files.
        type:
          type: string
          description: Sandbox type the snapshot was saved from. Deploys default to it.
        sizeBytes:
          type: integer
          description: Restored content size of the frozen state, in bytes.
        createdAt:
          type: string
          format: date-time
    NamedSnapshotListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [snapshots]
          properties:
            type:
              type: string
              const: snapshot.named.list
            snapshots:
              type: array
              items:
                $ref: '#/components/schemas/NamedSnapshot'
    NamedSnapshotInfoResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [snapshot]
          properties:
            type:
              type: string
              const: snapshot.named.info
            snapshot:
              $ref: '#/components/schemas/NamedSnapshot'
    NamedSnapshotSaveRequest:
      type: object
      required: [sandboxId, name]
      properties:
        sandboxId:
          type: string
          description: The sandbox whose current state to freeze.
        name:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
          description: >-
            Name to save under. 1-63 lowercase letters, digits, or dashes, starting with
            a letter or digit. Reusing one of your existing names replaces that snapshot's
            artifact. `latest`, `tree`, `pull`, `rm`, `save`, `current`, `self`, and `new`
            are reserved.
    NamedSnapshotSavingResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [status, snapshot]
          properties:
            type:
              type: string
              const: snapshot.named.saving
            status:
              type: string
              const: saving
            snapshot:
              $ref: '#/components/schemas/NamedSnapshot'
    NamedSnapshotDeletedResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [name, status]
          properties:
            type:
              type: string
              const: snapshot.named.deleted
            name:
              type: string
            status:
              type: string
              const: deleted
    SnapshotTreeEntry:
      type: object
      required: [path, kind]
      properties:
        path:
          type: string
          description: Path relative to the snapshot root. Docker named volumes appear under `__dockervol__/`.
        kind:
          type: string
          enum: [file, dir, symlink]
        size:
          type: integer
          description: File size in bytes. Omitted for directories.
    SnapshotTreeResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [snapshotId, sandboxId, generation, treeAvailable, truncated, fileCount, totalSizeBytes, entries]
          properties:
            type:
              type: string
              const: snapshot.tree
            snapshotId:
              type: string
              format: uuid
            sandboxId:
              type: string
            generation:
              type: integer
            treeAvailable:
              type: boolean
              description: '`false` for legacy snapshots or inventories too large to expand; see `reason`.'
            truncated:
              type: boolean
              description: '`true` when the file list was capped; not every entry is returned.'
            fileCount:
              type: integer
              description: Number of your files in this snapshot (base-image system files excluded).
            totalSizeBytes:
              type: integer
              description: Total bytes of your data in this snapshot (base-image system files excluded).
            entries:
              type: array
              description: Exactly the files/dirs a resume or download returns, your data only; base-image system entries are not listed.
              items:
                $ref: '#/components/schemas/SnapshotTreeEntry'
            reason:
              type: string
              description: Why the tree is unavailable, when `treeAvailable` is `false`.
              examples: [legacy_snapshot, inventory_too_large]
    SnapshotChunk:
      type: object
      required: [snapshotId, generation, chunkIndex, r2Key, sizeBytes, sha256, signedUrl]
      properties:
        snapshotId:
          type: string
          format: uuid
        generation:
          type: integer
        chunkIndex:
          type: integer
        r2Key:
          type: string
        sizeBytes:
          type: [integer, 'null']
        sha256:
          type: [string, 'null']
        signedUrl:
          type: string
          format: uri
          description: Time-limited download URL (see `expiresInSeconds`).
    SnapshotDownloadResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [snapshotId, sandboxId, kind, generation, expiresInSeconds, reconstruct, chunks]
          properties:
            type:
              type: string
              const: snapshot.download
            snapshotId:
              type: string
              format: uuid
            sandboxId:
              type: string
            kind:
              type: string
              enum: [base, incremental, legacy]
            generation:
              type: integer
            expiresInSeconds:
              type: integer
              description: Lifetime of every `signedUrl` in this response.
            reconstruct:
              type: string
              description: Human-readable note on how to reassemble the chunks into a filesystem.
            inventory:
              oneOf:
                - type: object
                  required: [r2Key, signedUrl]
                  properties:
                    r2Key: { type: string }
                    signedUrl: { type: string, format: uri }
                - type: 'null'
            chunks:
              type: array
              description: Every chunk across the chain (all generations up to and including this snapshot), ordered by `(generation, chunkIndex)`.
              items:
                $ref: '#/components/schemas/SnapshotChunk'
    DeletionOperation:
      type: object
      required: [id, kind, targetId, reason, status, attemptCount, requestedAt, completedAt]
      properties:
        id:
          type: string
          pattern: '^bdop_[a-f0-9]{32}$'
        kind:
          type: string
          enum: [sandbox, snapshot]
        targetId:
          type: string
        reason:
          type: string
          enum: [explicit, zdr, account]
        status:
          type: string
          enum: [pending, processing, blocked, completed]
        stage:
          type: string
          enum: [removing, waiting_for_uploads, kept_for_newer_snapshots, waiting_for_restore, retrying, completed]
          description: >-
            What the background purge is doing. The target is already gone from every list, restore
            and fork once the operation exists. `waiting_for_uploads`: stored data is erased once the
            last upload URL issued for it expires (`expectedBy`). `kept_for_newer_snapshots`: a newer
            snapshot you kept is built on this one; its data goes when they go. `waiting_for_restore`:
            a sandbox is still restoring from it. `retrying`: a transient fault, retried automatically.
        expectedBy:
          type: [string, 'null']
          format: date-time
          description: When `waiting_for_uploads` ends.
        attemptCount:
          type: integer
          minimum: 0
        requestedAt:
          type: string
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time
    DeletionOperationListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [operations]
          properties:
            type:
              type: string
              enum: [snapshot.deleting]
            operations:
              type: array
              items:
                $ref: '#/components/schemas/DeletionOperation'
    DeletionOperationResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [operation]
          properties:
            type:
              type: string
              enum: [deletion.operation, sandbox.deleting, snapshot.deleting]
            operation:
              $ref: '#/components/schemas/DeletionOperation'
    DataRetentionPolicyResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [enabled, enabledAt]
          properties:
            type:
              type: string
              enum: [data_retention.info, data_retention.updated]
            enabled:
              type: boolean
            enabledAt:
              type: [string, 'null']
              format: date-time
            queuedSandboxes:
              type: integer
              minimum: 0
              description: Archived Sandboxes newly queued for deletion by this policy update.
            acceptedDeletionOperationsIrreversible:
              type: boolean
              description: Always true on updates. Disabling the policy does not cancel accepted deletion operations.
            snapshotsOff:
              type: boolean
              description: When true, every new sandbox of this account is created with snapshots off.
            snapshotsOffAt:
              type: [string, 'null']
              format: date-time
    DataRetentionUpdateRequest:
      type: object
      description: Pass `enabled` to change zero data retention, or `snapshotsOff` alone to change the account's snapshots-off setting.
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        snapshotsOff:
          type: boolean
          description: >-
            Turn snapshots off for every sandbox created from now on. Existing sandboxes keep their
            setting. While on, a create or fork that passes `snapshots: true` is refused with 409
            `snapshots_off_for_account`.
        confirmation:
          type: string
          description: Required when enabling and must exactly equal `delete archived sandbox data`.
          const: delete archived sandbox data
  responses:
    BadRequest:
      description: Invalid request body or parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            invalid:
              value:
                ok: false
                type: sandbox.error
                status: 400
                code: invalid_json
                message: Request body must be valid JSON.
                error: { code: invalid_json, message: Request body must be valid JSON., status: 400 }
                requestId: req_01HX...
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            unauthorized:
              value:
                ok: false
                type: sandbox.error
                status: 401
                code: unauthorized
                message: Unauthorized
                error: { code: unauthorized, message: Unauthorized, status: 401 }
                requestId: req_01HX...
    Forbidden:
      description: Authenticated token is not allowed to perform this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            forbidden:
              value:
                ok: false
                type: sandbox.error
                status: 403
                code: forbidden
                message: Forbidden
                error: { code: forbidden, message: Forbidden, status: 403 }
                requestId: req_01HX...
    PaymentRequired:
      description: Account cannot currently create or operate sandboxes. The error body may include a dashboard billing URL, but billing actions are not part of the v1 API.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Request conflicts with current account or sandbox state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: >-
        Machine start or concurrent-sandbox limit reached. Create, fork and resume each count as one
        machine start against your plan's start limits (see the Billing guide; `rate_limited`,
        naming the window you hit). A sandbox that would exceed your plan's concurrent-sandbox cap is
        refused with `limit_reached`, or `member_limit_reached` when an organization owner has
        capped you below the plan.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NoReadyMachine:
      description: >-
        No capacity. `no_ready_machine`: a `failFast` create, fork or resume found no ready
        machine of that type; nothing was started, billed, or counted, and a resumed sandbox
        stays stopped. `out_of_capacity`: creates and forks are paused until the provisioning
        queue drains.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
paths:
  /me:
    get:
      tags: [Boat]
      summary: Get current Boat user
      description: Returns GitHub identity for the authenticated Boat account.
      operationId: me
      responses:
        '200':
          description: Current user information.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
              examples:
                user:
                  value:
                    ok: true
                    type: user.info
                    user:
                      login: octocat
                      email: octocat@example.com
                      zeroDataRetention: false
                      zeroDataRetentionEnabledAt: null
        '401': { $ref: '#/components/responses/Unauthorized' }
  /orgs:
    get:
      tags: [Boat]
      summary: List organizations
      description: >-
        The wallets this account can bill: your personal account first, then every
        organization you belong to, each with its id and name. Either spelling works
        wherever an org is passed (`org`, `X-Boat-Org`, `teamId`). `active` marks the
        wallet new sandboxes bill when a request names none; change it with
        `PATCH /orgs/active`.
      operationId: listOrganizations
      responses:
        '200':
          description: Personal account and organizations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgListResponse' }
              examples:
                orgs:
                  value:
                    ok: true
                    type: org.list
                    activeWalletChosen: true
                    orgs:
                      - id: 4f1c2e0a-7b3d-4a6e-9c8b-2d5e1f0a3b7c
                        name: Personal
                        type: personal
                        role: owner
                        memberCount: 1
                        active: false
                      - id: team_583fd89e-6d29-4007-b48d-52477656cb0f
                        name: acme
                        type: org
                        role: owner
                        memberCount: 3
                        subscriptionStatus: active
                        active: true
        '401': { $ref: '#/components/responses/Unauthorized' }
  /orgs/active:
    patch:
      tags: [Boat]
      summary: Set the active organization
      description: >-
        Set the wallet new sandboxes bill when a request names none, for this account
        on every client: the API, the CLI (`boat org switch` sets the same value) and
        the dashboard. Pass an organization id or name you belong to, or `personal`
        (or `null`) for your own account. `GET /limits` follows it. Sandboxes already
        running keep the wallet they were created with; leaving or deleting the
        organization resets the account to personal.
      operationId: setActiveOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActiveOrgUpdateRequest' }
            examples:
              byName:
                value: { org: acme }
              personal:
                value: { org: personal }
      responses:
        '200':
          description: The wallet now active.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActiveOrgResponse' }
              examples:
                org:
                  value:
                    ok: true
                    type: org.active_updated
                    active:
                      id: team_583fd89e-6d29-4007-b48d-52477656cb0f
                      name: acme
                      type: org
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: '`not_org_member`: no organization with that id or name that you belong to.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: '`ambiguous_org`: several of your organizations share that name; pass the id.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /account/data-retention:
    get:
      tags: [Boat]
      summary: Get account data-retention policy
      description: Returns the current zero-data-retention policy. Per-Boat API keys cannot access this account-wide setting. Responses are never cached.
      operationId: getDataRetention
      responses:
        '200':
          description: Current retention policy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataRetentionPolicyResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Boat]
      summary: Update account data-retention policy
      description: >-
        Requires an interactive sandbox session; API keys and legacy permanent tokens are refused.
        Enabling requires the exact confirmation phrase `delete archived sandbox data`. Disabling
        affects future archives only and cannot cancel deletion operations already accepted.
      operationId: updateDataRetention
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DataRetentionUpdateRequest' }
      responses:
        '200':
          description: Updated retention policy. Responses are never cached.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataRetentionPolicyResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /deletion-operations/{operationId}:
    get:
      tags: [Boat]
      summary: Get deletion operation
      description: Poll an accepted Boat or snapshot deletion. Only operations owned by the authenticated account are returned. Responses are never cached.
      operationId: getDeletionOperation
      parameters:
        - $ref: '#/components/parameters/OperationId'
      responses:
        '200':
          description: Current deletion operation state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionOperationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /limits:
    get:
      tags: [Boat]
      summary: Get Boat limits
      description: >-
        Check remaining machine starts, compute time, credits, access readiness, and
        concurrent-sandbox capacity for the wallet a create would bill: the `org` /
        `X-Boat-Org` you pass (id or name), else the account's active wallet, else
        personal. The response carries `teamId` when an organization wallet was read.
      operationId: limits
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/OrgHeader'
        - name: teamId
          in: query
          required: false
          schema: { type: string }
          description: Legacy alias for `org`. Takes precedence over `org` / `X-Boat-Org` when set.
      responses:
        '200':
          description: Current creation and concurrent-boat limits.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LimitsResponse' }
              examples:
                ready:
                  value:
                    ok: true
                    type: limits.info
                    canStart: true
                    activeSandboxes: 1
                    activeStates: [provisioned, cloning, ready, idle, running]
                    sandboxPlanKey: box_20
                    sandboxPlanDollars: 20
                    maxActiveSandboxes: 100
                    maxCreationRequestsPerMinute: 10
                    maxCreationRequestsPerDay: null
                    startLimits: { perMinute: 10, perHour: 50, perDay: 150 }
                    starts:
                      unlimited: false
                      minute: { limit: 10, used: 3, remaining: 7 }
                      hour: { limit: 50, used: 12, remaining: 38 }
                      day: { limit: 150, used: 47, remaining: 103 }
                    billingStatus: active
                    creditBalanceSeconds: 7200
                    creditBalanceHours: 2
                    packBalanceSeconds: 500000
                    packBalanceHours: 138.89
                    packBalanceDollars: 5
        '401': { $ref: '#/components/responses/Unauthorized' }
  /repos:
    get:
      tags: [Boat]
      summary: List GitHub repositories available to Boat
      description: Returns GitHub repositories grouped by installation plus the current selected repositories for new Sandboxes.
      operationId: repos
      parameters:
        - name: sync
          in: query
          schema: { type: boolean }
          description: When true, sync from GitHub before returning repository groups.
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Sort'
        - name: q
          in: query
          schema: { type: string }
          description: Case-insensitive repository name/fullName filter.
        - name: selected
          in: query
          schema: { type: boolean }
          description: Filter to selected or unselected repositories.
      responses:
        '200':
          description: Repository groups and current sandbox repository selection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReposResponse' }
              examples:
                repos:
                  value:
                    ok: true
                    type: repos.list
                    environmentId: env_123
                    installations:
                      - type: Organization
                        accountLogin: acme
                        accountAvatarUrl: https://github.com/acme.png
                        repositories:
                          - id: 123456
                            databaseId: repo_org_123456
                            name: web
                            fullName: acme/web
                            description: Marketing site
                            url: https://github.com/acme/web
                            private: true
                            permissions: admin
                            pushedAt: '2026-05-31T12:00:00Z'
                    selectedRepositories:
                      - id: 123456
                        databaseId: repo_org_123456
                        name: web
                        fullName: acme/web
                        private: true
                        permissions: admin
                        pushedAt: '2026-05-31T12:00:00Z'
                        baseBranch: dev
                        setupRoutineId: null
                        setupScript: ''
                        setupBlocking: false
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
    post:
      tags: [Boat]
      summary: Select repository for sandboxes
      description: Idempotently selects one repository for the sandbox environment. Use `databaseId` from `GET /repos` as `repositoryId`; selecting an already-selected repository updates its `baseBranch`.
      operationId: selectRepo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RepoSelectionRequest' }
      responses:
        '200':
          description: Updated repository selection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepoSelectionResponse' }
              examples:
                selected:
                  value:
                    ok: true
                    type: repos.updated
                    success: true
                    environmentId: env_123
                    selectedRepositories:
                      - databaseId: repo_org_123456
                        name: web
                        fullName: acme/web
                        baseBranch: dev
                        setupRoutineId: null
                        setupScript: ''
                        setupBlocking: false
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api-keys:
    get:
      tags: [Boat]
      summary: List API keys
      description: "Lists API key metadata only. Raw key secrets are not returned after creation/rotation. Results include expiry and scope. A restricted API-key caller receives `apiKeys: []`; only an unrestricted account key or browser/CLI session receives the account inventory. Bearer header is unchanged; scope lives on the key."
      operationId: apiKeys
      responses:
        '200':
          description: API key metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeysResponse' }
              examples:
                keys:
                  value:
                    ok: true
                    type: api_key.list
                    apiKeys:
                      - id: sak_123
                        name: Production worker
                        credentialLane: scoped-v1
                        keyPrefix: boat_live
                        keyLastFour: 9abc
                        sandboxId: null
                        createdAt: '2026-05-31T12:00:00Z'
                        lastUsedAt: null
                        usage:
                          requests: 1842
                          windowDays: 30
                        resources:
                          total: 3
                          sandboxes: 2
                          agents: 1
                        expiresAt: '2026-11-21T12:00:00Z'
                        expired: false
                        expiringSoon: false
                        scope:
                          actions: ['*']
                          sandboxes: '*'
                          environments: '*'
                          grandfathered: false
                    catalog:
                      actions: [sandbox.read, exec, '*']
                      presets:
                        read-only: [sandbox.read, file.read, snapshot.read, environment.read, account.read]
                      defaultTtl: 90d
                      maxTtl: 365d
                      scopedCreationEnabled: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api-keys/scoped:
    post:
      tags: [Boat]
      summary: Create a scoped API key
      description: Creates a scoped, expiring API key. Requires a dashboard/CLI session or an admin-scoped token. The secret is returned once. This dedicated path returns a typed 503 until scoped credential creation is activated.
      operationId: createScopedApiKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                ttl: { type: string, description: 'Duration such as 90d, 24h, or seconds. Max 365d.', examples: [90d] }
                preset: { type: string, enum: [read-only, full-sandbox, ci, admin] }
                actions: { type: array, items: { type: string } }
                sandboxIds: { type: array, items: { type: string } }
                environmentIds: { type: array, items: { type: string } }
      responses:
        '201':
          description: Created key metadata plus the one-time secret.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeySecretResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503':
          description: Scoped credential creation has not been activated yet.
          content:
            application/json:
              schema:
                type: object
                required: [error, message, scopedCreationEnabled]
                properties:
                  error: { type: string, enum: [scoped_api_key_creation_disabled] }
                  message: { type: string }
                  scopedCreationEnabled: { type: boolean, enum: [false] }
  /api-keys/{apiKeyId}:
    parameters:
      - name: apiKeyId
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [Boat]
      summary: Revoke an API key
      description: Revokes the key immediately. Requires a dashboard or CLI session.
      operationId: revokeApiKey
      responses:
        '200':
          description: Key revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeyRevokeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api-keys/{apiKeyId}/rotate:
    parameters:
      - name: apiKeyId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Boat]
      summary: Rotate an API key
      description: Replaces the raw secret without changing expiry or scope. Requires a dashboard or CLI session.
      operationId: rotateApiKey
      responses:
        '200':
          description: Rotated key metadata plus the one-time replacement secret.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeySecretResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The scoped API key has already expired and cannot be rotated.
          content:
            application/json:
              schema:
                type: object
                required: [error, message]
                properties:
                  error: { type: string, enum: [api_key_expired] }
                  message: { type: string }
  /api-keys/{apiKeyId}/usage:
    parameters:
      - name: apiKeyId
        in: path
        required: true
        description: API key ID returned by `GET /api-keys`.
        schema: { type: string }
    get:
      tags: [Boat]
      summary: Get API key usage
      description: Returns the key's request total for the 30-day UTC window and the sandboxes and Agents it created that still exist, including sandboxes that never got a sandbox row. Works for revoked keys owned by the authenticated account.
      operationId: apiKeyUsage
      responses:
        '200':
          description: Usage and created resources for the key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeyUsageResponse' }
              examples:
                usage:
                  value:
                    ok: true
                    type: api_key.usage
                    id: sak_123
                    name: Production worker
                    keyPrefix: boat_live
                    keyLastFour: 9abc
                    sandboxId: null
                    createdAt: '2026-05-31T12:00:00Z'
                    lastUsedAt: '2026-08-25T09:30:00Z'
                    usage:
                      requests: 1842
                      windowDays: 30
                    resources:
                      total: 2
                      sandboxes: 1
                      agents: 1
                    createdResources:
                      - kind: sandbox
                        id: bx_123
                        name: CI build
                        state: ready
                        createdAt: '2026-08-24T14:00:00Z'
                      - kind: agent
                        id: agent_456
                        name: Review
                        state: idle
                        createdAt: '2026-08-23T12:00:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /webhooks:
    get:
      tags: [Boat]
      summary: List webhooks
      description: Lists account-wide sandbox lifecycle webhook endpoints. Signing secrets are never included.
      operationId: listWebhooks
      responses:
        '200':
          description: Registered webhook endpoints.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Boat]
      summary: Create webhook
      description: |
        Registers an account-wide endpoint for sandbox lifecycle events. The endpoint must use HTTPS on port 443 and resolve only to public addresses. Redirects are not followed during delivery.

        The signing secret is returned only in this response. An account can register at most 10 unique endpoint URLs.
      operationId: createWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookCreateRequest' }
            examples:
              readyAndError:
                value:
                  name: Production automation
                  url: https://example.com/hooks/sandbox
                  events: [sandbox.ready, sandbox.error]
      responses:
        '201':
          description: Webhook created. Store the one-time signing secret now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookSecretResponse' }
              examples:
                created:
                  value:
                    ok: true
                    type: webhook.created
                    webhook:
                      id: wh_0123456789abcdef01234567
                      name: Production automation
                      url: https://example.com/hooks/sandbox
                      events: [sandbox.ready, sandbox.error]
                      createdAt: '2026-08-11T12:00:00Z'
                      updatedAt: '2026-08-11T12:00:00Z'
                    secret: whsec_0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /webhooks/{webhookId}:
    parameters:
      - name: webhookId
        in: path
        required: true
        schema:
          type: string
          pattern: '^wh_[a-f0-9]{24}$'
    get:
      tags: [Boat]
      summary: Get webhook
      description: Returns webhook metadata without the signing secret.
      operationId: getWebhook
      responses:
        '200':
          description: Webhook metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Boat]
      summary: Update webhook
      description: Updates the name, endpoint URL, or subscribed events without changing the signing secret.
      operationId: updateWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookUpdateRequest' }
      responses:
        '200':
          description: Updated webhook metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Boat]
      summary: Delete webhook
      description: Deletes the endpoint and its queued deliveries. An attempt already in flight can still arrive.
      operationId: deleteWebhook
      responses:
        '200':
          description: Webhook deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookDeleteResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /webhooks/{webhookId}/rotate:
    parameters:
      - name: webhookId
        in: path
        required: true
        schema:
          type: string
          pattern: '^wh_[a-f0-9]{24}$'
    post:
      tags: [Boat]
      summary: Rotate webhook signing secret
      description: Replaces the endpoint's signing secret. The new secret is returned only in this response; briefly accept the old secret for attempts already in flight.
      operationId: rotateWebhookSigningSecret
      responses:
        '200':
          description: Signing secret rotated. Store the new secret now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookSecretResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /secrets:
    get:
      tags: [Boat]
      summary: Get Boat secrets setup
      description: Returns the environment variables and secret files configured for sandboxes.
      operationId: secrets
      responses:
        '200':
          description: Current secret setup metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecretsResponse' }
              examples:
                secrets:
                  value:
                    ok: true
                    type: secrets.info
                    environmentId: env_123
                    envContents: "OPENAI_API_KEY=sk-...\n"
                    secretFiles:
                      - path: .config/service-account.json
                        contents: '{"type":"service_account"}'
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Boat]
      summary: Update Boat secrets setup
      operationId: updateSecrets
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SecretsUpdateRequest' }
      responses:
        '200':
          description: Updated secret setup metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecretsResponse' }
              examples:
                updated:
                  value:
                    ok: true
                    type: secrets.updated
                    success: true
                    environmentId: env_123
                    envContents: "OPENAI_API_KEY=sk-...\n"
                    secretFiles: []
                    pushed: { updated: 2, failed: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /environments:
    get:
      tags: [Boat]
      summary: List Sandbox environments
      description: Returns every non-deleted sandbox environment with its latest-version flags, contents, and per-version sandbox usage. A default environment named `base` is created on first access if none exists.
      operationId: environments
      responses:
        '200':
          description: The account's sandbox environments.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxEnvironmentListResponse' }
              examples:
                environments:
                  value:
                    environments:
                      - id: 8f1c2d3e-0000-4000-8000-000000000001
                        name: default
                        isDefault: true
                        latestVersionId: 8f1c2d3e-0000-4000-8000-0000000000a1
                        safeForThirdParties: false
                        passGithub: true
                        passSecrets: true
                        passSandboxCredentials: true
                        passAgentsCredentials: true
                        envContents: "OPENAI_API_KEY=sk-...\n"
                        secretFiles: []
                        versions:
                          - id: 8f1c2d3e-0000-4000-8000-0000000000a1
                            versionNumber: 1
                            sandboxCount: 3
                            createdAt: '2026-06-01T12:00:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Boat]
      summary: Create a sandbox environment
      description: Create a new named environment. It starts on version 1 with all fine-grained flags on and `safeForThirdParties` off.
      operationId: createEnvironment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSandboxEnvironmentRequest' }
      responses:
        '200':
          description: Environment created; full list returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxEnvironmentListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /environments/{environmentId}:
    parameters:
      - name: environmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Environment id returned by `GET /environments`.
    put:
      tags: [Boat]
      summary: Update a sandbox environment
      description: Rename, set as default, and/or edit flags and contents. Any flag or content change mints a new immutable version; existing sandboxes stay on their pinned version until you call upgrade.
      operationId: updateEnvironment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSandboxEnvironmentRequest' }
      responses:
        '200':
          description: Updated environment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxEnvironmentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Boat]
      summary: Delete a sandbox environment
      description: Soft-deletes an environment. The default environment cannot be deleted, and at least one environment is always kept.
      operationId: deleteEnvironment
      responses:
        '200':
          description: Environment soft-deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxEnvironmentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /environments/{environmentId}/upgrade:
    post:
      tags: [Boat]
      summary: Upgrade sandboxes to an environment's latest version
      description: Repoints the caller's active sandboxes from an older version of this environment to its latest version, scrubbing any owner secrets the new version drops and hot-pushing the new config.
      operationId: upgradeEnvironment
      parameters:
        - name: environmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpgradeSandboxEnvironmentRequest' }
      responses:
        '200':
          description: Upgrade result counts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpgradeSandboxEnvironmentResponse' }
              examples:
                upgraded:
                  value:
                    success: true
                    upgraded: 2
                    failed: 0
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /environments/{environmentId}/vars/{key}:
    parameters:
      - name: environmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: key
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z_][A-Za-z0-9_]*$' }
        description: Environment variable name.
    put:
      tags: [Boat]
      summary: Set one environment variable
      description: Sets or replaces a single variable without reading or rewriting the rest. Mints a new immutable version.
      operationId: setEnvironmentVar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: string }
      responses:
        '200':
          description: New version minted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvironmentItemChangeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Boat]
      summary: Remove one environment variable
      description: Removes a single variable. Mints a new immutable version.
      operationId: deleteEnvironmentVar
      responses:
        '200':
          description: New version minted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvironmentItemChangeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /environments/{environmentId}/secret-files:
    parameters:
      - name: environmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Boat]
      summary: Write one secret file
      description: Adds or replaces a single secret file by path. Mints a new immutable version.
      operationId: setEnvironmentSecretFile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, contents]
              properties:
                path:
                  type: string
                  description: In-sandbox path relative to the workspace, e.g. `.env` or `repo/.env`.
                contents: { type: string }
      responses:
        '200':
          description: New version minted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvironmentItemChangeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Boat]
      summary: Remove one secret file
      description: Removes the secret file at `path`. Mints a new immutable version.
      operationId: deleteEnvironmentSecretFile
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: New version minted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvironmentItemChangeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /environments/{environmentId}/repos:
    post:
      tags: [Boat]
      summary: Add a repository to an environment
      description: Adds a repository (or updates its base branch) by database id from the repository list. Mints a new immutable version.
      operationId: addEnvironmentRepo
      parameters:
        - name: environmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repositoryId]
              properties:
                repositoryId:
                  type: string
                  description: The repository `databaseId` from `GET /repos`.
                baseBranch:
                  type: string
                  default: main
      responses:
        '200':
          description: New version minted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvironmentItemChangeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /environments/{environmentId}/repos/{repositoryId}:
    delete:
      tags: [Boat]
      summary: Remove a repository from an environment
      description: Removes one repository from the environment's selection. Mints a new immutable version.
      operationId: deleteEnvironmentRepo
      parameters:
        - name: environmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: repositoryId
          in: path
          required: true
          schema: { type: string }
          description: The repository `databaseId`.
      responses:
        '200':
          description: New version minted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvironmentItemChangeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /sandboxes:
    get:
      tags: [Boat]
      summary: List sandboxes
      description: >-
        Your sandboxes. In an organization's scope (the active wallet, `org`, or `X-Boat-Org`)
        the list also holds every sandbox that organization pays for, whoever created it;
        `createdBy` and `access` say whose it is and what you may do with it.
      operationId: sandboxes
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/OrgHeader'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Sort'
        - name: state
          in: query
          schema: { type: string }
          description: Comma-separated sandbox state filter, for example `ready,idle,running`.
      responses:
        '200':
          description: Sandboxes owned by the authenticated Boat user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxListResponse' }
              examples:
                sandboxes:
                  value:
                    ok: true
                    type: sandbox.list
                    sandboxes:
                      - id: bx_23456789
                        name: Sandbox 2026-05-31 12:00
                        state: idle
                        url: https://machine.on.boat.dev
                        ip: 203.0.113.10
                        createdAt: '2026-05-31T12:00:00Z'
                        updatedAt: '2026-05-31T12:05:00Z'
                        archiveAfter: '2026-05-31T13:00:00Z'
                        desktopAvailable: true
                        desktopUrl: https://desktop.example/stream.html?token=redacted
                        snapshotAvailable: false
                        snapshotCompletedAt: null
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Boat]
      summary: Create sandbox
      description: >-
        Provision a new cloud computer. Store the returned `sandbox.id` with your product job/session
        record. Send an `Idempotency-Key` header to make this call safe to retry after a lost
        response without creating a second billable sandbox.
      operationId: create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/OrgHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSandboxRequest' }
      responses:
        '202':
          description: Boat accepted for provisioning.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateSandboxResponse' }
              examples:
                provisioning:
                  value:
                    ok: true
                    type: sandbox.created
                    status: provisioning
                    ttlSeconds: 3600
                    sandbox:
                      id: bx_23456789
                      name: Sandbox 2026-05-31 12:00
                      state: provisioning
                      url: null
                      ip: null
                      createdAt: '2026-05-31T12:00:00Z'
                      updatedAt: '2026-05-31T12:00:00Z'
                      archiveAfter: '2026-05-31T13:00:00Z'
                      desktopAvailable: false
                      desktopUrl: null
                      snapshotAvailable: false
                      snapshotCompletedAt: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/NoReadyMachine' }
  /sandboxes/{sandboxId}:
    parameters:
      - $ref: '#/components/parameters/SandboxId'
    get:
      tags: [Boat]
      summary: Get sandbox
      description: Poll this endpoint after create, stop, resume, or fork operations.
      operationId: get
      responses:
        '200':
          description: Boat details.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxInfoResponse' }
              examples:
                sandbox:
                  value:
                    ok: true
                    type: sandbox.info
                    sandbox:
                      id: bx_23456789
                      name: Sandbox 2026-05-31 12:00
                      state: idle
                      url: https://machine.on.boat.dev
                      ip: 203.0.113.10
                      createdAt: '2026-05-31T12:00:00Z'
                      updatedAt: '2026-05-31T12:05:00Z'
                      archiveAfter: '2026-05-31T13:00:00Z'
                      desktopAvailable: true
                      desktopUrl: https://desktop.example/stream.html?token=redacted
                      snapshotAvailable: false
                      snapshotCompletedAt: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Boat]
      summary: Update sandbox
      operationId: update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSandboxRequest' }
      responses:
        '200':
          description: Updated sandbox details.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxInfoResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Boat]
      summary: Permanently delete sandbox data
      description: >-
        Accept irreversible background deletion of the sandbox machine, snapshots, and content-bearing
        records. This is not archive: the sandbox cannot be resumed. Named snapshots and other shared
        artifacts remain independent. Poll the returned operation until `completed`.
      operationId: deleteSandbox
      parameters:
        - $ref: '#/components/parameters/ConfirmDelete'
      responses:
        '202':
          description: Deletion confirmed and accepted for background processing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionOperationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /sandboxes/{sandboxId}/stop:
    post:
      tags: [Boat]
      summary: Stop and archive sandbox
      description: |
        Stop active work and archive/snapshot the sandbox for later resume or fork.

        A stop always saves the sandbox's disk first. If that save is failing, the stop is
        refused and the sandbox keeps running so your work is not discarded, we retry
        automatically and email you. You are not billed for time spent in that state.

        Set `force: true` to stop anyway, accepting the loss of everything written since
        the last successful snapshot. This is irreversible; only reach for it after a
        stop has already failed.
      operationId: stop
      parameters:
        - $ref: '#/components/parameters/SandboxId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StopRequest' }
      responses:
        '202':
          description: Boat archival started or already in progress.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxActionResponse' }
              examples:
                archiving:
                  value:
                    ok: true
                    type: sandbox.stopping
                    id: bx_23456789
                    status: archiving
                    sandbox: { id: bx_23456789, name: Sandbox 2026-05-31 12:00, state: archiving, desktopAvailable: true, snapshotAvailable: false }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /sandboxes/{sandboxId}/share:
    post:
      tags: [Boat]
      summary: Share sandbox with the organization
      description: |
        Let every member of the organization that pays for this sandbox use it.

        Your personal logins (GitHub token, Claude and Codex logins, environment secrets,
        the sandbox's own CLI key) are never pushed to it again and are wiped off its disk
        at its next start, so a teammate never acts as you. Files you wrote stay. One-way:
        the sandbox stays like a `noEnv` sandbox from then on. A running sandbox stays
        `view` for the organization until you stop and resume it (`restartRequired`).

        Only the person who created the sandbox can share it, and only a sandbox billed to
        an organization. Sharing an already shared sandbox is a no-op.
      operationId: share
      parameters:
        - $ref: '#/components/parameters/SandboxId'
      responses:
        '200':
          description: The sandbox is shared.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sandbox: { $ref: '#/components/schemas/Sandbox' }
                  restartRequired:
                    type: boolean
                    description: >-
                      True when the sandbox was running: what runs on it still holds your
                      logins in memory, so it stays `view` for the organization until you
                      stop and resume it.
                  message: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /sandboxes/{sandboxId}/resume:
    post:
      tags: [Boat]
      summary: Resume sandbox
      operationId: resume
      parameters:
        - $ref: '#/components/parameters/SandboxId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResumeRequest' }
      responses:
        '202':
          description: Resume started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxActionResponse' }
              examples:
                resuming:
                  value:
                    ok: true
                    type: sandbox.resuming
                    id: bx_23456789
                    status: resuming
                    sandbox: { id: bx_23456789, name: Sandbox 2026-05-31 12:00, state: provisioning, desktopAvailable: false, snapshotAvailable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/NoReadyMachine' }
  /sandboxes/{sandboxId}/fork:
    post:
      tags: [Boat]
      summary: Fork sandbox
      description: >-
        Provision a new sandbox from an existing one. Send an `Idempotency-Key` header to make this
        call safe to retry after a lost response without creating a second billable fork.
      operationId: fork
      parameters:
        - $ref: '#/components/parameters/SandboxId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                failFast:
                  type: boolean
                  default: false
                  description: >-
                    Pass `true` to fork only if a machine is ready right now. Within about 1.5 s you
                    get the usual `202`, or `503` `no_ready_machine` with no fork created and nothing
                    counted against your start limits.
                env:
                  type: object
                  additionalProperties:
                    type: string
                  description: >-
                    Replaces the env the fork would otherwise inherit from the source sandbox.
                    Same validation rules as `CreateSandboxRequest.env`.
                environment:
                  type: string
                  description: >-
                    Optionally pin the fork to a different named sandbox environment. Omit to inherit
                    the source sandbox's environment. Unknown names are rejected with
                    `unknown_environment`.
                  examples: [base, customer-demos]
                noEnv:
                  type: boolean
                  description: >-
                    Make the fork no-env (see `CreateSandboxRequest.noEnv`). A fork of a no-env sandbox is
                    always no-env regardless of this field.
                type:
                  type: string
                  enum: [small, default, large]
                  description: >-
                    Machine size for the fork. Omit to inherit the source sandbox's type. The source
                    sandbox is never modified. Shrinking is rejected with `type_too_small` when the
                    source's data would not fit the smaller disk.
                ttlSeconds:
                  oneOf:
                    - type: integer
                      minimum: 1
                      maximum: 2592000
                    - type: 'null'
                  default: 3600
                  description: >-
                    Auto-stop for the fork, in seconds. Omit for the 1 hour default; the fork
                    does NOT inherit the source sandbox's TTL, so forking a sandbox that has auto-stop
                    disabled still gives you a fork that stops itself. `null` disables
                    auto-stop, which means nothing will ever stop this sandbox for you.
      responses:
        '202':
          description: Fork started. The response `id` is the new forked sandbox id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxActionResponse' }
              examples:
                forking:
                  value:
                    ok: true
                    type: sandbox.forking
                    id: bx_abcdef23
                    status: forking
                    sandbox: { id: bx_abcdef23, name: Sandbox fork, state: provisioning, desktopAvailable: false, snapshotAvailable: false }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/NoReadyMachine' }
  /sandboxes/{sandboxId}/prompt:
    post:
      tags: [Boat]
      summary: Prompt Sandbox
      description: >-
        Queue a natural-language work item for an agent harness (Codex, Claude Code, pi, OpenCode, or Prime Agent) inside the sandbox. Observe progress with `GET /sandboxes/{sandboxId}/events`.


        A Sandbox runs many conversations in parallel. Set `new: true` to start a fresh one, `conversationId` to continue a specific one, or omit both to continue the most-recently-active conversation; the response returns the `conversationId`. See [Integrated agents](/integrated-agents).
      operationId: prompt
      parameters:
        - $ref: '#/components/parameters/SandboxId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromptRequest' }
            examples:
              repoWork:
                value:
                  provider: codex
                  model: gpt-5.4
                  reasoningEffort: medium
                  prompt: Work on the selected repo, run tests, fix failures, commit the result, and report any hosted preview URL.
              computerUse:
                value:
                  provider: claude-code
                  model: sonnet
                  reasoningEffort: high
                  prompt: Use the browser to research flight options to France and return the best itinerary summary with source links.
      responses:
        '202':
          description: Prompt queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromptResponse' }
              examples:
                queued:
                  value:
                    ok: true
                    type: prompt.queued
                    id: bx_23456789
                    promptId: prompt_123
                    conversationId: 8f1c2b7a-3d4e-4f5a-9b0c-1d2e3f4a5b6c
                    promptRun:
                      id: prompt_123
                      promptId: prompt_123
                      sandboxId: bx_23456789
                      status: queued
                      done: false
                      conversationId: 8f1c2b7a-3d4e-4f5a-9b0c-1d2e3f4a5b6c
                    status: queued
                    provider: codex
                    model: gpt-5.4
                    reasoningEffort: medium
                    fast: false
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /sandboxes/{sandboxId}/events:
    get:
      tags: [Boat]
      summary: List boat events
      description: Return Sandbox work, lifecycle, and progress events so product UIs can show what the sandbox is doing. A Sandbox runs many conversations in parallel; this streams **all** of them by default and every event carries a `conversationId`. Filter to one or more with `conversation`. Event payloads are extensible. Clients can long-poll this endpoint with `sort=asc` and a cursor to stream responses. Response events expose agent text, streaming partials via `data.is_streaming`, and tool calls/results via `data.tools`.
      operationId: events
      parameters:
        - $ref: '#/components/parameters/SandboxId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Sort'
        - name: type
          in: query
          schema: { type: string }
          description: Comma-separated event type filter, for example `prompt,response,steer`.
        - name: conversation
          in: query
          schema: { type: string }
          description: Only return events for this conversation id. Repeat the parameter (or comma-separate) for several. Omit to stream every conversation on the sandbox. See [Integrated agents](/integrated-agents).
      responses:
        '200':
          description: >-
            The agent's work on the sandbox (prompts, responses), not sandbox
            lifecycle. A sandbox that was never prompted returns an empty list even
            though it started, stopped and resumed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventsResponse' }
              examples:
                progress:
                  value:
                    ok: true
                    type: events.list
                    id: bx_23456789
                    events:
                      - id: prompt_123
                        type: prompt
                        timestamp: 1780347055370
                        taskId: prompt_123
                        data:
                          prompt: Run tests and summarize failures.
                          status: running
                          is_reverted: false
                      - id: response_123-tools
                        type: response
                        timestamp: 1780347063427
                        taskId: prompt_123
                        data:
                          content: ""
                          model: gpt-5.4
                          tools:
                            - use:
                                id: call_123
                                type: tool_use
                                name: Bash
                                input:
                                  command: npm test
                              result:
                                type: tool_result
                                tool_use_id: call_123
                                is_error: false
                                content: '{"exitCode":0}'
                          is_reverted: false
                      - id: response_123
                        type: response
                        timestamp: 1780347065650
                        taskId: prompt_123
                        data:
                          content: Tests passed.
                          model: gpt-5.4
                          is_reverted: false
                    pageInfo:
                      nextCursor: null
                      hasMore: false
                      limit: 100
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /sandboxes/{sandboxId}/conversations:
    get:
      tags: [Boat]
      summary: List boat conversations
      description: >-
        Every conversation on the sandbox, most recently prompted first, with what you need to pick one: how many prompts it holds, whether a turn is running in it right now, the last harness and model it ran on, a preview of its last prompt, and `current`, the one a `POST /prompt` without `new` or `conversationId` would continue. Pass an `id` back as `conversationId` on `POST /prompt` to resume that thread, or as `conversation` on `POST /steer`, `POST /interrupt` and `GET /events` to scope those. See [Integrated agents](/integrated-agents).
      operationId: conversations
      parameters:
        - $ref: '#/components/parameters/SandboxId'
      responses:
        '200':
          description: Conversations on the sandbox. A Sandbox that was never prompted returns an empty list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationsResponse' }
              examples:
                twoConversations:
                  value:
                    ok: true
                    type: conversation.list
                    id: bx_23456789
                    conversations:
                      - id: 8f1c2b7a-3d4e-4f5a-9b0c-1d2e3f4a5b6c
                        createdAt: '2026-09-08T10:05:00.000Z'
                        lastPromptAt: '2026-09-08T10:05:00.000Z'
                        prompts: 1
                        running: true
                        lastHarness: pi
                        lastModel: claude-sonnet-5
                        lastPromptPreview: Investigate the flaky CI job
                        current: true
                      - id: 2c0d9e4b-7a1f-4c3e-8b5d-6e7f8a9b0c1d
                        createdAt: '2026-09-08T09:40:00.000Z'
                        lastPromptAt: '2026-09-08T10:03:00.000Z'
                        prompts: 2
                        running: false
                        lastHarness: claude
                        lastModel: claude-opus-4-8
                        lastPromptPreview: Now add tests
                        current: false
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /sandboxes/{sandboxId}/prompts/{promptId}:
    get:
      tags: [Boat]
      summary: Get prompt run status
      description: Returns first-class status for a queued/running/finished prompt so clients do not infer completion from sandbox state and events.
      operationId: promptRunStatus
      parameters:
        - $ref: '#/components/parameters/SandboxId'
        - name: promptId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Prompt run status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromptRunResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /sandboxes/{sandboxId}/files:
    get:
      tags: [Boat]
      summary: Read a file from a sandbox
      operationId: readFile
      parameters:
        - $ref: '#/components/parameters/SandboxId'
        - name: path
          in: query
          required: true
          schema: { type: string, description: "Absolute path, or path relative to the sandbox work directory (/home/user). The canonicalized path must resolve under /home/user or /tmp; anything else is rejected with a 400 invalid_path error." }
        - name: encoding
          in: query
          schema: { type: string, enum: [utf8, base64], default: utf8 }
      responses:
        '200':
          description: File contents.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileReadResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
    put:
      tags: [Boat]
      summary: Write a file in a sandbox
      operationId: writeFile
      parameters:
        - $ref: '#/components/parameters/SandboxId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FileWriteRequest' }
      responses:
        '200':
          description: File written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileWriteResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /sandboxes/{sandboxId}/commands:
    post:
      tags: [Boat]
      summary: Execute a command in a sandbox
      description: "Runs the command synchronously by default (timeout configurable via `timeoutSeconds`, 600s cap). With `detached: true` the command starts in the background and a process id is returned immediately; poll `/sandboxes/{sandboxId}/commands/{processId}` for status and logs. With `stream: true` the output arrives as the command writes it, as newline-delimited JSON (`application/x-ndjson`): `{\"type\":\"started\"}`, then `{\"type\":\"stdout\"|\"stderr\",\"data\":\"...\"}` per chunk, and last `{\"type\":\"exit\",...}` (the synchronous result without stdout/stderr) or `{\"type\":\"error\",\"error\":\"...\",\"message\":\"...\"}`. Returns 400 invalid_timeout when `timeoutSeconds` is not an integer in 1-600. A command sent while the sandbox is still starting (right after a resume) waits up to 60s for it to be ready instead of failing; 409 boat_starting (retryable) is returned only if it is still not ready by then. A sandbox that is not starting (`error`, `stopped`) returns 409 sandbox_not_ready with `retryable: false` and its `state` at once: resume or recover it first. Command execution is never retried automatically: a 502 boat_direct_failed means the command may already be running on the sandbox."
      operationId: command
      parameters:
        - $ref: '#/components/parameters/SandboxId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommandRequest' }
      responses:
        '200':
          description: 'Command result (synchronous), process start confirmation (detached), or the output stream (`stream: true`).'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CommandResponse'
                  - $ref: '#/components/schemas/CommandStartedResponse'
            application/x-ndjson:
              schema: { $ref: '#/components/schemas/CommandStreamFrame' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /sandboxes/{sandboxId}/commands/{processId}:
    get:
      tags: [Boat]
      summary: Get detached command status and logs
      operationId: commandStatus
      parameters:
        - $ref: '#/components/parameters/SandboxId'
        - $ref: '#/components/parameters/ProcessId'
        - name: tailBytes
          in: query
          schema: { type: integer, minimum: 1, maximum: 8388608 }
          description: Cap each returned log to its last N bytes. Defaults to 8388608 (8 MiB).
      responses:
        '200':
          description: Process status and log tails.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommandStatusResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /sandboxes/{sandboxId}/artifacts:
    get:
      tags: [Boat]
      summary: Download a sandbox artifact
      operationId: artifact
      parameters:
        - $ref: '#/components/parameters/SandboxId'
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Artifact bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /sandboxes/{sandboxId}/steer:
    post:
      tags: [Boat]
      summary: Steer a running turn
      description: >-
        Send a new message to a turn that is already running, without losing what the agent is doing. This is what typing into a coding agent while it works does: the instruction is taken into account and the work continues.


        Where the harness has a native mid-turn primitive (Claude Code, Codex, pi, Prime Agent) nothing is interrupted and the response has `native: true`. Where it does not (OpenCode), Boat interrupts that turn and immediately continues the SAME conversation with the instruction, keeping the session and its memory, and the response has `native: false`.


        Refused with **409 `no_running_turn`** when the conversation has nothing in flight; queue work with `POST /prompt` instead. The steer shows up in `GET /events` as a `steer` event. See [Integrated agents](/integrated-agents).
      operationId: steer
      parameters:
        - $ref: '#/components/parameters/SandboxId'
        - name: conversation
          in: query
          schema: { type: string }
          description: Conversation id to steer. Also accepted in the body. Omit to steer the sandbox's most-recently-active conversation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SteerRequest' }
            examples:
              addATask:
                value:
                  message: Also write /home/user/steered.txt containing the word STEERED, then finish.
              oneConversation:
                value:
                  conversation: 8f1c2b7a-3d4e-4f5a-9b0c-1d2e3f4a5b6c
                  message: Skip the integration tests, unit tests are enough.
      responses:
        '200':
          description: Message delivered to the running turn.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SteerResponse' }
              examples:
                steered:
                  value:
                    ok: true
                    type: prompt.steered
                    id: bx_23456789
                    conversationId: 8f1c2b7a-3d4e-4f5a-9b0c-1d2e3f4a5b6c
                    promptId: prompt_456
                    native: true
                    mode: native
                    status: steered
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /sandboxes/{sandboxId}/interrupt:
    post:
      tags: [Boat]
      summary: Interrupt running work
      description: Interrupt running agent work. By default this stops **every** conversation on the sandbox. Pass `conversation` to stop just one, leaving the others running. See [Integrated agents](/integrated-agents).
      operationId: interrupt
      parameters:
        - $ref: '#/components/parameters/SandboxId'
        - name: conversation
          in: query
          schema: { type: string }
          description: Interrupt only this conversation id. Omit to interrupt the whole sandbox.
      responses:
        '200':
          description: Interrupt requested.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxActionResponse' }
              examples:
                interrupted:
                  value:
                    ok: true
                    type: sandbox.interrupted
                    id: bx_23456789
                    status: interrupted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /sandboxes/{sandboxId}/desktop:
    post:
      tags: [Boat]
      summary: Get desktop streaming URL
      description: "Create or fetch a secret-bearing desktop/noVNC URL for live computer-use visibility. Use `?vnc=1` for noVNC; a `provisioning: true` response means poll again."
      operationId: desktop
      parameters:
        - $ref: '#/components/parameters/SandboxId'
        - name: vnc
          in: query
          schema:
            type: integer
            enum: [1]
          description: Use VNC/noVNC streaming mode.
        - name: theme
          in: query
          schema:
            type: string
            enum: [light, dark]
          description: Desktop streaming theme for non-VNC mode.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DesktopRequest' }
      responses:
        '200':
          description: Desktop streaming URL, or provisioning state for VNC setup.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesktopResponse' }
              examples:
                ready:
                  value:
                    ok: true
                    type: desktop.url
                    success: true
                    desktopUrl: https://sandbox-preview.example/vnc.html?_token=redacted
                    ip: 203.0.113.10
                    mode: vnc
                provisioning:
                  value:
                    ok: true
                    type: desktop.provisioning
                    provisioning: true
                    message: Preparing VNC desktop…
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /sandboxes/{sandboxId}/host:
    post:
      tags: [Boat]
      summary: Expose a sandbox port on a public HTTPS URL
      description: "Registers a stable `https://<sandbox-subdomain>-<port>.on.boat.dev` route for a port inside the sandbox and opens the sandbox firewall for it. Idempotent: calling it again for the same sandbox and port returns the same URL and token."
      operationId: hostPort
      parameters:
        - $ref: '#/components/parameters/SandboxId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HostPortRequest' }
      responses:
        '200':
          description: The public HTTPS URL for the port.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostPortResponse' }
              examples:
                hosted:
                  value:
                    ok: true
                    type: port.hosted
                    success: true
                    port: 3000
                    url: https://swift-otter-9021-3000.on.boat.dev?_token=redacted
                    isProtected: true
                    access: private
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /sandboxes/{sandboxId}/sshkey:
    post:
      tags: [Boat]
      summary: Configure sandbox SSH key
      description: |
        Adds an OpenSSH public key to the running sandbox so the caller can SSH as user `user`. The response carries `machineIp`, which is the host to connect to on port 22.

        This is also how you reach your own machine from inside a sandbox without the CLI: authorize the key, then open a reverse tunnel with stock OpenSSH, and a port on your machine answers at `127.0.0.1:<port>` inside the sandbox for as long as the ssh process runs.

        ```bash
        ssh -o ExitOnForwardFailure=yes -i ~/.ssh/id_ed25519 -N -R 7777:127.0.0.1:7777 user@<machineIp>
        ```

        `boat forward <id> --reverse --local 7777` is the same tunnel with the key handling and redial done for you.
      operationId: sshKey
      parameters:
        - $ref: '#/components/parameters/SandboxId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SshKeyRequest' }
      responses:
        '200':
          description: SSH key setup result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SshKeyResponse' }
              examples:
                configured:
                  value:
                    ok: true
                    type: ssh_key.configured
                    success: true
                    machineIp: 203.0.113.10
                    sshUser: user
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /named-snapshots:
    get:
      tags: [Boat]
      summary: List named snapshots
      description: List your named snapshots, newest first.
      operationId: listNamedSnapshots
      responses:
        '200':
          description: Named snapshots owned by the authenticated Boat user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NamedSnapshotListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Boat]
      summary: Save a named snapshot
      description: >-
        Freeze a sandbox's current state under a name (`boat snapshot <id> <name>` in the CLI).
        Answers `202` immediately with the snapshot in `saving`; a running sandbox takes a fresh
        capture first, which can run minutes. Poll `GET /named-snapshots/{name}` until the
        status settles at `ready` or `failed`. Reusing one of your existing names replaces
        that snapshot's artifact once the new save is ready.
      operationId: saveNamedSnapshot
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NamedSnapshotSaveRequest' }
      responses:
        '202':
          description: Save accepted and running in the background.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NamedSnapshotSavingResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            `named_snapshot_limit` when you already keep the maximum of 10 named snapshots;
            remove one first. `save_in_progress` when a save under this name is already
            running; wait for it to settle rather than retrying immediately.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /named-snapshots/{name}:
    get:
      tags: [Boat]
      summary: Get a named snapshot
      operationId: getNamedSnapshot
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The named snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NamedSnapshotInfoResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Boat]
      summary: Remove a named snapshot
      description: >-
        Remove a named snapshot and release its storage (`boat snapshot rm <name>` in the
        CLI). Sandboxes already deployed from it are unaffected.
      operationId: deleteNamedSnapshot
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Removed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NamedSnapshotDeletedResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            `save_in_progress`: a save under this name is still running. Wait for it to settle
            before removing it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /snapshots:
    get:
      tags: [Boat]
      summary: List snapshots
      description: >-
        List visible completed snapshots across all of your sandboxes using immutable ownership attribution.
        Pinned, deletion-scheduled, and privacy-fenced sandbox snapshots are omitted. Follow `nextCursor`
        through the complete history; there is no hidden 500-snapshot cap.
      operationId: listSnapshots
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Completed snapshots owned by the authenticated Boat user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnapshotListResponse' }
              examples:
                snapshots:
                  value:
                    ok: true
                    type: snapshot.list
                    snapshots:
                      - id: 7417be09-d419-4ae0-b3fc-7f04a5a71ef1
                        sandboxId: bx_23456789
                        status: completed
                        kind: incremental
                        generation: 3
                        chainId: 4ced5b04-d2cb-4ec3-b127-3b3ed836cab5
                        createdAt: '2026-06-24T06:24:00Z'
                        completedAt: '2026-06-24T06:24:50Z'
                        sizeBytes: 18874368
                        fileCount: 6781
                    pageInfo:
                      nextCursor: null
                      hasMore: false
                      limit: 50
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /sandboxes/{sandboxId}/snapshots:
    get:
      tags: [Boat]
      summary: List boat snapshots
      description: List visible completed snapshots for one sandbox with uncapped cursor pagination.
      operationId: listSandboxSnapshots
      parameters:
        - $ref: '#/components/parameters/SandboxId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Completed snapshots for this sandbox.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnapshotListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Boat]
      summary: Permanently delete all snapshots of a sandbox
      description: >-
        Accept irreversible deletion of every unpinned snapshot of this sandbox. The sandbox itself
        and its named snapshots stay. Snapshots disappear from lists, restores and forks immediately;
        their stored data is purged in the background. Set `X-Ascii-Confirm-Delete` to the sandbox id.
      operationId: deleteSandboxSnapshots
      parameters:
        - $ref: '#/components/parameters/SandboxId'
        - $ref: '#/components/parameters/ConfirmDelete'
      responses:
        '202':
          description: One accepted deletion operation per snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionOperationListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /sandboxes/{sandboxId}/snapshots/latest:
    get:
      tags: [Boat]
      summary: Get latest boat snapshot
      description: Return the most recent completed snapshot for this sandbox, or `null` if it has none.
      operationId: getLatestSandboxSnapshot
      parameters:
        - $ref: '#/components/parameters/SandboxId'
      responses:
        '200':
          description: Most recent completed snapshot, or `null`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnapshotLatestResponse' }
              examples:
                latest:
                  value:
                    ok: true
                    type: snapshot.latest
                    snapshot:
                      id: 7417be09-d419-4ae0-b3fc-7f04a5a71ef1
                      sandboxId: bx_23456789
                      status: completed
                      kind: incremental
                      generation: 3
                      chainId: 4ced5b04-d2cb-4ec3-b127-3b3ed836cab5
                      createdAt: '2026-06-24T06:24:00Z'
                      completedAt: '2026-06-24T06:24:50Z'
                      sizeBytes: 18874368
                      fileCount: 6781
                none:
                  value:
                    ok: true
                    type: snapshot.latest
                    snapshot: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /sandboxes/{sandboxId}/usage:
    get:
      tags: [Boat]
      summary: Get boat usage
      description: >-
        Machine time one sandbox consumed, and what it costs, so you can bill your own users per sandbox. Same
        meter as `GET /limits`: billable seconds with the sandbox type's multiplier applied, paused past a
        refused stop, never counting time stopped. Narrow it to a billing period with `since` and
        `until`; a period boundary that falls inside a running stretch splits that stretch pro rata.
        Works while the sandbox runs and after it stops.
      operationId: usage
      parameters:
        - $ref: '#/components/parameters/SandboxId'
        - name: since
          in: query
          required: false
          schema: { type: string }
          description: Count from this time, ISO 8601 or Unix epoch seconds. Default is the sandbox's creation.
          examples:
            iso: { value: '2026-09-01T00:00:00Z' }
            epoch: { value: '1756684800' }
        - name: until
          in: query
          required: false
          schema: { type: string }
          description: Count up to this time, ISO 8601 or Unix epoch seconds. Default is now.
          examples:
            iso: { value: '2026-10-01T00:00:00Z' }
      responses:
        '200':
          description: Billable machine time for the sandbox inside the window.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxUsageResponse' }
              examples:
                usage:
                  value:
                    ok: true
                    type: sandbox.usage
                    sandboxId: bx_23456789
                    sandboxType: default
                    billingMultiplier: 1
                    since: '2026-09-01T00:00:00.000Z'
                    until: '2026-09-14T09:30:00.000Z'
                    seconds: 4980
                    dollars: 0.0498
                    secondsPerDollar: 100000
                    running: false
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /snapshots/{snapshotId}:
    delete:
      tags: [Boat]
      summary: Permanently delete snapshot data
      description: >-
        Accept irreversible deletion of an unpinned snapshot owned by the authenticated account. Any
        such snapshot is accepted: it disappears from lists, restores and forks immediately, and its
        stored data is purged in the background once nothing still reads it (see the operation's
        `stage`). `409` only means `X-Ascii-Confirm-Delete` is missing or wrong.
      operationId: deleteSnapshot
      parameters:
        - $ref: '#/components/parameters/SnapshotId'
        - $ref: '#/components/parameters/ConfirmDelete'
      responses:
        '202':
          description: Deletion confirmed and accepted for background processing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionOperationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /snapshots/{snapshotId}/tree:
    get:
      tags: [Boat]
      summary: Get snapshot file tree
      description: List the files and folders captured in a snapshot, with sizes. Returns a flat list of entries you can render as a tree.
      operationId: getSnapshotTree
      parameters:
        - $ref: '#/components/parameters/SnapshotId'
      responses:
        '200':
          description: Flat file/folder listing for the snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnapshotTreeResponse' }
              examples:
                tree:
                  value:
                    ok: true
                    type: snapshot.tree
                    snapshotId: 7417be09-d419-4ae0-b3fc-7f04a5a71ef1
                    sandboxId: bx_23456789
                    generation: 3
                    treeAvailable: true
                    truncated: false
                    fileCount: 6781
                    totalSizeBytes: 458291
                    entries:
                      - { path: src, kind: dir }
                      - { path: src/main.ts, kind: file, size: 1024 }
                legacy:
                  value:
                    ok: true
                    type: snapshot.tree
                    snapshotId: 7417be09-d419-4ae0-b3fc-7f04a5a71ef1
                    sandboxId: bx_23456789
                    generation: 0
                    treeAvailable: false
                    truncated: false
                    fileCount: 0
                    totalSizeBytes: 0
                    entries: []
                    reason: legacy_snapshot
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /snapshots/{snapshotId}/files:
    get:
      tags: [Boat]
      summary: Download a file or folder from a snapshot
      description: >-
        Stream a single file's bytes, or a folder subtree as a tar archive, directly
        out of a snapshot, the sandbox can be stopped or archived; the machine is never
        contacted. Use `GET /snapshots/{snapshotId}/tree` to list paths, then pass one
        here. Paths are relative to the snapshot root (same space as `tree` entries;
        docker volumes under `__dockervol__/`). An empty or `/` path downloads the whole
        snapshot as a tar. Folder responses set `X-Snapshot-File-Count`,
        `X-Snapshot-Total-Size-Bytes` and `X-Snapshot-Skipped-Base-Image-Files` headers;
        both response shapes set `X-Snapshot-Entry-Kind` (`file` or `dir`).
      operationId: getSnapshotFile
      parameters:
        - $ref: '#/components/parameters/SnapshotId'
        - name: path
          in: query
          required: false
          schema: { type: string }
          description: File or folder path inside the snapshot. Empty for the whole snapshot.
      responses:
        '200':
          description: File bytes (`application/octet-stream`) or folder tar (`application/x-tar`).
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/x-tar:
              schema:
                type: string
                format: binary
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Path has no downloadable bytes, one of `legacy_snapshot` (pre-inventory snapshot), `snapshot_not_indexed` (content captured before the indexed snapshot format; take a new snapshot or use the download bundle), `base_image_file` (stock image file, not stored in snapshots), or `is_symlink` (request the symlink's target instead).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /snapshots/{snapshotId}/download:
    get:
      tags: [Boat]
      summary: Get snapshot download
      description: |
        Return time-limited signed URLs for every chunk needed to reconstruct the sandbox filesystem at this snapshot (the full chain, base through this generation), plus the inventory. Download the chunks and reassemble them as described by `reconstruct`. The `boat snapshot pull` CLI command does this for you.
      operationId: getSnapshotDownload
      parameters:
        - $ref: '#/components/parameters/SnapshotId'
      responses:
        '200':
          description: Signed chunk URLs for the snapshot chain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnapshotDownloadResponse' }
              examples:
                download:
                  value:
                    ok: true
                    type: snapshot.download
                    snapshotId: 7417be09-d419-4ae0-b3fc-7f04a5a71ef1
                    sandboxId: bx_23456789
                    kind: incremental
                    generation: 3
                    expiresInSeconds: 3600
                    reconstruct: Download every chunk. For each snapshot in ascending generation, concat its chunks by chunkIndex and pipe through `zstd -d | tar -x`.
                    inventory:
                      r2Key: chains/4ced5b04/inventory-3.json.zst
                      signedUrl: https://r2.example/chains/4ced5b04/inventory-3.json.zst?sig=redacted
                    chunks:
                      - snapshotId: 2db50582-716c-424c-817e-9495484f88dd
                        generation: 0
                        chunkIndex: 0
                        r2Key: chains/4ced5b04/snapshots/2db50582/chunks/00.tar.zst
                        sizeBytes: 209715200
                        sha256: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
                        signedUrl: https://r2.example/chains/4ced5b04/snapshots/2db50582/chunks/00.tar.zst?sig=redacted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
