openapi: 3.1.0
info:
  title: Boat Public API v1
  version: 1.0.0
  description: |
    Public JSON API for creating, operating, prompting, observing, and exposing sandboxes from backend services, CI jobs, hosted workers, and Boat automation products.

    The v1 reference intentionally documents the developer integration surface only. Dashboard billing actions are not part of v1.
servers:
  - url: https://boat.dev/api/v1
security:
  - BoatBearerAuth: []
webhooks:
  sandboxLifecycle:
    post:
      summary: Sandbox lifecycle event delivery
      operationId: deliverSandboxLifecycleEvent
      description: At-least-once delivery to each subscribed endpoint. Separate events may arrive out of order. Return any 2xx status within 5 seconds to acknowledge the event.
      security: []
      parameters:
        - name: X-Ascii-Event
          in: header
          required: true
          schema: { $ref: '#/components/schemas/WebhookEventType' }
        - name: X-Ascii-Delivery
          in: header
          required: true
          schema: { type: string, pattern: '^evt_[a-f0-9]{32}$' }
        - name: X-Ascii-Timestamp
          in: header
          required: true
          schema: { type: string, pattern: '^[0-9]+$' }
        - name: X-Ascii-Signature
          in: header
          required: true
          description: HMAC-SHA256 over `delivery_id.timestamp.raw_body`, formatted as `v1=<hex>`.
          schema: { type: string, pattern: '^v1=[a-f0-9]{64}$' }
        - name: X-Ascii-Attempt
          in: header
          required: true
          schema: { type: integer, minimum: 1, maximum: 8 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookEvent' }
      responses:
        '2XX':
          description: Delivery accepted.
        default:
          description: Delivery will be retried with exponential backoff.
tags:
  - name: Boat
    description: Unified Boat account, setup, lifecycle, prompting, event history, desktop access, and SSH operations.
components:
  securitySchemes:
    BoatBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sandbox_api_key
      description: Boat bearer token in the form `boat_...`. Service API keys authenticate sandbox operations.
  parameters:
    SandboxId:
      name: sandboxId
      in: path
      required: true
      schema:
        type: string
        pattern: '^bx_[23456789abcdefghjkmnpqrstuvwxyz]{8}$'
      description: Public Sandbox id returned by create/list/get sandbox calls.
    ProcessId:
      name: processId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: Process id returned by a detached command start.
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      description: Maximum items to return.
    Cursor:
      name: cursor
      in: query
      schema: { type: [string, 'null'] }
      description: Opaque pagination cursor returned as `pageInfo.nextCursor`.
    Sort:
      name: sort
      in: query
      schema: { type: string, enum: [asc, desc], default: desc }
      description: Sort direction for cursor pagination.
    SnapshotId:
      name: snapshotId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Snapshot id returned by the snapshot list/latest calls.
    OperationId:
      name: operationId
      in: path
      required: true
      schema: { type: string, pattern: '^bdop_[a-f0-9]{32}$' }
      description: Deletion operation id returned by an accepted delete request.
    ConfirmDelete:
      name: X-Ascii-Confirm-Delete
      in: header
      required: true
      schema: { type: string }
      description: Must exactly equal the target `sandboxId` or `snapshotId`. A missing or mismatched value returns `409` without accepting deletion.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 255 }
      description: >-
        Optional exactly-once key for creating a sandbox. Send your own opaque,
        account-unique value (a UUID) to make `POST /sandboxes` safe to retry when the
        response is lost (network timeout, 5xx): the first request creates the sandbox
        and binds it to the key; every later request with the **same account, key,
        and request body** returns that same sandbox instead of creating a second,
        billable one. Behavior: keys are retained for **24 hours**; a concurrent or
        early retry while the first sandbox is still being minted returns `409`
        `idempotency_in_progress` (retry shortly, same key); reusing a key with a
        **different body** returns `409` `idempotency_key_reused`; timeouts and 5xx
        are safe to retry with the same key; a create that fails before the sandbox
        exists releases the key within ~2 minutes so a retry can create the sandbox.
        Omit the header to keep the default (non-idempotent) behavior.
    OrgId:
      name: org
      in: query
      required: false
      schema: { type: string }
      description: >-
        Billing wallet for this request: an organization you belong to, by id
        (`team_…`) or by name as `GET /orgs` lists it (case-insensitive), or
        `personal`. Omitted, the account's active wallet applies (`PATCH
        /orgs/active`; personal until set). Two organizations sharing the name
        answer `409 ambiguous_org` and need the id. Sandboxes, snapshots, and
        environments stay creator-private.
    OrgHeader:
      name: X-Boat-Org
      in: header
      required: false
      schema: { type: string }
      description: Same as the `org` query parameter. Query wins when both are set.
  schemas:
    SuccessBase:
      type: object
      required: [ok, type]
      properties:
        ok:
          type: boolean
          examples: [true]
        type:
          type: string
          description: Stable success envelope discriminator added by v1.
    ErrorEnvelope:
      type: object
      required: [ok, type, status, code, message, error, requestId]
      properties:
        ok:
          type: boolean
          examples: [false]
        type:
          type: string
          examples: [sandbox.error]
        status:
          type: integer
          examples: [409]
        code:
          type: string
          examples: [provider_not_configured]
        message:
          type: string
          examples: [Prompting is locked until Codex is configured on the Agents page.]
        requestId:
          type: string
          examples: [req_01HX...]
        error:
          type: object
          required: [code, message, status]
          properties:
            code:
              type: string
            message:
              type: string
            status:
              type: integer
            details:
              type: object
              additionalProperties: true
    Sandbox:
      type: object
      required: [id, name, state, desktopAvailable, snapshotAvailable]
      properties:
        id:
          type: string
          pattern: '^bx_[23456789abcdefghjkmnpqrstuvwxyz]{8}$'
          examples: [bx_23456789]
        name:
          type: string
          examples: [Boat 2026-05-31 12:00]
        state:
          type: string
          enum: [init, provisioning, provisioned, cloning, ready, idle, running, archiving, archived, error, cancelled]
          description: >-
            `cancelled` is terminal: a create or fork that could not get a machine was removed.
            `GET /sandboxes/{sandboxId}` reports it once, with only `id`, `state` and `error`, then answers 404.
        error:
          type: [string, 'null']
          description: Why the sandbox is stopped, failed or cancelled, or null.
        health:
          type: string
          enum: [ok, degraded]
          description: >-
            `degraded` when the machine is alive but Boat cannot fully reach it (for example a
            firewall rule inside the sandbox blocks the tunnel). The sandbox keeps running.
        healthReason:
          type: [string, 'null']
          description: Why the sandbox is degraded, or null.
        degradedSince:
          type: [string, 'null']
          format: date-time
          description: When the sandbox became degraded, or null.
        type:
          type: string
          enum: [small, default, large]
          description: >-
            Current machine size: what the sandbox was created with, or the size it was last resumed
            or forked onto.
        vcpu:
          type: integer
          description: vCPUs guaranteed by this sandbox's type.
          examples: [4]
        memoryGB:
          type: integer
          description: RAM in GB guaranteed by this sandbox's type.
          examples: [8]
        billingMultiplier:
          type: number
          description: Rate at which this sandbox consumes machine time. 0.5 for `small`, 1 for `default`, and 2 for `large`.
          examples: [1]
        machineProvider:
          type: [string, 'null']
          enum: [hetzner, baremetal, null]
          description: Machine provider of the machine the sandbox is on, or null when it has no machine.
        url:
          type: [string, 'null']
          format: uri
          description: Machine URL when assigned.
        ip:
          type: [string, 'null']
          description: Machine IPv6 or IPv4 address when assigned.
        sshEndpoint:
          type: [string, 'null']
          description: >-
            Public IPv4 `host:port` that forwards to the sandbox SSH server. Set only when the
            machine has no public IPv4 of its own; null otherwise. Connect with
            `ssh -p <port> user@<host>`.
          examples: ['203.0.113.10:22001']
        createdAt:
          type: [string, 'null']
          format: date-time
        updatedAt:
          type: [string, 'null']
          format: date-time
        archiveAfter:
          type: [string, 'null']
          format: date-time
          description: Automatic archival time, or null when auto-stop is disabled.
        desktopAvailable:
          type: boolean
        desktopUrl:
          type: [string, 'null']
          format: uri
          description: Secret-bearing desktop stream URL when available. Redact from logs.
        snapshots:
          type: boolean
          description: False when the sandbox was created with snapshots off.
        snapshotAvailable:
          type: boolean
        snapshotCompletedAt:
          type: [string, 'null']
          format: date-time
          description: Timestamp of the most recent successfully completed snapshot, or null.
        snapshotVerifiedAt:
          type: [string, 'null']
          format: date-time
          description: >-
            Last time a snapshot confirmed the sandbox's saved state, including checks that found
            nothing new to save. Falls back to `snapshotCompletedAt`; null if never.
        team:
          type: [object, 'null']
          description: The organization billed for this sandbox, or null when the owner is billed.
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        createdBy:
          type: [string, 'null']
          description: Display name (or email) of the person who created the sandbox. Organization members see every sandbox the organization pays for, so this says whose it is.
        createdById:
          type: [string, 'null']
          description: Account id of the person who created the sandbox.
        access:
          type: string
          enum: [owner, use, view]
          description: >-
            What you may do with this sandbox. `owner`: you created it. `use`: a teammate's
            organization sandbox that is `noEnv` (created with it, or shared and restarted), so you can open,
            run commands in, prompt, resume and stop it. `view`: a teammate's organization
            sandbox that still holds their personal logins, so you can see it and stop it
            until they share it (`POST /sandboxes/{sandboxId}/share`).
        holdsCreatorLogins:
          type: boolean
          description: True while the sandbox still holds its creator's personal logins (GitHub token, model logins, secrets). Other members can only see such a sandbox.
        wipePendingUntilRestart:
          type: boolean
          description: True once the sandbox is shared but not restarted yet. Its creator's logins are wiped at its next start, and the organization can use it from then on.
        subdomain:
          type: [string, 'null']
          description: The sandbox's stable three-word subdomain slug (e.g. "frazil-pneuma-rallye"), or null before one is assigned.
        lastSnapshotAttemptAt:
          type: [string, 'null']
          format: date-time
          description: Timestamp of the most recent snapshot attempt of any status (queued, in_progress, completed, failed, cancelled), or null. Use with snapshotCompletedAt to detect snapshots that keep failing.
        lastSnapshotStatus:
          type: [string, 'null']
          enum: [queued, in_progress, completed, failed, cancelled, null]
          description: Status of the most recent snapshot attempt, or null if none. A value other than completed while snapshotCompletedAt stays stale indicates failing snapshots.
        setupStatus:
          type: [string, 'null']
          enum: [pending, running, done, failed, null]
          description: >-
            Outcome of the create-time `setupScript`: `pending` (stored, not yet
            started), `running` (executing on the sandbox in the background), `done`
            (exit code 0) or `failed` (non-zero exit, or the sandbox lost track of
            the process). Null when the sandbox was created without a setup script.
        setupError:
          type: [string, 'null']
          description: Short failure detail (exit code plus a stderr tail) when `setupStatus` is `failed`; while `pending`, may carry the last start/upload error from a retry in progress. Otherwise null.
        environment:
          type: [string, 'null']
          description: >-
            Name of the sandbox environment this sandbox is running, or null if it is attached to
            none (a `noEnv` sandbox, or one whose environment was deleted). A sandbox freezes onto
            one environment version when it starts and keeps it for life, so this is what
            the sandbox actually holds, not what the environment says today.
          examples: [base]
        environmentVersion:
          type: [integer, 'null']
          description: >-
            Version number of `environment` that this sandbox is pinned to. Compare it against
            the environment's latest version to see whether an upgrade is pending: a sandbox
            below the latest is still running the older configuration until someone calls
            `POST /environments/{environmentId}/upgrade`.
          examples: [3]
    ApiKey:
      type: object
      required: [id, name, credentialLane, keyPrefix, keyLastFour, sandboxId, createdAt, lastUsedAt, usage, resources]
      properties:
        id:
          type: string
          examples: [sak_123]
        name:
          type: string
          examples: [Production worker]
        credentialLane:
          type: string
          enum: [legacy, scoped-v1]
          description: Credential storage lane. Scoped secrets are never stored in the legacy hash column.
        keyPrefix:
          type: string
          examples: [boat_live]
        keyLastFour:
          type: string
          examples: [9abc]
        sandboxId:
          type: [string, 'null']
          description: Sandbox ID for a platform-managed machine key, or null for a user-created key.
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: [string, 'null']
          format: date-time
        usage:
          $ref: '#/components/schemas/ApiKeyRequestUsage'
        resources:
          $ref: '#/components/schemas/ApiKeyResourceTotals'
        expiresAt:
          type: [string, 'null']
          format: date-time
        expired:
          type: boolean
        expiringSoon:
          type: boolean
        scope:
          type: object
          properties:
            expiresAt:
              type: [string, 'null']
              format: date-time
            actions:
              type: array
              items: { type: string }
            sandboxes:
              oneOf:
                - { type: string, enum: ['*'] }
                - { type: array, items: { type: string } }
            environments:
              oneOf:
                - { type: string, enum: ['*'] }
                - { type: array, items: { type: string } }
            grandfathered:
              type: boolean
    ApiKeyRequestUsage:
      type: object
      required: [requests, windowDays]
      properties:
        requests:
          type: integer
          minimum: 0
          description: Requests authenticated with this key during the current UTC day and the previous 29 UTC days.
          examples: [1842]
        windowDays:
          type: integer
          const: 30
    ApiKeyResourceTotals:
      type: object
      required: [total, sandboxes, agents]
      properties:
        total:
          type: integer
          minimum: 0
        sandboxes:
          type: integer
          minimum: 0
        agents:
          type: integer
          minimum: 0
    ApiKeyCreatedResource:
      type: object
      required: [kind, id, name, state, createdAt]
      properties:
        kind:
          type: string
          enum: [sandbox, agent]
        id:
          type: string
        name:
          type: string
        state:
          type: string
        createdAt:
          type: [string, 'null']
          format: date-time
    WebhookEventType:
      type: string
      enum: [sandbox.ready, sandbox.error, sandbox.archived, sandbox.hydrated, sandbox.degraded, sandbox.recovered]
    Webhook:
      type: object
      required: [id, name, url, events, createdAt, updatedAt]
      properties:
        id:
          type: string
          pattern: '^wh_[a-f0-9]{24}$'
          examples: [wh_0123456789abcdef01234567]
        name:
          type: [string, 'null']
          maxLength: 100
          examples: [Production automation]
        url:
          type: string
          format: uri
          description: Public HTTPS endpoint on port 443.
          examples: [https://example.com/hooks/sandbox]
        events:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/WebhookEventType'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WebhookCreateRequest:
      type: object
      required: [url, events]
      properties:
        name:
          type: [string, 'null']
          minLength: 1
          maxLength: 100
        url:
          type: string
          format: uri
        events:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/WebhookEventType'
    WebhookUpdateRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: [string, 'null']
          maxLength: 100
        url:
          type: string
          format: uri
        events:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/WebhookEventType'
    WebhookEvent:
      type: object
      required: [id, type, createdAt, data]
      description: JSON body sent to the registered endpoint. This is not a v1 success envelope.
      properties:
        id:
          type: string
          pattern: '^evt_[a-f0-9]{32}$'
        type:
          $ref: '#/components/schemas/WebhookEventType'
        createdAt:
          type: string
          format: date-time
        data:
          type: object
          required: [sandbox]
          properties:
            sandbox:
              type: object
              required: [id, name]
              properties:
                id:
                  type: string
                  pattern: '^bx_[23456789abcdefghjkmnpqrstuvwxyz]{8}$'
                name:
                  type: string
            previousState:
              type: string
              description: On sandbox.ready, sandbox.error and sandbox.archived only.
            state:
              type: string
              description: Absent on sandbox.hydrated.
            reason:
              type: [string, 'null']
              description: On sandbox.degraded and sandbox.recovered. Why the sandbox is degraded (null on recovered).
    Repository:
      type: object
      additionalProperties: true
      properties:
        id:
          type: integer
          description: GitHub repository id.
        databaseId:
          type: string
          description: Internal repository id used when selecting repositories.
        name:
          type: string
        fullName:
          type: string
          examples: [acme/web]
        description:
          type: [string, 'null']
        url:
          type: string
          format: uri
          examples: [https://github.com/acme/web]
        private:
          type: boolean
        permissions:
          type: string
        pushedAt:
          type: [string, 'null']
          format: date-time
        lastUserCommitAt:
          type: [string, 'null']
          format: date-time
          description: Reserved; always null.
    SelectedRepository:
      allOf:
        - $ref: '#/components/schemas/Repository'
        - type: object
          properties:
            baseBranch:
              type: string
              examples: [main]
            setupRoutineId:
              type: [string, 'null']
            setupScript:
              type: string
            setupBlocking:
              type: boolean
    RepositoryInstallation:
      type: object
      properties:
        type:
          type: string
          examples: [Organization]
        accountLogin:
          type: string
          examples: [acme]
        accountAvatarUrl:
          type: [string, 'null']
          format: uri
        repositories:
          type: array
          items:
            $ref: '#/components/schemas/Repository'
    SecretFile:
      type: object
      required: [path, contents]
      properties:
        path:
          type: string
          examples: [.config/service-account.json]
        contents:
          type: string
          description: Secret file contents. Treat as sensitive.
    StartWindowUsage:
      type: [object, 'null']
      description: One rolling start window. Null when the account is unlimited.
      properties:
        limit: { type: integer }
        used: { type: integer }
        remaining: { type: integer }
    LimitsFields:
      type: object
      required: [activeSandboxes, maxActiveSandboxes, canStart, billingStatus]
      additionalProperties: true
      properties:
        accessTier:
          type: string
          examples: [trial]
        blockedReason:
          type: [string, 'null']
        currentLimits:
          type: object
          additionalProperties: true
          properties:
            activeSandboxes: { type: integer }
            creationRatePerMinute: { type: integer }
            creationRequestsPerHour: { type: [integer, 'null'] }
            creationRequestsPerDay: { type: [integer, 'null'] }
        standardLimits:
          type: object
          additionalProperties: true
          properties:
            activeSandboxes: { type: integer }
            creationRatePerMinute: { type: integer }
            creationRequestsPerHour: { type: [integer, 'null'] }
            creationRequestsPerDay: { type: [integer, 'null'] }
        trialLimits:
          type: object
          additionalProperties: true
          properties:
            activeSandboxes: { type: integer }
            creationRatePerMinute: { type: integer }
            creationRequestsPerHour: { type: [integer, 'null'] }
            creationRequestsPerDay: { type: [integer, 'null'] }
        upgradeEffects:
          type: object
          additionalProperties: true
        canStart:
          type: boolean
          description: Whether the authenticated account can create or operate sandboxes right now.
        checkoutRequired:
          type: boolean
        startBlockedReason:
          type: [string, 'null']
        contactMessage:
          type: [string, 'null']
        activeSandboxes:
          type: integer
        activeStates:
          type: array
          items:
            type: string
        maxActiveSandboxes:
          type: integer
        maxCreationRequestsPerMinute:
          type: integer
        maxCreationRequestsPerDay:
          type: [integer, 'null']
        startLimits:
          type: [object, 'null']
          description: Plan caps for machine starts. Null on unlimited accounts. Create, fork and resume each count as one start.
          properties:
            perMinute: { type: integer }
            perHour: { type: integer }
            perDay: { type: integer }
        starts:
          type: object
          description: Remaining machine starts in the rolling minute, hour and day windows. Null windows mean the account is unlimited.
          properties:
            unlimited: { type: boolean }
            minute:
              $ref: '#/components/schemas/StartWindowUsage'
            hour:
              $ref: '#/components/schemas/StartWindowUsage'
            day:
              $ref: '#/components/schemas/StartWindowUsage'
        creditBalanceHours:
          type: [number, 'null']
          description: Remaining machine time in hours (`creditBalanceSeconds / 3600`). Null on unlimited accounts.
        packBalanceHours:
          type: number
          description: Remaining purchased credit packs in hours.
        packBalanceDollars:
          type: number
          description: Remaining purchased credit packs in dollars.
        hasPaymentHistory:
          type: boolean
        package:
          type: object
          additionalProperties: true
        subscriptionQuotaSeconds:
          type: integer
        subscriptionRemainingSeconds:
          type: integer
        packBalanceSeconds:
          type: integer
        creditPurchasedSeconds:
          type: integer
        creditUsedSeconds:
          type: integer
        liveUsageSeconds:
          type: integer
        creditSecondsPerDollar:
          type: integer
        sandboxPlanKey:
          type: string
          description: Current plan key, or `trial` before any payment.
          examples: [box_20]
        sandboxPlanDollars:
          type: number
          description: Monthly price of the current plan in dollars.
        sandboxPlanTiers:
          type: array
          description: Every plan tier and its limits.
          items:
            type: object
            properties:
              key:
                type: string
                examples: [box_20]
              dollars: { type: number }
              displayPrice:
                type: string
                examples: [$20/mo]
              maxActiveSandboxes: { type: integer }
              startsPerMinute: { type: integer }
              startsPerHour: { type: integer }
              startsPerDay: { type: integer }
              includedSeconds:
                type: integer
                description: Machine time included each month.
              purchasable:
                type: boolean
                description: Whether this tier can be bought right now.
        accountPlan:
          type: string
          examples: [user, service]
        plan:
          type: [string, 'null']
          description: '`service` for service accounts, otherwise null.'
        planName:
          type: [string, 'null']
          description: '`Service` for service accounts, otherwise null.'
        serviceAccount:
          type: boolean
        unlimited:
          type: boolean
          description: True when the account has no machine-time or start limits.
        hasSeatPlan:
          type: boolean
          description: True when an organization has an active per-seat plan.
        last24hUsageSeconds:
          type: integer
          description: Machine time used in the last 24 hours, in seconds. Useful to estimate how long the balance lasts.
        trialComputeCapSeconds:
          type: [integer, 'null']
          description: Lifetime machine-time allowance for a trial that never paid. Null once the account has paid or has a plan.
        trialLine:
          type: [string, 'null']
          description: The trial limits in one readable line. Null on paid accounts.
        giftLimit:
          type: [object, 'null']
          description: Fair-use caps on a gifted account, or null when there are none.
          properties:
            maxActiveSandboxes: { type: [integer, 'null'] }
            maxTtlSeconds: { type: [integer, 'null'] }
            line:
              type: [string, 'null']
              description: The caps in one readable line.
            message:
              type: string
              description: The same text shown when a cap is hit.
        billingStatus:
          type: string
          description: Account access state returned by the current backend. Billing endpoints are not part of v1.
        subscriptionStatus:
          type: [string, 'null']
        subscriptionCancelAtPeriodEnd:
          type: boolean
        hasSubscription:
          type: boolean
        subscriptionTrialEndsAt:
          type: [string, 'null']
          format: date-time
        subscriptionCurrentPeriodEnd:
          type: [string, 'null']
          format: date-time
        creditBalanceSeconds:
          type: integer
        teamId:
          type: string
          description: Present when limits were read for a team wallet (`?teamId=`, `?org=`, or `X-Boat-Org`).
        teamRole:
          type: string
          description: Caller's role on that team when `teamId` is present.
    CreateSandboxRequest:
      type: object
      description: Options for provisioning a new cloud computer.
      properties:
        type:
          type: string
          enum: [small, default, large]
          default: default
          description: >-
            Machine size. `small` consumes machine time at half rate and `large` at twice the
            default rate (see the Billing guide). A fork inherits the source sandbox's type unless the fork request passes its
            own, and resume and fork can move a sandbox between sizes.
        ttlSeconds:
          oneOf:
            - type: integer
              minimum: 1
              maximum: 2592000
            - type: 'null'
          default: 3600
          description: Number of seconds before automatic archival. `null` disables auto-stop. The backend also accepts the string `infinite` for legacy compatibility; new clients should send null.
        env:
          type: object
          additionalProperties:
            type: string
          description: >-
            Per-sandbox environment variables injected into the sandbox's tool environment, on top of the
            account environment's variables (per-sandbox values win on conflicts). Keys must match
            `[A-Za-z_][A-Za-z0-9_]{0,127}`; at most 100 variables and 64KB total. Reserved names
            (`ASCII_TOKEN`, `ASCII_API_URL`, `AGENT_ID`, `PRODUCT_MODE`, `ENVIRONMENT_ID`, `BOAT_ID`,
            `SERVICE_PREVIEW_TOKEN`, `BOAT_CLI_TOKEN`) are rejected with `invalid_env`. Forked sandboxes
            inherit the source sandbox's env unless the fork request supplies its own `env`.
        environment:
          type: string
          default: base
          description: >-
            Name of the sandbox environment to attach to this sandbox. Environments are managed in the
            Boat dashboard and bundle the repositories, secrets, and credential toggles a sandbox
            gets. Omit to use your default environment (`base` unless you changed it). Unknown
            names are rejected with `unknown_environment`. An environment marked "safe for third parties" passes nothing
            to the sandbox, exactly like `noEnv`.
          examples: [base, customer-demos]
        noEnv:
          type: boolean
          default: false
          description: >-
            Create a sandbox with none of the secrets attached to your account (no environment
            variables, secret files, or credentials), confined to itself so it cannot act on your
            account or other sandboxes. For sandboxes you give to your own users. SSH, SCP, desktop,
            snapshots, and public URLs still work; pass `env` to give the sandbox a secret of its own.
            A fork of a no-env sandbox is always no-env. Equivalent to attaching an environment marked
            "safe for third parties".
        snapshots:
          type: boolean
          default: true
          description: >-
            Pass `false` to never snapshot this sandbox. Nothing is captured in the background, so
            it pays no CPU or memory for it, and stopping it erases its disk the way zero data
            retention does. It cannot be resumed, forked, or saved as a named snapshot, and if its
            machine fails there is no backup to rebuild it from.
        failFast:
          type: boolean
          default: false
          description: >-
            Pass `true` to get a sandbox only if a machine of this type is ready right now. The call
            answers within about 1.5 s: either the usual `202` with the sandbox, or `503`
            `no_ready_machine` with nothing created, billed, or counted against your start limits,
            so you can retry or fall back at once. Without it, a create waits for a machine to be
            built when none is ready. Works with `from`; fork and resume take it too.
        setupScript:
          type: string
          maxLength: 65536
          description: >-
            Shell script that runs on the sandbox after it is ready. Ready means
            "ready to accept the user", not "setup done": the script starts in
            the background once provisioning completes and never blocks the sandbox
            becoming usable. It runs as the sandbox user via `bash`, with the sandbox's
            environment applied, and its output goes to a log file on the sandbox.
            Observe the outcome as `setupStatus` (pending/running/done/failed)
            and `setupError` on the sandbox. Rejected with a 400 `invalid_setup_script`
            error when it is not a string or exceeds 64KB.
        org:
          type: string
          description: >-
            Bill this sandbox to an organization you belong to (its shared wallet), by
            id or by name as `GET /orgs` lists it; `personal` or your own account id
            means personal billing. Omitted, the `X-Boat-Org` / `?org=` request scope
            applies, then the account's active wallet (`PATCH /orgs/active`), then
            personal. Listing, snapshots, and environments stay yours: the org is a
            wallet, not a shared workspace. Takes precedence over `teamId`.
        teamId:
          type: string
          description: Legacy alias for `org`. Ignored when `org` is also set.
        from:
          type: string
          description: >-
            Create the sandbox from a named snapshot (saved with `POST /named-snapshots`, or
            `boat snapshot <id> <name>` in the CLI). The sandbox starts from that exact frozen
            state. Omitting `type` inherits the type the snapshot was saved from; env and
            no-env inherit from the snapshot's source sandbox unless the request passes its own,
            with the same rules as forking.
      examples:
        - ttlSeconds: 3600
        - ttlSeconds: null
        - type: large
          ttlSeconds: 3600
        - ttlSeconds: 3600
          env:
            DATABASE_URL: postgres://user:pass@host:5432/app
            FEATURE_FLAG: "1"
        - ttlSeconds: null
          noEnv: true
    StopRequest:
      type: object
      description: Options for stopping a sandbox.
      properties:
        force:
          type: boolean
          default: false
          description: >-
            Stop the sandbox even if its disk cannot be snapshotted. Everything written
            since the last successful snapshot is permanently LOST. Without this, a sandbox
            whose snapshot pipeline is failing is left running rather than discarding
            your work, and you are not billed for that time. Only use this after a stop
            has already been refused.
    ResumeRequest:
      type: object
      description: Options for resuming a stopped sandbox.
      properties:
        failFast:
          type: boolean
          default: false
          description: >-
            Pass `true` to resume only if a machine is ready right now. Within about 1.5 s you
            get the usual `202`, or `503` `no_ready_machine` with the sandbox left stopped and
            nothing counted against your start limits.
        type:
          type: string
          enum: [small, default, large]
          description: >-
            Resume onto a different machine size. Omit to keep the sandbox's current type.
            A resume already restores onto a fresh machine, so changing size costs nothing
            extra. Shrinking is rejected with `type_too_small` when the sandbox's data would
            not fit the smaller disk.
        env:
          type: object
          additionalProperties:
            type: string
          description: >-
            Replaces the sandbox's per-sandbox environment variables. Omit to keep the sandbox's
            current env. Same validation rules as `CreateSandboxRequest.env`.
        environment:
          type: string
          description: >-
            Optionally re-pin the sandbox to a different named sandbox environment on resume. Omit to
            keep the sandbox's current environment. Unknown names are rejected with
            `unknown_environment`.
          examples: [base, customer-demos]
        noEnv:
          type: boolean
          description: >-
            Resume into a no-env sandbox: withhold account secrets and scrub inherited owner
            secrets from the restored snapshot before the sandbox is exposed. One-way; once a
            sandbox is resumed as no-env it stays no-env on later resumes.
        ttlSeconds:
          oneOf:
            - type: integer
              minimum: 1
              maximum: 2592000
            - type: 'null'
          description: >-
            Auto-stop for the resumed sandbox, in seconds, stored on the sandbox. Omit to keep
            the TTL the sandbox already had. `null` disables auto-stop, which means nothing
            will ever stop this sandbox for you.
      examples:
        - ttlSeconds: 28800
        - type: large
          ttlSeconds: 3600
    UpdateSandboxRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: New display name. Empty strings are rejected; longer names are truncated to 120 chars by the backend.
        ttlSeconds:
          oneOf:
            - type: integer
              minimum: 1
              maximum: 2592000
            - type: 'null'
          description: New archival TTL. `null` disables auto-stop.
        subdomain:
          type: string
          minLength: 3
          maxLength: 40
          pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
          description: >-
            Rename the sandbox's stable subdomain (the `<subdomain>.on.boat.dev` label).
            Lowercase letters, digits and hyphens; no leading/trailing/double hyphens;
            cannot end in `-desktop` or `-<number>` (reserved for the desktop and
            hosted-port URLs). Must be globally unique. The base URL, desktop URL and
            every live `host <port>` URL are re-pointed to the new name with no
            downtime and their access tokens preserved; the old URLs stop resolving.
            On a transient routing error the rename is saved but returns 502
            `gateway_error` - retry with the same value to finish activating routes.
      examples:
        - name: Customer support run
          ttlSeconds: 7200
        - subdomain: acme-staging
    PromptRequest:
      type: object
      description: |
        Work item to queue inside an existing sandbox. Provider credentials must already be configured in the Boat dashboard.

        **Providers (harnesses):** `codex`, `claude-code` (alias `claude`), `pi`, `opencode`, `prime-agent` (alias `prime`), `kimi` (Kimi Code CLI, alias `kimi-code`). Omit `provider` to use the harness the user selected on the Agents dashboard.

        **Models & reasoning effort** are harness- and model-specific and change over time. Fetch the live catalog (every provider's models and which reasoning-effort levels each accepts) from `GET /provider-models`. Some models accept no reasoning control. `pi`, `opencode` and `prime-agent` also expose models routed through OpenRouter and llmgateway (ids like `openrouter:anthropic/claude-sonnet-4.5`).

        **Conversations:** a sandbox runs many conversations in parallel, each with its own history. Set `new: true` to start a fresh conversation, or `conversationId` to continue a specific one; omit both to continue the sandbox's most-recently-active conversation. The response returns the `conversationId` this prompt ran in. Conversations run concurrently up to a per-sandbox limit that scales with the sandbox's memory; beyond it, prompts queue.
      required: [provider, prompt]
      properties:
        provider:
          type: string
          enum: [codex, claude-code, claude, pi, opencode, prime-agent, prime, kimi, kimi-code]
        model:
          type: [string, 'null']
          description: Optional provider model id from `GET /provider-models`. Omit to use the model selected for that harness on the Agents dashboard. Unknown explicit ids are currently forwarded rather than rejected by request validation.
          examples: [gpt-5.6-terra, claude-sonnet-5, 'openrouter:anthropic/claude-sonnet-4.5']
        reasoningEffort:
          type: [string, 'null']
          description: Optional reasoning/thinking level (e.g. `none`, `low`, `medium`, `high`, `xhigh`, `max`). Which levels a given model accepts is listed per model in `GET /provider-models`; some models accept none.
          examples: [high]
        fast:
          type: [boolean, 'null']
          description: Optional. `true` runs this prompt in fast mode. The model stays the same and gives output faster. The provider bills fast mode at its higher fast rate. Omit to use the choice saved on the Agents dashboard for that model. `false` forces standard speed. Only models with `fastMode` set to `true` in `GET /provider-models` accept `true`. Other models return 400 `fast_mode_not_supported`.
          examples: [true]
        new:
          type: boolean
          description: Start a NEW conversation on the sandbox (runs in parallel with any existing ones) instead of continuing the most-recently-active one. Mutually exclusive with `conversationId`.
          examples: [true]
        conversationId:
          type: [string, 'null']
          description: Continue a specific conversation by id (as returned by a previous prompt). Omit (and omit `new`) to continue the sandbox's most-recently-active conversation.
          format: uuid
        prompt:
          type: string
          minLength: 1
          description: Natural-language task for the sandbox, including repo, preview, or browser-use instructions.
      examples:
        - provider: codex
          model: gpt-5.4
          reasoningEffort: medium
          prompt: Work on the selected repo, run tests, fix failures, commit the result, and report any hosted preview URL.
        - provider: claude
          new: true
          prompt: Start a second, independent task on the auth module while the first keeps running.
    SteerRequest:
      type: object
      description: |
        A message for a turn that is ALREADY RUNNING. The agent takes it into account and keeps what it was doing, instead of queueing behind the turn (`POST /prompt`) or stopping it (`POST /interrupt`).

        **Conversations:** omit `conversation` to steer the sandbox's most-recently-active conversation, exactly like `POST /prompt` chooses one. Pass a `conversation` id to steer a specific one while the others keep running.

        The response's `native` says how the harness took it. See [Integrated agents](/integrated-agents).
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          description: The extra instruction for the running turn.
        conversation:
          type: [string, 'null']
          description: Conversation id to steer. Omit to steer the sandbox's most-recently-active conversation.
          format: uuid
      examples:
        - message: Also write /home/user/steered.txt containing the word STEERED, then finish.
        - conversation: 8f1c2b7a-3d4e-4f5a-9b0c-1d2e3f4a5b6c
          message: Skip the integration tests, unit tests are enough.
    SteerResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessBase'
        - type: object
          required: [id, conversationId, promptId, native, status]
          properties:
            type:
              type: string
              const: prompt.steered
            id:
              type: string
              description: Sandbox id.
            conversationId:
              type: string
              description: The conversation whose running turn was steered.
            promptId:
              type: string
              description: Id of the steer record. It appears in `GET /events` as a `steer` event; it is not a prompt run and has no lifecycle to poll.
            native:
              type: boolean
              description: >-
                `true` when the harness accepted the message into the turn that was already running, so nothing was interrupted. `false` when Boat interrupted that turn and immediately continued the SAME conversation with the instruction, which keeps the harness session and all of its memory but may repeat a little of the work in flight.
            mode:
              type: string
              enum: [native, fallback, late]
              description: >-
                How the message was delivered. `native` and `fallback` mirror the `native` field; `late` means the turn finished between the request and its delivery, so the message ran as an ordinary new turn on the conversation. A steer reported `native` here can settle as `native-continued` on the `steer` event: the harness accepted it but its turn ended without acting on it, so Boat continued it immediately as its own turn on the same session. Read the event for the settled mode.
            status:
              type: string
              enum: [steered]
    RepoSelectionRequest:
      type: object
      required: [repositoryId]
      description: Idempotently selects a repository for future sandboxes. If the repository is already selected, the API updates its base branch instead of returning a conflict.
      properties:
        repositoryId:
          type: string
          description: Internal repository `databaseId` returned by `GET /repos`.
        baseBranch:
          type: string
          default: main
      examples:
        - repositoryId: repo_org_123
          baseBranch: dev
    SecretsUpdateRequest:
      type: object
      description: Full replacement for the sandbox secret setup. Omitted `envContents` or `secretFiles` are treated as empty values, and successful updates are pushed to active sandboxes.
      properties:
        envContents:
          type: string
          description: Full .env-style content to sync into sandboxes. Send the complete desired file contents, not a patch.
        secretFiles:
          type: array
          description: Full list of secret files to keep configured. Send existing files again if they should remain.
          items:
            $ref: '#/components/schemas/SecretFile'
      examples:
        - envContents: "OPENAI_API_KEY=sk-...\nDATABASE_URL=postgres://..."
          secretFiles:
            - path: .config/service-account.json
              contents: '{"type":"service_account"}'
    SandboxEnvironmentVersionSummary:
      type: object
      required: [id, versionNumber, sandboxCount, createdAt]
      description: An immutable snapshot of an environment's config. Editing an environment mints a new version; sandboxes stay pinned to the version they were created on until upgraded.
      properties:
        id:
          type: string
          format: uuid
        versionNumber:
          type: integer
          description: Monotonically increasing per environment; version 1 is the first.
        sandboxCount:
          type: integer
          description: Number of the caller's active sandboxes currently pinned to this version.
        createdAt:
          type: string
          format: date-time
    SandboxEnvironment:
      type: object
      required: [id, name, isDefault, latestVersionId, safeForThirdParties, passGithub, passSecrets, passSandboxCredentials, passAgentsCredentials, envContents, secretFiles, versions]
      description: A named sandbox environment. All flags/contents reflect the latest version.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          examples: [base, customer-demos]
        isDefault:
          type: boolean
          description: Exactly one environment is the default; sandboxes created without an `environment` name use it.
        latestVersionId:
          type: [string, 'null']
          format: uuid
        latestVersionNumber:
          type: integer
          description: Number of the latest version, 0 when there is none.
          examples: [3]
        safetyAnsweredAt:
          type: [string, 'null']
          format: date-time
          description: When the owner last answered whether this environment is safe for third parties, or null if never asked.
        safeForThirdParties:
          type: boolean
          description: When true the environment passes nothing to a sandbox (repos, secrets, and all credentials withheld), overriding the fine-grained flags below. Use for sandboxes handed to third parties.
        passGithub:
          type: boolean
          description: Attach the environment's GitHub repositories and the GitHub token (so `gh` and pushes work). Ignored when `safeForThirdParties` is true.
        passSecrets:
          type: boolean
          description: Attach the environment's env variables and secret files. Ignored when `safeForThirdParties` is true.
        passSandboxCredentials:
          type: boolean
          description: Attach the sandbox's own service/preview credentials. Ignored when `safeForThirdParties` is true.
        passAgentsCredentials:
          type: boolean
          description: Attach agent-provider credentials configured on the Agents page. Ignored when `safeForThirdParties` is true.
        envContents:
          type: string
          description: The latest version's .env-style content. Treat as sensitive.
        secretFiles:
          type: array
          items:
            $ref: '#/components/schemas/SecretFile'
        selectedRepositories:
          type: array
          description: Repositories attached to the latest version, with base branch and setup script.
          items:
            $ref: '#/components/schemas/SelectedRepository'
        versions:
          type: array
          items:
            $ref: '#/components/schemas/SandboxEnvironmentVersionSummary'
    SandboxEnvironmentListResponse:
      type: object
      required: [environments]
      properties:
        ok:
          type: boolean
          const: true
        type:
          type: string
          const: environments.list
        environments:
          type: array
          items:
            $ref: '#/components/schemas/SandboxEnvironment'
    SandboxEnvironmentResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        environment:
          oneOf:
            - $ref: '#/components/schemas/SandboxEnvironment'
            - type: 'null'
    CreateSandboxEnvironmentRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 64
          pattern: '^[a-zA-Z0-9._-]+$'
          description: Unique environment name. Letters, numbers, dot, dash, underscore; max 64 chars.
          examples: [customer-demos]
    UpdateSandboxEnvironmentRequest:
      type: object
      description: Rename, set-default, and/or edit flags and contents. Any flag or content change mints a new immutable version; existing sandboxes are not touched until you call upgrade.
      properties:
        name:
          type: string
          description: New environment name.
        isDefault:
          type: boolean
          description: Set to true to make this the default environment (clears the flag on the previous default).
        safeForThirdParties: { type: boolean }
        passGithub: { type: boolean }
        passSecrets: { type: boolean }
        passSandboxCredentials: { type: boolean }
        passAgentsCredentials: { type: boolean }
        envContents:
          type: string
          description: Full .env-style content for the new version.
        secretFiles:
          type: array
          items:
            $ref: '#/components/schemas/SecretFile'
        repositories:
          type: array
          description: Full replacement of the version's repository selection. Each item selects one repository by its internal `databaseId` (from `GET /repos`).
          items:
            type: object
            required: [repositoryId]
            properties:
              repositoryId:
                type: string
                description: Internal repository databaseId.
              baseBranch:
                type: string
                default: main
              setupScript:
                type: string
              setupBlocking:
                type: boolean
    UpgradeSandboxEnvironmentRequest:
      type: object
      description: Repoint active sandboxes to the environment's latest version, scrubbing any owner secrets the new version drops and hot-pushing the new config.
      properties:
        agentIds:
          type: array
          items:
            type: string
          description: Restrict the upgrade to these sandbox (agent) ids. Omit to upgrade all of the caller's active sandboxes that are on an older version of this environment.
    UpgradeSandboxEnvironmentResponse:
      type: object
      required: [success, upgraded, failed]
      properties:
        success:
          type: boolean
        upgraded:
          type: integer
        upgradedLive:
          type: integer
          description: Running sandboxes that received the new configuration now.
        upgradedStopped:
          type: integer
          description: Stopped sandboxes moved to the latest version; they pick it up when they next resume.
        failed:
          type: integer
        latestVersionId:
          type: string
          description: Id of the version the sandboxes were moved to.
    EnvironmentItemChangeResponse:
      type: object
      description: >-
        Result of a granular environment change. Every change mints a new immutable
        version holding just that delta; existing sandboxes stay pinned until upgraded.
      required: [success]
      properties:
        success:
          type: boolean
        versionId:
          type: string
          description: >-
            Id of the newly minted environment version. This is a version id, not the
            environment's own id: the environment id you passed in the path is unchanged.
        versionNumber:
          type: integer
    SshKeyRequest:
      type: object
      required: [key]
      properties:
        key:
          type: string
          description: Public SSH key in OpenSSH format. Private keys are rejected.
          examples: [ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA... user@host]
    DesktopRequest:
      type: object
      additionalProperties: true
      description: Optional desktop/VNC setup options used by the Boat dashboard and CLI. Most callers send an empty body.
      properties:
        publicAccess:
          type: boolean
          default: false
          description: For `?vnc=1`, return a noVNC URL that does not require an access token.
    HostPortRequest:
      type: object
      required: [port]
