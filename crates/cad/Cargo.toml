[package]
name = "cad"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "CAD Lab's core: typed part.v1 and assembly.v1 documents built on SolidCraft's Truck-based kernel crates (pinned), with checks (valid solids, interference, mass properties) and STEP, 3MF and glTF exports."

[dependencies]
# SolidCraft (MIT OR Apache-2.0), pinned to one commit; see docs/cad-lab/README.md.
solidcraft-engine = { git = "https://github.com/bherbruck/solidcraft", rev = "229de1484ce7c4df3c28df5e5c111078ca9e53a3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# 3MF packages with the assembly tree (the version SolidCraft's io already uses).
zip = { version = "3", default-features = false, features = ["deflate"] }
# The collision bake (#11657): hull checks and the distance-grid format.
physics = { path = "../physics" }
glam = "0.30.10"
lab-kit = { path = "../lab-kit" }

[dev-dependencies]
# The URDF round trip reads what `urdf` writes the way Robot Lab does.
robot-description = { path = "../robot-description" }
tempfile = "3"

[lints]
workspace = true
