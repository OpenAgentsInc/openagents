[package]
name = "capability"
version.workspace = true
edition = "2024"
rust-version = "1.95"
description = "The capability manifest contract: inert registry discovery, host-owned trust, and bounded probes."
publish = false

[dependencies]
atif = { path = "../atif" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
supervise = { path = "../supervise" }
tokio = { version = "1", features = ["io-util", "process", "rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
