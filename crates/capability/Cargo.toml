[package]
name = "capability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The capability manifest contract: inert registry discovery, host-owned trust, and bounded probes."
publish.workspace = true

[dependencies]
user-home = { path = "../user-home" }
atif = { path = "../atif" }
nostr = { path = "../nostr" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
supervise = { path = "../supervise" }
tokio = { version = "1", features = ["io-util", "process", "rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
openagents-workspace-hack = { version = "0.1" }
