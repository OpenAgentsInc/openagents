[package]
name = "chat-home"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Portable chat homes, continuation links, and bounded conversation context."

[features]
ui = ["dep:rust-native"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secret-screen = { path = "../secret-screen" }
rust-native = { path = "../rust-native", default-features = false, optional = true }

[lints]
workspace = true
