[package]
name = "claude_agent_sdk"
description = "Rust port of the Claude Agent SDK wire protocol: drives the Claude Code CLI over stream-json and its control protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "MIT"
repository = "https://github.com/OpenAgentsInc/openagents"
keywords = ["claude", "ai", "agent", "sdk", "anthropic"]
categories = ["development-tools", "api-bindings"]

[dependencies]
tokio = { version = "1", features = ["process", "io-util", "sync", "rt-multi-thread", "macros", "time"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
which = "8"

[lints]
workspace = true
