[package]
name = "coder-access"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Host-wide Coder device enrollment and scoped access rights over private Nostr artifacts."

[features]
default = ["host"]
host = ["coder-connect/host"]

[[bin]]
name = "coder-access"
required-features = ["host"]

[dependencies]
base64 = "0.22"
sha2 = "0.10"
coder-connect = { path = "../coder-connect", default-features = false }
nostr = { path = "../nostr" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secp256k1 = { version = "0.31.1", features = ["rand"] }

# The relay clients. A browser build keeps the protocol, studio, and review
# shapes without them.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nostr-transport = { path = "../nostr-transport" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

# Owner-only state on Windows, where there are no mode bits.
[target.'cfg(windows)'.dependencies]
private-fs = { path = "../private-fs" }

[dev-dependencies]
nostr = { path = "../nostr", features = ["test-invoice"] }
tempfile = "3"
futures-util = "0.3"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["net", "sync", "process"] }

[lints]
workspace = true
