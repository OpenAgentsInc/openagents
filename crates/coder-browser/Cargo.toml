[package]
name = "coder-browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Browser client for explicitly admitted host terminals."
[dependencies]
coder-access = { path = "../coder-access", default-features = false }
coder-host-wire = { path = "../coder-host-wire" }
coder-pty = { path = "../coder-pty", default-features = false }
coder-reach = { path = "../coder-reach" }
nostr = { path = "../nostr" }
secp256k1 = { version = "0.31.1", features = ["rand"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util"] }
futures-util = "0.3"
[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen = "0.2.128"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "Event"] }
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
[lints]
workspace = true
