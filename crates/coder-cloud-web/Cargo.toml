[package]
name = "coder-cloud-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Browser privacy lifecycle for the admitted Coder Cloud workspace."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-util = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["AbortController", "AbortSignal", "Document", "Element", "Event", "EventTarget", "Headers", "HtmlInputElement", "HtmlTextAreaElement", "Node", "NodeList", "ReadableStream", "ReadableStreamDefaultReader", "ReferrerPolicy", "Request", "RequestCache", "RequestCredentials", "RequestInit", "RequestMode", "RequestRedirect", "Response", "Window"] }

[lints]
workspace = true
