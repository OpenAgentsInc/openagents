[package]
name = "coder-cloud"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Durable remote Coder jobs and explicitly selected cloud execution."

[dependencies]
openagents-sdk = { path = "../openagents-sdk" }
user-home = { path = "../user-home" }
atif = { path = "../atif" }
# The project's selected environment version a new job pins (ENV-06).
coder-environment = { path = "../coder-environment" }
coder-access = { path = "../coder-access", default-features = false }
coder-host = { path = "../coder-host", default-features = false }
libc = "0.2"
sha2 = "0.10"
secret-screen = { path = "../secret-screen" }
coder-engine-status = { path = "../coder-engine-status" }
microcoder-loop = { path = "../microcoder-loop" }
boat = { path = "../boat" }
# `chat work --on archil`: one Archil sandbox per issue (#12136).
archil = { path = "../archil" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "macros", "rt", "process", "io-util"] }

[target.'cfg(unix)'.dependencies]
supervise = { path = "../supervise" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
