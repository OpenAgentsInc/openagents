[package]
name = "coder-cloud"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Durable remote Coder jobs and explicitly selected cloud execution."

[dependencies]
atif = { path = "../atif" }
coder-access = { path = "../coder-access", default-features = false }
coder-host = { path = "../coder-host", default-features = false }
libc = "0.2"
sha2 = "0.10"
secret-screen = { path = "../secret-screen" }
boat = { path = "../boat" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "macros", "rt", "process", "io-util"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
