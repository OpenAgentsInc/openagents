[package]
name = "coder-cloud"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Durable remote Coder jobs and explicitly selected cloud execution."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "macros", "rt"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
