[package]
name = "coder-components-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Rust browser controllers for the Coder component catalog and local demo."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
coder-ui = { path = "../coder-ui" }
coder-demo-ui = { path = "../coder-demo-ui" }
rust-native = { path = "../rust-native" }
rust-native-web = { path = "../rust-native-web", features = ["browser"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.128"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "DomRect", "FocusOptions", "HtmlElement", "HtmlInputElement", "HtmlTextAreaElement", "HtmlSelectElement", "Event", "EventTarget", "InputEvent", "KeyboardEvent", "CompositionEvent", "ClipboardEvent", "DataTransfer", "MouseEvent", "WheelEvent", "Blob", "BlobPropertyBag", "Url", "Performance", "Selection", "Range", "Node", "NodeList", "DomTokenList", "Location", "UrlSearchParams", "console"] }

[lints]
workspace = true
