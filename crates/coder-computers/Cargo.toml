[package]
name = "coder-computers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Coder's Computers screens: host status, enrollment, access, and activity as Rust Native projections."

[features]
default = ["live"]
# The live service over the resident host client.
live = ["dep:coder-host", "dep:tokio", "dep:futures-util"]
# Start or adopt hosts over the system ssh binary. Desktop and terminal
# clients only; the mobile library leaves it off.
ssh = ["live", "dep:coder-ssh"]

[dependencies]
openagents-chat = { path = "../openagents-chat" }
coder-access = { path = "../coder-access", default-features = false }
# Local QR rendering only; no host store.
coder-connect = { path = "../coder-connect", default-features = false, features = ["qr"] }
coder-host = { path = "../coder-host", default-features = false, optional = true }
# A window of file chunks in flight at once over one link.
futures-util = { version = "0.3", optional = true }
coder-link = { path = "../coder-link" }
coder-ssh = { path = "../coder-ssh", optional = true }
coder-reach = { path = "../coder-reach" }
coder-ui = { path = "../coder-ui" }
# The terminal screen's emulator.
coder-vt = { path = "../coder-vt" }
nostr = { path = "../nostr" }
rust-native = { path = "../rust-native" }
secp256k1 = { version = "0.31.1", features = ["rand"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"], optional = true }

[dev-dependencies]
# Connect a computer: a fake computer answering the enroll ALPN on loopback
# iroh, and the `coder-host:` layout its test codes are read from.
openagents-connect = { path = "../openagents-connect" }
base64 = "0.22"
# The live acceptance test serves a real host on the synthetic relay and
# drives the SSH path through coder-ssh's fake ssh harness.
coder-host = { path = "../coder-host" }
coder-terminal = { path = "../coder-terminal" }
futures-util = "0.3"
libc = "0.2"
sha2 = "0.10"
tempfile = "3"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
crossterm = "0.29"
ratatui = "0.30"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }

[lints]
workspace = true

[[example]]
name = "terminal"
required-features = ["ssh"]

[[test]]
name = "live"
required-features = ["ssh"]

[[test]]
name = "edits"
required-features = ["ssh"]
