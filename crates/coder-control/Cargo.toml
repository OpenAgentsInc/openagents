[package]
name = "coder-control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Scoped authenticated Nostr control of the durable local task owner."

[features]
default = ["host"]
host = ["dep:coder", "dep:libc"]

[[bin]]
name = "coder-control"
path = "src/main.rs"
required-features = ["host"]

[dependencies]
coder = { path = "../coder", optional = true }
nostr = { path = "../nostr" }
nostr-transport = { path = "../nostr-transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = { version = "0.2", optional = true }
secp256k1 = { version = "0.31.1", features = ["rand"] }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
futures-util = "0.3"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }

[lints]
workspace = true
