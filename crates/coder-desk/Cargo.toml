# The desk client. One crate defines the desk protocol and speaks it, with a
# backend per desk, so a caller names a verb and never a compositor.
[package]
name = "coder-desk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The desk protocol and its client, with a native and a Hyprland backend."

[lints]
workspace = true

[dependencies]
# The shared bind table, which the Hyprland backend reads to turn a `key`
# on a launcher chord into the launcher's command.
coder-binds = { path = "../coder-binds" }
# The desk protocol's frames: the verbs, the replies, and the rows.
serde = { version = "1", features = ["derive"] }
# The native protocol's frames, and the Hyprland backend's answers.
serde_json = "1"
# An async caller asks over a blocking socket on the blocking pool.
tokio = { version = "1", features = ["rt"] }
# The fake desk's socket directory, under the `test-support` feature.
tempfile = { version = "3", optional = true }

[features]
# The fakes a caller's tests run against. A caller adds the feature to its
# dev-dependencies, so nothing a release builds holds them.
test-support = ["dep:tempfile"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
