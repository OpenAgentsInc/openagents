[package]
name = "coder-environment-setup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Dedicated environment setup sessions: an agent drafts and revises a repository recipe on its own setup computer, with pinned inputs, named credentials, identified commands, and complete evidence."

[dependencies]
coder-cloud = { path = "../coder-cloud" }
coder-environment = { path = "../coder-environment" }
coder-working-computer = { path = "../coder-working-computer" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
