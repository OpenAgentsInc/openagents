[package]
name = "coder-environment-verify"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Independent environment verification: boot a sealed output image on a fresh machine and run its frozen startup and application checks without repairing it."

[dependencies]
coder-environment = { path = "../coder-environment" }
coder-environment-build = { path = "../coder-environment-build" }
coder-environment-setup = { path = "../coder-environment-setup" }
coder-working-computer = { path = "../coder-working-computer" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
