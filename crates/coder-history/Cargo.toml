[package]
name = "coder-history"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Read-only, bounded saved-agent history and portable transcript pages."

[features]
default = ["host"]
host = ["dep:base64", "dep:libc"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = { version = "0.22", optional = true }
libc = { version = "0.2", optional = true }
sha2 = "0.11"

[lints]
workspace = true
