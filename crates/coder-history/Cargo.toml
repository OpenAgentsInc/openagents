[package]
name = "coder-history"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Read-only, bounded saved-agent history and portable transcript pages."

[features]
default = ["host"]
host = ["dep:base64", "dep:libc"]
# The host's mirror of OpenCode's SQLite session store (`opencode`).
opencode = ["host", "dep:rusqlite"]
# The host's mirror of the Devin CLI's SQLite session store (`devin`).
devin = ["host", "dep:rusqlite"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = { version = "0.22", optional = true }
libc = { version = "0.2", optional = true }
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
sha2 = "0.11"

[lints]
workspace = true
