[package]
name = "coder-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The resident Coder host: enrollment, reach, direct channels, terminals, and tasks behind one process, plus the client that connects to it."

[features]
default = ["host"]
# The resident host: `serve`, the `coder host` commands, the grant authority,
# and presence telemetry. A client build, such as the mobile library,
# disables default features and keeps `client`, `mailbox`, and `message`.
host = [
    "coder-access/host",
    "dep:openagents-chat",
    "dep:background",
    "coder-connect/host",
    "coder-history/host",
    "coder-pty/host",
    "dep:coder-vt",
    "dep:terminal-core",
    "tokio/signal",
    "tokio/process",
    "dep:libc",
    "dep:coder-service",
    "dep:tokio-rustls",
    "dep:security-framework",
    "dep:keyring",
    "dep:pylon",
]

# Private Verse placements are opt-in, never part of the default Coder build.
verse-assets = ["host", "dep:verse-private"]

[dependencies]
coder-host-wire = { path = "../coder-host-wire" }
openagents-chat = { path = "../openagents-chat", optional = true }
# Shared compute: `host share` and the pylon `serve` runs while it is on
# (host feature only).
pylon = { path = "../pylon", optional = true }
# The background rules runner `serve` starts (the disk cleanup monitor).
background = { path = "../background", optional = true }
# The `coder-host:` layout of a connect code's invitation.
base64 = "0.22"
coder-access = { path = "../coder-access", default-features = false }
# The plain spelling of a Windows path, which Git needs for a project.
coder-boundary = { path = "../coder-boundary" }
coder-connect = { path = "../coder-connect", default-features = false }
# Chat invitations handed out by tailnet admission (host feature only).
coder-history = { path = "../coder-history", default-features = false }
coder-link = { path = "../coder-link" }
coder-pty = { path = "../coder-pty", default-features = false }
# Claude Code's own sign-in status, read inside this computer (BYO-02).
coder-engine-status = { path = "../coder-engine-status" }
# Each terminal's authoritative emulator (host feature only).
coder-vt = { path = "../coder-vt", optional = true }
# The shell-integration hooks a terminal's shell starts with (host feature
# only).
terminal-core = { path = "../terminal-core", optional = true }
# The host root's one generation counter, shared with the service launcher.
coder-service = { path = "../coder-service", optional = true }
libc = { version = "0.2", optional = true }
# The owner's private Verse placements a paired phone asks for (opt-in
# verse-assets feature; docs/verse/private-assets.md).
verse-private = { path = "../verse-private", optional = true }
# The iroh endpoint (enroll and reach ALPNs) and connect codes, for the host
# and the client; the local control protocol and the key source are the
# host's.
openagents-connect = { path = "../openagents-connect" }
coder-reach = { path = "../coder-reach" }
nostr = { path = "../nostr" }
nostr-transport = { path = "../nostr-transport" }
secp256k1 = { version = "0.31.1", features = ["rand"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
# WebSocket direct channels: the host's listener and the client's dialer.
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# TLS for `wss` hints: the client's test-only roots and the host's
# certificate checks, with the ring provider the graph already uses.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# The host's TLS-terminating WebSocket listener.
tokio-rustls = { version = "0.26", default-features = false, optional = true }

# The macOS keychain key source: the same crate and version iroh's TLS
# verifier already brings in, so the graph gains nothing new.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7", optional = true }

# The Linux keychain key source: the freedesktop Secret Service (GNOME
# Keyring, KWallet, KeePassXC) over D-Bus, through `keyring`'s pure-Rust
# zbus store; reviewed in docs/coder/design/2026-09-29-auto-pairing.md.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=4.2.0", optional = true }

# The Windows control pipe (`control/windows.rs`): its DACL and the peer's
# token user. The Windows keychain key source: generic credentials in the
# Credential Manager. Owner-only state files, where Unix has modes.
[target.'cfg(windows)'.dependencies]
private-fs = { path = "../private-fs" }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[dev-dependencies]
# The ready record test decodes with the host service's own reader.
coder-service = { path = "../coder-service" }
futures-util = "0.3"
nostr = { path = "../nostr", features = ["test-invoice"] }
tempfile = "3"

[[test]]
name = "cj"
required-features = ["host"]

[[test]]
name = "end_to_end"
required-features = ["host"]

[[test]]
name = "serve"
required-features = ["host"]

[[test]]
name = "websocket"
required-features = ["host"]

[[test]]
name = "wss"
required-features = ["host"]

[[test]]
name = "headless"
required-features = ["host"]

[[test]]
name = "iroh"
required-features = ["host"]

[[test]]
name = "nearby"
required-features = ["host"]

[[test]]
name = "control"
required-features = ["host"]

[[test]]
name = "adopt"
required-features = ["host"]

[[test]]
name = "threads"
required-features = ["host"]

[[test]]
name = "idle"
required-features = ["host"]

[lints]
workspace = true
