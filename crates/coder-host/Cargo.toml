[package]
name = "coder-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The resident Coder host: enrollment, reach, direct channels, terminals, and tasks behind one process, plus the client that connects to it."

[features]
default = ["host"]
# The resident host: `serve`, the `coder host` commands, the grant authority,
# and presence telemetry. A client build, such as the mobile library,
# disables default features and keeps `client`, `mailbox`, and `message`.
host = ["coder-access/host", "coder-pty/host", "tokio/signal", "dep:libc"]

[dependencies]
coder-access = { path = "../coder-access", default-features = false }
coder-connect = { path = "../coder-connect", default-features = false }
coder-link = { path = "../coder-link" }
coder-pty = { path = "../coder-pty", default-features = false }
libc = { version = "0.2", optional = true }
coder-reach = { path = "../coder-reach" }
nostr = { path = "../nostr" }
nostr-transport = { path = "../nostr-transport" }
secp256k1 = { version = "0.31.1", features = ["rand"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
# The ready record test decodes with the host service's own reader.
coder-service = { path = "../coder-service" }
futures-util = "0.3"
tempfile = "3"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }

[[test]]
name = "end_to_end"
required-features = ["host"]

[[test]]
name = "serve"
required-features = ["host"]

[lints]
workspace = true
