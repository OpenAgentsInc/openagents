[package]
name = "coder-labor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "A recoverable free Nostr buyer-provider labor order."

[dependencies]
coder = { path = "../coder" }
coder-boundary = { path = "../coder-boundary" }
nostr = { path = "../nostr" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
secp256k1 = { version = "0.31.1", features = ["rand"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
