[package]
name = "coder-lite"
version = "0.1.0"
# The vendored markdown engine (src/markdown, ported from xAI grok-build) is
# written against edition 2024 — chiefly let-chains. Held here rather than in
# [workspace.package] so no other crate's edition moves.
edition = "2024"
license.workspace = true
repository.workspace = true

[[bin]]
name = "coder-lite"
path = "src/main.rs"

[dependencies]
# The capable runtime lives next door and stays there: tools (`shell`,
# `skill`, `openagents`, `capability`, `delegate`) with their refusal patterns
# and output ceiling, the grok-derived composer, lanes, the live model
# catalog, metering, and thread revocation. Taken as a library rather than
# copied, so there is one implementation of each and coder-lite cannot drift
# from it. What coder-lite owns is the front: the frame, the palette, the
# spinner, the system prompt, and the session loop in `interactive.rs`.
openagents-cli = { path = "../openagents-cli" }
tokio = { version = "1", features = ["full"] }
crossterm = { version = "0.28", features = ["event-stream"] }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
futures = "0.3"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
reqwest = { workspace = true }

# Streaming markdown engine (src/markdown), ported from xAI grok-build.
# Versions match grok-build's workspace pins.
anstyle = "1.0"
anstyle-lossy = "1.1.4"
anstyle-syntect = "1.0.4"
html-escape = "0.2"
linkify = "0.10"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html", "simd"] }
supports-color = "3.0"
syntect = "5.3"
textwrap = "0.16"
two-face = { version = "0.4", default-features = false, features = ["syntect-fancy"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"
url = "2"

[dev-dependencies]
pretty_assertions = "1"
