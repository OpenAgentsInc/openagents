[package]
name = "coder-mobile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Rust-owned read-only Coder mobile conversation state and native bridge."

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
terminal-gfx = { path = "../terminal-gfx", default-features = false, features = ["fonts"] }
coder-access = { path = "../coder-access", default-features = false }
coder-computers = { path = "../coder-computers" }
coder-connect = { path = "../coder-connect", default-features = false }
coder-history = { path = "../coder-history", default-features = false }
coder-ui = { path = "../coder-ui" }
coder-vt = { path = "../coder-vt" }
# `ffi` exports Rust Native transcript layout to the iOS host.
rust-native = { path = "../rust-native", features = ["ffi", "shaping"] }
# `xp-host` is Verse's read-only NIP-XP reader: levels over players' heads.
# `studio-host` is Everglade's live studio worker, which the phone's studio
# panels drive over a paired computer's link (`src/studio_panel.rs`).
verse = { path = "../verse", default-features = false, features = ["xp-host", "studio-host", "imported-surface", "remote-chamber"] }
# The chamber's shared controls and abilities, and the engine scene the
# chamber content is placed around.
verse-world = { path = "../verse-world", default-features = false }
verse-engine = { path = "../verse-engine" }
# The paired computer's NIP-HOST link and its errors, for the studio panels.
coder-host = { path = "../coder-host", default-features = false }
nostr = { path = "../nostr" }
# The Agent Studio panels read seats and decisions with the app's shared
# attention and question models.
openagents-chat-app = { path = "../openagents-chat-app" }
# The device side of push wakes only; the gateway service is not linked.
push-gateway = { path = "../push-gateway", default-features = false, features = ["client"] }
serde ={ version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# A computer's screenshot, decoded and brought down to the HUD's grid (#11185).
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
secp256k1 = { version = "0.31.1", features = ["rand"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.22.4"
libc = "0.2"
ndk-sys = "0.6"

[dev-dependencies]
# The machine-talk guard over the copy in this crate's sources (#11031).
oa-copy = { path = "../oa-copy" }
tempfile = "3"
coder-connect = { path = "../coder-connect", features = ["host"] }
# The Computers acceptance run serves a real host on a local relay.
coder-host = { path = "../coder-host" }
# The studio acceptance run's scratch host: the task inbox and its studio
# coordinator.
coder = { path = "../coder" }
coder-history = { path = "../coder-history", features = ["host"] }
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "sync"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# The chamber tests play an in-process chamber host.
verse = { path = "../verse", default-features = false, features = ["chamber-loopback"] }

[lints]
workspace = true
