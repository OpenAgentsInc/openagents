[package]
name = "coder-mobile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Rust-owned read-only Coder mobile conversation state and native bridge."

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
coder-connect = { path = "../coder-connect", default-features = false }
coder-history = { path = "../coder-history", default-features = false }
coder-ui = { path = "../coder-ui" }
rust-native = { path = "../rust-native" }
verse = { path = "../verse", default-features = false }
nostr = { path = "../nostr" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
secp256k1 = { version = "0.31.1", features = ["rand"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"] }

[dev-dependencies]
tempfile = "3"
coder-connect = { path = "../coder-connect", features = ["host"] }
coder-history = { path = "../coder-history", features = ["host"] }
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "sync"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }

[lints]
workspace = true
