[package]
name = "coder-new"
default-run = "coder-new"
version = "1.0.0-rc.5"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The Coder terminal with model, tool, and subagent plugins."

[dependencies]
coder-cloud = { path = "../coder-cloud" }
atif = { path = "../atif" }
brainstorm-client = { path = "../brainstorm-client" }
getrandom = "0.3"
nostr = { path = "../nostr" }
coder = { path = "../coder" }
coder-delegate = { path = "../coder-delegate" }
coder-engine-status = { path = "../coder-engine-status" }
secret-screen = { path = "../secret-screen" }
code-highlight = { path = "../code-highlight", features = ["grok"] }
coder-terminal = { path = "../coder-terminal" }
coder-ui = { path = "../coder-ui" }
coder-demo-ui = { path = "../coder-demo-ui" }
acp-client = { path = "../acp-client" }
coder-boundary = { path = "../coder-boundary" }
codex-transport = { path = "../codex-transport" }
jev = { path = "../jev" }
microcoder-loop = { path = "../microcoder-loop" }
supervise = { path = "../supervise" }
model-access = { path = "../model-access" }
openrouter = { path = "../openrouter" }
openagents-login = { path = "../openagents-login" }
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache", "unstable-rendered-line-info"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "process", "io-util", "signal"] }
unicode-segmentation = "1"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
background = { path = "../background" }

[dev-dependencies]
sha2 = "0.10"
tempfile = "3"

[lints]
workspace = true
