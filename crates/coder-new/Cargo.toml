[package]
name = "coder-new"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "A Ratatui mockup of the new Coder terminal."

[dependencies]
code-highlight = { path = "../code-highlight", features = ["grok"] }
coder-terminal = { path = "../coder-terminal" }
coder-ui = { path = "../coder-ui" }
acp-client = { path = "../acp-client" }
coder-boundary = { path = "../coder-boundary" }
codex-transport = { path = "../codex-transport" }
jev = { path = "../jev" }
microcoder-loop = { path = "../microcoder-loop" }
supervise = { path = "../supervise" }
model-access = { path = "../model-access" }
openrouter = { path = "../openrouter" }
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache", "unstable-rendered-line-info"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "process", "io-util"] }
unicode-segmentation = "1"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
