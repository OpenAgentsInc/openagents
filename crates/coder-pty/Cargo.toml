[package]
name = "coder-pty"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Host terminal sessions over a real PTY with bounded replay, and the portable client state that applies their frames (NIP-TERM)."

[features]
default = ["host"]
# The host half: real PTYs (a Unix PTY, or a Windows pseudoconsole),
# process groups or job objects, and the replay ring. Elsewhere it compiles
# to a host that refuses every open. A client build (mobile, a renderer)
# disables default features and keeps the portable wire types and client
# state.
host = ["dep:coder-boundary", "dep:libc", "dep:supervise", "dep:windows-sys"]

[dependencies]
sha2 = "0.10"
base64 = "0.22"
# A terminal stays out of the places macOS guards with a privacy prompt.
coder-boundary = { path = "../coder-boundary", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }
supervise = { path = "../supervise", default-features = false, optional = true }

# The Windows host: ConPTY, the job object a terminal's tree runs in, and
# the system random source.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
coder-vt = { path = "../coder-vt" }

# One test runs a terminal inside the write boundary, through `Wrap`.
[target.'cfg(unix)'.dev-dependencies]
coder-boundary = { path = "../coder-boundary" }

# Checks that a terminal's process is gone.
[target.'cfg(windows)'.dev-dependencies]
supervise = { path = "../supervise" }

[[test]]
name = "pty"
required-features = ["host"]

[[test]]
name = "windows"
required-features = ["host"]

[lints]
workspace = true
