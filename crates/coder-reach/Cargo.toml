[package]
name = "coder-reach"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "NIP-REACH owner host directory, host presence, reachability hints, direct channels, and placement."

[dependencies]
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
nostr = { path = "../nostr" }
secp256k1 = { version = "0.31.1", features = ["rand"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tokio = { version = "1", features = ["io-util", "time"] }
url = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["WebSocket", "BinaryType", "MessageEvent", "Event"] }
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
futures-util = "0.3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }

[lints]
workspace = true
