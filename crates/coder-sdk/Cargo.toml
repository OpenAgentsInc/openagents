[package]
name = "coder-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Coder's harness-independent hook layer: normalized events, hook outcomes and how they combine, support tiers per backend, the hook set digest, and a scripted backend that replays a recorded session (docs/coder/design/coder-sdk.md)."

[dependencies]
user-home = { path = "../user-home" }
# The `Session` capability matrix and its hook tiers.
coder-delegate = { path = "../coder-delegate" }
# The ACP backend's permission asks (#11508).
acp-client = { path = "../acp-client" }
# The adapter digest the hook set joins (`route_contract::recipe`).
route-contract = { path = "../route-contract" }
# The Claude Code backend (#11496), and the tool server's MCP shapes and
# its in-process form (#11501).
claude_agent_sdk = { path = "../claude_agent_sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The `decide` tool asks the Decisions API, and records through hook-log.
jev = { path = "../jev" }
hook-log = { path = "../hook-log" }
futures = "0.3"
# Plugin hooks run Wasm guests on the plugin host, with receipts (#11499).
plugin = { path = "../plugin" }
tokio = { version = "1", features = ["rt", "io-util", "io-std", "sync", "macros", "process", "time"] }
# The folder holding an ACP agent's hook plugin or configuration (`acp::gate`).
tempfile = "3"

[[bin]]
name = "monitor-replay"
path = "src/bin/monitor_replay.rs"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "io-util"] }

[lints]
workspace = true
