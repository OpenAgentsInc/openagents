[package]
name = "coder-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The Coder host as a background service: launchd and systemd user units, trial updates with snapshot rollback, and the host descriptor."

[[bin]]
name = "coder-service"
path = "src/main.rs"

[dependencies]
libc = "0.2"
secp256k1 = "0.31.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
supervise = { path = "../supervise", default-features = false }

[dev-dependencies]
coder-access = { path = "../coder-access" }
tempfile = "3"

[lints]
workspace = true
