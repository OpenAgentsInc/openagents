[package]
name = "coder-setup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "`coder link`: make a computer a serving Coder host, list it in the owner directory, and enroll devices."

[dependencies]
coder-access = { path = "../coder-access" }
# The client device store the Computers screens use, so a linked machine and
# the desktop and terminal clients share one set of grants.
coder-computers = { path = "../coder-computers" }
# Invitation QR codes, rendered locally.
coder-connect = { path = "../coder-connect", default-features = false, features = ["qr"] }
coder-host = { path = "../coder-host" }
coder-reach = { path = "../coder-reach" }
# The staged bundle the host service should run.
coder-service = { path = "../coder-service" }
libc = "0.2"
nostr = { path = "../nostr" }
secp256k1 = { version = "0.31.1", features = ["rand"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }

# Owner-only key and certificate files on Windows, where there are no modes.
[target.'cfg(windows)'.dependencies]
private-fs = { path = "../private-fs" }

[dev-dependencies]
# The local test relay in coder-control's tests.
futures-util = "0.3"
tempfile = "3"
tokio-tungstenite = "0.30"

[lints]
workspace = true
