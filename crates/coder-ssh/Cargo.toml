[package]
name = "coder-ssh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Install, start or adopt, and reach a Coder host over the system ssh binary."

[dependencies]
libc = "0.2"
sha2 = "0.10"
supervise = { path = "../supervise", default-features = false }
tempfile = "3"

[lints]
workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
openagents-workspace-hack = { version = "0.1" }
