[package]
name = "coder-vt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "A small VT100/xterm terminal emulator: a character grid with colors, scroll regions, and the alternate screen, fed by NIP-TERM output."

[dependencies]
# The escape-sequence parser (Alacritty's state machine). Parsing only; the
# grid, modes, and replies are this crate's.
vte = { version = "0.15", default-features = false, features = ["std"] }
unicode-width = "0.2"
# The NIP-TERM snapshot records `snapshot` writes and restores, and the
# emulator seam `Authority` fills: the portable wire half only, without
# PTYs.
coder-pty = { path = "../coder-pty", default-features = false }
serde_json = "1"

# The authority tests run real PTYs through the host half.
[target.'cfg(unix)'.dev-dependencies]
coder-pty = { path = "../coder-pty", features = ["host"] }
tempfile = "3"

# The scrollback budget measurement compares DEFLATE against the encoded
# history records (#10692).
[dev-dependencies]
flate2 = "1"

[lints]
workspace = true
