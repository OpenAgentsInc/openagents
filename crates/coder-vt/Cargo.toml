[package]
name = "coder-vt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "A small VT100/xterm terminal emulator: a character grid with colors, scroll regions, and the alternate screen, fed by NIP-TERM output."

[dependencies]
# The escape-sequence parser (Alacritty's state machine). Parsing only; the
# grid, modes, and replies are this crate's.
vte = { version = "0.15", default-features = false, features = ["std"] }
unicode-width = "0.2"

[lints]
workspace = true
