[package]
name = "coder-working-computer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "A chat's working computer: per-turn checkpoints, restore, idle and absolute bounds, declared services, and separate stop facts."

[dependencies]
base64 = "0.22"
boat = { path = "../boat" }
coder-cloud = { path = "../coder-cloud" }
coder-environment = { path = "../coder-environment" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
