# ---------------------------------------------------------------------------
# capability.missing (#9960): the user asked for something a plugin could
# do, and none of the admitted ones does it ("There's no plugin for that
# yet", #10087; the route id keeps its name). Picked by code from the
# `capability` reading; the {capability} and {capability_line} slots come
# from an entry of the admitted-capability set, never from the message.
# ---------------------------------------------------------------------------

[[answer]]
id = "capability.missing"
version = 2
routes = ["capability.missing"]
records = true
when = "Picked by code: the user asks us to do or reach something that would take a plugin none of ours covers, and none is close"
text = "There's no plugin for that yet. Want to make one? Anyone can make a plugin and test it in the Gym, so everyone can see whether it helps."
sources = ["crates/coder/src/router/capability.rs", "docs/essays/2026-09-29-test-time-capabilities.md"]
followups = ["gym.what", "eval.credit.how"]

[[answer]]
id = "capability.missing_near"
version = 2
routes = ["capability.missing"]
records = true
when = "Picked by code: the user asks us to do or reach something that would take a plugin none of ours covers, and something we have is close to it"
text = "There's no plugin for that yet. The closest thing we have is {capability}: {capability_line} Want to make one? Anyone can make a plugin and test it in the Gym, so everyone can see whether it helps."
facts = { capability = "capability.name", capability_line = "capability.line" }
sources = ["crates/coder/src/router/capability.rs", "docs/essays/2026-09-29-test-time-capabilities.md"]
followups = ["gym.what", "eval.credit.how"]

# ---------------------------------------------------------------------------
# presentation.open (#10058): the user asked to open, show, or present one
# of our decks. Picked by code from the `deck` reading on a desktop turn;
# the {deck} and {decks} slots come from the decks the desktop app ships
# (`openagents_deck::decks()`), never from the message. The desktop opens
# the deck from the `open_presentation` offer beside the line.
# ---------------------------------------------------------------------------

[[answer]]
id = "presentation.open"
version = 1
routes = ["presentation.open"]
records = true
when = "Picked by code: the user asks to open, show, or present one of our decks on the desktop, and the deck reading names it"
text = "Opening {deck}."
facts = { deck = "deck.title" }
sources = ["crates/openagents-deck/src/catalog.rs", "crates/openagents-desktop/src/shell.rs"]

[[answer]]
id = "presentation.unknown"
version = 1
routes = ["presentation.open"]
records = true
when = "Picked by code: the user asks to open a deck on the desktop, and the deck reading names none of the decks we have"
text = "We can't find that deck. The decks we can open are {decks}."
facts = { decks = "deck.list" }
sources = ["crates/openagents-deck/src/catalog.rs"]

[[answer]]
id = "presentation.elsewhere"
version = 1
routes = ["presentation.open"]
records = true
when = "Picked by code: the user asks to open, show, or present a deck anywhere but the desktop app"
text = "Decks open in the OpenAgents desktop app, so we can't show one here."
sources = ["crates/openagents-desktop/src/shell.rs"]

# ---------------------------------------------------------------------------
# standing.rule (#10157): the user asked for something to keep happening on
# its own on their computer, or a change to such a background rule. Picked
# by code by surface: in a terminal, the computer compiles the message into
# a rule and shows it with its dry run beside this line; nothing is saved
# until the person confirms. Elsewhere, the line says where rules are made.
# ---------------------------------------------------------------------------

[[answer]]
id = "standing.rule"
version = 1
routes = ["standing.rule"]
records = true
when = "Picked by code: in a terminal, the user asks for something to keep happening on its own on this computer, or a change to such a background rule"
text = "Drafting a background rule for this computer. Nothing is saved until you confirm it."
sources = ["docs/background/2026-10-02-background-processes.md", "crates/background/src/compile.rs"]

[[answer]]
id = "standing.elsewhere"
version = 1
routes = ["standing.rule"]
records = true
when = "Picked by code: the user asks for something to keep happening on its own on a computer, anywhere but a terminal on that computer"
text = "Background rules run on your computer, so we set them up there: ask in OpenAgents Terminal, or run `openagents background add --message` with what you want. You see the rule and what it would do before anything is saved."
sources = ["docs/background/2026-10-02-background-processes.md", "crates/openagents-cli/src/background.rs"]

# ---------------------------------------------------------------------------
# refuse, warn, and clarify
# ---------------------------------------------------------------------------

[[answer]]
id = "refuse.secret_shared"
version = 1
routes = ["refuse"]
when = "The message contains what looks like a private key, password, or wallet recovery words"
text = "That looks like a private key, password, or recovery words. We won't use it, and we suggest rotating that key or moving those funds."

[[answer]]
id = "warn.secret_shared"
version = 1
routes = ["refuse"]
when = "The message may contain a private key, password, or recovery words, but it is not clear"
text = "That may be a private key, password, or recovery words. If it is, we suggest rotating that key or moving those funds."

[[answer]]
id = "refuse.asks_for_secret"
version = 1
routes = ["refuse"]
when = "The user asks for someone else's keys, passwords, or recovery words, or asks us to get into an account that is not theirs"
text = "We can't help get anyone's keys, passwords, or recovery words, and we'll never ask for yours."

[[answer]]
id = "refuse.harmful"
version = 1
routes = ["refuse"]
when = "A request to help hurt people, steal, or do something clearly harmful or illegal"
text = "We can't help with that. We're glad to help with something else."

[[answer]]
id = "clarify.generic"
version = 2
routes = ["clarify"]
when = "The message is too ambiguous to act on, and one short question would settle what the user means"
stem = "Quick question:"
generic_end = " what would you like us to do?"

# ---------------------------------------------------------------------------
# Openers: a first line above the model's reply (T3)
# ---------------------------------------------------------------------------

[[opener]]
id = "explain"
text = "We'll look that up for you."
when = "A request to explain how a concept, tool, protocol, or piece of code works"

[[opener]]
id = "compare"
text = "Here's how the options compare."
when = "A question asking us to choose between two or more named tools, libraries, or approaches"

[[opener]]
id = "plan"
text = "Here's a plan."
when = "A request to plan a multi-step feature, migration, or project"

[[opener]]
id = "draft"
text = "Here's a draft."
when = "A request to write a message, document, or short piece of text in the chat"

[[opener]]
id = "summary"
text = "Here's the short version."
when = "A request to summarize or condense text the user gave"

[[opener]]
id = "sorry"
text = "Sorry about that."
when = "A complaint that our previous answer was wrong or unhelpful"
