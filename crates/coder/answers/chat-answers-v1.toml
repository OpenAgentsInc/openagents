examples = ["what is the gym for", "what do people do in the gym"]
text = "The Gym is where plugins for Coder, our coding agent, get tested. The same tests run with a plugin and without it, so you can see whether it makes Coder better. Trainers add their results to the Gym and check each other's results to earn XP. The Gym in the Verse shows the results on a board."
