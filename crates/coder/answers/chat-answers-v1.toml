# The OpenAgents chat's answer bank: chat-answers-v1.
#
# Every line a user can read in this file is user-facing copy. The owner or
# a named delegate approves text changes (see the chat router design,
# docs/coder/design/2026-09-28-chat-router.md, "The answer bank").
#
# Rules the lint in crates/coder/src/router/bank.rs enforces:
# - Plural voice: "we", "us", "our"; never "I", "me", or "my" in text,
#   stem, or generic_end.
# - No button or control is named: the app shows the action itself, and an
#   entry's offer carries its label.
# - Facts are {slots} filled from the worker's configuration (facts maps a
#   slot to a known config key). A slot the worker cannot fill makes the
#   entry ineligible for the turn, never a blank.
# - Every meta, wallet, and account entry cites sources, and every source
#   exists in the repository.
# - Advice to do something carries the exact page as an https:// link or
#   the one command to run in `backticks`, or an offer that does it; the
#   rare exception says why in unlinked (2026-10-09).
# - At most 600 characters; true before any work happens.
# - A text change bumps version; ids are never reused.
# - when is written for Jev, as a description of the messages the entry
#   answers, with what it does not cover when a neighbor is close.
# - followups name entries with a chip: the question a suggestion chip
#   under the answer sends when tapped.

bank = "chat-answers-v1"

# ---------------------------------------------------------------------------
# meta: kicking the tires
# ---------------------------------------------------------------------------

[[answer]]
id = "meta.who"
version = 4
routes = ["meta"]
place = "away"
when = "The user asks who or what we are, what OpenAgents is, what this assistant or app is, or asks us to introduce ourselves; not who built us, which AI models power the chat, which products or apps we offer, or a detailed question about what we can do"
examples = ["What is OpenAgents?", "whats openagents", "who r u", "introduce yourself pls", "who am i talking to right now"]
text = "We are OpenAgents. We're an open network of agents you work with through one conversation: on the web, in your terminal, on desktop, and on your phone. We answer questions, explain things, and help you plan and write, and each message goes to whatever in the network serves it best: one of many models, a specialist agent, or a computer. When work needs a computer, like changing a repository or running commands, Coder, our coding agent, does it on a computer you connect. Plugins add new abilities, like handing work to Claude Code or Codex."
chip = "What is OpenAgents?"
sources = ["crates/openagents-mobile/src/basic_coder.rs", "docs/deployment/chat-worker.md", "crates/coder-new/README.md"]
followups = ["meta.model", "meta.codebase", "meta.plugins"]

