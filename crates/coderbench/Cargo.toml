[package]
name = "coderbench"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Task manifests and recorded goldens for whole Coder episodes."
publish = false

[dependencies]
atif = { path = "../atif" }
# For `gate::Verdict`. A grade here answers with the same three values a
# gate there does, and one vocabulary is the point: a second enum spelling
# `unverifiable` would drift from this one.
gym = { path = "../gym" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
