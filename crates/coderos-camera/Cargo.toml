# The CoderOS camera daemon: one owner of the camera node that serves the
# camera circle, a recording, and hand tracking at once. Carried from the
# private Coder repository on 2026-09-28 by the owner's decision to
# publish it.
[package]
name = "coderos-camera"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "One owner of the camera on CoderOS: a loopback node, a recording, and hand landmarks on a socket."
publish.workspace = true

[[bin]]
name = "coderos-camera"
path = "src/main.rs"

[dependencies]
# The landmarker, the pinned model, and the line the hands socket carries.
coder-hands = { path = "../coder-hands" }
# The control socket speaks one JSON object a line, the way the desk
# protocol does, and the grant the host writes is JSON too.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A `SIGTERM` or `SIGINT` sets the flag the main loop shuts down on.
signal-hook = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
# The camera is read with V4L2 and decoded once, MJPEG through
# `jpeg-decoder`.
jpeg-decoder = "0.3"
v4l = "0.14"

[lints]
workspace = true
