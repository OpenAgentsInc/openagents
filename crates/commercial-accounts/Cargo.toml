[package]
name = "commercial-accounts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Explicit commercial attribution over native tenancy and retail accounts."

[features]
default = []
merchant-commissions = ["dep:coder", "dep:openagents-x402", "dep:openagents-wallet", "dep:plugin", "dep:receipts", "dep:nostr"]

[dependencies]
tenancy = { path = "../tenancy" }
pay-ledger = { path = "../pay-ledger" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
coder = { path = "../coder", optional = true }
openagents-x402 = { path = "../x402", optional = true }
openagents-wallet = { path = "../wallet", optional = true }
nostr = { path = "../nostr", optional = true }
receipts = { path = "../receipts", optional = true }
plugin = { path = "../plugin", optional = true }

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.31", features = ["bundled"] }

[lints]
workspace = true
