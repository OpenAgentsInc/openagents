[package]
name = "computer-credentials"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Scoped computer credentials and immutable egress policies"

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "tokio", "http1"] }
base64 = "0.22"
crc32c = "0.6"
http = "1"
hmac = "0.12"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal", "fs"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = "1"

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net"] }

[lints]
workspace = true
