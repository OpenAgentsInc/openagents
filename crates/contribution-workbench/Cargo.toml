[package]
name = "contribution-workbench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
host = ["dep:openagents-chat", "dep:knowledge", "dep:pay-ledger", "dep:terminal-core"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
route-contract = { path = "../route-contract" }
workbench = { path = "../workbench" }
nostr = { path = "../nostr" }
xp-ledger = { path = "../xp-ledger" }
openagents-chat = { path = "../openagents-chat", optional = true }
knowledge = { path = "../knowledge", optional = true }
pay-ledger = { path = "../pay-ledger", optional = true }
terminal-core = { path = "../terminal-core", optional = true }

[dev-dependencies]
secp256k1 = "0.31.1"
xp-ledger = { path = "../xp-ledger", features = ["fixtures"] }
tempfile = "3"

[lints]
workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
openagents-workspace-hack = { version = "0.1" }
