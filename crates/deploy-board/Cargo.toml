[package]
name = "deploy-board"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The Grid's build billboard: NIP-DEPLOY statuses and livehost pointers folded into two lanes, and the board's line art and lettering."

[dependencies]
nostr = { path = "../nostr" }
serde_json = "1"

[dev-dependencies]
oa-copy = { path = "../oa-copy" }

[lints]
workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
openagents-workspace-hack = { version = "0.1" }
