[package]
name = "design-lab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Design Lab: a zoomable board of every version of every mobile app screen, read from the screenshots in git history, and the board.v1 Lab kind"

[dependencies]
lab-kit = { path = "../lab-kit" }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

[lints]
workspace = true
