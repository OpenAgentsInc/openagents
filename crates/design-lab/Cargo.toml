[package]
name = "design-lab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Design Lab: a zoomable board of every screen of the current phone app, captured from apps/openagents by its demo tour, the board.v1 Lab kind, and mock screens with revision notes (mock.v1)"

[dependencies]
ab_glyph = "0.2.32"
lab-kit = { path = "../lab-kit" }
png = "0.18.1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

[lints]
workspace = true
