[package]
name = "discovery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The public discovery surface: the bundled documentation corpus, the machine-readable document set, and the well-known indexes every origin serves — shared between the gateway's HTTP routes and oak's MCP documentation tools."
publish.workspace = true

[dependencies]
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lints]
workspace = true
