[package]
name = "env-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "NIP-ENV allocator: signed leases, exact materialization, admitted attachments, and accounted cleanup."

[dependencies]
nostr = { path = "../nostr" }
workspace-host = { path = "../workspace-host" }
coordination-host = { path = "../coordination-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secp256k1 = { version = "0.31.1", features = ["rand"] }
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
coder-ssh = { path = "../coder-ssh" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
