[package]
name = "everglade-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Everglade in a browser: the Verse zone over WebGPU or WebGL2, from a same-origin pinned pack."

[lib]
crate-type = ["cdylib", "rlib"]

# Everything is browser-only; a native build of this crate is empty.
[target.'cfg(target_arch = "wasm32")'.dependencies]
verse = { path = "../verse", default-features = false, features = ["web"] }
wgpu = "29.0.4"
# The `wasm-bindgen` CLI that `scripts/build-everglade-web.sh` runs must be
# the version Cargo.lock resolves here; the script checks.
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1.7"
web-sys = { version = "0.3", features = [
    "AddEventListenerOptions",
    "CssStyleDeclaration",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlElement",
    "KeyboardEvent",
    "MouseEvent",
    "Node",
    "Performance",
    "PointerEvent",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "RequestCredentials",
    "RequestInit",
    "RequestRedirect",
    "Response",
    "WheelEvent",
    "Window",
    "console",
] }

[lints]
workspace = true
