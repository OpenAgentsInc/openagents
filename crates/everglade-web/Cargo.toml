[package]
name = "everglade-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Everglade in a browser: the Verse zone over WebGPU or WebGL2, from a same-origin pinned pack."

[lib]
crate-type = ["cdylib", "rlib"]

# Everything is browser-only; a native build of this crate is empty.
[target.'cfg(target_arch = "wasm32")'.dependencies]
coder-browser = { path = "../coder-browser" }
coder-ui = { path = "../coder-ui" }
coder-host-wire = { path = "../coder-host-wire" }
coder-pty = { path = "../coder-pty", default-features = false }
coder-access = { path = "../coder-access", default-features = false }
terminal-core = { path = "../terminal-core" }
terminal-gfx = { path = "../terminal-gfx", default-features = false }
secp256k1 = { version = "0.31.1", features = ["rand"] }
serde = { version = "1", features = ["derive"] }
gloo-timers = { version = "0.3", features = ["futures"] }
futures-util = "0.3"
verse = { path = "../verse", default-features = false, features = ["browser-chamber"] }
wgpu = "29.0.4"
# The Grid's presence: positions, the console's frame lines, and the clock.
verse-engine = { path = "../verse-engine" }
verse-world = { path = "../verse-world", features = ["reach-client"] }
verse-content = { path = "../verse-content" }
coder-reach = { path = "../coder-reach" }
glam = "0.30.10"
serde_json = "1"
web-time = "1.1.0"
# The browser display handle wgpu's WebGL2 backend needs on its instance.
raw-window-handle = "0.6"
# The `wasm-bindgen` CLI that `scripts/build-everglade-web.sh` runs must be
# the version Cargo.lock resolves here; the script checks.
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1.7"
# wgpu reports GPU validation errors through `log`; the page forwards
# warnings and errors to the browser console.
log = "0.4"
web-sys = { version = "0.3", features = [
    "AddEventListenerOptions",
    "AbortController",
    "AbortSignal",
    "CssStyleDeclaration",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlButtonElement",
    "Gamepad",
    "GamepadButton",
    "Navigator",
    "HtmlCanvasElement",
    "HtmlElement",
    "KeyboardEvent",
    "CompositionEvent",
    "InputEvent",
    "HtmlTextAreaElement",
    "Clipboard",
    "Navigator",
    "Location",
    "MouseEvent",
    "Node",
    "Performance",
    "PointerEvent",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "Request",
    "RequestCredentials",
    "RequestCache",
    "RequestInit",
    "RequestRedirect",
    "Response",
    "Storage",
    "WheelEvent",
    "Window",
    "console",
] }

[lints]
workspace = true
