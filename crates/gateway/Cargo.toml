[package]
name = "gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The keyed HTTP gateway in front of decision doors: authenticate, authorize, reserve quota, verify backend identity, forward bounded work, and record a receipt."
publish.workspace = true

[dependencies]
atif = { path = "../atif" }
gym = { path = "../gym", default-features = false }
# Paper Mono, the one typeface, for the pages this crate renders.
paper-mono = { path = "../paper-mono" }
commercial-accounts = { path = "../commercial-accounts" }
fs2 = "0.4"
libc = "0.2"
openagents-wallet = { path = "../wallet", default-features = false }
discovery = { path = "../discovery" }
jev = { path = "../jev" }
axum = { version = "0.8", features = ["multipart", "ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
hmac = "0.12.1"
nostr = { path = "../nostr" }
oa-auth = { path = "../oa-auth" }
inference = { path = "../inference" }
# Bring your own key on the inference API: who pays, and sealed keys.
model-access = { path = "../model-access" }
oa-seal = { path = "../oa-seal" }
zeroize = "1"
pay-ledger = { path = "../pay-ledger" }
# Pylon providers as inference upstreams: NIP-CJ jobs through its buyer.
pylon = { path = "../pylon" }
receipts = { path = "../receipts" }
retail-cloud = { path = "../retail-cloud" }
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
secp256k1 = { version = "0.31", features = ["rand"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tenancy = { path = "../tenancy" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
commercial-spend = { path = "../commercial-spend" }
hex = "0.4"
nostr = { path = "../nostr", features = ["test-invoice"] }
tempfile = "3"

[lints]
workspace = true
