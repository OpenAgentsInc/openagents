[package]
name = "gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The keyed HTTP gateway in front of decision doors: authenticate, authorize, reserve quota, verify backend identity, forward bounded work, and record a receipt."
publish.workspace = true

[dependencies]
discovery = { path = "../discovery" }
jev = { path = "../jev" }
axum = "0.8"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
hmac = "0.12.1"
nostr = { path = "../nostr" }
receipts = { path = "../receipts" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
secp256k1 = { version = "0.31", features = ["rand"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tenancy = { path = "../tenancy" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
