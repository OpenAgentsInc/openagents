[package]
name = "grid-foreman"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The Grid Foreman: where its giant robot stands on the Grid, its tag and status line, and the host that walks it."

[features]
default = []
# The host: `grid-foreman serve`, its patrol, and its relay session.
host = ["dep:verse", "dep:glam", "dep:reqwest", "dep:serde_json", "dep:deploy-board", "dep:pylons-view"]

[[bin]]
name = "grid-foreman"
path = "src/main.rs"
required-features = ["host"]

[dependencies]
verse = { path = "../verse", default-features = false, optional = true }
glam = { version = "0.30.10", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
serde_json = { version = "1", optional = true }
deploy-board = { path = "../deploy-board", optional = true }
pylons-view = { path = "../pylons-view", optional = true }

[dev-dependencies]
oa-copy = { path = "../oa-copy" }
pylons-view = { path = "../pylons-view" }

[lints]
workspace = true
