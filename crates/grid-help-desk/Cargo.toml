[package]
name = "grid-help-desk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The Grid's help desk: where it stands, when a visitor is in reach, and its models, with the launch film's MacBook and iPhone."

[dependencies]
glam = "0.30.10"
sha2 = "0.10"
verse-engine = { path = "../verse-engine" }

[dev-dependencies]
# The pinned device art is compiled from the Blender export in a test.
gltf = { version = "=1.4.1", default-features = false, features = ["import", "utils", "names"] }
# Admits the desk's pack with its screens decoded.
verse-engine = { path = "../verse-engine", features = ["asset-io"] }
oa-copy = { path = "../oa-copy" }
pylons-view = { path = "../pylons-view" }

[lints]
workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
openagents-workspace-hack = { version = "0.1" }
