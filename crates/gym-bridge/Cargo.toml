[package]
name = "gym-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Explicitly admitted private Gym boards and bounded local recipe launches."

[features]
default = ["host"]
host = ["dep:gym", "dep:supervise", "dep:libc"]

[[bin]]
name = "gym-bridge"
required-features = ["host"]

[dependencies]
coder-connect = { path = "../coder-connect", default-features = false }
nostr = { path = "../nostr" }
nostr-transport = { path = "../nostr-transport" }
gym = { path = "../gym", optional = true }
supervise = { path = "../supervise", optional = true }
libc = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
secp256k1 = { version = "0.31.1", features = ["rand"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
futures-util = "0.3"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["net"] }

[lints]
workspace = true
