[package]
name = "gym"
version.workspace = true
edition = "2024"
rust-version = "1.95"
description = "The measurement and control plane for decision models: pinned suites, a receipt-chained result store, digested gates, and the loop that decides what to keep."
publish = false

[features]
default = []
# The `gym` terminal and its dependencies.
tui = ["dep:ratatui", "dep:crossterm", "dep:coder-terminal"]

[dependencies]
indexmap = { version = "2", features = ["serde"] }
jev = { path = "../jev" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"

# The terminal's design system — the amber ladder, the hairline frame, and
# the rails — is `coder-terminal`'s, not a second copy of it.
coder-terminal = { path = "../coder-terminal", optional = true }
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "gym"
path = "src/bin/gym.rs"

[[bin]]
name = "gym-terminal"
path = "src/bin/gym_terminal.rs"
required-features = ["tui"]

[lints]
workspace = true
