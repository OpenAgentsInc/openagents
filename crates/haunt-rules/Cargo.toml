[package]
name = "haunt-rules"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The Haunted House as data: the haunt.v1 house document, its checks, add and remove area, the text description and map an agent reads, collision, and triggers. Pure; builds for wasm."

[[bin]]
name = "haunt"
path = "src/main.rs"

[dependencies]
haunt-assets = { path = "../haunt-assets" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
oa-copy = { path = "../oa-copy" }

[lints]
workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
openagents-workspace-hack = { version = "0.1" }
