[package]
name = "icecream-rules"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The Ice Cream Man's rules: the seeded Airbnb, the Ice Cream Man's state machine, tools and ammo, health, hiding, keys, the front-door escape and the run card, as a deterministic fixed-step simulation."

[dependencies]
# The game state crosses the boundary to the swappable logic module
# (`crates/icecream-logic`) and back as JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
openagents-workspace-hack = { version = "0.1" }
