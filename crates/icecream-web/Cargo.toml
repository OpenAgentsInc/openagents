[package]
name = "icecream-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The Ice Cream Man in a browser: the Airbnb run drawn with WebGL2, with Roblox-style controls and camera."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
icecream-rules = { path = "../icecream-rules" }
icecream-zone = { path = "../icecream-zone" }
toon-mesh = { path = "../toon-mesh" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glam = "0.30.10"

# The page itself is browser-only; natively only the meshes, the camera,
# the options and the words are built, for their tests.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# The `wasm-bindgen` CLI that `scripts/build-icecream-web.sh` runs must be
# the version Cargo.lock resolves here; the script checks.
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4"
live-web = { path = "../live-web" }
js-sys = "0.3"
console_error_panic_hook = "0.1.7"
web-sys = { version = "0.3", features = [
    "AddEventListenerOptions",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioContext",
    "AudioContextState",
    "AudioDestinationNode",
    "AudioNode",
    "AudioParam",
    "AudioScheduledSourceNode",
    "BaseAudioContext",
    "BiquadFilterNode",
    "BiquadFilterType",
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventSource",
    "EventTarget",
    "GainNode",
    "HtmlButtonElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "KeyboardEvent",
    "Location",
    "MediaQueryList",
    "MessageEvent",
    "MouseEvent",
    "Node",
    "OscillatorNode",
    "OscillatorType",
    "Performance",
    "PointerEvent",
    "RequestInit",
    "Response",
    "Storage",
    "WebGl2RenderingContext",
    "WebGlBuffer",
    "WebGlProgram",
    "WebGlShader",
    "WebGlUniformLocation",
    "WebGlVertexArrayObject",
    "UiEvent",
    "WheelEvent",
    "Window",
    "console",
] }

[dev-dependencies]
oa-copy = { path = "../oa-copy" }

[lints]
workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
openagents-workspace-hack = { version = "0.1" }
