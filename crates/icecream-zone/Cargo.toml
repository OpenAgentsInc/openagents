[package]
name = "icecream-zone"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The Ice Cream Man's hosted zone as data: content-addressed mesh chunks, the zone index, the first-play budget, and the plan for what to load first, next, and again after a deploy."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
openagents-workspace-hack = { version = "0.1" }
