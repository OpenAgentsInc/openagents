[package]
name = "jev-hosted"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "One way every Jev caller finds Jev: a local TypeSafe key, else OpenAgents' hosted decision service over NIP-CJ, else no Jev with the reason."
publish.workspace = true

[dependencies]
atif = { path = "../atif" }
jev = { path = "../jev" }
# Who pays: the person's own keys under BYOK `mine` (#10176).
model-access = { path = "../model-access" }
nostr = { path = "../nostr" }
nostr-transport = { path = "../nostr-transport" }
# Our decision API over HTTPS (#11225).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
secp256k1 = { version = "0.31.1", features = ["rand"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
axum = "0.8"
futures-util = "0.3"
gateway = { path = "../gateway" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"

[lints]
workspace = true
