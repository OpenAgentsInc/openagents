[package]
name = "kev"
version.workspace = true
edition = "2024"
rust-version = "1.94"
description = "Rust port of the kev decision model: packed prefill, block-causal question isolation, pointer readout, TypeSafe-compatible /v1/systemone."
publish = false

[features]
# The `kev-serve` binary and its dependencies.
serve = ["dep:axum", "dep:tower-http", "dep:tokio"]

[dependencies]
candle-core = "0.11"
candle-nn = "0.11"
indexmap = { version = "2", features = ["serde"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
tokenizers = "0.23"

axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }

[dev-dependencies]
jev = { path = "../jev", features = ["blocking"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full", "test-util"] }

[[bin]]
name = "kev-serve"
path = "src/bin/kev_serve.rs"
required-features = ["serve"]

[lints]
workspace = true
