[package]
name = "kiln-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Persistent native Kiln execution and Foreman WORK objective publication"

[dependencies]
grid-foreman = { path = "../grid-foreman" }
kiln = { path = "../kiln" }
kiln-git = { path = "../kiln-git" }
nostr = { path = "../nostr" }
pylon = { path = "../pylon" }
work-host = { path = "../work-host" }
workspace-host = { path = "../workspace-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secp256k1 = { version = "0.31.1", features = ["rand"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
