[package]
name = "kiln-runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Runs Kiln's remote cargo jobs: a NIP-CJ worker that applies a page's changed files at a commit and runs cargo test inside coder-boundary"
publish.workspace = true

[dependencies]
coder-boundary = { path = "../coder-boundary" }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
kiln = { path = "../kiln" }
livehost = { path = "../livehost" }
libc = "0.2"
nostr = { path = "../nostr" }
nostr-transport = { path = "../nostr-transport" }
secp256k1 = { version = "0.31.1", features = ["rand"] }
serde_json = "1.0.151"
serde = { version = "1", features = ["derive"] }
supervise = { path = "../supervise", default-features = false }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

[lints]
workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
openagents-workspace-hack = { version = "0.1" }
