[package]
name = "kiln-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Small WASI tools Kiln runs in browser workers: ls, cat, grep, write, patch, a Rhai interpreter, and a test runner"
publish.workspace = true

# Built for `wasm32-wasip1` by `scripts/build-kiln.sh`. Each binary is plain
# `std` Rust, so the native build and its tests run too.
[dependencies]
rhai = { version = "1.26.1", default-features = false, features = ["std", "sync"] }

[lints]
workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
openagents-workspace-hack = { version = "0.1" }
