<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiln</title>
<style>
  :root { color-scheme: dark; --bg: #0b0a08; --panel: #14120e; --line: #2b261d; --text: #e9e2d0; --dim: #9a907b; --amber: #f2b33d; --red: #ff6b5b; --green: #7bd88f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  header { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 18px; color: var(--amber); letter-spacing: 0.06em; }
  .sub { color: var(--dim); font-size: 12px; }
  main { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 0; height: calc(100vh - 56px); }
  aside { border-right: 1px solid var(--line); padding: 14px; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
  textarea, input[type=text] { width: 100%; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 8px; font: inherit; }
  textarea { height: 110px; resize: vertical; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; font: inherit; cursor: pointer; }
  button.primary { background: var(--amber); color: #1a1407; border-color: var(--amber); font-weight: 600; }
  label { color: var(--dim); font-size: 12px; }
  h2 { margin: 6px 0 0; font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; }
  #files { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px; min-height: 60px; white-space: pre; }
  #files .file { cursor: pointer; } #files .file:hover { color: var(--amber); } #files .dir { color: var(--dim); }
  #viewer { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px; white-space: pre-wrap; min-height: 60px; max-height: 260px; overflow: auto; margin: 0; }
  .hidden { display: none; }
  #metrics { white-space: pre-wrap; color: var(--dim); font-size: 12px; }
  #log { padding: 14px 18px; overflow: auto; }
  #log div { white-space: pre-wrap; margin: 2px 0; }
  #log .task { color: var(--amber); font-weight: 600; margin-top: 10px; }
  #log .step { color: var(--amber); margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
  #log .thought { color: var(--text); font-style: italic; }
  #log .cmd { color: var(--amber); }
  #log .out { color: var(--dim); padding-left: 14px; border-left: 2px solid var(--line); }
  #log .err { color: var(--red); padding-left: 14px; border-left: 2px solid var(--red); }
  #log .error { color: var(--red); }
  #log .done { color: var(--green); font-weight: 600; }
  #log .info { color: var(--dim); font-size: 12px; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; height: auto; } aside { border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1>KILN</h1>
  <span class="sub">A coding agent in this tab: WASI tools in workers, an OPFS workspace, inference on Pylons.</span>
  <span class="sub">Agent key <span id="key">…</span></span>
  <span class="sub" id="env">loading…</span>
  <a class="sub" href="review.html" target="_blank" style="color: var(--amber)">Patches</a>
</header>
<main>
  <aside>
    <textarea id="task" placeholder="What should the agent build?">Write fib.rhai with a function fib(n) that returns the nth Fibonacci number, write fib_test.rhai that tests fib(0), fib(1) and fib(10) == 55, and make the tests pass.</textarea>
    <div class="row">
      <button id="run" class="primary">Run agent</button>
      <button id="stop">Stop</button>
      <button id="selftest">Sandbox self-test</button>
      <button id="reset">Clear workspace</button>
    </div>
    <h2>Rust crate from the repository</h2>
    <div class="row">
      <input type="text" id="slice" value="crates/memory-stream" style="flex: 2">
      <input type="text" id="ref" value="main" style="flex: 1">
      <button id="load">Load</button>
    </div>
    <h2>Self-edit <span class="sub">build <span id="build">…</span></span></h2>
    <div class="row">
      <button id="self-load">Load Kiln's source</button>
      <button id="self-publish">Publish Kiln</button>
      <button id="self-revert">Revert to last good</button>
      <button id="self-reset">Reset to the site's build</button>
    </div>
    <div class="sub">Admin key <span id="admin-key">…</span>: the runner publishes only for keys on its admin list.</div>
    <div class="sub hidden" id="update"></div>
    <button id="reload-now" class="hidden">Reload into it now</button>
    <label>Test runner key (hex or npub) <input type="text" id="runner" placeholder="from kiln-runner"></label>
    <label>Model <input type="text" id="model" value="deepseek-v4.1-flash"></label>
    <label><input type="checkbox" id="fallback" checked> Fall back to any Pylon when no pylon serves this model</label>
    <label>Relay <input type="text" id="relay" value="wss://relay.openagents.com"></label>
    <h2>Workspace <span id="usage" class="sub"></span></h2>
    <div id="files"></div>
    <h2 id="viewer-name">File</h2>
    <pre id="viewer"></pre>
    <h2>Measurements</h2>
    <div id="metrics"></div>
  </aside>
  <section id="log"></section>
</main>
<script type="module">
  import init, { start } from './pkg/kiln.js';
  await init();
  start();
</script>
</body>
</html>
