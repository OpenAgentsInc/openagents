<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiln Patches</title>
<style>
  :root { color-scheme: dark; --bg: #0b0a08; --panel: #14120e; --line: #2b261d; --text: #e9e2d0; --dim: #9a907b; --amber: #f2b33d; --red: #ff6b5b; --green: #7bd88f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 16px; }
  h1 { margin: 0 0 4px; font-size: 18px; color: var(--amber); }
  #status { color: var(--dim); font-size: 12px; margin-bottom: 14px; }
  a { color: var(--amber); }
  details.patch { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin: 10px 0; padding: 10px 12px; }
  summary { cursor: pointer; display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline; }
  .subject { font-weight: 600; }
  .meta { color: var(--dim); font-size: 12px; }
  .badge { font-size: 11px; border-radius: 10px; padding: 1px 8px; border: 1px solid var(--line); }
  .badge.pass { color: var(--green); border-color: var(--green); }
  .badge.fail { color: var(--red); border-color: var(--red); }
  .badge.merged { color: #b78cff; border-color: #b78cff; }
  .badge.open { color: var(--amber); border-color: var(--amber); }
  .check, .comment { margin: 10px 0; padding: 8px 10px; border-left: 2px solid var(--green); white-space: pre-wrap; }
  .comment { border-color: var(--dim); }
  .warn { color: var(--red); margin: 8px 0; }
  pre.diff { overflow-x: auto; background: #0f0d0a; border: 1px solid var(--line); border-radius: 6px; padding: 8px; margin: 10px 0 6px; }
  pre.diff div { white-space: pre; }
  .add { color: var(--green); } .del { color: var(--red); } .hunk { color: #6fb3ff; } .h { color: var(--amber); }
</style>
</head>
<body>
<h1 id="title">Patches</h1>
<div id="status">Loading…</div>
<div><a href="./">Back to Kiln</a></div>
<div id="patches"></div>
<script type="module">
  import init, { start_review } from './pkg/kiln.js';
  await init();
  start_review();
</script>
</body>
</html>
