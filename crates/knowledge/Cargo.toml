[package]
name = "knowledge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The shared knowledge base: entries, the lint, and lexical and embedding search."
publish.workspace = true

[dependencies]
workbench = { path = "../workbench" }
openui-lang = { path = "../openui-lang" }
codex-transport = { path = "../codex-transport" }
# The codebase index file is gzip-compressed.
flate2 = "1"
openrouter = { path = "../openrouter" }
# Who pays for an embedding (BYOK, #10176).
model-access = { path = "../model-access" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xp-ledger = { path = "../xp-ledger" }
sha2 = "0.10"
nostr = { path = "../nostr" }
secp256k1 = "0.31.1"

# Windows: the system's random source, and owner-only bundle files.
[target.'cfg(windows)'.dependencies]
getrandom = "0.3"
private-fs = { path = "../private-fs" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "net", "io-util"] }

[lints]
workspace = true
