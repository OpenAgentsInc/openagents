[package]
name = "knowledge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The shared knowledge base: entries, the lint, and lexical and embedding search."
publish.workspace = true

[dependencies]
openrouter = { path = "../openrouter" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
nostr = { path = "../nostr" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
