[package]
name = "lab-jobs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Lab job placement, scoped workers, and bounded execution"

[features]
schema = ["dep:schemars", "lab-kit/schema"]
cloud = ["dep:openagents-sdk"]

[dependencies]
base64 = "0.22"
fs2 = "0.4"
libc = "0.2"
lab-kit = { path = "../lab-kit" }
lab-store = { path = "../lab-store" }
openagents-sdk = { path = "../openagents-sdk", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
axum = "0.8"
stateright = "0.31"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
