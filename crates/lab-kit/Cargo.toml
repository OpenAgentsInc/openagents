[package]
name = "lab-kit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The shared Lab contract: documents, versions, changes, jobs, notes, cards, and the LabKind trait"

# Pure: no IO, so it builds for every app (desktop, iOS, Android, wasm32) and
# for both the root workspace and apps/openagents.
[features]
schema = ["dep:schemars"]

[dependencies]
schemars = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
proptest = "1.11.0"

[lints]
workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
openagents-workspace-hack = { version = "0.1" }
