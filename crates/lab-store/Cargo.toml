[package]
name = "lab-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Space-scoped Lab storage with filesystem and PostgreSQL/Cloud Storage backends"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
fs2 = "0.4"
lab-kit = { path = "../lab-kit" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx-core = { version = "0.8.6", default-features = false, features = ["_rt-tokio", "_tls-rustls-ring-webpki", "json"] }
sqlx-postgres = { version = "0.8.6", default-features = false, features = ["json"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }

[dev-dependencies]
axum = "0.8"
stateright = "0.31"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

[lints]
workspace = true
