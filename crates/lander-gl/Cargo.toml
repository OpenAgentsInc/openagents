[package]
name = "lander-gl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The /lander4 first frame: a raw WebGL2 painter for the Grid floor, a GPUI-style button, and two words of Geist, inlined into the page as wasm."

[lib]
# cdylib for the page; rlib so the glyph test links on the host.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned to the CLI that `scripts/build-lander-gl.sh` runs.
# No std: the module brings its own allocator and an aborting panic
# handler (src/lib.rs), which keeps the formatting machinery out of it.
wasm-bindgen = { version = "=0.2.128", default-features = false }
js-sys = { version = "0.3", default-features = false }
ab_glyph_rasterizer = { version = "0.1.10", default-features = false, features = ["libm"] }
libm = "0.2"
web-sys = { version = "0.3", default-features = false, features = [
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "DomTokenList",
    "Element",
    "EventTarget",
    "HtmlCanvasElement",
    "MediaQueryList",
    "Performance",
    "WebGl2RenderingContext",
    "WebGlBuffer",
    "WebGlProgram",
    "WebGlShader",
    "WebGlTexture",
    "WebGlUniformLocation",
    "WebGlVertexArrayObject",
    "Window",
] }

[dev-dependencies]
# The glyph test shapes and outlines the two words from Geist SemiBold.
swash = "0.2.10"
ttf-parser = "0.25.1"
