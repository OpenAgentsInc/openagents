[package]
name = "lander5-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "/lander5's procedural background: two GLSL passes (a sky-view table and the Grid at twilight) and a tiny raw WebGL2 runner, built from Shader Skills (MIT)."

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Exports for running the Grid in a dedicated worker on an OffscreenCanvas
# (`start_worker`, `pause`, `scene_time`, `frame_times`), which /lander6
# hands over to; /lander5's build leaves them out.
worker = []

# The shaders and their minifier build natively, for the site that inlines
# them and for the tests; only the runner is browser-only.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# The `wasm-bindgen` CLI that `scripts/build-lander5-web.sh` runs must be
# the version Cargo.lock resolves here; the script checks.
wasm-bindgen = "0.2.128"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "DedicatedWorkerGlobalScope",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "MediaQueryList",
    "Node",
    "OffscreenCanvas",
    "Performance",
    "WebGl2RenderingContext",
    "WebGlFramebuffer",
    "WebGlProgram",
    "WebGlShader",
    "WebGlTexture",
    "WebGlUniformLocation",
    "Window",
] }

[lints]
workspace = true

[dependencies]

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
openagents-workspace-hack = { version = "0.1" }
