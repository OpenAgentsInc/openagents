[package]
name = "layertree-tee-lab"
version = "0.0.0"
edition = "2021"
publish = false
description = "Sandbox: LayerTree's off-chain tree and rules, enforced by a modelled TEE co-signer on today's Bitcoin. Research only; outside the default build."

# Its own workspace, so it never joins the monorepo build (the root
# Cargo.toml also lists it under `exclude`). See README.md.
[workspace]

[dependencies]
# Same version as the monorepo's Cargo.lock; it brings secp256k1 0.29.
bitcoin = { version = "=0.32.102", default-features = false, features = ["std", "rand-std"] }

# `layertree.events.v1` (the `events` module) only; the predicate stays
# dependency-light without it.
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "=1.0.151", optional = true }

# Opt-in GCP image-bound restart recovery; absent from the pure predicate.
aes-gcm = { version = "=0.10.3", optional = true, default-features = false, features = ["aes", "alloc"] }
base64 = { version = "=0.22.1", optional = true }
crc = { version = "=3.4.0", optional = true }
reqwest = { version = "=0.12.28", optional = true, default-features = false, features = ["blocking", "json", "rustls-tls"] }
zeroize = { version = "=1.9.0", optional = true }

# Opt-in read-only chain follower and public mirror transport.
nostr = { path = "../nostr", optional = true }
nostr-transport = { path = "../nostr-transport", optional = true }
tokio = { version = "1", features = ["rt", "net", "time"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }

futures-util = { version = "0.3", optional = true }
tokio-tungstenite = { version = "=0.30.0", optional = true }

[features]
# The local WebSocket relay acceptance fixture; never needed by the follower binary.
stage-attacks = ["follow-live"]
follow-relay-tests = ["follow-live", "dep:futures-util", "dep:tokio-tungstenite"]
events = ["dep:serde", "dep:serde_json"]
follow-live = ["events", "dep:base64", "dep:reqwest", "dep:nostr", "dep:nostr-transport", "dep:tokio", "dep:rustls", "dep:webpki-roots"]
gcp-sealing = ["events", "dep:aes-gcm", "dep:base64", "dep:crc", "dep:reqwest", "dep:zeroize"]
# The ignored bitcoind harness in tests/regtest.rs (#11781); run it with
# scripts/layertree-regtest.sh. Adds no dependencies.
regtest = ["events"]

[dev-dependencies]
# The tests use the events module.
layertree-tee-lab = { path = ".", features = ["events"] }
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
# Only for the opt-in cross-check against upstream's published vectors.
serde_json = "=1.0.151"
hex = "=0.4.3"

[[example]]
name = "attestation_probe"
required-features = ["events"]

[[example]]
name = "key_lifecycle_probe"
required-features = ["gcp-sealing"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[[bin]]
name = "layertree-follow"
path = "src/bin/layertree-follow.rs"
required-features = ["follow-live"]

[[bin]]
name = "layertree-stage"
path = "src/bin/layertree-stage.rs"
required-features = ["stage-attacks"]
