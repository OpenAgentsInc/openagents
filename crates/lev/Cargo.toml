[package]
name = "lev"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The System One contract answered by Apple's on-device foundation model: guided generation, seeded estimators, and a fitted calibration map."
publish.workspace = true

[features]
# The `lev-serve` binary and its dependencies.
serve = ["dep:axum", "dep:tokio", "dep:tower-http"]

[dependencies]
# The measurement side — the reliability table, the acceptance rules, the
# suites, and the result store — is the Gym's. Lev answers the contract; it
# does not score it, and the dependency runs one way and never back.
gym = { path = "../gym" }
jev = { path = "../jev" }
# The policy snapshot dates itself, and an HTTP date is a timestamp a person
# can read and a parser cannot misread. One small crate already in the tree.
httpdate = "1"

indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"

axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }

[[bin]]
name = "lev-serve"
path = "src/bin/lev_serve.rs"
required-features = ["serve"]

[[bin]]
name = "lev-measure"
path = "src/bin/lev_measure.rs"

[[bin]]
name = "lev-band"
path = "src/bin/lev_band.rs"

[[bin]]
name = "lev-adapter-check"
path = "src/bin/lev_adapter_check.rs"

[[bin]]
name = "lev-policy"
path = "src/bin/lev_policy.rs"

[[bin]]
name = "lev-seed-sweep"
path = "src/bin/lev_seed_sweep.rs"

[[bin]]
name = "lev-order-sweep"
path = "src/bin/lev_order_sweep.rs"

[[bin]]
name = "lev-calibration-sweep"
path = "src/bin/lev_calibration_sweep.rs"

[[bin]]
name = "lev-render"
path = "src/bin/lev_render.rs"

[lints]
workspace = true
