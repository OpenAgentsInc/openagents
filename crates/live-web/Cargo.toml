[package]
name = "live-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The browser half of a livehost zone: follow a tenant's channel, fetch objects by hash, ack applied versions, and count the bytes moved. Shared by The Ice Cream Man and The Haunted House."

[dependencies]
icecream-zone = { path = "../icecream-zone" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "EventSource",
    "MessageEvent",
    "Performance",
    "RequestInit",
    "Response",
    "Window",
    "console",
] }

[lints]
workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
openagents-workspace-hack = { version = "0.1" }
