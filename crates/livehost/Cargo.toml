[package]
name = "livehost"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A prototype of web deploys in seconds: a stable host that serves content-addressed manifests named by a signed Nostr pointer, with runtime templates, browser modules by hash, WebAssembly component handlers, and live reload."
publish.workspace = true

[dependencies]
anyhow = "1"
axum = "0.8"
brotli = { version = "8", default-features = false, features = ["std"] }
flate2 = "1"
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.3"
hex = "0.4"
nostr = { path = "../nostr" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30.0"
# Handlers are WebAssembly components (wasm32-wasip2). Apache-2.0 WITH
# LLVM-exception, already allowed in deny.toml for `plugin`.
wasmtime = "48.0.4"
wasmtime-wasi = "48.0.4"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
openagents-workspace-hack = { version = "0.1" }
