<!doctype html>
<html lang="en">
<head>
{{> layout-head.html }}
<title>{{ title }}</title>
</head>
<body>
  <main>
    <h1>{{ title }}</h1>
    <p class="tagline">{{ tagline }}</p>
    <ul>
      {{#each points}}<li><strong>{{ this.name }}</strong>: {{ this.detail }}</li>
      {{/each}}
    </ul>
    <p id="greet" data-pending>Loading the module.</p>
    <p data-bench="template">Template revision 0.</p>
    <p><a href="{{ livehost.base }}/hello?name=reader">Ask the handler</a></p>
  </main>
  <script type="module">
    const element = document.getElementById("greet");
    const { instance } = await WebAssembly.instantiateStreaming(fetch("{{module greet}}"));
    const { memory, greeting_ptr, greeting_len } = instance.exports;
    const at = greeting_ptr();
    element.textContent = new TextDecoder().decode(new Uint8Array(memory.buffer, at, greeting_len()));
    element.removeAttribute("data-pending");
  </script>
</body>
</html>
