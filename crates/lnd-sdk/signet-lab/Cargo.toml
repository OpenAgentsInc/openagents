[package]
name = "lnd-signet-lab"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
lnd-sdk = { path = "..", features = ["supervisor"] }
openagents-x402 = { path = "../../x402" }
openagents-wallet = { path = "../../wallet", default-features = false }
nostr = { path = "../../nostr" }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls-pemfile = "2"
base64 = "0.22"

tonic = { version = "=0.12.3", features = ["tls"] }
zeroize = "1"
pay-ledger = { path = "../../pay-ledger" }

[[bin]]
name = "lnd-signet-recovery"
path = "src/bin/recovery.rs"

[[bin]]
name = "lnd-signet-assets"
path = "src/bin/assets.rs"
