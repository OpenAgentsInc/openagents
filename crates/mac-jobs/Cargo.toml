[package]
name = "mac-jobs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Typed jobs a linked Mac runs for the account (#11223): the recipes, their allowlisted arguments, the steps each runs, and what the Mac reports it can do."

[dependencies]
# The job as an actor (#11253): definitions only, no database driver.
actors = { path = "../actors", default-features = false }
secret-screen = { path = "../secret-screen" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
# The job actor against a scratch PostgreSQL (ACTORS_TEST_DATABASE_URL).
actors = { path = "../actors" }
getrandom = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
