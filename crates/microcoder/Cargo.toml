[package]
name = "microcoder"
# The engine release version, shared with Coder and the OpenAgents CLI.
# The release scripts check this value before naming downloadable artifacts.
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
description = "Microcoder: the simple coding loop. Jev judges the state, one model call returns the next shell commands, the host runs them."
publish.workspace = true

[[bin]]
name = "microcoder"
path = "src/main.rs"

[dependencies]
acp-client = { path = "../acp-client" }
coder-history = { path = "../coder-history", default-features = false, features = ["opencode", "devin"] }
atif = { path = "../atif" }
# A seat's turn on the Claude Agent SDK, with studio approvals (#10571).
claude_agent_sdk = { path = "../claude_agent_sdk" }
coder = { path = "../coder" }
# The plain spelling of a Windows path, for the detached owner it starts.
coder-boundary = { path = "../coder-boundary" }
# The delegate recipe's groundwork and table (#10208).
coder-delegate = { path = "../coder-delegate" }
route-contract = { path = "../route-contract" }
futures-util = "0.3"
jev = { path = "../jev" }
jev-hosted = { path = "../jev-hosted" }
libc = "0.2"
knowledge = { path = "../knowledge" }
microcoder-loop = { path = "../microcoder-loop" }
codex-transport = { path = "../codex-transport" }
nostr = { path = "../nostr" }
secp256k1 = "0.31.1"
openrouter = { path = "../openrouter" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
supervise = { path = "../supervise" }
tokio = { version = "1", features = ["macros", "rt", "time", "process", "io-util", "signal"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
base64 = "0.22"
tempfile = "3"
# The Coder event stream a local run's fixture test reads.
openagents-chat = { path = "../openagents-chat" }
# Signed extension evaluation fixtures for the referee's tests.
xp-ledger = { path = "../xp-ledger", features = ["fixtures"] }
# The engine's OpenCode database a refusal test writes.
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["macros", "rt", "time", "process", "io-util", "signal", "test-util", "net"] }

[lints]
workspace = true
