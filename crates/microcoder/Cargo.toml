[package]
name = "microcoder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Microcoder: the simple coding loop. Jev judges the state, one model call returns the next shell commands, the host runs them."
publish.workspace = true

[[bin]]
name = "microcoder"
path = "src/main.rs"

[dependencies]
atif = { path = "../atif" }
coder = { path = "../coder" }
futures-util = "0.3"
jev = { path = "../jev" }
knowledge = { path = "../knowledge" }
microluna = { path = "../microluna" }
nostr = { path = "../nostr" }
openrouter = { path = "../openrouter" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
supervise = { path = "../supervise" }
tokio = { version = "1", features = ["macros", "rt", "time", "process", "io-util", "signal"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "time", "process", "io-util", "signal", "test-util", "net"] }

[lints]
workspace = true
