[package]
name = "microcoder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Microcoder: the simple coding loop. Jev judges the state, one model call returns the next shell commands, the host runs them."
publish.workspace = true

[[bin]]
name = "microcoder"
path = "src/main.rs"

[dependencies]
acp-client = { path = "../acp-client" }
coder-history = { path = "../coder-history", default-features = false, features = ["opencode"] }
atif = { path = "../atif" }
coder = { path = "../coder" }
futures-util = "0.3"
jev = { path = "../jev" }
libc = "0.2"
knowledge = { path = "../knowledge" }
microcoder-loop = { path = "../microcoder-loop" }
codex-transport = { path = "../codex-transport" }
nostr = { path = "../nostr" }
secp256k1 = "0.31.1"
openrouter = { path = "../openrouter" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
supervise = { path = "../supervise" }
tokio = { version = "1", features = ["macros", "rt", "time", "process", "io-util", "signal"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
tempfile = "3"
# The engine's OpenCode database a refusal test writes.
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["macros", "rt", "time", "process", "io-util", "signal", "test-util", "net"] }

[lints]
workspace = true
