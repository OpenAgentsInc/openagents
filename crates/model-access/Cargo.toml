[package]
name = "model-access"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Who pays for a model call: OpenAgents' keys, or the person's own OpenRouter, Vercel AI Gateway, and TypeSafe keys (BYOK), in one fixed order per use."
publish.workspace = true

[features]
default = []
# The real key checks over HTTPS (`check::Http`). Tests use a fake.
http = ["dep:reqwest"]
# The macOS login keychain as the key store (`store::Keychain`).
keychain = ["dep:security-framework"]

[dependencies]
# Paper Mono, the one typeface, for the pages this crate renders.
paper-mono = { path = "../paper-mono" }
getrandom = "0.3"
jev = { path = "../jev" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7", optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
