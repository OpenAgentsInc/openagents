[package]
name = "nostr-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Bounded authenticated Nostr transport for explicitly admitted relays."

[dependencies]
nostr = { path = "../nostr" }
futures-util = "0.3"
serde_json = "1"
secp256k1 = { version = "0.31.1", features = ["rand"] }
tokio = { version = "1", features = ["net", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

[lints]
workspace = true
