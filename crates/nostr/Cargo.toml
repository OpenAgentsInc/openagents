[package]
name = "nostr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Pure Nostr protocol and verification primitives"
publish.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = []
# The relay enables `server` for the signer internals it needs.
server = []

# Dependency allowlist carried over from immortal-core: secp256k1, sha2,
# serde, serde_json.
[dependencies]
secp256k1 = { version = "0.31.1", features = ["recovery"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"

[lints]
workspace = true

# Test-only oracles for the hand-written NIP-44 primitives and the property
# tests. Read docs/nostr/crypto-primitives.md before promoting one of these to
# a runtime dependency.
[dev-dependencies]
chacha20 = "0.10.2"
hkdf = "0.13.0"
hmac = "0.13.0"
proptest = "1.11.0"
subtle = "2.6.1"
