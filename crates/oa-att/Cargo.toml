[package]
name = "oa-att"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "NIP-ATT client verification: Google Confidential Space attestation tokens checked against Google's pinned root, the measurement against the logged release, the key binding, and the sealed-job receipt. Pure Rust; builds for wasm32. The `net` feature adds the relay reads and the sealed-job exchange the gateway and the CLI use."

[features]
net = ["dep:nostr-transport", "dep:tokio", "secp256k1/rand"]

[dependencies]
nostr = { path = "../nostr" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["oid"] }
rsa = { version = "0.9", default-features = false, features = ["std", "sha2"] }
x509-cert = { version = "0.2.5", default-features = false }
base64 = "0.22"
# The sealed result's receipt (its digest seal).
receipts = { path = "../receipts" }
nostr-transport = { path = "../nostr-transport", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"], optional = true }
secp256k1 = "0.31.1"

[[bin]]
name = "oa-att"
required-features = ["net"]

[lints]
workspace = true
