[package]
name = "oa-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "OpenAgents sign-in: GitHub OAuth (authorization code + PKCE), profile reading, account resolution over tenancy, and a fake GitHub for tests (docs/auth)."

[features]
# An in-process fake GitHub (authorize, token, user, emails) for tests and
# the local fixture.
fake = ["dep:axum"]
# A small account service over the tenancy stores, for local fixtures only.
local = ["dep:axum"]
# Keep GitHub access in the account database when one is attached to the
# registry directory (#11154).
postgres = ["tenancy/postgres"]
# WorkOS User Management (docs/auth/2026-10-20-workos-source-of-truth.md):
# the official SDK at an exact version, for server crates only.
workos = ["dep:workos", "dep:jsonwebtoken"]
# An in-process fake WorkOS API for tests and fixtures.
fake-workos = ["workos", "dep:axum"]

[dependencies]
axum = { version = "0.8", optional = true }
aes-gcm = "0.10"
nostr = { path = "../nostr" }
base64 = "0.22"
oauth2 = { version = "5.0.0", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tenancy = { path = "../tenancy" }
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }
url = "2"
workos = { version = "=3.5.0", optional = true }
# The SDK's own pin, for signing and reading access tokens in the fake.
jsonwebtoken = { version = "=10.3.0", optional = true, default-features = false, features = ["aws_lc_rs"] }
x509-parser = { version = "0.18", features = ["verify"] }

[dev-dependencies]
oa-auth = { path = ".", features = ["fake", "local", "fake-workos"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }

[lints]
workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
openagents-workspace-hack = { version = "0.1" }
