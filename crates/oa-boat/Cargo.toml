[package]
name = "oa-boat"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Our own Boat-compatible sandbox service on Google Compute Engine."
publish = false

[[bin]]
name = "oa-boat"
path = "src/main.rs"

[dependencies]
boat = { path = "../boat" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
rand = { version = "0.9", default-features = false, features = ["std", "std_rng", "thread_rng"] }
futures-util = "0.3"
bytes = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
