[package]
name = "oa-computers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The lifecycle layer for every computer: an API that records intent and returns at once, desired and observed state in Postgres, and a restart-safe reconcile loop over computer-driver drivers."
default-run = "oa-computers"

[[bin]]
name = "oa-computers"
path = "src/main.rs"

[features]
space = ["computer-driver/space"]
# Archil sandboxes as an opt-in `fast-sandbox` deployment (#12138).
archil = ["computer-driver/archil"]

[dependencies]
computer-enrolled = { path = "../computer-enrolled" }
coder-access = { path = "../coder-access", default-features = false }
coder-host = { path = "../coder-host", default-features = false }
secp256k1 = "0.31.1"
async-trait = "0.1"
computer-files = { path = "../computer-files" }
computer-credentials = { path = "../computer-credentials" }
base64 = "0.22"
axum = { version = "0.8", features = ["json", "query", "tokio", "http1"] }
boat = { path = "../boat" }
coder-environment = { path = "../coder-environment" }
coder-working-computer = { path = "../coder-working-computer" }
computer-driver = { path = "../computer-driver", features = ["boat"] }
getrandom = "0.4"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1", "with-uuid-1"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = "1"

[dev-dependencies]
stateright = "0.31"
proptest = "1"
oa-boat = { path = "../oa-boat" }
tempfile = "3"

[lints]
workspace = true
