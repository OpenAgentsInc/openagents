[package]
name = "oa-seal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Encryption at rest for small server-held secrets: AES-256-GCM under a named key from a keyring kept outside the data directory (#11041)."

[dependencies]
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
base64 = "0.22"
getrandom = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1.8"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
