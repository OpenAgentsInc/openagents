[package]
name = "oa-tokens"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The OpenAgents design token table (Apps SDK UI roles, Coder Light, Coder Noir, the HUD layer and scales) as dependency-free data, shared by the web components, the Kiki and Verse stylesheet, and the native GUI themes."

[features]
# Serialize `ThemeChoice` as a stored preference (`system`, `light`, `dark`).
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[lints]
workspace = true
