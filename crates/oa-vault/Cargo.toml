[package]
name = "oa-vault"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "NIP-VAULT client core: the vault master key, key slots (passkey PRF, device, Nostr, recovery code, pairing), chunked AES-256-GCM vault objects, user wraps, and the sealed key index. Builds for native targets and wasm32 (#11240)."

[dependencies]
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
base64 = "0.22"
bip39 = { version = "2.2.2", default-features = false, features = ["std"] }
getrandom = "0.3"
hkdf = "0.12.4"
# The sealed tier's HPKE (RFC 9180) wraps, requests, and replies.
hpke = { version = "0.12", default-features = false, features = ["alloc", "x25519"] }
scrypt = { version = "0.11.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1.25"
zeroize = "1.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
# hpke's rand_core 0.6 pulls getrandom 0.2, which needs its `js` backend
# (crypto.getRandomValues) to compile for the browser (#11837). Nothing here
# draws from it: every random byte comes from getrandom 0.3 above
# (`sealed::OsRandom`, `lib.rs`).
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }

[lints]
workspace = true
