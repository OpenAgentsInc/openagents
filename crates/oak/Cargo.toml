[package]
name = "oak"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The caller's CLI for the decision API: ask typed questions over POST /v1/systemone, classify inputs over POST /v1/classify, and serve classification and discovery over MCP stdio."
publish.workspace = true

[features]
# The `oak-mcp-http` binary: the MCP tools over the Streamable HTTP
# transport — sessions, `Mcp-Session-Id`, and per-call bearer
# forwarding.
mcp-http = [
    "dep:axum",
    "dep:secp256k1",
    "tokio/macros",
    "tokio/rt-multi-thread",
    "tokio/net",
    "tokio/signal",
]

[dependencies]
axum = { version = "0.8", optional = true }
jev = { path = "../jev", features = ["blocking"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
secp256k1 = { version = "0.31", features = ["rand"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "time"] }

[[bin]]
name = "oak-mcp-http"
path = "src/bin/oak-mcp-http.rs"
required-features = ["mcp-http"]

[dev-dependencies]
gateway = { path = "../gateway" }
axum = "0.8"
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
