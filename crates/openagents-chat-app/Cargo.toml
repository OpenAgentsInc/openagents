[package]
name = "openagents-chat-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Shared OpenAgents chat application state, projections, and Coder client behavior."

[features]
test-support = []

[dependencies]
openagents-chat = { path = "../openagents-chat" }
coder-computers = { path = "../coder-computers" }
coder-host = { path = "../coder-host", default-features = false }
coder-connect = { path = "../coder-connect", default-features = false }
coder-history = { path = "../coder-history", default-features = false }
nostr = { path = "../nostr" }
rust-native = { path = "../rust-native" }
xp-ledger = { path = "../xp-ledger" }
# Portable event codes; the phone adapter owns playtest logging and reports.
playtest = { path = "../playtest" }
base64 = "0.22"
secp256k1 = { version = "0.31.1", features = ["rand"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
xp-ledger = { path = "../xp-ledger", features = ["fixtures"] }

[lints]
workspace = true
