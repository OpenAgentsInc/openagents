[package]
name = "openagents-chat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Shared OpenAgents hosted chat transport, state, and encrypted storage."

[dependencies]
coder-access = { path = "../coder-access", default-features = false }
# Each thread renders as one ATIF trajectory (`thread`).
atif = { path = "../atif" }
nostr = { path = "../nostr" }
# BYOK: the person's own keys travel sealed with each job (#10176).
model-access = { path = "../model-access" }
nostr-transport = { path = "../nostr-transport" }
playtest = { path = "../playtest" }
rust-native = { path = "../rust-native" }
# The route each message takes, its admission, and its record (`route`, #10207).
route-contract = { path = "../route-contract" }
secp256k1 = { version = "0.31.1", features = ["rand"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "time", "io-util", "sync", "macros"] }
uuid = { version = "1", features = ["v4"] }
# Threads as workbench product panes (`pane`).
workbench = { path = "../workbench" }

[dev-dependencies]
oa-copy = { path = "../oa-copy" }
tempfile = "3"
futures-util = "0.3"
tokio = { version = "1", features = ["test-util", "net"] }
tokio-tungstenite = "0.30"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[lints]
workspace = true
