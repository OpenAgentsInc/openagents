[package]
name = "openagents-cli"
version = "0.2.0-rc2"
# The integrated Coder markdown engine uses edition 2024 let chains.
edition = "2024"
license.workspace = true
repository.workspace = true

[[bin]]
name = "openagents"
path = "src/main.rs"

[[bin]]
name = "coder-surfaces"
path = "src/bin/coder_surfaces.rs"

[dependencies]
openagents-coder-contract = { path = "../openagents-coder-contract" }
reqwest = { workspace = true, features = ["stream"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sysinfo.workspace = true
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "cargo"] }
clap_complete = "4"
crossterm = { version = "0.28", features = ["event-stream", "libc", "use-dev-tty"] }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
futures = "0.3"
libc = "0.2"
async-trait = "0.1"
eventsource-stream = "0.2.3"
unicode-width = "0.2"
unicode-segmentation = "1"
bip39 = { version = "2", features = ["rand"] }
regex = "1"
zeroize = "1"
# `oa computer up` speaks the Phoenix controller socket. The same pair the
# desktop audio transport already uses, so no new TLS stack enters the tree.
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# The WebAssembly host behind the `capability` tool. Cranelift compiles the
# guest, `StoreLimits` enforces the manifest's memory ceiling, and epoch
# interruption enforces its timeout against a guest that never returns. The
# default feature set drags in the component model, GC, async fibers, and a
# compilation cache this host has no use for; these four are what a
# `packet-v0` core module needs.
wasmtime = { version = "36", default-features = false, features = ["cranelift", "runtime", "std", "parallel-compilation"] }
# The identity seed is sealed with ChaCha20-Poly1305 before it reaches disk.
# `ring` is already in the tree underneath `rustls`, so this adds an audited
# AEAD and CSPRNG without adding a crate to the lock.
ring = "0.17"
vt100 = "0.15"
portable-pty = "0.9"
anstyle = "1.0"
anstyle-lossy = "1.1.4"
anstyle-syntect = "1.0.4"
html-escape = "0.2"
linkify = "0.10"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html", "simd"] }
supports-color = "3.0"
syntect = "5.3"
textwrap = "0.16"
two-face = { version = "0.4", default-features = false, features = ["syntect-fancy"] }
url = "2"
base64 = "0.22"
time = { version = "0.3.55", features = ["formatting"] }

[dev-dependencies]
tempfile = "3"
pretty_assertions = "1"
# The sandbox tests need guests that misbehave on purpose -- one that grows
# past the ceiling, one that never returns, one that imports a capability its
# manifest never declared. None of those can be a checked-in artifact, so the
# tests assemble them from WAT.
wat = "1"
bech32 = "0.11"
# The Computer channel tests stand up a real Phoenix-shaped socket server, so
# the client's framing, policy, journal, and backoff run against a live peer.
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
