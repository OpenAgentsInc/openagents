[package]
name = "openagents-cli"
# The CLI release version, shared with Coder and its bundled Microcoder.
# The release scripts check this value before naming downloadable artifacts.
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The openagents command: one program that reaches every OpenAgents surface an agent needs, over Nostr."

[[bin]]
name = "openagents"
path = "src/main.rs"

[dependencies]
github-actions = { path = "../github-actions", default-features = false }
coder-cloud = { path = "../coder-cloud" }
coder-environment-operator = { path = "../coder-environment-operator" }
coder-new = { path = "../coder-new" }
brainstorm-client = { path = "../brainstorm-client" }
receipts = { path = "../receipts" }
terminal-tty = { path = "../terminal-tty" }
terminal-core = { path = "../terminal-core" }
tenancy = { path = "../tenancy" }
axum = "0.8"
coder-delegate = { path = "../coder-delegate" }
acp-client = { path = "../acp-client" }
jsonschema = { version = "0.33", default-features = false }
supervise = { path = "../supervise" }
# `openagents background`: the host's background rules (the disk monitor).
background = { path = "../background" }
base64 = "0.22"
# Human-readable amounts: BIP 177 base units, or legacy BTC.
bitcoin-amount = { path = "../bitcoin-amount" }
# `openagents boat run`: this checkout's change, built and tested on Boat.
boat = { path = "../boat" }
coder = { path = "../coder" }
route-contract = { path = "../route-contract" }
coder-access = { path = "../coder-access", default-features = false }
coder-computers = { path = "../coder-computers" }
coder-connect = { path = "../coder-connect" }
# `openagents connect`: the local control protocol and the connect code.
openagents-connect = { path = "../openagents-connect" }
# `openagents chat`: the shared chat service, threads, and their ATIF export.
openagents-chat = { path = "../openagents-chat" }
# `openagents terminal`: OpenAgents Terminal, the full-screen chat.
openagents-terminal = { path = "../openagents-terminal" }
# `openagents terminal --computer`: another computer's threads over NIP-HOST.
openagents-chat-app = { path = "../openagents-chat-app" }
atif = { path = "../atif" }
coder-host = { path = "../coder-host" }
coder-link = { path = "../coder-link" }
# `openagents lease`: the host resource broker's leases.
coder-lease = { path = "../coder-lease" }
coder-reach = { path = "../coder-reach" }
coder-service = { path = "../coder-service" }
discovery = { path = "../discovery" }
# `openagents ext eval`: the runner, the sandbox, the publish and check
# builders, and the authoring interview (`ext eval init`).
ext-eval = { path = "../ext-eval" }
glam = "0.30.10"
gym = { path = "../gym" }
gym-bridge = { path = "../gym-bridge", default-features = false }
jev = { path = "../jev" }
jev-hosted = { path = "../jev-hosted" }
knowledge = { path = "../knowledge" }
libc = "0.2"
# `openagents mac`: jobs for a linked Mac, sent and run over the website's
# pull channel (#11223).
mac-jobs = { path = "../mac-jobs" }
coder-sync = { path = "../coder-sync" }
# `chat work`: issue runs as rows of the account's agent lists (#11228).
agent-fleet = { path = "../agent-fleet" }
openagents-login = { path = "../openagents-login" }
# `openagents vault`: the person's "only you" vault (NIP-VAULT tier user).
oa-vault = { path = "../oa-vault" }
zeroize = "1.8"
microcoder = { path = "../microcoder" }
# BYOK: the person's own provider keys, tested over HTTPS and kept in the
# keychain or 0600 files.
model-access = { path = "../model-access", features = ["http", "keychain"] }
nostr = { path = "../nostr" }
# `openagents pylon`: NIP-PYLON beacons, free jobs, receipts, and pools.
pylon = { path = "../pylon" }
openagents-wallet = { path = "../wallet" }
# Idempotency keys for wallet payments.
uuid = { version = "1", features = ["v4"] }
# The person's Spark wallet, the same as the phone's (`openagents wallet`).
openagents-spark = { path = "../spark-wallet" }
openagents-x402 = { path = "../x402" }
# `openagents pay serve`: paid plugin invocations run a release's guest
# (`/v1/plugins/{id}/invoke`), and settlements go to the ledger.
pay-ledger = { path = "../pay-ledger" }
plugin = { path = "../plugin" }
# The playtest triage inbox: reports, drafts, and the triage log.
playtest = { path = "../playtest" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# ES256 App Store Connect API tokens for `playtest testflight`.
ring = "0.17"
secp256k1 = { version = "0.31.1", features = ["rand"] }
# The workshop agent's memory read from disk applies the secret screen.
secret-screen = { path = "../secret-screen" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
# `openagents pay serve --routes FILE`.
toml = "0.9"
verse = { path = "../verse", default-features = false, features = ["xp-host", "remote-chamber", "studio-host"] }
verse-engine = { path = "../verse-engine" }
verse-world = { path = "../verse-world", features = ["service-net", "service-reach", "studio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
verse-lagrange = { path = "../verse-lagrange" }
# `openagents verse town`: Everglade's townsfolk definitions and roster.
townsfolk = { path = "../townsfolk" }
town-clock = { path = "../town-clock" }
world-tree = { path = "../world-tree" }

# `openagents ssh` runs the system ssh through Unix process groups, and
# `openagents labor`'s, `openagents pay commission`'s, and plugin purchases'
# stores rest on Unix file modes; Windows builds without them.
[target.'cfg(unix)'.dependencies]
commercial-accounts = { path = "../commercial-accounts", features = ["merchant-commissions"] }
commercial-spend = { path = "../commercial-spend" }
coder-labor = { path = "../coder-labor" }
coder-ssh = { path = "../coder-ssh" }

# Owner-only sales inputs on Windows, where there are no modes.
[target.'cfg(windows)'.dependencies]
private-fs = { path = "../private-fs" }

[target.'cfg(unix)'.dependencies.coder-project]
path = "../coder-project"

[dev-dependencies]
# The plain-words guard over `openagents vault`'s messages.
oa-copy = { path = "../oa-copy" }
commercial-accounts = { path = "../commercial-accounts" }
hex = "0.4"
receipts = { path = "../receipts" }
# `tests/chat.rs` runs a local NIP-42 relay with a scripted chat worker.
futures-util = "0.3"
tokio-tungstenite = "0.30"
nostr = { path = "../nostr", features = ["test-invoice"] }
# `tests/ext_eval.rs` publishes to and checks against a local relay.
nostr-relay = { path = "../nostr-relay" }
tempfile = "3"
# `tests/terminal.rs` reads OpenAgents Terminal's screen in a
# pseudo-terminal with the emulator the phone's terminal uses.
coder-vt = { path = "../coder-vt" }

[lints]
workspace = true
