[package]
name = "openagents-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The openagents command: one program that reaches every OpenAgents surface an agent needs, over Nostr."

[[bin]]
name = "openagents"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
# Human-readable amounts: BIP 177 base units, or legacy BTC.
bitcoin-amount = { path = "../bitcoin-amount" }
coder = { path = "../coder" }
coder-access = { path = "../coder-access", default-features = false }
coder-computers = { path = "../coder-computers" }
coder-connect = { path = "../coder-connect" }
# `openagents connect`: the local control protocol and the connect code.
openagents-connect = { path = "../openagents-connect" }
# `openagents chat`: the shared chat service, threads, and their ATIF export.
openagents-chat = { path = "../openagents-chat" }
# `openagents terminal`: OpenAgents Terminal, the full-screen chat.
openagents-terminal = { path = "../openagents-terminal" }
atif = { path = "../atif" }
coder-host = { path = "../coder-host" }
coder-labor = { path = "../coder-labor" }
coder-link = { path = "../coder-link" }
coder-reach = { path = "../coder-reach" }
coder-service = { path = "../coder-service" }
coder-ssh = { path = "../coder-ssh" }
discovery = { path = "../discovery" }
# `openagents ext eval`: the runner, the sandbox, the publish and check
# builders, and the authoring interview (`ext eval init`).
ext-eval = { path = "../ext-eval" }
glam = "0.30.10"
gym = { path = "../gym" }
gym-bridge = { path = "../gym-bridge", default-features = false }
jev = { path = "../jev" }
knowledge = { path = "../knowledge" }
libc = "0.2"
microcoder = { path = "../microcoder" }
nostr = { path = "../nostr" }
openagents-wallet = { path = "../wallet" }
openagents-x402 = { path = "../x402" }
# The playtest triage inbox: reports, drafts, and the triage log.
playtest = { path = "../playtest" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# ES256 App Store Connect API tokens for `playtest testflight`.
ring = "0.17"
secp256k1 = { version = "0.31.1", features = ["rand"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
verse = { path = "../verse", default-features = false, features = ["xp-host"] }
verse-lagrange = { path = "../verse-lagrange" }

[dev-dependencies]
# `tests/chat.rs` runs a local NIP-42 relay with a scripted chat worker.
futures-util = "0.3"
tokio-tungstenite = "0.30"
nostr = { path = "../nostr", features = ["test-invoice"] }
# `tests/ext_eval.rs` publishes to and checks against a local relay.
nostr-relay = { path = "../nostr-relay" }
tempfile = "3"

[lints]
workspace = true
