# OpenAgents for Mac: the desktop app that shows the QR code a phone scans
# to connect, lists the connected phones, and shows what Coder is doing.
# The window is Rust Native views drawn by `rust-native-desktop`; it talks
# to the host only through the local control socket and holds no host key.
[package]
name = "openagents-desktop"
# The app's version, in lockstep with the phone app's marketing version:
# MARKETING_VERSION in bins/openagents-ios/host/project.yml is the source
# of truth (Android reads it too). Change both together;
# tests/version_lockstep.rs fails when they differ.
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "OpenAgents for Mac: pair a phone by QR code, manage phones, and watch Coder."

[features]
default = ["app"]
# The window and its macOS glue.
app = [
    "dep:rust-native-desktop",
    "dep:openagents-deck",
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-service-management",
    "dep:core-foundation",
    "dep:objc2-app-kit",
    "dep:objc2-user-notifications",
    "dep:block2",
    "dep:reqwest",
    "dep:ring",
    "dep:semver",
    "dep:verse",
    "dep:zbus",
    "dep:coder-mobile",
    "dep:gym-leaderboard",
    "dep:keyring",
    "dep:security-framework",
    "dep:rfd",
    "dep:coder",
    "dep:model-access",
    "dep:resvg",
]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
# The release acceptance gate's phone-shaped client (`--acceptance`,
# #10080): the phone's NIP-HOST service, already in the graph through
# `openagents-chat-app`, and TLS for its relay.
coder-computers = { path = "../coder-computers" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
openagents-chat = { path = "../openagents-chat" }
openagents-chat-app = { path = "../openagents-chat-app" }
coder-access = { path = "../coder-access", default-features = false }
coder-connect = { path = "../coder-connect", default-features = false }
coder-history = { path = "../coder-history" }
# The activity summaries a Coder task reports, read for notifications
# (`notices`); already in the graph through `openagents-chat-app`.
nostr = { path = "../nostr" }
# Give feedback on selected text (`feedback`, #10127): the playtest report
# and its sealing; already in the graph through `openagents-chat-app`.
playtest = { path = "../playtest" }
# Coder on this computer for a chat: the runner `openagents chat` uses
# (`coder::task::local`), in the window's Coder lane (`src/worker.rs`).
coder = { path = "../coder", optional = true }
# Who pays for model calls (BYOK, #10176).
model-access = { path = "../model-access", optional = true, features = ["http", "keychain"] }
# Whether Grok Build is installed and signed in here (`model::grok`,
# #10091); already in the graph through `coder`.
acp-client = { path = "../acp-client" }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
# The control protocol's messages.
openagents-connect = { path = "../openagents-connect" }
qrcodegen = "1.8.0"
# The web's font stacks and type scale (#11120).
oa-tokens = { path = "../oa-tokens" }
rust-native = { path = "../rust-native" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secp256k1 = { version = "0.31.1", features = ["rand"] }
rust-native-desktop = { path = "../rust-native-desktop", optional = true }
openagents-deck = { path = "../openagents-deck", optional = true }
# The updater (`update`): HTTPS, Ed25519 and SHA-256, and version order.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
ring = { version = "0.17", optional = true }
semver = { version = "1", optional = true }
# File choosers: the Grid's store on every system, and on Windows the
# folder chooser (the common item dialog, `IFileOpenDialog` with
# `FOS_PICKFOLDERS`). `rust-native-desktop` already uses it for images.
rfd = { version = "0.17.2", optional = true }
# The GitHub mark and padlock on the slide link cards (`slide_embeds`);
# already in the graph through `rust-native-desktop`.
resvg = { version = "0.48.1", default-features = false, optional = true }

# Linux: the desktop portal's folder chooser over the session bus
# (`src/platform/linux.rs`). The same zbus release and features the host's
# Secret Service store (`keyring`, in `coder-host`) already brings in, so
# the graph gains nothing new.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"], optional = true }
keyring = { version = "=4.2.0", optional = true }

# Windows: the Run key, the user's SID for the
# control pipe, and the lock check (`src/platform/windows.rs`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Registry", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
# Coder's notifications as WinRT toasts and the process's AppUserModelID
# (`src/win_notify.rs`). The release `accesskit_windows` already brings in,
# so the graph gains nothing new.
windows = { version = "0.62.2", default-features = false, features = ["std", "Data_Xml_Dom", "Foundation", "UI_Notifications", "Win32_System_Com", "Win32_UI_Shell"] }

# Watch and Play use the shared Grid. Verse does not
# build for Windows, where the window keeps its plain background.
[target.'cfg(not(windows))'.dependencies]
verse = { path = "../verse", default-features = false, optional = true }
coder-mobile = { path = "../coder-mobile", optional = true }
gym-leaderboard = { path = "../gym-leaderboard", default-features = false, features = ["client"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { version = "0.9.4", optional = true }
security-framework = { version = "3.7", optional = true }
objc2 = { version = "0.6.4", optional = true }
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSString", "NSError", "NSBundle"] }
# The menu-bar item (`menubar`).
objc2-app-kit = { version = "0.3.2", optional = true, default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSButton", "NSCell", "NSControl", "NSImage", "NSMenu", "NSMenuItem", "NSResponder", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView", "NSWindow", "NSWorkspace", "NSAccessibility"] }
objc2-service-management = { version = "0.3.2", optional = true, default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
# Coder's notifications through the notification center (`mac_notify`).
objc2-user-notifications = { version = "0.3.2", optional = true, default-features = false, features = ["std", "bitflags", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }
block2 = { version = "0.6.2", optional = true }

# Process CPU and peak resident memory in the offline native benchmark.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
# The background watchers the sidebar counts (`crates/background`).
background = { path = "../background" }

[dev-dependencies]
# The machine-talk guard over the copy people see (#11031).
oa-copy = { path = "../oa-copy" }
pollster = "0.4"
# Reads the chosen system faces in the typeface test.
swash = "0.2.10"
# The seeded pylon league on an in-process relay, for the Gym's league capture.
pylon = { path = "../pylon", features = ["fixture"] }
secp256k1 = { version = "0.31.1", features = ["rand"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = "3"
# Reading the QR code back from painted frames and window captures.
png = "0.18.1"
rqrr = { version = "0.11", default-features = false }
# Reading the accessibility tree as VoiceOver's, AT-SPI's, and UI
# Automation's adapters read it.
accesskit_consumer = "0.39.1"

[lints]
workspace = true

[[bin]]
name = "openagents-desktop"
path = "src/main.rs"
required-features = ["app"]
