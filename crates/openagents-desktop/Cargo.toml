# OpenAgents for Mac: the desktop app that shows the QR code a phone scans
# to connect, lists the connected phones, and shows what Coder is doing.
# The window is Rust Native views drawn by `rust-native-desktop`; it talks
# to the host only through the local control socket and holds no secret key.
[package]
name = "openagents-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "OpenAgents for Mac: pair a phone by QR code, manage phones, and watch Coder."

[features]
default = ["app"]
# The window and its macOS glue.
app = [
    "dep:rust-native-desktop",
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-service-management",
    "dep:core-foundation",
    "dep:objc2-app-kit",
    "dep:reqwest",
    "dep:ring",
    "dep:semver",
]

[dependencies]
base64 = "0.22"
# The control protocol's messages.
openagents-connect = { path = "../openagents-connect" }
qrcodegen = "1.8.0"
rust-native = { path = "../rust-native" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-native-desktop = { path = "../rust-native-desktop", optional = true }
# The updater (`update`): HTTPS, Ed25519 and SHA-256, and version order.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
ring = { version = "0.17", optional = true }
semver = { version = "1", optional = true }

# Linux needs nothing more. Windows: the Run key, the user's SID for the
# control pipe, and the lock check (`src/platform/windows.rs`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Registry", "Win32_System_StationsAndDesktops", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { version = "0.9.4", optional = true }
objc2 = { version = "0.6.4", optional = true }
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSString", "NSError"] }
# The menu-bar item (`menubar`).
objc2-app-kit = { version = "0.3.2", optional = true, default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSButton", "NSCell", "NSControl", "NSImage", "NSMenu", "NSMenuItem", "NSResponder", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView", "NSWindow"] }
objc2-service-management = { version = "0.3.2", optional = true, default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[[bin]]
name = "openagents-desktop"
path = "src/main.rs"
required-features = ["app"]
