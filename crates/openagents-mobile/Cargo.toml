[package]
name = "openagents-mobile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Rust-owned application state and native bridge for the OpenAgents mobile app."

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
# Coder's Computers screens, live host client, encrypted store, and phone
# terminal screen: enrollment, presence, direct channels, and commands.
coder-computers = { path = "../coder-computers" }
coder-vt = { path = "../coder-vt" }
rust-native = { path = "../rust-native" }
# Linking tailscale-rs (aws-lc-rs) beside the host client (ring) enables two
# rustls providers, so the app installs ring as the process default.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
secp256k1 = { version = "0.31.1", features = ["rand"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Tailscale's Rust control client. The app signs in as its own tailnet node
# and reads one netmap to list the tailnet's devices; it carries no traffic.
ts_control = "=0.6.1"
ts_control_serde = "=0.6.1"
ts_keys = { version = "=0.6.1", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "io-util"] }
url = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
