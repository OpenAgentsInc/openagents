[package]
name = "openagents-mobile"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
description = "Rust-owned application state and native bridge for the OpenAgents mobile app."

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
openagents-chat-app = { path = "../openagents-chat-app" }
# The theme (#11028): Coder Light's roles for the hosts' own chrome.
oa-tokens = { path = "../oa-tokens" }
openagents-chat = { path = "../openagents-chat" }
# Account > Your keys (BYOK, #10176): who pays and the key tests.
model-access = { path = "../model-access" }
# The key tests' one HTTPS call each, on the app's runtime.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Coder's Computers screens, live host client, encrypted store, and phone
# terminal screen: enrollment, presence, direct channels, and commands.
coder-computers = { path = "../coder-computers" }
# Route classes, for the Computers list's short status.
coder-reach = { path = "../coder-reach" }
coder-vt = { path = "../coder-vt" }
nostr = { path = "../nostr" }
# Report a problem and the playtest log: the report schema and its
# NIP-17 transport to the triage key.
playtest = { path = "../playtest" }
# The Wallet's npub payments: reading Nostr profiles and publishing the
# phone's payment targets (`src/payees.rs`).
nostr-transport = { path = "../nostr-transport" }
# The tailnet admission client (NIP-HOST): no host code is linked.
coder-host = { path = "../coder-host", default-features = false }
# Coder's read-only chat observer: `coder-pair:` pairing, catalog and
# transcript pages, and readable projections of Claude and Codex records.
coder-connect = { path = "../coder-connect", default-features = false }
coder-history = { path = "../coder-history", default-features = false }
# The Verse tab: Coder's mobile Verse surface in its bare-world mode. Its
# reader and C exports are not called; the app linker strips them.
coder-mobile = { path = "../coder-mobile" }
# The Account tab's trainer card: Verse's read-only NIP-XP reader and its
# level curve, the same code that puts levels over heads in the Grid.
verse = { path = "../verse", default-features = false, features = ["xp-host"] }
# The owner's private Verse placements a paired computer sends
# (`src/verse_private.rs`).
verse-private = { path = "../verse-private" }
# "What you made" (`CARD-07`, the Profile): the XP ledger's eval credit.
xp-ledger = { path = "../xp-ledger" }
base64 = "0.22"
# Every amount on screen: BIP 177 integer base units, or legacy BTC.
bitcoin-amount = { path = "../bitcoin-amount" }
# The Wallet tab: Breez's Spark wallet, on Bitcoin mainnet, through the
# wallet code computers share (`crates/spark-wallet`). Its SQLite store
# needs `rusqlite` 0.32, which cannot share a lock file with `ldk-node`'s
# 0.31, so this crate is its own workspace; see the note at the end.
openagents-spark = { path = "../spark-wallet" }
breez-sdk-spark = { git = "https://github.com/breez/spark-sdk", tag = "0.26.0", features = ["sqlite"] }
# Recovery words for the Spark wallet's seed.
bip39 = "2"
# Breez's event listener trait is an `async_trait`.
async-trait = "0.1"
# The fingerprint that remembers which wallet's recovery words were saved.
sha2 = "0.10"
# Idempotency keys for wallet payments.
uuid = { version = "1", features = ["v4"] }
# The Wallet tab's receive-address QR code.
qrcodegen = "1.8"
# `ffi` exports Rust Native transcript layout to the iOS host.
rust-native = { path = "../rust-native", features = ["ffi", "shaping"] }
# Linking tailscale-rs (aws-lc-rs) beside the host client (ring) enables two
# rustls providers, so the app installs ring as the process default.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
secp256k1 = { version = "0.31.1", features = ["rand"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Tailscale's Rust control client. The app signs in as its own tailnet node
# and reads one netmap to list the tailnet's devices; it carries no traffic.
ts_control = "=0.6.1"
ts_control_serde = "=0.6.1"
ts_keys = { version = "=0.6.1", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "io-util", "sync", "macros"] }
url = "2"
# Nearby on Connect a computer: the mDNS listing's event stream.
futures-util = "0.3"

# The Android host's JNI surface (`src/android.rs`).
[target.'cfg(target_os = "android")'.dependencies]
# iroh's DNS resolver reads Android's configuration through JNI; the host
# publishes the JVM and context once (`installContext`).
openagents-connect = { path = "../openagents-connect" }
jni = "=0.22.4"
libc = "0.2"
ndk-sys = "0.6"

[dev-dependencies]
# The machine-talk guard over the copy in this crate's sources (#11031).
oa-copy = { path = "../oa-copy" }
openagents-chat-app = { path = "../openagents-chat-app", features = ["test-support"] }
# Nearby computers' iroh keys in tests.
openagents-connect = { path = "../openagents-connect" }
# Signed BOLT11 invoices for the agent-spending tests.
nostr = { path = "../nostr", features = ["test-invoice"] }
tempfile = "3"
# Signed eval results, checks, and reports for the Gym's tests.
xp-ledger = { path = "../xp-ledger", features = ["fixtures"] }
# A paused clock for the Chats time-to-first-rows tests, and a local relay
# for the basic Coder's kept connection.
tokio = { version = "1", features = ["test-util", "net"] }
tokio-tungstenite = "0.30.0"
futures-util = "0.3"

# This crate is its own workspace, excluded from the repository's: Breez's
# SQLite store links `libsqlite3-sys` 0.30 and `ldk-node` (the x402
# receiver, `crates/wallet`) links 0.28, and Cargo allows one `sqlite3` link per
# lock file. Build it with `--manifest-path crates/openagents-mobile/Cargo.toml`.
# The lints repeat the repository's.
[workspace]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# breez/boltz-client, a git dependency of breez-sdk-spark, is no longer
# published (404 on 2026-10-04); build its pinned revision from the vendored
# copy. See vendor/boltz-client/VENDORED.md.
[patch."https://github.com/breez/boltz-client"]
boltz-client = { path = "../../vendor/boltz-client/crates/lib" }
macros = { path = "../../vendor/boltz-client/crates/macros" }
platform-utils = { path = "../../vendor/boltz-client/crates/platform-utils" }
