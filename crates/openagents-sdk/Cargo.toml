[package]
name = "openagents-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The lightweight public OpenAgents client: app authentication and account resources."

[features]
schema = ["dep:schemars", "openagents-dashboard/schema"]
labs-cad = ["dep:cad"]

[dependencies]
agent-lab = { path = "../agent-lab" }
chat-home = { path = "../chat-home" }
agent-contract = { path = "../agent-contract" }
lab-kit = { path = "../lab-kit" }
cad = { path = "../cad", optional = true }
schemars = { version = "1", optional = true }
openagents-dashboard = { path = "../openagents-dashboard" }
openagents-login = { path = "../openagents-login", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = { version = "2", features = ["serde"] }
httpdate = "1"
getrandom = "0.4"
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
# The SDK reference extractor (tests/reference.rs, #12007).
syn = { version = "2", features = ["full", "visit"] }
prettyplease = "0.2"
async-trait = "0.1"
lab-api = { path = "../lab-api" }
lab-store = { path = "../lab-store" }
nostr = { path = "../nostr" }
futures-util = "0.3"
oa-copy = { path = "../oa-copy" }
axum = "0.8"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt", "test-util"] }
oa-auth = { path = "../oa-auth", features = ["fake", "local"] }
tenancy = { path = "../tenancy" }
openagents-web = { path = "../openagents-web" }

[lints]
workspace = true
