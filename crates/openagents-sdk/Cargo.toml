[package]
name = "openagents-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The lightweight public OpenAgents client: app authentication and account resources."
# One test binary (tests/all.rs) plus the few below (#12199).
autotests = false

[features]
default = ["transport"]
# The HTTP client and every call. Without it the crate is only the chat
# API's values and rules (`chats::wire`), which the website's GPUI chat
# reads in a browser build (apps/openagents/web/client).
transport = [
    "dep:oa-copy",
    "dep:agent-lab",
    "dep:chat-home",
    "dep:agent-contract",
    "dep:lab-kit",
    "dep:openagents-dashboard",
    "dep:openagents-login",
    "dep:reqwest",
    "dep:tokio",
    "dep:tokio-util",
    "dep:url",
    "dep:httpdate",
    "dep:getrandom",
    "dep:sha2",
    "dep:base64",
]
schema = ["transport", "dep:schemars", "openagents-dashboard/schema"]
labs-cad = ["transport", "dep:cad"]

[dependencies]
oa-copy = { path = "../oa-copy", optional = true }
agent-lab = { path = "../agent-lab", optional = true }
chat-home = { path = "../chat-home", optional = true }
agent-contract = { path = "../agent-contract", optional = true }
lab-kit = { path = "../lab-kit", optional = true }
cad = { path = "../cad", optional = true }
schemars = { version = "1", optional = true }
openagents-dashboard = { path = "../openagents-dashboard", optional = true }
openagents-login = { path = "../openagents-login", default-features = false, optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "macros"], optional = true }
tokio-util = { version = "0.7", features = ["rt"], optional = true }
url = { version = "2", features = ["serde"], optional = true }
httpdate = { version = "1", optional = true }
getrandom = { version = "0.4", optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }

[dev-dependencies]
# The SDK reference extractor (tests/reference.rs, #12007).
syn = { version = "2", features = ["full", "visit"] }
prettyplease = "0.2"
async-trait = "0.1"
lab-api = { path = "../lab-api" }
lab-store = { path = "../lab-store" }
nostr = { path = "../nostr" }
futures-util = "0.3"
axum = "0.8"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt", "test-util"] }
oa-auth = { path = "../oa-auth", features = ["fake", "local"] }
tenancy = { path = "../tenancy" }

[[test]]
name = "all"
path = "tests/all.rs"

[[test]]
name = "reference"
path = "tests/reference.rs"

[lints]
workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
openagents-workspace-hack = { version = "0.1" }
