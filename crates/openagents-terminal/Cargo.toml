[package]
name = "openagents-terminal"
# The release line of OpenAgents Terminal (the `openagents` program), which
# `openagents --version` and the welcome card name. It moves apart from the
# workspace version; scripts/release/terminal.sh refuses a release whose
# version differs from this one, in both crates (docs/release/terminal.md).
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "OpenAgents Terminal: a full-screen chat with OpenAgents over the shared chat client, drawn with coder-terminal."

[dependencies]
# `/export` writes the thread as an ATIF trajectory and checks it first.
atif = { path = "../atif" }
# The file view highlights code as code blocks do: grok-build's syntect.
code-highlight = { path = "../code-highlight", features = ["grok"] }
coder-terminal = { path = "../coder-terminal" }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
# The one chat-list ordering every surface uses (#10100).
openagents-chat-app = { path = "../openagents-chat-app" }
openagents-chat = { path = "../openagents-chat" }
nostr = { path = "../nostr" }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[target.'cfg(unix)'.dev-dependencies]
# The end-to-end test runs the screen in a real pseudo-terminal.
libc = "0.2"

[dev-dependencies]
# The end-to-end test reads the screen with the terminal emulator the
# phone's terminal uses.
coder-vt = { path = "../coder-vt" }
tempfile = "3"

[lints]
workspace = true
