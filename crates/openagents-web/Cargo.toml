[package]
name = "openagents-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The OpenAgents website: public pages, legal documents, the install and pairing pages, and the local read-only task browser."
default-run = "openagents-web"

[dependencies]
# Paper Mono, the one typeface, for the pages this crate renders.
paper-mono = { path = "../paper-mono" }
axum = "0.8"
base64 = "0.22"
coder = { path = "../coder" }
coder-access = { path = "../coder-access", default-features = false }
coder-host = { path = "../coder-host", default-features = false }
coder-ui = { path = "../coder-ui" }
rust-native = { path = "../rust-native" }
rust-native-web = { path = "../rust-native-web" }
route-contract = { path = "../route-contract" }
discovery = { path = "../discovery" }
futures-util = "0.3"
hmac = "0.12.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
jev = { path = "../jev" }
libc = "0.2"
openagents-chat = { path = "../openagents-chat" }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secp256k1 = { version = "0.31.1", features = ["rand"] }
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
url = "2"

[dev-dependencies]
atif = { path = "../atif" }
coder-cloud = { path = "../coder-cloud" }
coder-project = { path = "../coder-project" }
coder-scheduler = { path = "../coder-scheduler" }
nostr = { path = "../nostr" }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }

[lints]
workspace = true
