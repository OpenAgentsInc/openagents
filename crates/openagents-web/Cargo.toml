[package]
name = "openagents-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The OpenAgents website: public pages, legal documents, the install and pairing pages, and the local read-only task browser."
default-run = "openagents-web"

[dependencies]
openagents-ui = { path = "../openagents-ui" }
agent-fleet = { path = "../agent-fleet" }
atif = { path = "../atif" }
markdown-stream = { path = "../markdown-stream" }
openui-lang = { path = "../openui-lang" }
axum = "0.8"
base64 = "0.22"
coder = { path = "../coder" }
coder-access = { path = "../coder-access", default-features = false }
coder-cloud = { path = "../coder-cloud" }
coder-environment = { path = "../coder-environment" }
coder-environment-operator = { path = "../coder-environment-operator" }
coder-host = { path = "../coder-host", default-features = false }
coder-demo-ui = { path = "../coder-demo-ui" }
coder-ui = { path = "../coder-ui" }
compute-workbench = { path = "../compute-workbench", features = ["client"] }
receipts = { path = "../receipts" }
retail-cloud = { path = "../retail-cloud" }
rust-native = { path = "../rust-native" }
rust-native-web = { path = "../rust-native-web" }
route-contract = { path = "../route-contract" }
discovery = { path = "../discovery" }
futures-util = "0.3"
# The chat's GitHub tools: typed actions and their REST calls (#11167).
github-actions = { path = "../github-actions" }
hmac = "0.12.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
# Images sent to a chat are made smaller before a model reads them (#11174).
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
jev = { path = "../jev" }
inference = { path = "../inference" }
libc = "0.2"
# Mac jobs: the recipes and what a linked Mac reports (#11223).
mac-jobs = { path = "../mac-jobs" }
maud = { version = "=0.27.0", features = ["axum"] }
oa-auth = { path = "../oa-auth" }
oa-seal = { path = "../oa-seal" }
openagents-chat = { path = "../openagents-chat" }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secp256k1 = { version = "0.31.1", features = ["rand"] }
secret-screen = { path = "../secret-screen" }
sha2 = "0.10"
toml = "0.9"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
url = "2"
workbench = { path = "../workbench" }

[dev-dependencies]
oa-copy = { path = "../oa-copy" }
coder-environment = { path = "../coder-environment" }
coder-environment-build = { path = "../coder-environment-build" }
coder-environment-operator = { path = "../coder-environment-operator" }
coder-environment-setup = { path = "../coder-environment-setup" }
coder-environment-verify = { path = "../coder-environment-verify" }
coder-working-computer = { path = "../coder-working-computer" }
codex-transport = { path = "../codex-transport" }
openagents-wallet = { path = "../wallet", default-features = false }
pay-ledger = { path = "../pay-ledger" }
retail-qualify = { path = "../retail-qualify" }
retail-service = { path = "../retail-service" }
coder-project = { path = "../coder-project" }
coder-pty = { path = "../coder-pty", default-features = false }
coder-scheduler = { path = "../coder-scheduler" }
nostr = { path = "../nostr" }
oa-auth = { path = "../oa-auth", features = ["fake", "local"] }
tenancy = { path = "../tenancy" }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }

[lints]
workspace = true
