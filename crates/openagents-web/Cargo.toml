[package]
name = "openagents-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The OpenAgents website: public pages, legal documents, the install and pairing pages, and the local read-only task browser."
default-run = "openagents-web"

[dependencies]
axum = "0.8"
base64 = "0.22"
coder = { path = "../coder" }
discovery = { path = "../discovery" }
futures-util = "0.3"
hmac = "0.12.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
openagents-chat = { path = "../openagents-chat" }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secp256k1 = { version = "0.31.1", features = ["rand"] }
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
