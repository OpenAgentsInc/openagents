# Builds and pushes the openagents.com website image. From the repository root:
#
#   gcloud builds submit --project openagentsgemini \
#     --config crates/openagents-web/cloudbuild.yaml \
#     --ignore-file crates/openagents-web/web.gcloudignore \
#     --substitutions _TAG=$(git rev-parse --short=10 HEAD) .
#
# See docs/deployment/openagents-web.md for the deploy and the rollback.
steps:
  # The pinned medieval kit pack (KIT_SHA256 in
  # crates/verse-zone-everglade/src/zones/everglade_pack/kit.rs), from the
  # private bucket into the build context, so /everglade/kit/ serves it.
  # It never enters the repository. Without it the web build draws the
  # kit's committed proxies.
  - name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        sha="$$(sed -n 's/^pub const KIT_SHA256: &str = "\([0-9a-f]*\)";$$/\1/p' crates/verse-zone-everglade/src/zones/everglade_pack/kit.rs)"
        mkdir -p crates/openagents-web/kit
        if [ -n "$$sha" ]; then
          gcloud storage cp "gs://openagentsgemini-verse-private-assets/packs/$$sha.vtp" crates/openagents-web/kit/ \
            || echo "the kit pack $$sha is not in the bucket; the web build draws proxies"
        fi
        # Reviewed layers are optional until pinned. A published pin must
        # resolve to its exact private object before the image is built.
        bake_pin=crates/verse-zone-everglade/src/zones/everglade_pack/kit_bake.rs
        bake_sha="$$(sed -n 's/^pub const KIT_BAKE_SHA256: &str = "\([0-9a-f]*\)";$$/\1/p' "$$bake_pin")"
        bake_bytes="$$(sed -n 's/^pub const KIT_BAKE_BYTES: u64 = \([0-9]*\);$$/\1/p' "$$bake_pin")"
        mkdir -p crates/openagents-web/kit/bake
        if [ -z "$$bake_sha" ]; then
          test "$$bake_bytes" -eq 0
        else
          test "$$bake_bytes" -gt 0
          bake_file="crates/openagents-web/kit/bake/$$bake_sha.vlay"
          gcloud storage cp "gs://openagentsgemini-verse-private-assets/bakes/$$bake_sha.vlay" "$$bake_file"
          printf '%s  %s\n' "$$bake_sha" "$$bake_file" | sha256sum -c -
          test "$$(wc -c < "$$bake_file")" -eq "$$bake_bytes"
        fi
        # The phone tier's kit pack and layers (#10908), once pinned. A
        # published pin must resolve to its exact private object.
        kit_pin=crates/verse-zone-everglade/src/zones/everglade_pack/kit.rs
        phone_sha="$$(sed -n 's/^pub const KIT_PHONE_SHA256: &str = "\([0-9a-f]*\)";$$/\1/p' "$$kit_pin")"
        phone_bytes="$$(sed -n 's/^pub const KIT_PHONE_BYTES: u64 = \([0-9]*\);$$/\1/p' "$$kit_pin")"
        if [ -n "$$phone_sha" ]; then
          phone_file="crates/openagents-web/kit/$$phone_sha.vtp"
          gcloud storage cp "gs://openagentsgemini-verse-private-assets/packs/$$phone_sha.vtp" "$$phone_file"
          printf '%s  %s\n' "$$phone_sha" "$$phone_file" | sha256sum -c -
          test "$$(wc -c < "$$phone_file")" -eq "$$phone_bytes"
        fi
        layers_sha="$$(sed -n 's/^pub const KIT_BAKE_PHONE_SHA256: &str = "\([0-9a-f]*\)";$$/\1/p' "$$bake_pin")"
        layers_bytes="$$(sed -n 's/^pub const KIT_BAKE_PHONE_BYTES: u64 = \([0-9]*\);$$/\1/p' "$$bake_pin")"
        if [ -n "$$layers_sha" ]; then
          layers_file="crates/openagents-web/kit/bake/$$layers_sha.vlay"
          gcloud storage cp "gs://openagentsgemini-verse-private-assets/bakes/$$layers_sha.vlay" "$$layers_file"
          printf '%s  %s\n' "$$layers_sha" "$$layers_file" | sha256sum -c -
          test "$$(wc -c < "$$layers_file")" -eq "$$layers_bytes"
        fi
  # BuildKit, so the independent stages (the native server and the
  # WebAssembly builds) run in parallel instead of one after another
  # (docs/deployment/2026-10-09-faster-deploys.md).
  - name: gcr.io/cloud-builders/docker
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --progress=plain
      - --build-arg
      - OPENAGENTS_COMMIT=${_COMMIT}
      - -f
      - crates/openagents-web/Dockerfile
      - -t
      - us-central1-docker.pkg.dev/openagentsgemini/openagents/openagents-web:${_TAG}
      - .
images:
  - us-central1-docker.pkg.dev/openagentsgemini/openagents/openagents-web:${_TAG}
substitutions:
  _TAG: latest
  # The full commit the context was exported from (scripts/deploy/web.sh).
  _COMMIT: unknown
options:
  machineType: E2_HIGHCPU_32
  logging: CLOUD_LOGGING_ONLY
timeout: 3600s
