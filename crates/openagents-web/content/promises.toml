# What OpenAgents promises, one record per claim. openagents.com/promises
# shows what works today (shipped, launching, partial) and
# openagents.com/roadmap shows the rest (next, later, dropped), both rendered
# from this file (crates/openagents-web/src/promises.rs). How to add or change
# a promise: docs/promises/README.md. Imported from the Kitchen Sink ledger
# (docs/kitchen-sink/ledger.md at c46aee749a, #11125); the ids are the
# ledger's, and W1-W5 are this registry's own.
#
# Each promise:
#   id         stable name, never reused
#   group      one of the group ids below
#   statement  one short sentence a user understands; no internal names
#   surfaces   web, terminal, mobile, iphone, android, desktop, api,
#              network, verse
#   status     shipped (works today; "live" also reads as this), launching
#              (new in today's 1.0 release), partial (works in part),
#              next (only the next two weeks: V1 core, V1 complete, or an
#              open issue on project 22), later ("missing" reads as this), or dropped
#              (on purpose; listed at the end of /roadmap with its note)
#   link or command
#              the one place to try it (shipped, launching, and partial
#              need one)
#   issues     the GitHub issue numbers behind it
#   episodes   the show episodes that promised it (docs/transcripts/NNN.md)
#   posts      posts on X that promised it, for a row no episode made:
#              { date = "YYYY-MM-DD", url = "https://x.com/..." }
#              (next, later, and dropped need an issue, episode, or post)
#   note       one short line: what part works, or why it was dropped
#   evidence   what proves it (shipped, launching, and partial need at least
#              one): { test = "path/to/file.rs::test_fn" }, { smoke =
#              "check name in scripts/smoke/web.py" }, { golden = "id in
#              bench/web-chat/goldens-v1.json" }, or { doc = "path" }.
#              A test fails when a named piece of evidence is gone.

