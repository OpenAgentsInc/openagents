<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
<title id="title">One Coder in front of every agent</title>
<desc id="desc">Coder sits at the center as a bright node inside a ring marked Auto. Around it are the agents it can hand a chat to: Claude Code, Codex, OpenCode, Grok Build, Devin, and Cursor. A light steps from one agent to the next, as Shift+Tab does: Auto, then Claude Code, Codex, OpenCode, and the others found on your computer.</desc>
<defs><radialGradient id="core"><stop offset="0" stop-color="#fff"/><stop offset=".7" stop-color="rgb(240,242,250)"/><stop offset="1" stop-color="rgb(210,214,228)"/></radialGradient><radialGradient id="halo"><stop offset="0" stop-color="rgb(236,240,255)" stop-opacity=".55"/><stop offset=".45" stop-color="rgb(236,240,255)" stop-opacity=".12"/><stop offset="1" stop-color="rgb(236,240,255)" stop-opacity="0"/></radialGradient><radialGradient id="goldhalo"><stop offset="0" stop-color="rgb(255,206,84)" stop-opacity=".5"/><stop offset="1" stop-color="rgb(255,206,84)" stop-opacity="0"/></radialGradient><radialGradient id="vignette" cx=".62" cy=".5" r=".75"><stop offset="0" stop-color="#141414"/><stop offset="1" stop-color="#0a0a0a"/></radialGradient><filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4"/></filter></defs>
