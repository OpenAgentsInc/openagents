<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
<title id="title">Another harness: every step goes through the big model</title>
<desc id="desc">Three messages on the left each run straight into one large glowing circle labeled the big model. A thin ring around it holds only the model's own commands: Bash, Read, Edit, Write, Grep, and Web. Every command's result goes back into the model. Below: $4.00 per accepted fix and a 284 second median.</desc>
