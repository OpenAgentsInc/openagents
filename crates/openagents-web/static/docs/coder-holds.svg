<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
<title id="title">Hard-to-undo steps wait for you</title>
<desc id="desc">From Coder on the left, everyday work runs straight through to its places: read, edit, run tests, and push. Five other paths stop at a hold before they arrive: a deploy, a merge, a secret, a payment (drawn in gold), and a DNS change. Each one waits for you to answer Y to allow it or N to deny it.</desc>
