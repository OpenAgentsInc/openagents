[package]
name = "pay-ledger"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Local SQLite settlement and revenue-share ledger"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
# NIP-A3 payment targets, kind-0 profiles, and EXT release payouts for the
# payout destination resolver (`src/payee.rs`).
nostr = { path = "../nostr" }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.9"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[lints]
workspace = true
