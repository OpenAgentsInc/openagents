[package]
name = "phone-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Native phone adapter to existing NIP-HOST admission and NIP-REACH channels"
[lib]
crate-type = ["rlib", "staticlib"]
[dependencies]
engine-proto = { path = "../engine-proto" }
prost = "=0.13.5"
coder-access = { path = "../coder-access", default-features = false }
coder-host = { path = "../coder-host", default-features = false }
coder-host-wire = { path = "../coder-host-wire" }
coder-reach = { path = "../coder-reach" }
nostr = { path = "../nostr" }
secp256k1 = { version = "0.31.1", features = ["rand"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "time", "net", "io-util"] }
[lints]
workspace = true
