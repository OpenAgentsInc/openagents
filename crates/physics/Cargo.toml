[package]
name = "physics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Zone-agnostic rigid-body physics for Verse: fixed stepping, bodies, and restorable state."
publish.workspace = true

[dependencies]
glam = { version = "0.30.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"

# The browser's clock for step profiling: std's `Instant` panics on
# wasm32-unknown-unknown.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1.1.0"

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }

[[example]]
name = "oracle_scenes"

[lints]
workspace = true
