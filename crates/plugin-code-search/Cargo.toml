[package]
name = "plugin-code-search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Code search guest: bounded literal and wildcard search over the files of a granted snapshot."
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
plugin-pdk = { path = "../plugin-pdk", features = ["guest"] }
serde_json = "1"

[lints]
workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
openagents-workspace-hack = { version = "0.1" }
