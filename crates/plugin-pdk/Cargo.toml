[package]
name = "plugin-pdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Packet types a plugin guest and its host share."
publish.workspace = true

[features]
default = []
# Guest-side helpers: allocation, the packet entry point, and the
# `oa_host.call` snapshot import. A host crate leaves it off.
guest = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
