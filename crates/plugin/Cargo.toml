[package]
name = "plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The packet ABI host for an OpenAgents plugin guest."
publish.workspace = true

[dependencies]
user-home = { path = "../user-home" }
nostr = { path = "../nostr" }
serde_json = "1"
sha2 = "0.11.0"
wasmtime = "48.0.4"

[dev-dependencies]
libc = "0.2"
tempfile = "3"
wat = "1"

[lints]
workspace = true

[[test]]
name = "signals"
harness = false

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
openagents-workspace-hack = { version = "0.1" }
