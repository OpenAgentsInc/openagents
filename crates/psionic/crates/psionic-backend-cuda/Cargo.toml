[package]
name = "psionic-backend-cuda"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
description = "CUDA backend architecture and truthful readiness surface for Psionic"
build = "build.rs"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
half = "2.4.1"
libloading = "0.8.9"
rayon = "1.10"
psionic-compiler = { path = "../psionic-compiler" }
psionic-core = { path = "../psionic-core" }
psionic-ir = { path = "../psionic-ir" }
psionic-runtime = { path = "../psionic-runtime" }

[dev-dependencies]
hex = { workspace = true }
psionic-backend-cpu = { path = "../psionic-backend-cpu" }
psionic-backend-tests = { path = "../psionic-backend-tests" }
psionic-models = { path = "../psionic-models" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokenizers = { version = "0.23.1", default-features = false, features = ["onig"] }

[build-dependencies]
cc = "1.1"
