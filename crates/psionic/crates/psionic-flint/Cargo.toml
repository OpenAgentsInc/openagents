[package]
name = "psionic-flint"
default-run = "psionic-flint"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
description = "Native Rust Flint safetensors inference for Psionic"

[lints]
workspace = true

[features]
default = []
cuda = ["candle/cuda", "candle-nn/cuda"]
metal = ["dep:psionic-backend-metal"]

[dependencies]
anyhow = "1"
axum = "0.8"
candle = { package = "candle-core", version = "0.9.2" }
candle-nn = "0.9.2"
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokenizers = { version = "0.23.1", default-features = false, features = ["onig"] }
tokio.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
psionic-backend-metal = { path = "../psionic-backend-metal", optional = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "psionic-flint-metal-bench"
path = "src/bin/metal_bench.rs"
required-features = ["metal"]
