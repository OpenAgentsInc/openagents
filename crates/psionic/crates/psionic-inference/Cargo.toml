[package]
name = "psionic-inference"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Shared tensor execution and small model inference for Psionic"

[lints]
workspace = true

[features]
default = []
native-cuda = ["dep:psionic-backend-cuda", "dep:psionic-core"]
native-metal = ["dep:psionic-backend-metal", "dep:psionic-core"]
ort = ["dep:ort"]
http = ["dep:axum", "dep:tokio"]

[dependencies]
psionic-backend-cuda = { path = "../psionic-backend-cuda", optional = true }
psionic-backend-metal = { path = "../psionic-backend-metal", optional = true }
psionic-core = { path = "../psionic-core", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
safetensors = { workspace = true }
rayon = { workspace = true }
matrixmultiply = "=0.3.10"
libm = "0.2"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
axum = { version = "0.8", optional = true }
tokio = { workspace = true, optional = true }
tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-28", "cuda", "coreml"], optional = true }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
reqwest = { workspace = true }
