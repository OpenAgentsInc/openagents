[package]
name = "psionic-inference"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Shared tensor execution and small model inference for Psionic"

[lints]
workspace = true

[features]
default = []
ort = ["dep:ort"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
safetensors = { workspace = true }
rayon = { workspace = true }
matrixmultiply = "=0.3.10"
libm = "0.2"
tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-28"], optional = true }

[dev-dependencies]
tempfile = "3"
