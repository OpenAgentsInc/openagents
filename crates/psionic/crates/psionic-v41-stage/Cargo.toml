[package]
name = "psionic-v41-stage"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
description = "The DeepSeek-V4.1 stage worker that a Pylon stage group starts"

[lints]
workspace = true

[[bin]]
name = "psionic-v41-stage"
path = "src/main.rs"

[features]
# W7's device-resident stage behind `--backend cuda`. It builds anywhere;
# the kernels link only where nvcc is installed (psionic-backend-cuda).
cuda = ["dep:psionic-backend-cuda", "dep:psionic-runtime", "dep:half", "dep:memmap2"]
# The Metal stage behind `--backend metal` on a Mac (#12420). It shares the
# CUDA stage's types and wire, so it builds the CUDA backend's portable half.
metal = [
    "dep:psionic-backend-metal",
    "psionic-backend-metal/v41",
    "dep:psionic-backend-cuda",
    "dep:psionic-runtime",
    "dep:half",
]

[dependencies]
half = { version = "2.4.1", optional = true }
hex = { workspace = true }
memmap2 = { version = "0.9", optional = true }
psionic-backend-cuda = { path = "../psionic-backend-cuda", optional = true }
psionic-backend-metal = { path = "../psionic-backend-metal", optional = true }
psionic-runtime = { path = "../psionic-runtime", optional = true }
psionic-models = { path = "../psionic-models", features = ["deepseek-v41-fixtures"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
stage-link = { path = "../../../stage-link" }
tokio = { workspace = true }
tokio-stream = "0.1.17"
tokenizers = { version = "0.23.1", default-features = false, features = ["onig"] }

[dev-dependencies]
tempfile = "3"
