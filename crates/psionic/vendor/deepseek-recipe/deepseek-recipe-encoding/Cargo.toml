# Vendored from deepseek-ai/deepseek-recipe at commit
# 935817c66f5d6e64838f419692545f06787e485f. See docs/dependencies.md.
# Downstream change: tokenizers leaves out its default features and the
# `http` downloader. Psionic loads tokenizer files that it pins itself.
[package]
name = "deepseek-recipe-encoding"
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/deepseek-ai/deepseek-recipe"
publish = false
description = "Conversation rendering and token encoding for DeepSeek V4 and V4.1 prompts."

[features]
# Runs the upstream tests that read the full V4.1 tokenizer from the path in
# DEEPSEEK_RECIPE_V41_TOKENIZER.
upstream-tokenizer-tests = []

[dependencies]
aho-corasick = "1.1.3"
deepseek-recipe-core = { path = "../deepseek-recipe-core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
thiserror = "2.0.17"
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
tracing = "0.1.41"
