# Vendored subset of deepseek-ai/deepseek-recipe at commit
# 935817c66f5d6e64838f419692545f06787e485f: the streamed output parser, the
# request options, and output-constraint selection. The protocol adapters,
# image handling, and demo servers are left out. See docs/dependencies.md.
[package]
name = "deepseek-recipe"
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/deepseek-ai/deepseek-recipe"
publish = false
description = "Streamed output parsing and request options for DeepSeek models (vendored subset)."

[features]
# Runs the upstream tests that read the full V4.1 tokenizer from the path in
# DEEPSEEK_RECIPE_V41_TOKENIZER.
upstream-tokenizer-tests = []

[dependencies]
async-stream = "0.3.6"
deepseek-recipe-core = { path = "../deepseek-recipe-core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
tokio-stream = "0.1.17"

[dev-dependencies]
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
