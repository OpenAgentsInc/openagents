# An empty stand-in for the root workspace's hakari package. Psionic links
# `crates/stage-link` from the root workspace by path, and that crate names
# `openagents-workspace-hack`, which only unifies the root workspace's
# dependency features. Psionic has no such package, so this one is empty.
[package]
name = "openagents-workspace-hack"
version = "0.1.0"
edition = "2021"
description = "Empty stand-in for the root workspace's hakari package"
publish = false
