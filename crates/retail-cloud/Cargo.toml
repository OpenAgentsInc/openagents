[package]
name = "retail-cloud"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The retail cloud computer behind the paid-availability gate: top-ups, offers, holds, provisioning, dispatch, metering, teardown, settlement, and recovery against fake payments and providers, with the live Boat binding behind the `boat` feature (docs/cloud/retail-service.md)."

[features]
# The live Boat binding (`retail_cloud::boat`), for the funded qualification.
boat = ["dep:boat", "dep:tokio"]

[dependencies]
boat = { path = "../boat", optional = true }
hex = "0.4"
nostr = { path = "../nostr" }
openagents-wallet = { path = "../wallet", default-features = false }
pay-ledger = { path = "../pay-ledger" }
route-contract = { path = "../route-contract" }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt", "time", "net"], optional = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
