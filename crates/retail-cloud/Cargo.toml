[package]
name = "retail-cloud"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The retail cloud computer behind the paid-availability gate: top-ups, offers, holds, provisioning, dispatch, metering, teardown, settlement, and recovery against fake payments and providers (docs/cloud/retail-service.md)."

[dependencies]
hex = "0.4"
openagents-wallet = { path = "../wallet", default-features = false }
pay-ledger = { path = "../pay-ledger" }
route-contract = { path = "../route-contract" }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
