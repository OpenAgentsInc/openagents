[package]
name = "retail-qualify"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Retail cloud acceptance, funded-qualification planning, and the fail-closed launch gate (docs/cloud/retail-qualification.md)."

[[bin]]
name = "retail-qualify"
path = "src/bin/retail-qualify.rs"

[dependencies]
compute-workbench = { path = "../compute-workbench", features = ["host"] }
pay-ledger = { path = "../pay-ledger" }
retail-cloud = { path = "../retail-cloud" }
route-contract = { path = "../route-contract" }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
