[package]
name = "retail-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Authenticated retail customer transport and restart-durable lifecycle worker."

[dependencies]
axum = "0.8"
boat = { path = "../boat" }
fs2 = "0.4"
libc = "0.2"
openagents-wallet = { path = "../wallet", default-features = false }
pay-ledger = { path = "../pay-ledger" }
retail-cloud = { path = "../retail-cloud", features = ["boat"] }
retail-qualify = { path = "../retail-qualify" }
route-contract = { path = "../route-contract" }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "signal", "sync", "macros"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tempfile = "3"

[lints]
workspace = true
