[package]
name = "robot-lab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Checked Robot Lab documents, private project storage, and typed operations"

[features]
# `migrate::import`, which writes a local project into a Labs platform store.
platform = ["dep:lab-store"]

[dependencies]
base64 = "0.22"
lab-kit = { path = "../lab-kit" }
schemars = "1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"

# The private project file store is native-only: the browser Verse build
# (wasm32) reads checked documents and never opens a lab on disk.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fs2 = "0.4.3"
robot-description = { path = "../robot-description" }
glam = "0.30.10"
roxmltree = "0.21.1"
tempfile = "3"
lab-store = { path = "../lab-store", optional = true }

[dev-dependencies]
oa-copy = { path = "../oa-copy" }
lab-store = { path = "../lab-store" }
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
