[package]
name = "robot-policy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Pinned robot policies, ACT inference, preprocessing, and bounded control"

[dependencies]
candle-core = "0.11"
candle-nn = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"
robot-lab = { path = "../robot-lab" }
robot-sim = { path = "../robot-sim" }
robot-data = { path = "../robot-data", features = ["export"] }

[dev-dependencies]
tempfile = "3"
oa-copy = { path = "../oa-copy" }

[lints]
workspace = true
