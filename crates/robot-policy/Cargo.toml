[package]
name = "robot-policy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Pinned robot policies, ACT inference, preprocessing, and bounded control"

[dependencies]
candle-core = "0.11"
candle-nn = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"
base64 = "0.22"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }
robot-lab = { path = "../robot-lab" }
robot-sim = { path = "../robot-sim" }
robot-data = { path = "../robot-data", features = ["export"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
oa-copy = { path = "../oa-copy" }

[lints]
workspace = true
