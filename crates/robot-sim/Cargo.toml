[package]
name = "robot-sim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Bounded Robot Lab experiments with an optional native MuJoCo backend"

[[example]]
name = "so101_run"
required-features = ["mujoco"]

[[example]]
name = "lagrange2_arm_oracle"
required-features = ["mujoco"]

[[example]]
name = "batch_bench"
required-features = ["mujoco"]

[features]
default = []
mujoco = ["dep:libloading", "dep:roxmltree"]

[dependencies]
robot-lab = { path = "../robot-lab" }
robot-description = { path = "../robot-description" }
glam = "0.30.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"
fs2 = "0.4"
tempfile = "3"
libloading = { version = "0.8.9", optional = true }
roxmltree = { version = "0.21.1", optional = true }

[dev-dependencies]
tempfile = "3"
# The batch benchmark's native 50-body pile (examples/batch_bench.rs).
physics = { path = "../physics" }
oa-copy = { path = "../oa-copy" }
# The Lagrange 2 arm's MuJoCo reference (examples/lagrange2_arm_oracle.rs).
verse-lagrange2 = { path = "../verse-lagrange2" }

[lints]
workspace = true
