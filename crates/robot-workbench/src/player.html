<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Robot Lab</title>
<style>html{color-scheme:dark;background:#141411;color:#eee;font:15px system-ui}body{margin:0;max-width:1100px;margin-inline:auto}header,section{padding:12px}h1{margin:0;font-size:20px}canvas{display:block;width:100%;height:min(58vh,560px);touch-action:none}button,input,select{font:inherit;border:1px solid #555;border-radius:6px;padding:6px;background:#252521;color:#eee}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}label{display:inline-flex;align-items:center;gap:8px;margin:5px 12px 5px 0}#controls{display:flex;gap:8px;flex-wrap:wrap}#status{margin:6px 0;color:#ddd}#note{width:min(65vw,600px)}#poster{width:100%;display:block}#readout{font-variant-numeric:tabular-nums}#comparison-label{display:flex;justify-content:space-around}#arm{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:4px 16px}#arm label{display:grid;grid-template-columns:7.5em 1fr 4.5em;margin:0}#arm output{font-variant-numeric:tabular-nums;text-align:right}#arm p{grid-column:1/-1;margin:4px 0;color:#bbb}#expanded{position:fixed;inset:0;z-index:10;background:#141411}a{color:#ead59a}</style>
<style>[hidden]{display:none!important}button,input,select{min-height:40px}button{min-width:44px}</style>
<body><header><h1>Robot Lab</h1><p id="status" role="status" aria-live="polite">Opening the scene…</p></header>
<main><img id="poster" alt="Robot and table preview" hidden><img id="sensor" alt="Recorded robot camera" style="width:100%" hidden><p id="sensor-time" hidden></p><canvas id="robot-canvas" aria-label="Robot and table in 3D" tabindex="0" hidden></canvas>
<div id="comparison-label"></div><section id="controls"></section><section id="arm" hidden></section><section id="inspector"></section><section id="notes"></section></main>
<script type="module" src="build/start.js"></script></body></html>
