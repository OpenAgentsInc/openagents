[package]
name = "route-contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The agentic execution router's frozen contract: admission snapshot, route result, offer, and lifecycle (docs/api/2026-10-02-agentic-execution-router.md)."

[dependencies]
