# The desktop adapter for Rust Native views: lays out a validated view in
# Rust with the bundled fonts, paints it in software, and shows it in a
# `winit` window over a `wgpu` surface.
[package]
name = "rust-native-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "A desktop adapter for Rust Native views: layout, software painting, and a native window."

[features]
default = ["window"]
# The native window. Without it the crate still lays out and paints views
# into frames, which is what tests and captures use.
window = ["dep:winit", "dep:wgpu", "dep:pollster", "dep:rfd", "dep:arboard", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation"]

[dependencies]
# The semantic views, and the bundled faces and line breaking it shapes with.
rust-native = { path = "../rust-native", features = ["shaping"] }
serde = { version = "1", features = ["derive"] }
swash = "0.2.10"
png = "0.18.1"
resvg = { version = "0.48.1", default-features = false }
rfd = { version = "0.17.2", optional = true }
arboard = { version = "3.6.1", features = ["wayland-data-control"], optional = true }
pollster = { version = "0.4", optional = true }
wgpu = { version = "29.0.4", optional = true }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"], optional = true }

# The Mac's visible frame (the display without the menu bar and the Dock),
# for a window that opens filling it.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", optional = true }
objc2-app-kit = { version = "0.3.2", optional = true, default-features = false, features = ["std", "objc2-core-foundation", "NSScreen", "NSWindow", "NSView", "NSControl", "NSButton", "NSResponder"] }
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSArray", "NSGeometry"] }

[dev-dependencies]
# Parses and validates the backdrop's shader with the naga release wgpu uses.
naga = { version = "29.0.4", features = ["wgsl-in"] }

[lints]
workspace = true
