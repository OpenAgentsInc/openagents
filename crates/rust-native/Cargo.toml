[package]
name = "rust-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
license = "Apache-2.0"
readme = "README.md"
description = "Experimental reusable semantic views, typed intents, styles, and native-renderer contracts."
include = ["src/**", "include/**", "examples/**", "docs/**", "fonts/**", "README.md", "LICENSE"]

[features]
# Exports the transcript layout's C interface (`include/rust_native_layout.h`)
# from the application library that links this crate.
ffi = []
# Shapes transcript text in Rust with the bundled fonts (`layout::shape`), so
# an adapter can lay out without a platform text-engine callback.
shaping = ["dep:swash"]

[dependencies]
# Markdown is parsed in Rust into typed blocks; adapters only lay them out.
pulldown-cmark = { version = "0.13.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swash = { version = "0.2.10", optional = true }
unicode-segmentation = "1.13.3"
tree-sitter-highlight = "0.27.0"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-bash = "0.25.1"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-go = "0.25.0"
tree-sitter-cpp = "0.23.4"
tree-sitter-c = "0.24.2"
tree-sitter-html = "0.23.2"
tree-sitter-css = "0.25.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
