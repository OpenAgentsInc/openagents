[package]
name = "rust-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
license = "Apache-2.0"
readme = "README.md"
description = "Experimental reusable semantic views, typed intents, styles, and native-renderer contracts."
include = ["src/**", "include/**", "examples/**", "docs/**", "README.md", "LICENSE"]

[features]
# Exports the transcript layout's C interface (`include/rust_native_layout.h`)
# from the application library that links this crate.
ffi = []
# Shapes transcript text in Rust with the bundled font, Paper Mono
# (`layout::shape`), so an adapter can lay out without a platform text-engine
# callback.
shaping = ["dep:swash", "dep:paper-mono"]

[dependencies]
# Markdown is parsed in Rust into typed blocks; adapters only lay them out.
pulldown-cmark = { version = "0.13.4", default-features = false }
# The streaming cut every chat surface shares (#11112).
markdown-stream = { path = "../markdown-stream" }
# Component blocks in replies, drawn as their Markdown fallback (#11187).
openui-lang = { path = "../openui-lang" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swash = { version = "0.2.10", optional = true }
paper-mono = { path = "../paper-mono", optional = true }
unicode-segmentation = "1.13.3"
# Syntax classes for code blocks, shared with the terminal.
code-highlight = { path = "../code-highlight" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
