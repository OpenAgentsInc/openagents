[package]
name = "sand-garden"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlButtonElement", "HtmlInputElement", "HtmlDialogElement", "CanvasRenderingContext2d", "CanvasGradient", "CanvasPattern", "ImageData", "DomRect", "Event", "EventTarget", "PointerEvent", "KeyboardEvent", "Node", "NodeList", "Storage", "Request", "RequestInit", "RequestMode", "Response", "Headers", "Location"] }

[dev-dependencies]
oa-copy = { path = "../oa-copy" }

[lints]
workspace = true
