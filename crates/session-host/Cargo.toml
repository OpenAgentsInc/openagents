[package]
name = "session-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "NIP-SESS managed sessions: admitted opening, durable command and queue law, turn control, interactions, and history export/import."

[dependencies]
nostr = { path = "../nostr" }
workspace-host = { path = "../workspace-host" }
env-host = { path = "../env-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secp256k1 = { version = "0.31.1", features = ["rand"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
