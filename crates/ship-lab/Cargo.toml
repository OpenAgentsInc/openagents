[package]
name = "ship-lab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Ship Lab: edit Lagrange 2's spacecraft.v1 document by talking. Versioned ships, every edit checked by Spacecraft::edit (mass budget, thrust line, test burn, latch loads, assembly tree), and the local service the web chat's ship_* tools call."

[dependencies]
verse-lagrange2 = { path = "../verse-lagrange2" }
lab-kit = { path = "../lab-kit" }
axum = "0.8"
glam = "0.30.10"
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
