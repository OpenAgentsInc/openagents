[package]
name = "snap-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Snap Station in a browser: drag-and-snap building and the Go run, drawn with WebGL2."

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# For captures only: the built-in bot builds each job.
autoplay = []

[dependencies]
snap-rules = { path = "../snap-rules" }
snap-share = { path = "../snap-share" }
serde_json = "1"
verse-game = { path = "../verse-game" }
glam = "0.30.10"

# The page itself is browser-only; natively only the meshes, the scene and
# the words are built, for their tests.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# The `wasm-bindgen` CLI that `scripts/build-snap-web.sh` runs must be the
# version Cargo.lock resolves here; the script checks.
wasm-bindgen = "0.2.128"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1.7"
web-sys = { version = "0.3", features = [
    "Blob", "BlobPropertyBag", "Crypto", "File", "FileList", "HtmlInputElement", "HtmlAnchorElement", "Url", "Request", "RequestInit", "Response", "Headers",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioContext",
    "AudioDestinationNode",
    "AudioNode",
    "AudioParam",
    "AudioScheduledSourceNode",
    "BaseAudioContext",
    "BiquadFilterNode",
    "BiquadFilterType",
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "GainNode",
    "Gamepad",
    "GamepadButton",
    "GamepadMappingType",
    "Navigator",
    "NodeList",
    "HtmlButtonElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "KeyboardEvent",
    "Location",
    "MediaQueryList",
    "Node", "Text",
    "OscillatorNode",
    "OscillatorType",
    "Performance",
    "PointerEvent",
    "Storage",
    "WebGl2RenderingContext",
    "WebGlBuffer",
    "WebGlProgram",
    "WebGlShader",
    "WebGlUniformLocation",
    "WebGlVertexArrayObject",
    "WheelEvent",
    "Window",
    "console",
] }

[dev-dependencies]
oa-copy = { path = "../oa-copy" }

[lints]
workspace = true
