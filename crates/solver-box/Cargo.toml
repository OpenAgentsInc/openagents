[package]
name = "solver-box"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Runs cloud Solver jobs on account-owned computers, with recovery and legacy Boat cleanup."
publish = false

[[bin]]
name = "oa-solver-box"
path = "src/main.rs"

[dependencies]
boat = { path = "../boat" }
openagents-sdk = { path = "../openagents-sdk" }
fs2 = "0.4"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
axum = "0.8"
base64 = "0.22"
tempfile = "3"

[lints]
workspace = true
