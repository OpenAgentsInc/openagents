[package]
name = "sov-treasury"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "NIP-SOV treasury: account/beneficiary binding, verified income, and approved X402 purchases under one durable allowance."

[dependencies]
nostr = { path = "../nostr" }
workspace-host = { path = "../workspace-host" }
openagents-x402 = { path = "../x402" }
pay-ledger = { path = "../pay-ledger" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secp256k1 = { version = "0.31.1", features = ["rand"] }
hex = "0.4"

[dev-dependencies]
nostr = { path = "../nostr", features = ["test-invoice"] }
sha2 = "0.11.0"
tempfile = "3"

[lints]
workspace = true
