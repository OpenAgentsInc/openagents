[package]
name = "space-key-broker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "SPACE intermediate keys wrapped by Google Cloud KMS"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
crc32c = "0.6"
getrandom = "0.4"
prost = "0.13"
prost-types = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal"] }
tonic = { version = "=0.12.3", features = ["transport", "tls-webpki-roots"] }
uuid = "1"
zeroize = "1"

[build-dependencies]
tonic-build = "=0.12.3"

[dev-dependencies]
aes-gcm = "0.10"
tokio-stream = { version = "0.1", features = ["net"] }

[lints]
workspace = true
