[package]
name = "spark-wallet-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The opt-in browser Spark wallet, implemented in Rust and compiled to Wasm."

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
openagents-spark = { path = "../spark-wallet" }
bitcoin-amount = { path = "../bitcoin-amount" }
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4"
zeroize = "1"
web-sys = { version = "0.3", features = ["Window","Document","Element","HtmlElement","HtmlInputElement","HtmlTextAreaElement","HtmlButtonElement","Event","PageTransitionEvent","EventTarget","Location"] }

[lints]
workspace = true
