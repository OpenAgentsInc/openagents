[package]
name = "openagents-spark"
version.workspace = true
edition.workspace = true
publish = false
description = "The person's Spark wallet (Breez SDK), shared by the phone and computers."

[dependencies]
# Breez's Spark SDK without its SQLite store: the computers' workspace links
# `ldk-node`'s `libsqlite3-sys` 0.28 and Breez's SQLite needs 0.30, which one
# lock file cannot hold. Computers keep the SDK's records in `store` (a JSON
# file); the phone, its own workspace, enables `sqlite` there.
breez-sdk-spark = { git = "https://github.com/breez/spark-sdk", tag = "0.26.0", default-features = false }
async-trait = "0.1"
bip39 = "2"
bitcoin-amount = { path = "../bitcoin-amount" }
# The fingerprint that names a seed without revealing it.
sha2 = "0.10"
# The link envelope: NIP-44 v2 to a one-time key (`link`).
nostr = { path = "../nostr" }
secp256k1 = "0.31.1"
getrandom = "0.3"
# Idempotency keys for payments.
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "fs"] }
url = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
breez-sdk-spark = { git = "https://github.com/breez/spark-sdk", tag = "0.26.0", default-features = false, features = ["test-utils"] }
tempfile = "3"
getrandom = "0.3"

[lints]
workspace = true
