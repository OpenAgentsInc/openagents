[package]
name = "openagents-spark"
version.workspace = true
edition.workspace = true
publish = false
description = "The person's Spark wallet (Breez SDK), shared by the phone and computers."

[dependencies]
# Breez's Spark SDK without its SQLite store: the computers' workspace links
# `ldk-node`'s `libsqlite3-sys` 0.28 and Breez's SQLite needs 0.30, which one
# lock file cannot hold. Computers keep the SDK's records in `store` (a JSON
# file); the phone, its own workspace, enables `sqlite` there.
breez-sdk-spark = { git = "https://github.com/breez/spark-sdk", tag = "0.26.0", default-features = false }
async-trait = "0.1"
bip39 = { version = "2", features = ["zeroize"] }
bitcoin-amount = { path = "../bitcoin-amount" }
# The fingerprint that names a seed without revealing it.
sha2 = "0.10"
# The link envelope: NIP-44 v2 to a one-time key (`link`).
nostr = { path = "../nostr" }
secp256k1 = "0.31.1"
getrandom = "0.3"
# Idempotency keys for payments.
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[dev-dependencies]
breez-sdk-spark = { git = "https://github.com/breez/spark-sdk", tag = "0.26.0", default-features = false, features = ["test-utils"] }
tempfile = "3"
getrandom = "0.3"

[lints]
workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
openagents-workspace-hack = { version = "0.1" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
user-home = { path = "../user-home" }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "fs"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", features = ["time", "sync", "macros"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
