[package]
name = "suggestion-inbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The encrypted suggestion inbox and its screened, read-only service."

[dependencies]
axum = "0.8"
nostr = { path = "../nostr" }
playtest = { path = "../playtest" }
secp256k1 = { version = "0.31.1", features = ["rand"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
verse-net = { path = "../verse-net" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
base64 = "0.22"

[lints]
workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
openagents-workspace-hack = { version = "0.1" }
