[package]
name = "supervise"
version.workspace = true
edition = "2024"
rust-version = "1.95"
description = "One subprocess supervisor: a job owns its process tree, and its output is bounded while it is read."
publish = false

[dependencies]
libc = "0.2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"], optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[features]
default = ["job"]
# The asynchronous supervisor. A caller that keeps its own output on disk
# takes the blocking half instead, which needs no asynchronous runtime.
job = ["dep:tokio"]

[lints]
workspace = true
