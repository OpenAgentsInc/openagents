[package]
name = "tenancy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The tenant-to-artifact registry: a versioned binding from tenant identity to the doors, artifact digests, and execution configuration a request may be served under."
publish.workspace = true

[dependencies]
pay-ledger = { path = "../pay-ledger" }
receipts = { path = "../receipts" }
gym = { path = "../gym" }
getrandom = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
secp256k1 = "0.31.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"], optional = true }
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1"], optional = true }

[features]
# Keep the account service's stores in Postgres when a database is
# attached to their directory (`tenancy::db`, #11154).
postgres = ["dep:tokio", "dep:tokio-postgres"]

[[bin]]
name = "tenant-db"
required-features = ["postgres"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
openagents-workspace-hack = { version = "0.1" }
