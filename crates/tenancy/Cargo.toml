[package]
name = "tenancy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The tenant-to-artifact registry: a versioned binding from tenant identity to the doors, artifact digests, and execution configuration a request may be served under."
publish.workspace = true

[dependencies]
gym = { path = "../gym" }
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
