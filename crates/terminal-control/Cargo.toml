[package]
name = "terminal-control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Private same-user socket adapter for shared terminal control requests."

[dependencies]
terminal-core = { path = "../terminal-core" }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
private-fs = { path = "../private-fs" }
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "macros", "sync"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }
