[package]
name = "terminal-gfx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Shared terminal glyph renderer and native local-session adapters."

[dependencies]
serde = { version = "1", features = ["derive"] }
terminal-control = { path = "../terminal-control" }
terminal-core = { path = "../terminal-core" }
coder-vt = { path = "../coder-vt" }
coder-pty = { path = "../coder-pty" }
coder-ui = { path = "../coder-ui" }
verse-gfx = { path = "../verse-gfx", default-features = false }
winit = "0.30.12"
arboard = "3.6.1"
memmap2 = "0.9"
libc = "0.2"
serde_json = "1"
bytemuck = "1.25"
swash = "0.2.10"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
