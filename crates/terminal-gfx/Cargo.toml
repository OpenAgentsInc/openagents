[package]
name = "terminal-gfx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Shared terminal glyph renderer and native local-session adapters."

[features]
default = ["native"]
native = ["fonts", "dep:terminal-remote", "dep:terminal-control", "dep:winit", "dep:arboard", "dep:libc", "coder-pty/host"]
fonts = ["dep:memmap2", "dep:swash"]

[dependencies]
terminal-remote = { path = "../terminal-remote", optional = true }
serde = { version = "1", features = ["derive"] }
terminal-control = { path = "../terminal-control", optional = true }
terminal-core = { path = "../terminal-core" }
coder-vt = { path = "../coder-vt" }
coder-pty = { path = "../coder-pty", default-features = false }
coder-ui = { path = "../coder-ui" }
verse-gfx = { path = "../verse-gfx", default-features = false }
winit = { version = "0.30.12", optional = true }
arboard = { version = "3.6.1", optional = true }
memmap2 = { version = "0.9", optional = true }
libc = { version = "0.2", optional = true }
serde_json = "1"
bytemuck = "1.25"
swash = { version = "0.2.10", optional = true }
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
