[package]
name = "terminal-studio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Admitted studio projections and native host adapters for the shared workbench."

[features]
onboarding-host = ["dep:coder-host", "dep:coder", "dep:contribution-workbench", "dep:coder-pty", "dep:workbench"]
acceptance = ["dep:coder", "dep:coder-host", "dep:tokio", "dep:tempfile"]

[[example]]
name = "studio-acceptance"
required-features = ["acceptance"]

[dependencies]
contribution-workbench = { path = "../contribution-workbench", features = ["host"], optional = true }
coder-pty = { path = "../coder-pty", default-features = false, optional = true }
workbench = { path = "../workbench", optional = true }
route-contract = { path = "../route-contract" }
openagents-chat = { path = "../openagents-chat" }
coder = { path = "../coder", optional = true }
coder-host = { path = "../coder-host", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
tempfile = { version = "3", optional = true }
sha2 = "0.10"
openagents-connect = { path = "../openagents-connect" }
coder-access = { path = "../coder-access", default-features = false }
terminal-core = { path = "../terminal-core" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
