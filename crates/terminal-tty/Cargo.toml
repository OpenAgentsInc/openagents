[package]
name = "terminal-tty"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Hook-only terminal requests and exact pending proposals without a graphical runtime."

[dependencies]
user-home = { path = "../user-home" }
coder-pty = { path = "../coder-pty" }
coder-vt = { path = "../coder-vt" }
terminal-core = { path = "../terminal-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
openagents-workspace-hack = { version = "0.1" }
