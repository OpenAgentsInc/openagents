[package]
name = "vault-sealed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "NIP-VAULT sealed tier: attested-workload sessions, system key certificates, leases, revocation, and auditable disclosure over oa-vault and oa-att."

[dependencies]
oa-vault = { path = "../oa-vault" }
oa-att = { path = "../oa-att" }
nostr = { path = "../nostr" }
secp256k1 = { version = "0.31.1", features = ["rand"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
zeroize = "1.8"

[lints]
workspace = true
