[package]
name = "verse-content"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Portable content admission and Rust asset compilation for Verse"

[features]
default = []
compiler = ["dep:gltf", "dep:libm", "dep:png", "dep:resvg"]

[dependencies]
verse-engine = { path = "../verse-engine", features = ["asset-io"] }
verse-world = { path = "../verse-world" }
physics = { path = "../physics" }
glam = "0.30.10"
serde_json = "1"
sha2 = "0.10"
gltf = { version = "1.4.1", features = ["import", "utils", "names"], optional = true }
libm = { version = "0.2.16", optional = true }
png = { version = "0.18.1", optional = true }
resvg = { version = "0.48.1", default-features = false, optional = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[[bin]]
name = "verse-content"
path = "src/main.rs"
required-features = ["compiler"]
