[package]
name = "verse-content"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Portable content admission and Rust asset compilation for Verse"

[features]
default = []
compiler = ["authoring", "dep:gltf", "dep:libm", "dep:png", "dep:resvg"]
authoring = ["dep:secp256k1", "dep:png", "dep:serde", "dep:serde_path_to_error", "verse-world/service-auth"]

[dependencies]
# Paper Mono, the UI font the inventory records as a source.
paper-mono = { path = "../paper-mono" }
verse-engine = { path = "../verse-engine", features = ["asset-io"] }
verse-world = { path = "../verse-world" }
physics = { path = "../physics" }
glam = "0.30.10"
serde_json = "1"
serde = { version = "1", features = ["derive"], optional = true }
serde_path_to_error = { version = "0.1", optional = true }
sha2 = "0.10"
secp256k1 = { version = "0.31.1", optional = true }
gltf = { version = "1.4.1", features = ["import", "utils", "names", "KHR_materials_emissive_strength"], optional = true }
libm = { version = "0.2.16", optional = true }
png = { version = "0.18.1", optional = true }
resvg = { version = "0.48.1", default-features = false, optional = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[[bin]]
name = "verse-content"
path = "src/main.rs"
required-features = ["compiler"]
