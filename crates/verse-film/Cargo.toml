[package]
name = "verse-film"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The film engine's take: a scene recorded once as a stream of uploads and frames, which any renderer draws on demand. No GPU, no dependencies beyond serde_json for notes."
publish.workspace = true

[features]
default = []
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck", "dep:png"]
layers = ["dep:swash", "dep:paper-mono", "dep:oa-tokens", "dep:image"]

[dependencies]
serde_json = "1"
video-lab = { path = "../video-lab" }
wgpu = { version = "30.0.1", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1.25", features = ["derive"], optional = true }
png = { version = "0.18.1", optional = true }
swash = { version = "0.2.10", optional = true }
paper-mono = { path = "../paper-mono", optional = true }
oa-tokens = { path = "../oa-tokens", optional = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"], optional = true }

[lints]
workspace = true
