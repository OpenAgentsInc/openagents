[package]
name = "verse-gym"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The Grid's Gym: the boards inside the building, the hall's shared eval board and notes, and the published results panel with its trace replay."

[dependencies]
coder-ui = { path = "../coder-ui" }
glam = "0.30.10"
gym-leaderboard = { path = "../gym-leaderboard", default-features = false }
nostr = { path = "../nostr" }
secp256k1 = { version = "0.31.1", features = ["rand"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
verse-core = { path = "../verse-core" }
verse-net = { path = "../verse-net" }
verse-pbr = { path = "../verse-pbr" }

# The Gym's network workers, the results client, and the pylon league
# reader: native only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gym-bridge = { path = "../gym-bridge", default-features = false }
gym-leaderboard = { path = "../gym-leaderboard", default-features = false, features = ["client"] }
pylon = { path = "../pylon", default-features = false }
tokio = { version = "1", features = ["rt", "time", "net", "sync", "macros"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
pylon = { path = "../pylon", features = ["fixture"] }

[lints]
workspace = true
