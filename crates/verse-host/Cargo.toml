[package]
name = "verse-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Dedicated authenticated TLS world host without rendering or agent dependencies"

[dependencies]
verse-engine = { path = "../verse-engine", features = ["asset-io"] }
verse-world = { path = "../verse-world", features = ["service-net"] }
verse-content = { path = "../verse-content" }
tokio = { version = "1", features = ["rt", "signal"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"

[dev-dependencies]
glam = "0.30.10"
secp256k1 = "0.31.1"
tempfile = "3"
verse-content = { path = "../verse-content", features = ["compiler"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }

[lints]
workspace = true
