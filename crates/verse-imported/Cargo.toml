[package]
name = "verse-imported"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Verse's imported content and remote chamber: chamber play, combat, controls, overlay, and panels, and the RITUAL client connection."

[features]
# A chamber reached over TLS or a REACH channel, with its session, panels,
# and recorder.
remote-chamber = ["verse-world/service-auth", "verse-world/service-reach", "dep:tokio", "tokio/signal"]
# An in-process chamber host over memory streams, for other crates' tests.
chamber-loopback = ["remote-chamber", "tokio/io-util"]
imported-desktop = ["dep:winit", "verse-pbr/imported-desktop"]

[dependencies]
glam = "0.30.10"
physics = { path = "../physics" }
png = "0.18.1"
secp256k1 = { version = "0.31.1", features = ["rand"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
verse-content = { path = "../verse-content", features = ["compiler"] }
verse-core = { path = "../verse-core" }
verse-engine = { path = "../verse-engine", features = ["asset-io"] }
verse-gfx = { path = "../verse-gfx" }
verse-net = { path = "../verse-net" }
verse-pbr = { path = "../verse-pbr" }
verse-world = { path = "../verse-world", features = ["studio"] }
wgpu = "29.0.4"
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt", "time", "net", "sync", "macros"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
# Retained evaluated poses for the chamber's rendering checks.
verse-pbr = { path = "../verse-pbr", features = ["diagnostics"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }

[lints]
workspace = true
