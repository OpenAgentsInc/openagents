[package]
name = "verse-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Verse's Nostr session plumbing: the relay link, identities, NIP-MV frames, chat lines, the chat feed, and the XP ledger client."

[features]
# The XP ledger client (`xp`), which `verse`'s `xp-host` feature enables.
xp = ["dep:xp-ledger", "dep:reqwest"]
# Test-only constructors other crates' tests use, such as an idle relay link.
test-support = []

[dependencies]
coder-ui = { path = "../coder-ui" }
glam = "0.30.10"
nostr = { path = "../nostr" }
secp256k1 = { version = "0.31.1", features = ["rand"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
verse-gfx = { path = "../verse-gfx" }
# `Instant` from `performance.now()` in a browser, where `std::time::Instant`
# has no clock; the standard types elsewhere.
web-time = "1.1.0"
xp-ledger = { path = "../xp-ledger", optional = true }

# Network, TLS, and threads: native only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "time", "net", "sync", "macros"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
# The XP client's HTTP reads.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser's `crypto.getRandomValues` for key generation; the
# `getrandom_backend` flag is set in `.cargo/config.toml`.
getrandom = { version = "0.3", features = ["wasm_js"] }
# The browser's WebSocket for the relay link.
wasm-bindgen = "0.2.128"
web-sys = { version = "0.3", features = ["CloseEvent", "MessageEvent", "WebSocket", "Window"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }

[lints]
workspace = true
