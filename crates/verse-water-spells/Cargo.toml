[package]
name = "verse-water-spells"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Shared Verse water spell simulation, hotbar, projectiles, and floating bodies."

[dependencies]
glam = "0.30.10"
physics = { path = "../physics" }
verse-content = { path = "../verse-content", features = ["compiler"] }
verse-core = { path = "../verse-core" }
verse-gfx = { path = "../verse-gfx" }
verse-pbr = { path = "../verse-pbr" }
verse-world = { path = "../verse-world" }
verse-zone-everglade = { path = "../verse-zone-everglade" }
verse-zone-grove = { path = "../verse-zone-grove" }

[dev-dependencies]
bytemuck = "1.25"
png = "0.18.1"
pollster = "0.4"
serde_json = "1"
sha2 = "0.10"
verse-engine = { path = "../verse-engine", features = ["asset-io"] }
verse-net = { path = "../verse-net" }
wgpu = "29.0.4"

[lints]
workspace = true
