[package]
name = "verse-world"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Portable command admission and owned world authority for Verse"

[features]
service-auth = ["dep:secp256k1", "dep:sha2", "dep:getrandom"]

[dependencies]
secp256k1 = { version = "0.31.1", optional = true }
sha2 = { version = "0.10", optional = true }
getrandom = { version = "0.3", optional = true }
verse-engine = { path = "../verse-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
glam = { version = "0.30.10", features = ["serde"] }
physics = { path = "../physics" }

[lints]
workspace = true
