[package]
name = "verse-world"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Portable command admission and owned world authority for Verse"

[features]
service-net = ["service-auth", "dep:tokio", "dep:rustls", "dep:tokio-rustls"]
service-auth = ["dep:secp256k1", "dep:getrandom"]
service-reach = ["service-net", "dep:coder-reach"]

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "sync", "time"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, optional = true }
secp256k1 = { version = "0.31.1", optional = true }
sha2 = "0.10"
getrandom = { version = "0.3", optional = true }
verse-engine = { path = "../verse-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
glam = { version = "0.30.10", features = ["serde"] }
physics = { path = "../physics" }
coder-reach = { path = "../coder-reach", optional = true }

[dev-dependencies]
tempfile = "3"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }

[lints]
workspace = true
