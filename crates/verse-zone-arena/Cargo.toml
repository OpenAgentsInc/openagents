[package]
name = "verse-zone-arena"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Verse's Grid Arena zone: a robot duel on the Grid's floor, with real-time abilities, seeded SRD-style dice, and an enemy robot that fights back."

[dependencies]
coder-ui = { path = "../coder-ui" }
glam = "0.30.10"
serde = { version = "1", features = ["derive"] }
verse-core = { path = "../verse-core" }
verse-gfx = { path = "../verse-gfx" }
verse-pbr = { path = "../verse-pbr" }
verse-world = { path = "../verse-world" }

[dev-dependencies]
oa-copy = { path = "../oa-copy" }

[lints]
workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
openagents-workspace-hack = { version = "0.1" }
