[package]
name = "verse-zone-duel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Verse's Prussian duel: a Teutonic knight against an Old Prussian warrior on a grassy plain, with directional sword-and-board melee, armour by hit zone, and a fighter that reads your attacks."

[dependencies]
glam = "0.30.10"
physics = { path = "../physics" }
verse-core = { path = "../verse-core" }
verse-gfx = { path = "../verse-gfx" }
verse-pbr = { path = "../verse-pbr" }
verse-world = { path = "../verse-world" }

[dev-dependencies]
oa-copy = { path = "../oa-copy" }

[lints]
workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
openagents-workspace-hack = { version = "0.1" }
