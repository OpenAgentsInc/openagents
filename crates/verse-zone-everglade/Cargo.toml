[package]
name = "verse-zone-everglade"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Verse's Everglade zone: the city, Agent Studio, spells, hotbar, wildlife, and demolition yard, with the pinned pack and its compiler."

[features]
# The scripted Agent Studio team (`verse --studio-sim`).
model-host = ["dep:coder"]
# The Agent Studio from a live host, over its same-user control socket.
studio-host = ["dep:openagents-connect"]
# The studio's sounds and desktop notices.
desktop = ["dep:openagents-chat-app"]
# Dev only: Meteor Swarm and the sledgehammer on Everglade's hotbar, for
# testing destruction locally (`verse --features dev-destruction --
# --everglade --dev-destruction`). Off by default; the web and phone builds
# refuse to compile with it, and no release script enables it.
dev-destruction = []
# The Pylon Field from the relay: verified NIP-PYLON beacons, receipts, and
# pool aggregates on a background subscription (`compute::relay`). Native
# only; Verse's desktop feature turns it on, and the web and phones leave
# the field dormant.
pylon-relay = ["dep:pylon", "dep:tokio"]

[[bin]]
# The owner's private asset command (docs/verse/private-assets.md).
name = "verse-private"
path = "src/bin/verse_private/main.rs"

[dependencies]
atif = { path = "../atif" }
coder = { path = "../coder", optional = true }
coder-access = { path = "../coder-access", default-features = false }
coder-ui = { path = "../coder-ui" }
glam = "0.30.10"
gltf = { version = "=1.4.1", default-features = false, features = ["import", "utils", "names"] }
# Deflate for the zone pack's geometry; already in the tree through `png`.
miniz_oxide = "0.8.9"
openagents-chat-app = { path = "../openagents-chat-app", optional = true }
openagents-connect = { path = "../openagents-connect", optional = true }
physics = { path = "../physics" }
png = "0.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
town-clock = { path = "../town-clock" }
# The admitted villagers and their routines (`zones::everglade::townsfolk`).
townsfolk = { path = "../townsfolk" }
verse-content = { path = "../verse-content", features = ["compiler"] }
verse-core = { path = "../verse-core" }
verse-engine = { path = "../verse-engine", features = ["asset-io"] }
verse-gfx = { path = "../verse-gfx" }
verse-pbr = { path = "../verse-pbr" }
verse-world = { path = "../verse-world", features = ["studio"] }
# The real time for the town clock, on the web too.
web-time = "1.1.0"
# The world tree the layout generates (`zones::everglade::world_tree`).
world-tree = { path = "../world-tree" }

# Fetching and caching the pinned pack: native only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libc = "0.2"
# The Pylon Field's local source reads the lease table (`compute::local`).
coder-lease = { path = "../coder-lease" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
# Private packs for the owner (docs/verse/private-assets.md): native only, so
# the web build has no private path.
nostr = { path = "../nostr" }
# The Pylon Field's relay source (`pylon-relay`).
pylon = { path = "../pylon", optional = true }
tokio = { version = "1", features = ["rt", "time"], optional = true }
verse-private = { path = "../verse-private", features = ["client"] }

[dev-dependencies]
tempfile = "3"
verse-net = { path = "../verse-net" }

[lints]
workspace = true

