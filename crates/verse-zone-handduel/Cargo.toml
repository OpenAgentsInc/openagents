[package]
name = "verse-zone-handduel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Verse's Hand Duel: a sword-and-shield fight played with tracked hands, shield in the left, sword in the right, against a revenant with telegraphed blows."

[dependencies]
coder-ui = { path = "../coder-ui" }
glam = "0.30.10"
# The browser landmarker's packed frames, the smoothed trackers, and the
# pose rules from `crates/coder-hands`.
openagents-web-hands = { path = "../../apps/openagents/web/hands" }
verse-core = { path = "../verse-core" }
verse-gfx = { path = "../verse-gfx" }
verse-pbr = { path = "../verse-pbr" }
verse-world = { path = "../verse-world" }

[dev-dependencies]
oa-copy = { path = "../oa-copy" }

[lints]
workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
openagents-workspace-hack = { version = "0.1" }
