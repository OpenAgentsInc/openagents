[package]
name = "verse-zone-robotlab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The local Robot Lab room over shared checked scenes and recordings"
[dependencies]
robot-lab = { path = "../robot-lab" }
robot-description = { path = "../robot-description" }
glam = "0.30.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
verse-core = { path = "../verse-core" }
verse-pbr = { path = "../verse-pbr" }
verse-world = { path = "../verse-world" }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
robot-sim = { path = "../robot-sim" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = "2"
[dev-dependencies]
oa-copy = { path = "../oa-copy" }
tempfile = "3"
[lints]
workspace = true
