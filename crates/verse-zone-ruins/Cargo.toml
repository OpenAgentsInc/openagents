[package]
name = "verse-zone-ruins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Verse's Ruins zone: the pinned Wizard Woods pack loader and the retained Atlantis simulation drawn on the physical path."

[dependencies]
glam = "0.30.10"
sha2 = "0.10"
verse-core = { path = "../verse-core" }
verse-pbr = { path = "../verse-pbr" }
verse-ruins = { path = "../verse-ruins" }
verse-world = { path = "../verse-world" }

# Fetching and caching the pinned pack: native only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
