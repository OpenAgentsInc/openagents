[package]
name = "verse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Verse: a shared amber world simulation, Nostr session, and wgpu renderer with desktop and native surface adapters."
publish.workspace = true

[features]
default = ["desktop"]
desktop = ["dep:winit", "dep:arboard", "verse-zone-everglade/desktop", "model-host", "xp-host", "replay-host", "capture", "panels", "studio-host", "imported-desktop", "terminal", "crypt", "crypt-fight", "pylon-relay"]
# Everglade's Pylon Field from the relay's NIP-PYLON beacons beside this
# computer's own pylon (`zones::everglade::compute::relay`). Native only.
pylon-relay = ["verse-zone-everglade/pylon-relay"]
model-host = ["dep:coder", "dep:coder-delegate", "verse-zone-everglade/model-host"]
xp-host = ["dep:xp-ledger", "verse-net/xp"]
replay-host = ["dep:gym", "dep:knowledge"]
capture = []
# The crypt lab's models built into the binary (about 5.7 MB), which open
# the zone and show its plaza arch. A build without them has neither.
crypt = ["verse-zone-crypt/embedded"]
# The great crypt's models built into the binary (about 2.1 MB more, sharing
# the crypt lab's props), which `verse --crypt-fight` plays in.
crypt-fight = ["crypt", "verse-imported/crypt-fight"]
# Rust Native panels (the chat transcript and the diff pane) painted by
# `rust-native-desktop` and composited over the world.
panels = ["dep:rust-native-desktop", "dep:openagents-chat-app"]
# The in-world terminal overlay: panes on PTYs of this computer, drawn
# from a `coder-vt` grid. Native desktop only.
terminal = ["dep:openagents-chat", "dep:workbench", "dep:compute-workbench", "dep:contribution-workbench", "dep:terminal-studio", "dep:terminal-gfx", "dep:winit"]
# The Agent Studio from a live host, over its same-user control socket.
studio-host = ["dep:openagents-connect", "verse-zone-everglade/studio-host"]
imported-desktop = ["dep:winit", "capture", "native-audio", "imported-surface", "verse-pbr/imported-desktop", "verse-imported/imported-desktop"]
# The engine renderer presenting on a surface the host made (a phone's
# layer or window, a browser canvas); no window library.
imported-surface = ["verse-pbr/imported-surface"]
native-audio = ["dep:cpal", "dep:rtrb"]
hosted-social = ["verse-world/service-auth"]
remote-chamber = ["hosted-social", "verse-world/service-reach", "tokio/signal", "verse-imported/remote-chamber"]
# An in-process chamber host over memory streams, for other crates' tests.
chamber-loopback = ["remote-chamber", "tokio/io-util", "verse-imported/chamber-loopback"]
# The browser build (`wasm32-unknown-unknown`), used without default
# features: WebGL2 as well as WebGPU. Network, threads, processes, and disk
# are native-only by target, so this feature only adds what the web needs.
web = ["wgpu/webgl", "imported-surface"]
browser-chamber = ["web", "verse-imported/chamber-client", "verse-world/reach-client"]
# Dev only: Meteor Swarm and the sledgehammer on Everglade's hotbar behind
# `verse --dev-destruction`, to test destruction locally. Never in a
# default, web, phone, or release build; the web and phone targets refuse
# to compile with it.
dev-destruction = ["verse-zone-everglade/dev-destruction"]

[dependencies]
openagents-chat = { path = "../openagents-chat", optional = true }
contribution-workbench = { path = "../contribution-workbench", features = ["host"], optional = true }
compute-workbench = { path = "../compute-workbench", features = ["host"], optional = true }
rtrb = { version = "=0.4.0", optional = true }
verse-content = { path = "../verse-content", features = ["compiler"] }
# The studio review's copy-path key, on the desktop.
arboard = { version = "3.6.1", optional = true }
cpal = { version = "=0.18.2", optional = true }
gltf = { version = "=1.4.1", default-features = false, features = ["import", "utils", "names"] }
verse-engine = { path = "../verse-engine", features = ["asset-io"] }
verse-world = { path = "../verse-world", features = ["studio"] }
# The palette, UI batch, overlay, GLES variants, and camera; `verse`
# re-exports each module under its old path.
verse-gfx = { path = "../verse-gfx" }
# The relay link, identities, NIP-MV frames, chat, the feed, and the XP
# client; `verse` re-exports each module under its old path.
verse-net = { path = "../verse-net" }
# The PBR pipelines, the world mesh, and streamed content residency;
# `verse` re-exports each module under its old path.
verse-pbr = { path = "../verse-pbr" }
# The static world, zone controls and atmosphere, the avatar, particle
# effects, tooltips, and scene labels the zones share; `verse` re-exports
# each under its old path.
verse-core = { path = "../verse-core" }
# The imported content and the RITUAL client; `verse` re-exports them
# as `imported` and `ritual`.
verse-imported = { path = "../verse-imported" }
# The Grid's Gym boards, hall, notes, and results; `verse` re-exports them
# as `gym`, `gym_evals`, `gym_hall`, `gym_notes`, `gym_replay`, and
# `gym_results`.
verse-gym = { path = "../verse-gym" }
bytemuck = { version = "1.25", features = ["derive"] }
coder = { path = "../coder", optional = true }
coder-delegate = { path = "../coder-delegate", optional = true }
# The shared activity classifier a replay and a live Agent Studio both call.
atif = { path = "../atif" }
# The Agent Studio's NIP-HOST snapshot, update, and review shapes Everglade
# draws, without the host.
coder-access = { path = "../coder-access", default-features = false }
coder-ui = { path = "../coder-ui" }
terminal-control = { path = "../terminal-control" }
terminal-gfx = { path = "../terminal-gfx", optional = true }
terminal-studio = { path = "../terminal-studio", features = ["onboarding-host"], optional = true }
workbench = { path = "../workbench", optional = true }
coder-vt = { path = "../coder-vt", optional = true }
rust-native = { path = "../rust-native" }
rust-native-desktop = { path = "../rust-native-desktop", default-features = false, optional = true }
# The chat palette, transcript metrics, and unified diff document the
# desktop app's panels use.
openagents-chat-app = { path = "../openagents-chat-app", optional = true }
# The control protocol the studio reaches a host on this computer with.
openagents-connect = { path = "../openagents-connect", optional = true }
physics = { path = "../physics" }
# Everglade's town clock (`docs/verse/generative-agents.md`).
town-clock = { path = "../town-clock" }
# Everglade's townsfolk: rumors and talking (`docs/verse/generative-agents.md`).
townsfolk = { path = "../townsfolk" }
verse-lagrange = { path = "../verse-lagrange" }
# The Lagrange 1 zone; `verse` re-exports it as `zones::lagrange`.
verse-zone-lagrange = { path = "../verse-zone-lagrange" }
# The Physics Lab zone; `verse` re-exports it as `zones::lab`.
verse-zone-lab = { path = "../verse-zone-lab" }
# The crypt lab zone; `verse` re-exports it as `zones::crypt`.
verse-zone-crypt = { path = "../verse-zone-crypt" }
# The Water Lab zone; `verse` re-exports it as `zones::water`.
verse-zone-water = { path = "../verse-zone-water" }
verse-zone-coast = { path = "../verse-zone-coast" }
# Everglade with its pack, and the Grove on that pack; `verse` re-exports
# them as `zones::everglade`, `zones::everglade_pack`, and `zones::grove`.
verse-zone-everglade = { path = "../verse-zone-everglade" }
verse-zone-grove = { path = "../verse-zone-grove" }
glam = "0.30.10"
resvg = { version = "0.48.1", default-features = false }
# Replays read retained Microcoder runs and Fable 5.1 trajectories with the
# Gym's own readers, so a replay and `gym runs` agree on every number.
gym = { path = "../gym", optional = true }
# The Gym's published results: the contract and the results panel's view
# model, without the generator. Native builds add the client.
gym-leaderboard = { path = "../gym-leaderboard", default-features = false }
knowledge = { path = "../knowledge", optional = true }
# The XP ledger alone, so the phone reads XP without the knowledge base's
# model clients.
xp-ledger = { path = "../xp-ledger", optional = true }
nostr = { path = "../nostr" }
png = "0.18.1"
# Deflate for the zone pack's geometry; already in the tree through `png`.
miniz_oxide = "0.8.9"
pollster = "0.4"
secp256k1 = { version = "0.31.1", features = ["rand"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
sha2 = "0.10"
swash = "0.2.10"
futures-util = "0.3"
wgpu = "29.0.4"
# `wayland-csd-adwaita` is off: it pulls BSD-2-Clause `arrayref`, which deny.toml refuses.
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"], optional = true }

# `Instant` and `SystemTime` from `performance.now()` and `Date.now()` in a
# browser, where the standard types have no clock; the standard types
# elsewhere.
web-time = "1.1.0"

# Network, TLS, threads, and the disk caches: native only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The screen check: an agent opens a window only under a screen lease.
coder-lease = { path = "../coder-lease" }
gym-bridge = { path = "../gym-bridge", default-features = false }
# The fetch-verify-cache client for the Gym's published results.
gym-leaderboard = { path = "../gym-leaderboard", default-features = false, features = ["client"] }
libc = "0.2"
# The owner's private placements (docs/verse/private-assets.md).
verse-private = { path = "../verse-private" }
coder-pty = { path = "../coder-pty", optional = true }
# The terminal's fallback fonts, mapped rather than read: the system emoji
# font is about 190 MB.
memmap2 = { version = "0.9", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "time", "net", "sync", "macros"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser's `crypto.getRandomValues` for key generation; the
# `getrandom_backend` flag is set in `.cargo/config.toml`.
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
verse-pbr = { path = "../verse-pbr", features = ["diagnostics"] }
verse-host = { path = "../verse-host" }
verse-net = { path = "../verse-net", features = ["test-support"] }
# The in-process chamber the remote-chamber tests play against.
verse-imported = { path = "../verse-imported", features = ["chamber-loopback"] }
tempfile = "3"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
# A scratch host the live studio source is tested against.
coder-host = { path = "../coder-host" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
# The GLES test translates every shader with the naga release wgpu uses.
naga = { version = "29.0.4", features = ["wgsl-in", "glsl-out", "msl-out"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Tags the desktop window's layer for extended dynamic range (src/edr.rs).
objc2 = "0.6"

[lints]
workspace = true

