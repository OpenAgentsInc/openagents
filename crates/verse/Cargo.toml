[package]
name = "verse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Verse: the OpenAgents desktop world. A Tron-style amber line city with a WoW-style player controller, rendered with wgpu."
publish.workspace = true

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
coder = { path = "../coder" }
coder-one = { path = "../coder-one" }
coder-terminal = { path = "../coder-terminal" }
glam = "0.30.10"
knowledge = { path = "../knowledge" }
nostr = { path = "../nostr" }
png = "0.18.1"
pollster = "0.4"
secp256k1 = "0.31.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swash = "0.2.10"
tokio = { version = "1", features = ["rt"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
wgpu = "29.0.4"
# `wayland-csd-adwaita` is off: it pulls BSD-2-Clause `arrayref`, which deny.toml refuses.
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }

[lints]
workspace = true
