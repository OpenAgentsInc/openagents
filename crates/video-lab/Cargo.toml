[package]
name = "video-lab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Video Lab's kind for the Labs platform: cut, shot and scene documents, their checks, edits and timeline"

# The rules are pure: facts that need media (probes, still stretches,
# speech, text layout) arrive as Measurements. `runner` is the Labs
# worker's ffmpeg jobs that make them, and the only module that reads files.
[dependencies]
base64 = "0.22"
lab-kit = { path = "../lab-kit" }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }

[lints]
workspace = true
