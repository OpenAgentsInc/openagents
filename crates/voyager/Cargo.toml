[package]
name = "voyager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Open-ended agent episodes in a Minecraft world: a supervised local server, a nightly-built azalea helper speaking line-delimited JSON, and an ATIF trace of every step."
publish.workspace = true

[dependencies]
atif = { path = "../atif" }
jev = { path = "../jev", features = ["blocking"] }
nostr = { path = "../nostr" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
mlua = { version = "0.11", features = ["lua54", "vendored", "serialize", "send"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
supervise = { path = "../supervise", default-features = false }
thiserror = "2"
libc = "0.2"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "voyager"
path = "src/bin/voyager.rs"

[lints]
workspace = true
