[package]
name = "openagents-wallet"
version = "0.1.0"
edition = "2024"
license = "CC-0"
publish = false
description = "Lightning wallet for openagents: an x402 receiver and payer on an exclusively held node key"

[lib]
name = "openagents_wallet"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
libc = "0.2"
rusqlite = { version = "0.31", features = ["bundled"] }
# MoneyDevKit's fork of ldk-node 0.7.0. It adds the LSPS4 client, whose
# JIT-channel invoices the local node signs itself, so the node id stays
# a valid x402 `payTo`.
ldk-node = { git = "https://github.com/moneydevkit/ldk-node", rev = "799e5be2ffaaaf2524d848ea1ba37bd15769f403", optional = true }

[features]
default = ["ldk"]
ldk = ["dep:ldk-node"]

[dev-dependencies]
nostr = { path = "../nostr" }
