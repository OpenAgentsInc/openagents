[package]
name = "workspace-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "NIP-WS source-bound documents, exact admission, and finite synchronized views."

[dependencies]
nostr = { path = "../nostr" }
workbench = { path = "../workbench" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secp256k1 = { version = "0.31.1", features = ["rand"] }
fs2 = "0.4"
tempfile = "3"

[lints]
workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
openagents-workspace-hack = { version = "0.1" }
