[package]
name = "openagents-x402"
version = "0.1.0"
edition = "2024"
license = "CC-0"
publish = false
description = "x402 exact Lightning over HTTP for openagents: the embedded facilitator, its replay store, and the header codecs"

[lib]
name = "openagents_x402"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
hex = "0.4"
nostr = { path = "../nostr" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
thiserror = "2"

