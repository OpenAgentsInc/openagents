# Server-only image packaging. Source stays in crates/coder-sync/src/server.
# This workspace never includes the frozen Coder client library. The sync
# clients come from the OpenAgents apps in apps/openagents (path dependencies).
[workspace]
members = ["conformance"]
default-members = ["."]

[workspace.dependencies]
openagents = { package = "openagents-sdk", path = "../../crates/openagents-sdk" }
openagents-sync = { path = "../../apps/openagents/crates/sync" }
openagents-client = { path = "../../apps/openagents/crates/client" }
openagents-proto = { path = "../../apps/openagents/crates/proto" }
openagents-doc = { path = "../../apps/openagents/crates/doc" }
openagents-rpc = { path = "../../apps/openagents/crates/rpc" }

[package]
name = "coder-sync-service"
version = "1.0.0"
edition = "2024"
rust-version = "1.98.1"
publish = false
autotests = false

[lib]
name = "coder_sync"
path = "lib.rs"

[[bin]]
name = "coder-sync"
path = "../../crates/coder-sync/src/main.rs"

[features]
server = []

[dependencies]
openagents.workspace = true
openagents-proto.workspace = true
sha2 = "0.10"
openagents-rpc.workspace = true
openagents-doc.workspace = true
openagents-sync.workspace = true
base64 = "0.22"
axum = { version = "0.8", features = ["ws"] }
bytes = { version = "1" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { version = "2" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-postgres = { version = "0.7.18" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
push-gateway = { path = "../../crates/push-gateway", default-features = false }
secp256k1 = { version = "0.31.1" }
