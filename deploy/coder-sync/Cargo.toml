# Server-only image packaging. Source stays in crates/coder-sync/src/server.
# This workspace never includes the frozen Coder client library.
[workspace]
members = ["conformance"]
default-members = ["."]

[workspace.metadata.conformance]
fork-revision = "9c58d1af0eb2e8cc750b65b5bafc435392010f15"

[workspace.dependencies]
zeron-sync = { git = "https://github.com/OpenAgentsInc/coder-desktop", rev = "9c58d1af0eb2e8cc750b65b5bafc435392010f15" }
zeron-client = { git = "https://github.com/OpenAgentsInc/coder-desktop", rev = "9c58d1af0eb2e8cc750b65b5bafc435392010f15" }
zeron-proto = { git = "https://github.com/OpenAgentsInc/coder-desktop", rev = "9c58d1af0eb2e8cc750b65b5bafc435392010f15" }
zeron-doc = { git = "https://github.com/OpenAgentsInc/coder-desktop", rev = "9c58d1af0eb2e8cc750b65b5bafc435392010f15" }
zeron-rpc = { git = "https://github.com/OpenAgentsInc/coder-desktop", rev = "9c58d1af0eb2e8cc750b65b5bafc435392010f15" }

[package]
name = "coder-sync-service"
version = "1.0.0"
edition = "2024"
rust-version = "1.98.1"
publish = false
autotests = false

[lib]
name = "coder_sync"
path = "lib.rs"

[[bin]]
name = "coder-sync"
path = "../../crates/coder-sync/src/main.rs"

[features]
server = []

[dependencies]
zeron-proto.workspace = true
sha2 = "0.10"
zeron-rpc.workspace = true
zeron-doc.workspace = true
zeron-sync.workspace = true
base64 = "0.22"
axum = { version = "0.8", features = ["ws"] }
bytes = { version = "1" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { version = "2" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-postgres = { version = "0.7.18" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
