# Builds and pushes the coder-sync image from the context
# scripts/coder-sync/deploy.py exports, with the dependency layers kept in a
# registry cache between builds (scripts/deploy/cloud-buildx.sh, #12177).
steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - scripts/deploy/cloud-buildx.sh
      - deploy/coder-sync/Dockerfile
      - us-central1-docker.pkg.dev/openagentsgemini/openagents/coder-sync:${_TAG}
      - coder-sync
options:
  machineType: E2_HIGHCPU_32
  logging: CLOUD_LOGGING_ONLY
timeout: 3600s
