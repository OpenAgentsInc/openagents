# Build the pinned public backend with the reviewed NIP-57 patch.
steps:
  - name: gcr.io/cloud-builders/git
    entrypoint: bash
    args:
      - -ceu
      - |
        git clone --no-checkout https://github.com/breez/spark-sdk.git /workspace/lnurl-source
        cd /workspace/lnurl-source
        git checkout --detach 2c140a5d721f04d21c5ac334fecc3efe7c069943
        git apply --unidiff-zero /workspace/deploy/lightning-address/nip57-raw-request.patch
  - name: gcr.io/cloud-builders/docker
    args: [build, --label, 'org.opencontainers.image.revision=2c140a5d721f04d21c5ac334fecc3efe7c069943', -t, 'openagents-lnurl-core:2c140a5', -f, lnurl-source/crates/breez-sdk/lnurl/Dockerfile, lnurl-source]
  - name: gcr.io/cloud-builders/docker
    args: [build, --build-arg, 'BASE_IMAGE=openagents-lnurl-core:2c140a5', --label, 'com.openagents.commit=${_COMMIT}', -t, 'us-central1-docker.pkg.dev/openagentsgemini/openagents/openagents-lnurl:${_TAG}', -f, deploy/lightning-address/Dockerfile, lnurl-source]
images: ['us-central1-docker.pkg.dev/openagentsgemini/openagents/openagents-lnurl:${_TAG}']
substitutions:
  _COMMIT: unknown
  _TAG: 2c140a5
options:
  machineType: E2_HIGHCPU_32
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY
timeout: 3600s
