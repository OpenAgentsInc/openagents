# Include in nginx's http block. Terminate TLS on this dedicated hostname.
limit_req_zone $binary_remote_addr zone=lnurl_hooks:10m rate=20r/s;
server {
    listen 443 ssl;
    server_name lnurl-hooks.openagents.com;
    # Set ssl_certificate and ssl_certificate_key through host configuration.
    client_max_body_size 64k;
    location = /webhook {
        limit_except POST { deny all; }
        limit_req zone=lnurl_hooks burst=40 nodelay;
        access_log off;
        proxy_pass http://127.0.0.1:8181;
        proxy_set_header Host openagents.com;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
    location / { return 404; }
}
