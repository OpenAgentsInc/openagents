# Disabled staging template for a separate, fresh asset node.
# Never point this instance at the running payout node's data directory.
lit-dir=/asset-node/lit
network=mainnet
lnd-mode=integrated
taproot-assets-mode=integrated
httpslisten=127.0.0.1:8444
disableui=true
autopilot.disable=true
faraday-mode=disable
loop-mode=disable
pool-mode=disable
lnd.lnddir=/asset-node/lnd
lnd.rpclisten=127.0.0.1:11009
lnd.restlisten=127.0.0.1:18080
lnd.listen=0.0.0.0:9736
lnd.bitcoin.node=bitcoind
# Supply private Core credentials and RPC/ZMQ addresses from tmpfs at startup.
lnd.protocol.simple-taproot-chans=true
lnd.protocol.simple-taproot-overlay-chans=true
lnd.protocol.option-scid-alias=true
lnd.protocol.zero-conf=true
lnd.rpcmiddleware.enable=true
taproot-assets.tapddir=/asset-node/tap
# Supply an authenticated real RFQ price oracle and proof courier after review.
# The regtest mock oracle must never be used on mainnet.
