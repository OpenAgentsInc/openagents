# Template for the owner-approved signer project. Pin the same LND release as the watch-only node.
[Application Options]
lnddir=/var/lib/openagents-lnd-signer
nolisten=true
nobootstrap=true
rpclisten=0.0.0.0:10019
restlisten=127.0.0.1:8080
wallet-unlock-password-file=/run/openagents-lnd-signer/password
wallet-unlock-allow-create=true

[Bitcoin]
bitcoin.active=true
bitcoin.mainnet=true
bitcoin.node=nochainbackend
