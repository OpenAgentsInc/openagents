[remotesigner]
remotesigner.enable=true
remotesigner.rpchost=REPLACE_WITH_SIGNER_PRIVATE_IP:10019
remotesigner.tlscertpath=/etc/openagents-lnd/signer.tls.cert
remotesigner.macaroonpath=/run/openagents-lnd/signer.macaroon
