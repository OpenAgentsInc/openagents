# api.openagents.com's load balancer (url map one-production-url-map,
# forwarding rule one-production-https, 35.201.75.247). Its /v1/... paths
# go to the Cloud Run service `coder` (openagents-web with the gateway
# sidecar), which answers them as openagents.com/v1 does
# (crates/openagents-web/src/api_host.rs, docs/api/README.md "API address"),
# except the paths other services already answer here: the voice service's
# /v1/sessions, the pay front's plugin calls and hosted resources, and the
# older One service's /v1/conversations and /v1/sarah/. Everything that is
# not /v1/... (/, /health, /mcp, /responses, /openapi.json) stays on the One
# service.
#
# Apply after the web image that knows --api-host is serving
# (deploy/production/web.sh):
#
#   CLOUDSDK_CONFIG=.secrets/gcloud-sa-config gcloud compute url-maps validate \
#     --global --source deploy/production/api-url-map.yaml --project openagentsgemini
#   CLOUDSDK_CONFIG=.secrets/gcloud-sa-config gcloud compute url-maps import \
#     one-production-url-map --global --source deploy/production/api-url-map.yaml \
#     --project openagentsgemini --quiet
#
# The backend (made 2026-10-15): backend service openagents-coder-api-backend
# (EXTERNAL_MANAGED, HTTPS) on serverless NEG openagents-coder-neg
# (us-central1, Cloud Run service coder). Rollback: import the map without
# priorities 4 and 5 below (and the tests that name them).
name: one-production-url-map
defaultUrlRedirect:
  hostRedirect: openagents.com
  httpsRedirect: true
  redirectResponseCode: MOVED_PERMANENTLY_DEFAULT
hostRules:
- hosts:
  - api.openagents.com
  pathMatcher: api
- hosts:
  - openagents.com
  pathMatcher: application
pathMatchers:
- defaultService: https://www.googleapis.com/compute/v1/projects/openagentsgemini/global/backendServices/simply-sarah-backend
  name: application
- defaultService: https://www.googleapis.com/compute/v1/projects/openagentsgemini/global/backendServices/one-production-api-backend
  name: api
  routeRules:
  - matchRules:
    - prefixMatch: /v1/sessions/
    - fullPathMatch: /v1/sessions
    priority: 1
    service: https://www.googleapis.com/compute/v1/projects/openagentsgemini/global/backendServices/one-production-voice-backend
  - matchRules:
    - pathTemplateMatch: /v1/plugins/{id=*}/invoke
    priority: 2
    service: https://www.googleapis.com/compute/v1/projects/openagentsgemini/global/backendServices/oa-pay-front-backend
  - matchRules:
    - prefixMatch: /x/
    - fullPathMatch: /v1/resources
    - fullPathMatch: /v1/paid-key
    priority: 3
    service: https://www.googleapis.com/compute/v1/projects/openagentsgemini/global/backendServices/oa-pay-front-backend
  - matchRules:
    - prefixMatch: /v1/conversations
    - prefixMatch: /v1/sarah/
    priority: 4
    service: https://www.googleapis.com/compute/v1/projects/openagentsgemini/global/backendServices/one-production-api-backend
  - matchRules:
    - prefixMatch: /v1/
    priority: 5
    service: https://www.googleapis.com/compute/v1/projects/openagentsgemini/global/backendServices/openagents-coder-api-backend
tests:
- host: openagents.com
  path: /
  service: https://www.googleapis.com/compute/v1/projects/openagentsgemini/global/backendServices/simply-sarah-backend
- host: openagents.com
  path: /chat
  service: https://www.googleapis.com/compute/v1/projects/openagentsgemini/global/backendServices/simply-sarah-backend
- host: api.openagents.com
  path: /mcp
  service: https://www.googleapis.com/compute/v1/projects/openagentsgemini/global/backendServices/one-production-api-backend
- host: api.openagents.com
  path: /responses
  service: https://www.googleapis.com/compute/v1/projects/openagentsgemini/global/backendServices/one-production-api-backend
- host: api.openagents.com
  path: /v1/sessions/00000000-0000-0000-0000-000000000000/events
  service: https://www.googleapis.com/compute/v1/projects/openagentsgemini/global/backendServices/one-production-voice-backend
- description: api or voice
  host: api.openagents.com
  path: /v1/sessions
  service: https://www.googleapis.com/compute/v1/projects/openagentsgemini/global/backendServices/one-production-voice-backend
- description: pay front
  host: api.openagents.com
  path: /v1/plugins/explain-error/invoke
  service: https://www.googleapis.com/compute/v1/projects/openagentsgemini/global/backendServices/oa-pay-front-backend
- description: pay front
  host: api.openagents.com
