# Only the numeric upstream port is substituted at container startup.
map $http_upgrade $space_connection {
    default upgrade;
    '' close;
}
# Omit request paths and headers: scoped credentials can appear in route paths.
log_format bounded '$status $request_time $upstream_status $body_bytes_sent';
server {
    access_log /dev/stdout bounded;
    error_log /dev/stderr crit;
    listen 8080;
    server_tokens off;
    client_max_body_size 16m;
    location = /edge-healthz { access_log off; return 200 'ok'; }
    location / {
        proxy_pass https://10.219.14.10:${SPACE_EDGE_PORT};
        proxy_ssl_server_name on;
        proxy_ssl_name space-management-edge;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_trusted_certificate /etc/space/ca.crt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $space_connection;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
