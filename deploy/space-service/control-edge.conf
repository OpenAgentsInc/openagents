map $http_upgrade $space_connection { default upgrade; '' close; }
log_format bounded '$status $request_time $upstream_status $body_bytes_sent';
server {
    access_log /dev/stdout bounded;
    error_log /dev/stderr crit;
    listen 8443 ssl;
    server_tokens off;
    ssl_certificate /etc/space-edge/tls.crt;
    ssl_certificate_key /etc/space-edge/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16m;
    location / {
        proxy_pass http://space-api.space.svc.cluster.local:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $space_connection;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
server {
    access_log /dev/stdout bounded;
    error_log /dev/stderr crit;
    listen 8444 ssl;
    server_tokens off;
    ssl_certificate /etc/space-edge/tls.crt;
    ssl_certificate_key /etc/space-edge/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16m;
    location / {
        proxy_pass http://space-data-plane.space.svc.cluster.local:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $space_connection;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
