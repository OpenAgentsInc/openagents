# Drop-in for a worker that answers through a local executor
# (CODER_EXECUTOR set). Install as
# /etc/systemd/system/coder-worker.service.d/executor.conf.
#
# The executor door runs each job inside a bwrap mount namespace, which the
# base unit's RestrictNamespaces forbids, and the executor's adapter and
# state live outside /var/lib/coder-worker. A gateway worker needs none of
# this; do not install it there.
[Service]
RestrictNamespaces=false
# bwrap reads /proc/sys/kernel/overflowuid and mounts its own /proc; the
# base unit's ProcSubset=pid hides the first and its @system-service filter
# refuses the second, and either fails every job with boundary_unavailable.
ProcSubset=all
SystemCallFilter=@mount
# The checkout that holds capabilities/ and the adapter the approval pinned.
ReadOnlyPaths=/opt/openagents
# The executor's work directory and its writable grant, both under the state
# directory the base unit already opens.
ExecStartPre=/usr/bin/install -d -m 0750 /var/lib/coder-worker/exec /var/lib/coder-worker/jobs
