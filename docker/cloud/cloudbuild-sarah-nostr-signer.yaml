steps:
  - name: gcr.io/cloud-builders/docker@sha256:f8b08c609fdc392ee6827ff3e1725e4980f7d96bde9f76f4695086405c96c147
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --platform
      - linux/amd64
      - --file
      - apps/sarah-nostr-signer/Dockerfile
      - --tag
      - ${_IMAGE}
      - --build-arg
      - IMAGE_REVISION=${_REVISION}
      - .
images:
  - ${_IMAGE}

substitutions:
  _IMAGE: us-central1-docker.pkg.dev/openagentsgemini/oa-cloud/sarah-nostr-signer:source-only
  _REVISION: unknown

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
