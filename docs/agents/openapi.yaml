        `gateway.json`, which itself requires `accounts`.
      responses:
        '200':
          description: The caller's submission records.
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/TypedError'
        '403':
          $ref: '#/components/responses/TypedError'
        '503':
          $ref: '#/components/responses/TypedError'
  /v1/submissions/{submission}/appeal:
    post:
      summary: Appeal a rejection
      description: The author contests a rejected submission; the appeal records and an operator
        answers through `skills-moderate`.
      x-conditional: This route exists only when the deployment configures the `skills` document in
        `gateway.json`, which itself requires `accounts`.
      parameters:
      - name: submission
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: The recorded appeal.
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/TypedError'
        '401':
          $ref: '#/components/responses/TypedError'
        '403':
          $ref: '#/components/responses/TypedError'
        '404':
          $ref: '#/components/responses/TypedError'
        '409':
          $ref: '#/components/responses/TypedError'
        '503':
          $ref: '#/components/responses/TypedError'

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: 'An issued key: `oak_<id>.<secret>`. Omitted entirely for anonymous access to shared
        doors, which a `require_workspace_membership` deployment refuses outright.'
  headers:
    RequestId:
      schema:
        type: string
      description: The request's identity — the `Idempotency-Key` when sent, else minted.
    Attempt:
      schema:
        type: integer
      description: The attempt that produced this response.
    Outcome:
      schema:
        type: string
        enum:
        - answered
        - mixed
        - refused
        - unavailable
        - unattempted
      description: How the settled attempt ended; `mixed` only on `POST /v1/classify`.
    Receipt:
      schema:
        type: string
      description: The sealed execution receipt's digest, resolving to a line in the service's `receipts.jsonl`.
    Settlement:
      schema:
        type: string
        enum:
        - settled
        - outstanding
        - released
      description: The monetary hold's resolution — present only under monetary admission.
  schemas:
    Call:
      type: object
      required:
      - model
      - state
      - questions
      properties:
        model:
          type: string
          description: The door to answer through, resolved against the caller's bindings.
        state:
          description: The JSON value or text the questions read.
        questions:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Question'
          description: Question id to question. Ids are caller-side and are not sent to the model.
    Question:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - noul
          - choice
          - score
        instructions:
          description: The judgment to make — a string or a structured object.
        criteria:
          description: '`noul`: optional `{"true": …, "false": …}`. `choice`: object of option to description.
            `score`: array of 2–10 ordered level descriptions.'
    Result:
      type: object
      required:
      - model
      - answers
      properties:
        model:
          type: string
          description: The served identity that answered.
        answers:
          type: object
          additionalProperties:
            oneOf:
            - $ref: '#/components/schemas/NoulAnswer'
            - $ref: '#/components/schemas/ChoiceAnswer'
            - $ref: '#/components/schemas/ScoreAnswer'
        usage:
          $ref: '#/components/schemas/Usage'
      description: The backend's document arrives verbatim; a door may add fields beyond this minimum
        shape.
    NoulAnswer:
      type: object
      required:
      - type
      - noul
      properties:
        type:
          const: noul
        noul:
          type: number
          description: The probability of yes, from 0 to 1.
        selected:
          type: string
          description: The estimator's own pick, when the door reports one.
    ChoiceAnswer:
      type: object
      required:
      - type
      - choice
      - confidence
      - probabilities
      properties:
        type:
          const: choice
        choice:
          type: string
        confidence:
          type: number
          description: How concentrated the distribution is — not a correctness guarantee.
        probabilities:
          type: object
          additionalProperties:
            type: number
    ScoreAnswer:
      type: object
      required:
      - type
      - score
      - confidence
      - legend
      properties:
        type:
          const: score
        score:
          type: number
          description: The probability-weighted mean level.
        confidence:
          type: number
        selected:
          type: string
        legend:
          type: object
        probabilities:
          type: object
          additionalProperties:
            type: number
    Usage:
      type: object
      properties:
        input_tokens:
          type: integer
        output_tokens:
          type: integer
      description: Either field is absent when the backend does not count it.
    ModelCard:
      type: object
      required:
      - id
      - model
      - artifact_signature
      - lane
      - admission
      - classification
      properties:
        id:
          type: string
          description: The door name a request uses in `model`.
        model:
          type: string
          description: The artifact id the binding expects the backend to publish.
        artifact_signature:
          type: string
          description: The content digest the binding pins; empty when the binding pins a name only.
        lane:
          type: string
          enum:
          - shared
          - dedicated
          - trained
          - on-device
        admission:
          type: object
          properties:
            scope:
              type: array
              items:
                type: string
              description: The question families an admission record covered — trained lane only.
            record:
              type: string
              description: The admission record's digest — trained lane only.
            registry_digest:
              type: string
            registry_sequence:
              type: integer
        classification:
          type: object
          description: 'The `openagents.classify-discovery.v1` card: `status` is `configured`, `unsupported`,
            `unavailable`, or `invalid-limits`; a configured card carries the door''s declared limits,
            supported modes, admission ceilings, and execution shape.'
    Balance:
      type: object
      required:
      - workspace
      - balance
      - prices
      properties:
        workspace:
          type: string
        balance:
          type: object
          properties:
            currency:
              type: string
            credited:
              type: integer
            reserved:
              type: integer
            settled:
              type: integer
            refunded:
              type: integer
            available:
              type: integer
            spend_remaining:
              type: integer
        prices:
          type: object
          additionalProperties:
            type: object
            properties:
              version:
                type: string
              policy:
                type: string
              currency:
                type: string
    TypedError:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              enum:
              - malformed
              - invalid_request
              - workspace_required
              - unauthenticated
              - insufficient_funds
              - door_not_bound
              - workspace_forbidden
              - account_missing
              - unmetered
              - idempotency_conflict
              - too_many_questions
              - too_many_options
              - unsupported_schema
              - unsupported_mode
              - unsupported_limits
              - unsupported_capacity
              - invalid_id
              - duplicate_id
              - too_many_inputs
              - too_many_labels
              - too_many_levels
              - too_many_dimensions
              - too_many_judgments
              - content_too_large
              - overflow
              - context_limit
              - rate_limited
              - busy
              - overloaded
              - quota_exhausted
              - registry_unavailable
              - ledger_unavailable
              - membership_unavailable
              - door_unavailable
              - identity_mismatch
              - unavailable
              - unpriced
              - price_invalid
              description: The gateway-owned codes, complete. A backend may pass through its own typed
                refusal with a code outside this set — treat an unknown code as refused, not transient.
            message:
              type: string
            request:
              type: string
              description: The request identity — present on refusals raised inside the owned admission
                path.
            attempt:
              type: integer
              description: The attempt number — present on refusals raised inside the owned admission
                path.
        settlement:
          type: string
          enum:
          - settled
          - outstanding
          - released
          description: The monetary hold's resolution, on gateway refusals under monetary admission.
    JobResults:
      type: object
      required:
      - v
      - job
      - items
      - next_cursor
      properties:
        v:
          type: string
          enum:
          - openagents.job-results.v1
        job:
          type: string
        items:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              attempt_id:
                type: string
              dispatched:
                type: boolean
              queue_ms:
                type: integer
                nullable: true
              usage:
                type: object
                nullable: true
              item:
                type: object
                description: The per-input result the classify pipeline produced.
        next_cursor:
          type: string
          nullable: true
        terminal:
          type: string
          enum:
          - queued
          - running
          - cancelling
          - completed
          - cancelled
          - failed
        counts:
          type: object
    JobEnvelope:
      type: object
      required:
      - v
      - kind
      - request
      properties:
        v:
          type: string
          enum:
          - openagents.job.v1
        kind:
          type: string
          enum:
          - classify
        request:
          type: object
          description: The `POST /v1/classify` envelope, verbatim.
        notify:
          type: object
          required:
          - url
          properties:
            url:
              type: string
              description: '`https`, or `http` to a loopback host only — never a URL carrying credentials.'
            secret:
              type: string
              description: The HMAC secret events sign under. Absent, one is minted and returned once
                in the submission response.
    JobStatus:
      type: object
      required:
      - v
      - job
      - kind
      - status
      - counts
      properties:
        v:
          type: string
          enum:
          - openagents.job.v1
        job:
          type: string
        kind:
          type: string
          enum:
          - classify
        status:
          type: string
          enum:
          - queued
          - running
          - cancelling
          - completed
          - cancelled
          - failed
        model:
          type: string
        capacity:
          type: string
        counts:
          type: object
          properties:
            expected:
              type: integer
            attempted:
              type: integer
            answered:
              type: integer
            refused:
              type: integer
            unavailable:
              type: integer
            unattempted:
              type: integer
            unknown:
              type: integer
        submitted_at:
          type: string
        started_at:
          type: string
          nullable: true
        finished_at:
          type: string
          nullable: true
        receipt:
          type: string
          nullable: true
        cause:
          type: string
          nullable: true
        secret:
          type: string
          description: Present once in the submission response when a notify secret was generated — never
            on later reads.
    FeedbackStatus:
      type: object
      required:
      - v
      - submission
      - status
      - received_at
      - receipt
      - transitions
      properties:
        v:
          type: string
          enum:
          - openagents.feedback.v1
        submission:
          type: string
          description: The fb_<hex> id the caller tracks.
        status:
          type: string
          enum:
          - submitted
          - duplicate
          - accepted
          - needs-information
          - resolved
          - rejected
        duplicate_of:
          type: string
          description: Present on a duplicate — the first submission's id.
        received_at:
          type: string
        receipt:
          type: object
          description: The sealed openagents.receipt.feedback.v1 — distinct from the execution
            receipt a decision call leaves.
        note:
          type: string
          description: The operator's latest human-readable note, when one exists.
        redacted:
          type: boolean
          description: Present and true once an operator redacts the record — digests stay,
            content is gone.
        transitions:
          type: array
          description: The triage journal — operator lifecycle lines in order.
          items:
            type: object
            properties:
              at:
                type: string
              status:
                type: string
              note:
                type: string
                nullable: true
              actor:
                type: string
    UpdatesSubscription:
      type: object
      required:
      - v
      - subscription
      - credential
      - status
      - topics
      - verified
      properties:
        v:
          type: string
          enum:
          - openagents.updates-subscription.v1
        subscription:
          type: string
          description: The sub_<hex> id.
        credential:
          type: string
          description: The credential id the subscription binds to — a reference,
            never the secret.
        status:
          type: string
          enum:
          - subscribed
          - unsubscribed
        topics:
          type: object
          description: Separate consents — a sender must not merge them.
          properties:
            product:
              type: boolean
            support:
              type: boolean
        contact:
          type: object
          properties:
            email:
              type: string
        verified:
          type: string
          enum:
          - credential
          description: The opt-in was made under an authenticated credential.
        subscribed:
          type: string
        updated:
          type: string
  responses:
    TypedError:
      description: A typed refusal — see the `refusal_codes` map in `docs/agents/api-catalog.json` and
        the code table in `docs/decision-models/service/gateway.md`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TypedError'
security:
- bearer: []
