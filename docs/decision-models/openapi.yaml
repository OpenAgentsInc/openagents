openapi: 3.1.0
info:
  title: OpenAgents Decision API
  version: "1.0.0"
  description: >-
    The keyed HTTP decision service. `POST /v1/systemone` answers typed
    questions about one state; `GET /v1/models` lists the doors the caller's
    credential is authorized for. Every admitted call is authenticated,
    authorized, bounded, quota-reserved, identity-verified, and receipted.
    Classification, batch, job, and review routes are specified in
    `decision-api.md` and join this same admission path as they land; they
    are not part of this document.
servers:
  - url: http://127.0.0.1:8080
    description: A locally deployed gateway; deployments choose their origin.
paths:
  /healthz:
    get:
      summary: Process liveness
      description: Liveness only — it is not readiness and reveals nothing about doors.
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
  /v1/models:
    get:
      summary: List the caller's doors
      description: >-
        The model cards this credential may name in `model`. Anonymous
        callers see only `shared` doors; a tenant sees its bound doors and
        the shared lane. A card is a serving claim verified against the
        registry binding at dispatch, not a remote attestation.
      responses:
        "200":
          description: The visible cards.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                required: [models]
                properties:
                  models:
                    type: array
                    items:
                      $ref: "#/components/schemas/ModelCard"
  /v1/systemone:
    post:
      summary: Answer typed questions about one state
      description: >-
        One state, one set of typed questions, one typed answer per
        question. The `model` field names a door the credential is bound
        to; the gateway verifies the backend's published identity against
        the binding before a byte of the request is forwarded.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
          description: >-
            The request's stable identity. Retries repeat it with an
            incrementing `X-Attempt`; a settled pair refuses reuse, and a
            pair reused against different content is `409
            idempotency_conflict`.
        - name: X-Attempt
          in: header
          required: false
          schema:
            type: integer
            minimum: 1
          description: The attempt number of this request; `1` when absent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Call"
      responses:
        "200":
          description: Every question answered.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
            x-attempt:
              $ref: "#/components/headers/Attempt"
            x-outcome:
              $ref: "#/components/headers/Outcome"
            x-receipt:
              $ref: "#/components/headers/Receipt"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
        "400":
          $ref: "#/components/responses/TypedError"
        "401":
          $ref: "#/components/responses/TypedError"
        "403":
          $ref: "#/components/responses/TypedError"
        "409":
          $ref: "#/components/responses/TypedError"
        "422":
          $ref: "#/components/responses/TypedError"
        "429":
          description: >-
            Rate, concurrency, or daily-quota bound. `Retry-After`
            accompanies `rate_limited`, `busy`, `overloaded`, and
            `quota_exhausted`.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying.
            x-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypedError"
        "503":
          $ref: "#/components/responses/TypedError"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: "An issued key: `oak_<id>.<secret>`. Omitted entirely for anonymous access to shared doors."
  headers:
    RequestId:
      schema:
        type: string
      description: The request's identity — the `Idempotency-Key` when sent, else minted.
    Attempt:
      schema:
        type: integer
      description: The attempt that produced this response.
    Outcome:
      schema:
        type: string
        enum: [answered, refused, unavailable, unattempted]
      description: How the settled attempt ended.
    Receipt:
      schema:
        type: string
      description: The sealed execution receipt's digest.
  schemas:
    ModelCard:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: The door name a request uses in `model`.
        description:
          type: string
        release_date:
          type: string
        artifact_identity:
          type: object
          description: The artifact digest the backend publishes; verified against the binding.
        execution:
          type: object
          description: The execution settings the backend publishes; verified against the binding.
    Call:
      type: object
      required: [model, state, questions]
      properties:
        model:
          type: string
          description: The door to answer through.
        state:
          description: The JSON or text the questions read.
        questions:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Question"
          description: Question id to question. Ids are for the caller and are not sent to the model.
    Question:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [noul, choice, score]
        instructions:
          description: The judgment to make — a string or a structured object.
        criteria:
          description: >-
            `noul`: optional `{"true": …, "false": …}`. `choice`: required
            object of option to description (at most 255). `score`:
            required array of 2–10 ordered level descriptions.
    Result:
      type: object
      required: [model, answers]
      properties:
        model:
          type: string
          description: The served identity that answered.
        answers:
          type: object
          additionalProperties:
            oneOf:
              - $ref: "#/components/schemas/NoulAnswer"
              - $ref: "#/components/schemas/ChoiceAnswer"
              - $ref: "#/components/schemas/ScoreAnswer"
        usage:
          $ref: "#/components/schemas/Usage"
    NoulAnswer:
      type: object
      required: [type, noul]
      properties:
        type:
          const: noul
        noul:
          type: number
          description: The probability of yes.
        selected:
          type: string
          description: The estimator's own pick, when the door reports one.
    ChoiceAnswer:
      type: object
      required: [type, choice, confidence, probabilities]
      properties:
        type:
          const: choice
        choice:
          type: string
        confidence:
          type: number
          description: How concentrated the distribution is — not a correctness guarantee.
        probabilities:
          type: object
          additionalProperties:
            type: number
    ScoreAnswer:
      type: object
      required: [type, score, confidence, legend]
      properties:
        type:
          const: score
        score:
          type: number
          description: The probability-weighted mean level.
        confidence:
          type: number
        selected:
          type: string
        legend:
          type: object
        probabilities:
          type: object
          additionalProperties:
            type: number
    Usage:
      type: object
      properties:
        input_tokens:
          type: integer
        output_tokens:
          type: integer
      description: Either field is absent when the backend does not count it.
    TypedError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - malformed
                - unauthenticated
                - door_not_bound
                - invalid_request
                - too_many_questions
                - too_many_options
                - idempotency_conflict
                - rate_limited
                - busy
                - overloaded
                - quota_exhausted
                - door_unavailable
                - identity_mismatch
                - unavailable
                - registry_unavailable
                - ledger_unavailable
              description: >-
                Gateway-owned codes are listed here; a backend may pass
                through its own typed refusal with a code outside this set.
            message:
              type: string
            request_id:
              type: string
            attempt:
              type: integer
  responses:
    TypedError:
      description: A typed refusal — see the `error.code` table in `gateway.md`.
      headers:
        x-request-id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TypedError"
security:
  - bearer: []
