<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:24px system-ui;margin:0}input,button{display:block;margin:24px;width:250px;height:60px}canvas{position:fixed;inset:0;width:100vw;height:100vh;z-index:-1;touch-action:none;background:linear-gradient(90deg,blue,green,orange);width:100%;height:100vh}body{touch-action:none}</style><input id="field"><button id="go">go</button><canvas></canvas><p id="state">ready</p><script>window.held=false;window.inputTrusted=true;window.inputs=0;window.clicked=false;document.getElementById('field').addEventListener('input',e=>{inputs++;inputTrusted=inputTrusted&&e.isTrusted;document.getElementById('state').textContent='input '+inputs});document.getElementById('go').onclick=()=>{clicked=true;document.getElementById('field').blur();document.getElementById('state').textContent='clicked'};addEventListener('pointerdown',e=>{window.pointer=[e.clientX,e.clientY,e.pointerType]});addEventListener('keydown',e=>{window.key=e.key;if(e.code==='KeyW')held=true});addEventListener('keyup',e=>{if(e.code==='KeyW')held=false});window.contacts=new Set();window.maxContacts=0;window.independentRelease=false;addEventListener('pointerdown',e=>{if(e.pointerType==='touch'){contacts.add(e.pointerId);maxContacts=Math.max(maxContacts,contacts.size)}});for(const name of ['pointerup','pointercancel'])addEventListener(name,e=>{const was=contacts.size;contacts.delete(e.pointerId);if(name==='pointerup'&&was===2&&contacts.size===1&&e.clientX>innerWidth/2)independentRelease=true});</script>
