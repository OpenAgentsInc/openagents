apiVersion: v1
kind: Namespace
metadata:
  name: livekit-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oa-livekit-prod-gateway-impersonator
rules:
  - apiGroups: [""]
    resources: ["users", "groups"]
    verbs: ["impersonate"]
    resourceNames:
      - oa-livekit-prod-deployer@openagentsgemini.iam.gserviceaccount.com
      - system:authenticated
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oa-livekit-prod-gateway-impersonator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: oa-livekit-prod-gateway-impersonator
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: oa-livekit-prod-deployer@openagentsgemini.iam.gserviceaccount.com
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oa-livekit-prod-runtime-deployer
  namespace: livekit-system
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - serviceaccounts
      - services
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups:
      - apps
      - autoscaling
      - cert-manager.io
      - cloud.google.com
      - external-secrets.io
      - monitoring.googleapis.com
      - networking.gke.io
      - networking.k8s.io
      - policy
    resources:
      - backendconfigs
      - certificates
      - deployments
      - externalsecrets
      - horizontalpodautoscalers
      - ingresses
      - managedcertificates
      - networkpolicies
      - poddisruptionbudgets
      - podmonitorings
      - secretstores
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oa-livekit-prod-runtime-deployer
  namespace: livekit-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: oa-livekit-prod-runtime-deployer
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: oa-livekit-prod-deployer@openagentsgemini.iam.gserviceaccount.com
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oa-livekit-prod-runtime-deployer
  namespace: cert-manager
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    resourceNames: ["livekit-cert-manager-secret-reader"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    resourceNames: ["cloudflare-dns-token"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["external-secrets.io"]
    resources: ["secretstores"]
    resourceNames: ["livekit-google-secret-manager"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["monitoring.googleapis.com"]
    resources: ["podmonitorings"]
    resourceNames: ["livekit-cert-manager"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oa-livekit-prod-runtime-deployer
  namespace: cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: oa-livekit-prod-runtime-deployer
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: oa-livekit-prod-deployer@openagentsgemini.iam.gserviceaccount.com
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oa-livekit-prod-addon-observer
  namespace: external-secrets
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oa-livekit-prod-addon-observer
  namespace: external-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: oa-livekit-prod-addon-observer
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: oa-livekit-prod-deployer@openagentsgemini.iam.gserviceaccount.com
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oa-livekit-prod-runtime-deployer
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["livekit-system"]
    verbs: ["get", "patch"]
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    resourceNames: ["livekit-media-critical"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["cert-manager.io"]
    resources: ["clusterissuers"]
    resourceNames: ["livekit-public-dns01"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames:
      - certificates.cert-manager.io
      - clusterissuers.cert-manager.io
      - externalsecrets.external-secrets.io
      - secretstores.external-secrets.io
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oa-livekit-prod-runtime-deployer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: oa-livekit-prod-runtime-deployer
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: oa-livekit-prod-deployer@openagentsgemini.iam.gserviceaccount.com
