apiVersion: monitoring.googleapis.com/v1
kind: Rules
metadata:
  name: livekit-server
  namespace: livekit-system
spec:
  groups:
    - name: livekit-availability
      interval: 30s
      rules:
        - alert: LiveKitServerUnavailable
          expr: count(up{namespace="livekit-system",job=~".*livekit-server.*"} == 1) < 2
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Fewer than two LiveKit SFU pods are being scraped.
        - alert: LiveKitRoomAdmissionAboveAcceptedTarget
          expr: sum(livekit_room_total) > 20
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: Active LiveKit rooms exceed the admitted initial load target.
        - alert: LiveKitParticipantJoinFailures
          expr: sum(rate(livekit_participant_join_total{state!="success"}[5m])) > 0.1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: LiveKit participant join failures are sustained.
        - alert: LiveKitPacketLossHigh
          expr: sum(rate(livekit_packet_loss_total[5m])) / clamp_min(sum(rate(livekit_packet_total[5m])), 1) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: LiveKit aggregate packet loss exceeds five percent.
