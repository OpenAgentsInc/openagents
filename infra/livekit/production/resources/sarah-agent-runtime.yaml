apiVersion: v1
kind: ConfigMap
metadata:
  name: sarah-nostr-projection
  namespace: livekit-system
data:
  SARAH_NOSTR_SIGNER_URL: https://oa-sarah-nostr-signer-ezxz4mgdsq-uc.a.run.app
  SARAH_NOSTR_SIGNER_AUDIENCE: https://oa-sarah-nostr-signer-ezxz4mgdsq-uc.a.run.app
  SARAH_NOSTR_EXPECTED_PUBKEY: f7824ac493cb820171a72dd4085880d1bdcc4ba1176ba84e93afddc176ec971d
  SARAH_NOSTR_RELAY_URL: wss://relay.openagents.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sarah-livekit-agent
  namespace: livekit-system
  labels:
    app.kubernetes.io/name: sarah-livekit-agent
    app.kubernetes.io/instance: sarah-livekit-agent
    app.kubernetes.io/component: voice-agent
    app.kubernetes.io/part-of: openagents-livekit
spec:
  replicas: 3
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sarah-livekit-agent
      app.kubernetes.io/instance: sarah-livekit-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sarah-livekit-agent
        app.kubernetes.io/instance: sarah-livekit-agent
        app.kubernetes.io/component: voice-agent
        app.kubernetes.io/part-of: openagents-livekit
        openagents.com/raw-media-boundary: "true"
    spec:
      serviceAccountName: sarah-agent
      automountServiceAccountToken: false
      priorityClassName: livekit-media-critical
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        cloud.google.com/gke-nodepool: oa-livekit-prod-app
        openagents.com/livekit-workload: app
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: sarah-livekit-agent
                  app.kubernetes.io/instance: sarah-livekit-agent
              topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 3
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sarah-livekit-agent
              app.kubernetes.io/instance: sarah-livekit-agent
      containers:
        - name: sarah-livekit-agent
          image: us-central1-docker.pkg.dev/openagentsgemini/oa-cloud/sarah-livekit-agent@sha256:07e7be7fad9150e93ab49c47dc8c935a3bc02e103ba82d10b3a81ad9f01a304c
          imagePullPolicy: IfNotPresent
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: HOME
              value: /tmp
            - name: XDG_CACHE_HOME
              value: /tmp/cache
            - name: LIVEKIT_URL
              value: wss://livekit.openagents.com
            - name: OPENAGENTS_CONTROL_URL
              value: https://openagents.com
            - name: SARAH_LIVEKIT_WORKER_REF
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.uid
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sarah-livekit-agent
                  key: livekit-api-key
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: sarah-livekit-agent
                  key: livekit-api-secret
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sarah-livekit-agent
                  key: openai-api-key
            - name: SARAH_LIVEKIT_CONTROL_ROOT
              valueFrom:
                secretKeyRef:
                  name: sarah-livekit-agent
                  key: control-root
          envFrom:
            - configMapRef:
                name: sarah-nostr-projection
                optional: true
          startupProbe:
            httpGet:
              path: /
              port: health
              scheme: HTTP
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /
              port: health
              scheme: HTTP
            failureThreshold: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: health
              scheme: HTTP
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            appArmorProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sarah-livekit-agent
  namespace: livekit-system
spec:
  minAvailable: 2
  unhealthyPodEvictionPolicy: IfHealthyBudget
  selector:
    matchLabels:
      app.kubernetes.io/name: sarah-livekit-agent
      app.kubernetes.io/instance: sarah-livekit-agent
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sarah-livekit-agent
  namespace: livekit-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sarah-livekit-agent
  minReplicas: 3
  maxReplicas: 4
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sarah-livekit-agent-deny-ingress
  namespace: livekit-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sarah-livekit-agent
      app.kubernetes.io/instance: sarah-livekit-agent
  policyTypes:
    - Ingress
