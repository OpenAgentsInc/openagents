apiVersion: v1
kind: ServiceAccount
metadata:
  name: livekit-secret-reader
  namespace: livekit-system
  annotations:
    iam.gke.io/gcp-service-account: oa-livekit-secret-reader@openagentsgemini.iam.gserviceaccount.com
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: google-secret-manager
  namespace: livekit-system
spec:
  provider:
    gcpsm:
      projectID: openagentsgemini
      auth:
        workloadIdentity:
          clusterProjectID: openagentsgemini
          clusterLocation: us-central1
          clusterName: oa-livekit-prod
          serviceAccountRef:
            name: livekit-secret-reader
