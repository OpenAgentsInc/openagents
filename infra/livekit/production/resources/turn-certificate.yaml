apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: livekit-turn
  namespace: livekit-system
spec:
  secretName: livekit-turn-tls
  commonName: turn.livekit.openagents.com
  dnsNames:
    - turn.livekit.openagents.com
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: livekit-public-dns01
    kind: ClusterIssuer
    group: cert-manager.io
