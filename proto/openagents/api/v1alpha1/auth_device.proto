syntax = "proto3";

package openagents.api.v1alpha1;

// What coax/web/api/auth-device.c answers, route by route (Protocol, GitHub #13250; profile
// api-routes; docs/protocol/api-routes-v1alpha1.md). Each message names the members
// of one answer as they ship: json_name is the key on the wire, a `bytes` member is
// JSON carried as it came, and a member may be absent or null. The messages were
// read off a run of the API suite and are held to every later run:
// proto/verse/api-routes-v1alpha1.json holds real answers and their routes, and
// coax/web/api/routes-goldens.coax holds each answer's keys to its message here.
// A refusal with only its words is ErrorReply (error.proto). Most bodies are built
// in SQL; what the C builds goes through a Coax unit.

// GET /api/auth/devices 200
message AuthDeviceDevices {
  optional int64 now_ms = 1 [json_name = "now_ms"];
  repeated AuthDeviceDevicesDevices devices = 2 [json_name = "devices"];
}

message AuthDeviceDevicesDevices {
  optional int64 id = 1 [json_name = "id"];
  optional string name = 2 [json_name = "name"];
  optional string platform = 3 [json_name = "platform"];
  optional string store = 4 [json_name = "store"];
  optional int64 created_ms = 5 [json_name = "created_ms"];
  optional int64 last_seen_ms = 6 [json_name = "last_seen_ms"];
  optional int64 sessions = 7 [json_name = "sessions"];
  optional bool this = 8 [json_name = "this"];
}

// GET /api/auth/devices 200
message AuthDeviceDevicesLines {
  optional string now_ms = 1 [json_name = "now_ms"];
  optional string count = 2 [json_name = "count"];
  optional string device = 3 [json_name = "device"];
}

// POST /api/auth/devices/*/remove 200
message AuthDeviceDevicesOneRemovePost {
  optional string state = 1 [json_name = "state"];
  optional int64 ended = 2 [json_name = "ended"];
}

// POST /api/auth/devices/*/remove 404
message AuthDeviceDevicesOneRemovePostRefusal {
  optional string error = 1 [json_name = "error"];
  optional string device_proof = 2 [json_name = "device_proof"];
}

// POST /api/auth/devices/push 200
message AuthDeviceDevicesPushPost {
  optional string state = 1 [json_name = "state"];
  optional int64 device = 2 [json_name = "device"];
}

// POST /api/auth/devices/push/off 200
message AuthDeviceDevicesPushOffPost {
  optional string state = 1 [json_name = "state"];
}
