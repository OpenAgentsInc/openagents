syntax = "proto3";

package openagents.api.v1alpha1;

// What coax/web/api/inference.c answers, route by route (Protocol, GitHub #13250; profile
// api-routes; docs/protocol/api-routes-v1alpha1.md). Each message names the members
// of one answer as they ship: json_name is the key on the wire, a `bytes` member is
// JSON carried as it came, and a member may be absent or null. The messages were
// read off a run of the API suite and are held to every later run:
// proto/verse/api-routes-v1alpha1.json holds real answers and their routes, and
// coax/web/api/routes-goldens.coax holds each answer's keys to its message here.
// A refusal with only its words is ErrorReply (error.proto). Most bodies are built
// in SQL; what the C builds goes through a Coax unit.

// GET /api/v1/inference/credit 200
message InferenceInferenceCredit {
  optional int64 credit_msat = 1 [json_name = "credit_msat"];
}

// POST /api/v1/inference 401; POST /api/v1/inference 402
message InferenceInferencePostRefusal {
  optional string error = 1 [json_name = "error"];
  optional string step_up = 2 [json_name = "step_up"];
  repeated string methods = 3 [json_name = "methods"];
  optional bool limited = 4 [json_name = "limited"];
  optional string level = 5 [json_name = "level"];
  optional InferenceInferencePostRefusalRecovery recovery = 6 [json_name = "recovery"];
  optional string credit = 7 [json_name = "credit"];
  optional int64 credit_msat = 8 [json_name = "credit_msat"];
}

message InferenceInferencePostRefusalRecovery {
  optional string state = 1 [json_name = "state"];
  optional int64 asked_ms = 2 [json_name = "asked_ms"];
  optional int64 ready_ms = 3 [json_name = "ready_ms"];
  optional int64 cancelled_ms = 4 [json_name = "cancelled_ms"];
  optional int64 done_ms = 5 [json_name = "done_ms"];
  optional int64 now_ms = 6 [json_name = "now_ms"];
  optional int64 wait_hours = 7 [json_name = "wait_hours"];
}

// GET /api/v1/inference/pricing 200
message InferenceInferencePricing {
  optional string currency = 1 [json_name = "currency"];
  optional string unit = 2 [json_name = "unit"];
  optional int64 local_cost_usd_micros = 3 [json_name = "local_cost_usd_micros"];
  repeated InferenceInferencePricingModel models = 4 [json_name = "models"];
}

message InferenceInferencePricingModel {
  optional string name = 1 [json_name = "name"];
  optional string kind = 2 [json_name = "kind"];
  optional int64 input_micros = 3 [json_name = "input_micros"];
  optional int64 cached_input_micros = 4 [json_name = "cached_input_micros"];
  optional int64 output_micros = 5 [json_name = "output_micros"];
  optional int64 per_call_micros = 6 [json_name = "per_call_micros"];
  optional int64 markup_bps = 7 [json_name = "markup_bps"];
}

// GET /api/v1/inference/usage 200
message InferenceInferenceUsage {
  optional string who = 1 [json_name = "who"];
  optional int64 credit_msat = 2 [json_name = "credit_msat"];
  optional int64 local_usd_micros = 3 [json_name = "local_usd_micros"];
  optional InferenceInferenceUsageToday today = 4 [json_name = "today"];
  optional InferenceInferenceUsageTotal total = 5 [json_name = "total"];
  optional InferenceInferenceUsageDecisions decisions = 6 [json_name = "decisions"];
}

message InferenceInferenceUsageToday {
  optional int64 requests = 1 [json_name = "requests"];
  optional int64 usd_micros = 2 [json_name = "usd_micros"];
}

message InferenceInferenceUsageTotal {
  optional int64 calls = 1 [json_name = "calls"];
  optional int64 in_tokens = 2 [json_name = "in_tokens"];
  optional int64 cached_in_tokens = 3 [json_name = "cached_in_tokens"];
  optional int64 out_tokens = 4 [json_name = "out_tokens"];
  optional int64 usd_micros = 5 [json_name = "usd_micros"];
  optional int64 msat = 6 [json_name = "msat"];
}

message InferenceInferenceUsageDecisions {
  optional int64 calls = 1 [json_name = "calls"];
  optional int64 usd_micros = 2 [json_name = "usd_micros"];
  optional int64 msat = 3 [json_name = "msat"];
}
