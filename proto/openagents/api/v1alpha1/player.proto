message PlayerRoomModLog {
  optional int64 n = 1 [json_name = "n"];
  optional int64 at_ms = 2 [json_name = "at_ms"];
  optional string by_who = 3 [json_name = "by_who"];
  optional string verb = 4 [json_name = "verb"];
  optional string whom = 5 [json_name = "whom"];
  optional int64 minutes = 6 [json_name = "minutes"];
  optional int64 until_ms = 7 [json_name = "until_ms"];
  optional string reason = 8 [json_name = "reason"];
  optional string source = 9 [json_name = "source"];
  optional bytes room = 10 [json_name = "room"];   // JSON carried as it came
  optional bytes shard = 11 [json_name = "shard"];   // JSON carried as it came
  optional bytes gen = 12 [json_name = "gen"];   // JSON carried as it came
  optional bytes seq = 13 [json_name = "seq"];   // JSON carried as it came
  optional string outcome = 14 [json_name = "outcome"];
  optional bool team = 15 [json_name = "team"];
}

