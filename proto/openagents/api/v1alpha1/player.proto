}

message PlayerProgressOneOneCurrent {
  optional double at = 1 [json_name = "at"];
  optional string bytes = 2 [json_name = "bytes"];
}

message PlayerProgressOneOnePrevious {
  optional int64 at = 1 [json_name = "at"];
