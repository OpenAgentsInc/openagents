syntax = "proto3";

package openagents.api.v1alpha1;

// What coax/web/api/player.c answers, route by route (Protocol, GitHub #13250; profile
// api-routes; docs/protocol/api-routes-v1alpha1.md). Each message names the members
// of one answer as they ship: json_name is the key on the wire, a `bytes` member is
// JSON carried as it came, and a member may be absent or null. The messages were
// read off a run of the API suite and are held to every later run:
// proto/verse/api-routes-v1alpha1.json holds real answers and their routes, and
// coax/web/api/routes-goldens.coax holds each answer's keys to its message here.
// A refusal with only its words is ErrorReply (error.proto). Most bodies are built
// in SQL; what the C builds goes through a Coax unit.

// GET /api/log/* 200
message PlayerOne {
  optional double at = 1 [json_name = "at"];
  optional PlayerOneBy by = 2 [json_name = "by"];
  optional string id = 3 [json_name = "id"];
  optional string who = 4 [json_name = "who"];
  optional string unit = 5 [json_name = "unit"];
  optional PlayerOneDelta delta = 6 [json_name = "delta"];
  optional bool guest = 7 [json_name = "guest"];
  optional string state = 8 [json_name = "state"];
  optional int64 amount = 9 [json_name = "amount"];
  optional string summary = 10 [json_name = "summary"];
  optional double decided_at = 11 [json_name = "decidedAt"];
  optional string decided_by = 12 [json_name = "decidedBy"];
  optional int64 version = 13 [json_name = "version"];
}

message PlayerOneBy {
  optional string player = 1 [json_name = "player"];
  optional bytes account = 2 [json_name = "account"];   // JSON carried as it came
}

message PlayerOneDelta {
  repeated PlayerOneDeltaAdded added = 1 [json_name = "added"];
}

message PlayerOneDeltaAdded {
  optional PlayerOneDeltaAddedItem item = 1 [json_name = "item"];
  optional string list = 2 [json_name = "list"];
}

message PlayerOneDeltaAddedItem {
  optional string id = 1 [json_name = "id"];
  optional string name = 2 [json_name = "name"];
}

// GET /api/planets 200; GET /api/playtest/planets 200
message Player {
  optional int64 n = 1 [json_name = "n"];
  repeated PlayerPlanets planets = 2 [json_name = "planets"];
}

// GET /api/playtest/planets/* 200; POST /api/playtest/planets 200
message PlayerPlanets {
  optional int64 n = 1 [json_name = "n"];
  optional double at = 2 [json_name = "at"];
  optional string id = 3 [json_name = "id"];
  optional string art = 4 [json_name = "art"];
  optional string cam = 5 [json_name = "cam"];
  optional string kind = 6 [json_name = "kind"];
  optional double made = 7 [json_name = "made"];
  optional string name = 8 [json_name = "name"];
  optional string cycle = 9 [json_name = "cycle"];
  optional string owner = 10 [json_name = "owner"];
}

// GET /api/planets/mine 200
message PlayerMine {
  optional bytes saved = 1 [json_name = "saved"];   // JSON carried as it came
  optional PlayerPlanets planet = 2 [json_name = "planet"];
  optional bool invited = 3 [json_name = "invited"];
}

// GET /api/playtest/course/* 200
message PlayerCourseOne {
  optional string by = 1 [json_name = "by"];
  optional string id = 2 [json_name = "id"];
  optional bytes best = 3 [json_name = "best"];   // JSON carried as it came
  optional bool mine = 4 [json_name = "mine"];
  optional bytes hoops = 5 [json_name = "hoops"];   // JSON carried as it came
  optional string realm = 6 [json_name = "realm"];
  optional bytes times = 7 [json_name = "times"];   // JSON carried as it came
}

// GET /api/playtest/log/* 200
message PlayerLogOne {
  optional double at = 1 [json_name = "at"];
  optional PlayerLogOneBy by = 2 [json_name = "by"];
  optional string who = 3 [json_name = "who"];
  optional string unit = 4 [json_name = "unit"];
  optional string state = 5 [json_name = "state"];
  optional int64 amount = 6 [json_name = "amount"];
  optional string summary = 7 [json_name = "summary"];
  optional int64 version = 8 [json_name = "version"];
  optional string id = 9 [json_name = "id"];
  optional PlayerOneDelta delta = 10 [json_name = "delta"];
  optional bool guest = 11 [json_name = "guest"];
  optional double decided_at = 12 [json_name = "decidedAt"];
  optional string decided_by = 13 [json_name = "decidedBy"];
}

message PlayerLogOneBy {
  optional string player = 1 [json_name = "player"];   // or null
  optional string account = 2 [json_name = "account"];   // or null
}

// GET /api/playtest/party 200
message PlayerParty {
  optional int64 party = 1 [json_name = "party"];   // or null
  optional int64 version = 2 [json_name = "version"];
  optional int64 until = 3 [json_name = "until"];
  repeated PlayerPartyMembers members = 4 [json_name = "members"];
}

message PlayerPartyMembers {
  optional string id = 1 [json_name = "id"];
  optional string name = 2 [json_name = "name"];
  optional int64 hp = 3 [json_name = "hp"];   // or null
  optional int64 hp_max = 4 [json_name = "hp_max"];   // or null
  optional bool you = 5 [json_name = "you"];
}

// GET /api/playtest/planets/mine 200
message PlayerPlanetsMine {
  optional PlayerPlanetsMineSaved saved = 1 [json_name = "saved"];   // or null
  optional PlayerPlanets planet = 2 [json_name = "planet"];   // or null
  optional bool invited = 3 [json_name = "invited"];
}

message PlayerPlanetsMineSaved {
  optional double at = 1 [json_name = "at"];
  optional PlayerPlanetsMineSavedDoc doc = 2 [json_name = "doc"];
}

message PlayerPlanetsMineSavedDoc {
  optional string id = 1 [json_name = "id"];
  optional string kind = 2 [json_name = "kind"];
}

// GET /api/playtest/player 200
message PlayerPlayer {
