  optional int64 waves = 5 [json_name = "waves"];
  optional bool leader = 6 [json_name = "leader"];
  optional bool levels = 7 [json_name = "levels"];
  optional int64 reward = 8 [json_name = "reward"];
  optional int64 minutes = 9 [json_name = "minutes"];
  optional int64 cultists = 10 [json_name = "cultists"];
  optional int64 fanatics = 11 [json_name = "fanatics"];
  optional int64 warlocks = 12 [json_name = "warlocks"];
  optional int64 level_cap = 13 [json_name = "level_cap"];
  optional int64 aggression = 14 [json_name = "aggression"];
  optional bool town_damage = 15 [json_name = "town_damage"];
  optional int64 warlock_level = 16 [json_name = "warlock_level"];
