syntax = "proto3";

package openagents.api.v1alpha1;

// What coax/web/api/villa.c answers, route by route (Protocol, GitHub #13250; profile
// api-routes; docs/protocol/api-routes-v1alpha1.md). Each message names the members
// of one answer as they ship: json_name is the key on the wire, a `bytes` member is
// JSON carried as it came, and a member may be absent or null. The messages were
// read off a run of the API suite and are held to every later run:
// proto/verse/api-routes-v1alpha1.json holds real answers and their routes, and
// coax/web/api/routes-goldens.coax holds each answer's keys to its message here.
// A refusal with only its words is ErrorReply (error.proto). Most bodies are built
// in SQL; what the C builds goes through a Coax unit.

// GET /api/villa/garden 200
message VillaGarden {
  repeated VillaGardenPets pets = 1 [json_name = "pets"];
}

message VillaGardenPets {
  optional string born = 1 [json_name = "born"];
  optional string died = 2 [json_name = "died"];
  optional string line = 3 [json_name = "line"];
  optional bool mine = 4 [json_name = "mine"];
  optional string name = 5 [json_name = "name"];
  optional int64 plot = 6 [json_name = "plot"];
  optional string slug = 7 [json_name = "slug"];
  optional VillaPetsOneAvatar avatar = 8 [json_name = "avatar"];
}

// GET /api/villa/memorial/* 200
message VillaMemorialOne {
  optional string born = 1 [json_name = "born"];
  optional string died = 2 [json_name = "died"];
  optional string line = 3 [json_name = "line"];
  optional bool mine = 4 [json_name = "mine"];
  optional string name = 5 [json_name = "name"];
  optional int64 plot = 6 [json_name = "plot"];
  optional string slug = 7 [json_name = "slug"];
  repeated VillaPetsOneMedia media = 8 [json_name = "media"];
  repeated VillaPetsOneNotes notes = 9 [json_name = "notes"];
  optional string story = 10 [json_name = "story"];
  optional VillaPetsOneAvatar avatar = 11 [json_name = "avatar"];
  optional string traits = 12 [json_name = "traits"];
  optional string species = 13 [json_name = "species"];
  optional string achievements = 14 [json_name = "achievements"];
}

// GET /api/villa/pets/* 200
