// GET /api/villa/reports 200
message VillaReports {
  repeated VillaReportsOpen open = 1 [json_name = "open"];
  repeated VillaReportsDecided decided = 2 [json_name = "decided"];
}

message VillaReportsOpen {
  optional string ref = 1 [json_name = "ref"];
  repeated string why = 2 [json_name = "why"];
  optional string kind = 3 [json_name = "kind"];
  optional string shown = 4 [json_name = "shown"];
  optional int64 reports = 5 [json_name = "reports"];
  optional int64 first_ms = 6 [json_name = "first_ms"];
}

message VillaReportsDecided {
  optional string by = 1 [json_name = "by"];
  optional string ref = 2 [json_name = "ref"];
  optional string kind = 3 [json_name = "kind"];
  optional string shown = 4 [json_name = "shown"];
  optional int64 reports = 5 [json_name = "reports"];
  optional bool restore = 6 [json_name = "restore"];
  optional string decision = 7 [json_name = "decision"];
  optional int64 decided_ms = 8 [json_name = "decided_ms"];
}

// GET /api/villa/vases 200
