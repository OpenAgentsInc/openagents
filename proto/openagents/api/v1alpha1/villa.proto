  optional string text = 3 [json_name = "text"];
  optional bool hidden = 4 [json_name = "hidden"];
}

message VillaPetsOneAvatar {
  optional bool tag = 1 [json_name = "tag"];
  optional double body = 2 [json_name = "body"];
  repeated double coat = 3 [json_name = "coat"];
  optional double ears = 4 [json_name = "ears"];
  optional double head = 5 [json_name = "head"];
  optional double legs = 6 [json_name = "legs"];
  optional double size = 7 [json_name = "size"];
  optional double tail = 8 [json_name = "tail"];
  optional double chest = 9 [json_name = "chest"];
  optional double fluff = 10 [json_name = "fluff"];
  optional double girth = 11 [json_name = "girth"];
  repeated double marks = 12 [json_name = "marks"];
  optional double snout = 13 [json_name = "snout"];
  optional string collar = 14 [json_name = "collar"];
  repeated string skills = 15 [json_name = "skills"];
  optional string pattern = 16 [json_name = "pattern"];
  optional double ear_size = 17 [json_name = "ear_size"];
  optional string tail_shape = 18 [json_name = "tail_shape"];
}

message VillaPetsOneEmotes {
  optional string name = 1 [json_name = "name"];
  optional string said = 2 [json_name = "said"];
  optional string text = 3 [json_name = "text"];
  optional string label = 4 [json_name = "label"];
