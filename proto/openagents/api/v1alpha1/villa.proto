  repeated VillaPetsOneFiles files = 9 [json_name = "files"];
  repeated VillaPetsOneMedia media = 10 [json_name = "media"];
  repeated VillaPetsOneNotes notes = 11 [json_name = "notes"];
  optional string story = 12 [json_name = "story"];
  optional VillaPetsOneAvatar avatar = 13 [json_name = "avatar"];
  repeated VillaPetsOneEmotes emotes = 14 [json_name = "emotes"];
  optional string status = 15 [json_name = "status"];
  optional string traits = 16 [json_name = "traits"];
  repeated VillaPetsOneChoices choices = 17 [json_name = "choices"];
  optional string species = 18 [json_name = "species"];
  optional string agent_note = 19 [json_name = "agent_note"];
  optional string achievements = 20 [json_name = "achievements"];
}

message VillaPetsOneFiles {
  optional string id = 1 [json_name = "id"];
  optional bool held = 2 [json_name = "held"];
  optional string kind = 3 [json_name = "kind"];
  optional string name = 4 [json_name = "name"];
  optional string note = 5 [json_name = "note"];
  optional int64 bytes = 6 [json_name = "bytes"];
  optional bool shown = 7 [json_name = "shown"];
  optional string status = 8 [json_name = "status"];
