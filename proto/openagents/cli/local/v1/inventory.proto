syntax = "proto3";
package openagents.cli.local.v1;

// Read-only local JSON projections: docs/protocol/local-inventory-v1.md.
// Observing a process confers no attachment or permission to operate it.
message Agent {
  string engine = 1;
  string name = 2;
  uint64 pid = 3;
  uint64 parent_pid = 4;
  string state = 5; // running
  bool attached = 6; // false in this inventory
}
message Agents {
  string schema = 1; // openagents.coder.agents.v1
  bool ok = 2;
  bool complete = 3;
  string scope = 4; // local_running_processes
  repeated Agent agents = 5; // at most 128
}
message Model {
  string id = 1;
  string kind = 2;
  string name = 3;
  string revision = 4;
  string path = 5;
  bool present = 6;
  uint64 bytes = 7; // weight file bytes; zero when absent
  bool verified = 8;
  bool loaded = 9; // false: inventory does not load a model
}
message Models {
  string schema = 1; // openagents.models.v1
  bool ok = 2;
  repeated Model models = 3;
}
