syntax = "proto3";
package openagents.coder.observability.v2;
import "openagents/options/v1alpha1/options.proto";
import "openagents/options/v1alpha1/json.proto";

// kind "attempt", schema "coder.observability.v2": one finished request
// attempt, never a cumulative snapshot or an invoice
// (docs/protocol/coder-observability-v2.md). Each json_name is the key on the
// wire, and fields are numbered in the order they are written. The one writer
// is coax/lib/agent/session/stream.coax; golden lines are in
// proto/coder/stream-v1.json, and the goldens check writes and reads each one
// through the JSON mapper as well.
message Attempt {
  option (openagents.options.v1alpha1.contract) = "coder.observability.v2";
  option (openagents.options.v1alpha1.json) = "kind=attempt;schema=coder.observability.v2";
  option (openagents.options.v1alpha1.json_int64_numbers) = true;
  optional string scope = 1 [json_name = "scope"];  // "request_attempt"
  optional string engine = 2 [json_name = "engine", (openagents.options.v1alpha1.json_null) = true];  // micro or psionic; null until Coder attaches it
  optional string gateway = 3 [json_name = "gateway"];
  optional string model = 4 [json_name = "model"];  // configured attempt model, not a resolved provider identity.
  optional string model_source = 5 [json_name = "model_source"];  // "attempt_configuration"
  optional string requested_effort = 6 [json_name = "requested_effort", (openagents.options.v1alpha1.json_null) = true];
  optional string outcome = 7 [json_name = "outcome"];
  optional int32 status = 8 [json_name = "status"];
  // A missing or invalid count is null; an explicit zero stays zero.
  optional int64 input_tokens = 9 [json_name = "input_tokens", (openagents.options.v1alpha1.json_null) = true];
  optional int64 output_tokens = 10 [json_name = "output_tokens", (openagents.options.v1alpha1.json_null) = true];
  optional int64 cached_tokens = 11 [json_name = "cached_tokens", (openagents.options.v1alpha1.json_null) = true];
  optional int64 reasoning_tokens = 12 [json_name = "reasoning_tokens", (openagents.options.v1alpha1.json_null) = true];
  optional int64 cache_write_tokens = 13 [json_name = "cache_write_tokens", (openagents.options.v1alpha1.json_null) = true];
  optional int64 provider_cost_usd_micros = 14 [json_name = "provider_cost_usd_micros", (openagents.options.v1alpha1.json_null) = true];
  optional int64 card_estimate_usd_micros = 15 [json_name = "card_estimate_usd_micros", (openagents.options.v1alpha1.json_null) = true];
  // The worker's legacy field: the card estimate again, -1 when there is none.
  optional int64 usd_micros = 16 [json_name = "usd_micros"];
}
