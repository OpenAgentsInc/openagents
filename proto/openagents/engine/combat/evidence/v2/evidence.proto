syntax = "proto3";
package openagents.engine.combat.evidence.v2;
// Zstandard with optional previous-observation dictionary; v1 is unchanged.
message Image {
  uint64 observation = 1;
  string phase = 2;
  string path = 3;
  uint64 bytes = 4;
  uint64 started_ms = 5;
  uint64 ended_ms = 6;
  string codec = 7;
  uint64 base_observation = 8;
}
