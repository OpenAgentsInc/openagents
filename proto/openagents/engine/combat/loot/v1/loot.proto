syntax = "proto3";
package openagents.engine.combat.loot.v1;
// Read-only public UI observations, composed with unchanged combat observation v1.
message Observation {
  uint32 serial = 1;
  uint32 flags = 2;
  uint32 free_general_slots = 3;
  uint32 total_slots = 4;
  uint32 loot_slots = 5;
  uint32 opened = 6;
  uint32 closed = 7;
  uint32 item_events = 8;
  uint32 inventory_full_events = 9;
  uint64 copper = 10;
  uint32 source_npc = 11;
  uint32 source_spawn = 12;
  uint32 item_id = 13;
  uint32 quantity = 14;
  uint32 source_kind = 15;
  uint32 target_epoch = 16;
}
message Outcome { uint32 npc = 1; uint32 spawn = 2; string status = 3; uint32 item_events = 4; uint64 copper_delta = 5; uint32 free_general_slots = 6; }
