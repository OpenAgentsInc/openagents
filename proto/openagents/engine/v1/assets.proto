syntax = "proto3";
package openagents.engine.v1;

// Consumer requirements are compiled into the host, not supplied by an
// untrusted asset manifest. Exact art bytes remain separate and hash-bound.
message RequiredAssetBuffer { string semantic = 1; uint32 byte_stride = 2; }
message RequiredAssetFile {
  string id = 1;
  string path = 2;
  string format = 3;
  repeated string dependencies = 4;
  repeated RequiredAssetBuffer buffers = 5;
}
message ConsumerAssetProfile {
  string id = 1;
  string scene_id = 2;
  repeated RequiredAssetFile files = 3;
}
message AssetProfileCatalog { uint32 schema_version = 1; repeated ConsumerAssetProfile profiles = 2; }
