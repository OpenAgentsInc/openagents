syntax = "proto3";
package openagents.engine.v1;
import "openagents/engine/v1/agent.proto";

message ArtifactReference { string id = 1; string path = 2; string uri = 3; string media_type = 4; string sha256 = 5; }
message InteractionRequest { string id = 1; string tool_id = 2; string kind = 3; string prompt = 4; repeated string options = 5; }
message ConversationSnapshot {
  uint32 schema = 1;
  string id = 2;
  uint64 revision = 3;
  string phase = 4;
  string objective = 5;
  repeated AgentEvent events = 6;
  bool history_truncated = 7;
  string result = 8;
  repeated InteractionRequest interactions = 9;
  repeated ArtifactReference artifacts = 10;
}
// Upserts use stable event IDs and monotonically increasing revisions. Tool
// updates retain the provider call ID; removing history is explicit.
message ConversationDelta {
  uint32 schema = 1;
  string id = 2;
  uint64 base_revision = 3;
  uint64 revision = 4;
  repeated AgentEvent upsert = 5;
  repeated string remove = 6;
  string phase = 7;
  bool history_truncated = 8;
}
message HudBar { string id = 1; string label = 2; string kind = 3; string text = 4; double value = 5; double max = 6; }
message HudCounter { string id = 1; string label = 2; string value = 3; }
message HudPrompt { string id = 1; string verb = 2; string key = 3; bool hold = 4; optional double progress = 5; }
message HudAction { string id = 1; string label = 2; bool enabled = 3; bool pressed = 4; bool shown = 5; }
message HudInvocation { uint32 schema = 1; string world = 2; string action_id = 3; string request_id = 4; uint64 revision = 5; }
message HudSpeech { string speaker = 1; string text = 2; repeated string replies = 3; }
message HudScreen { string kind = 1; string title = 2; string detail = 3; repeated string actions = 4; }
message HudGuide { string target = 1; string text = 2; }
message HudRect { repeated double values = 1; }
message HudPoint { double x = 1; double z = 2; }
message HudMark { double x = 1; double z = 2; string kind = 3; string label = 4; }
message HudMap {
  repeated double bounds = 1; optional double grid = 2; repeated HudRect rects = 3;
  repeated HudMark marks = 4; repeated double self = 5; string caption = 6;
  optional uint32 plan = 7; repeated HudPoint route = 8;
}
message HudToast { uint32 id = 1; string text = 2; double seconds = 3; }
message HudHit { uint32 id = 1; double angle = 2; double amount = 3; }
// Reusable engine HUD state, shared by all worlds and renderers. No layout or
// executable behavior is encoded here; the engine admits actions separately.
message HudFrame {
  string world = 1; repeated HudBar bars = 2; repeated HudCounter counters = 3;
  string objective = 4; string quest = 5; HudPrompt prompt = 6; HudSpeech speech = 7;
  HudScreen screen = 8; HudGuide guide = 9; repeated HudAction actions = 10;
  HudMap map = 11; repeated HudToast toasts = 12; repeated HudHit hits = 13;
}
