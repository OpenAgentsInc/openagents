syntax = "proto3";
package openagents.environment.access.v1alpha1;

// Explicit shared-user bootstrap profile. It does not attest ENV readiness or
// implement the complete SESS artifact family. No frozen HOST/SESS shape changes.
// Carried in HOST app.rpc; method/right mapping is closed in the Coax policy.
message RuntimeRequest {
  string method = 1 [json_name = "method"]; // DescribeEnvironment, ListSessions, ReadSession,
                    // ReadSubagent, OpenSession, SendMessage, StopTurn, StopSubagent, RespondInteraction
  string workspace_id = 2 [json_name = "workspace_id"]; // configured canonical workspace ID, never a path
  string session_id = 3 [json_name = "session_id"]; // 32 lowercase hex managed ID or native UUID
  string command_id = 4 [json_name = "command_id"]; // 32 lowercase hex, caller retained across retries
  int64 generation = 5 [json_name = "generation"]; // >0 for a managed operation
  int64 expected_revision = 6 [json_name = "expected_revision"];
  string text = 7 [json_name = "text"]; // 1..16384 UTF-8 bytes, nonblank and no NUL for submit
  string interaction_id = 8 [json_name = "interaction_id"];
  bool allow = 9 [json_name = "allow"];
  int64 before = 10 [json_name = "before"];
  int64 expires_at_ms = 11 [json_name = "expires_at_ms"]; // max five-minute logical intent, unchanged on retry
  int64 issued_at_ms = 12 [json_name = "issued_at_ms"]; // host allows 60 seconds of caller skew; reads use zero
  // OpenSession/SendMessage only. Absent: the conversation keeps its own (a new one
  // starts on the computer's default). Present: a model_id/effort_id from the view's
  // offer, [a-z0-9.-]; one the computer does not offer is refused model_unavailable.
  // Writers omit them when unset, so a request without them is unchanged on the wire.
  optional string model = 13 [json_name = "model"];
  optional string effort = 14 [json_name = "effort"];
  // OpenSession only: a folder the computer offered (RuntimeView.folders), relative to the bound
  // workspace, plain segments, none empty, hidden, "." or ".."; absent opens the workspace itself.
  optional string folder = 15 [json_name = "folder"];
  // ReadSubagent and StopSubagent only, and required there: the ReadSession item_id of the call
  // that started a sub-agent. ReadSubagent's view's items are that agent's calls (role tool) and
  // words (assistant), a page of at most 24 back from the newest; next_cursor counts the rows
  // before the page, and complete says the agent has finished. A computer that keeps no such
  // transcript refuses not_found. StopSubagent (#13776) stops that one sub-agent of a Coder
  // Desktop chat's running turn; an older computer refuses the method.
  optional string item_id = 16 [json_name = "item_id"];
}
message RuntimeItem {
  string item_id = 1 [json_name = "item_id"];
  string role = 2 [json_name = "role"]; // user, assistant, tool, notice
  string text = 3 [json_name = "text"];
  string tool_name = 4 [json_name = "tool_name"];
  bool complete = 5 [json_name = "complete"];
  // A call still running: when it began on the computer, Unix ms. Absent once it is done and from
  // an older computer; a reader shows how long it has run. `complete` is about the text only.
  optional int64 started_at_ms = 6 [json_name = "started_at_ms"];
  // A sub-agent's call: the calls its agent has made so far and the newest one ("Bash ls -la").
  // Absent for any other item and from an older computer; subagent_now never comes without a count.
  optional int64 subagent_calls = 7 [json_name = "subagent_calls"];
  optional string subagent_now = 8 [json_name = "subagent_now"]; // at most 160 bytes
  // An edit's or a write's file and what it changed: "-" lines, then "+" lines, whole lines, at most
  // 4000 bytes; diff_cut says it was longer. Absent for any other item and from an older computer.
  optional string path = 9 [json_name = "path"]; // at most 512 bytes
  optional string diff = 10 [json_name = "diff"];
  optional bool diff_cut = 11 [json_name = "diff_cut"]; // only with a diff
  // A notice's kind, on a notice item only: "install" (the agent's CLI is not installed on the
  // computer), "login" (it is signed out there) or "limit" (its usage limit). A reader draws it as
  // a setup notice, never as the agent's reply. Absent for any other notice and from an older computer.
  optional string notice_kind = 12 [json_name = "notice_kind"];
}
// A turn's thinking. A v1alpha1 reader draws any role but user, assistant, tool and notice as a
// reply, so thoughts never travel in items: each sits beside them, before the item at `at` (an
// index into items; at == len(items) is after the last). Readers put them back in place.
message RuntimeThought {
  string item_id = 1 [json_name = "item_id"];
  string text = 2 [json_name = "text"];
  bool complete = 3 [json_name = "complete"];
  int64 at = 4 [json_name = "at"]; // non-decreasing across thoughts
}
message RuntimeSession {
  string session_id = 1 [json_name = "session_id"];
  string workspace_id = 2 [json_name = "workspace_id"];
  string title = 3 [json_name = "title"];
  string origin = 4 [json_name = "origin"]; // managed or observed-native
  string control = 5 [json_name = "control"]; // available, observe-only, unknown
  int64 generation = 6 [json_name = "generation"];
  int64 revision = 7 [json_name = "revision"];
  bool busy = 8 [json_name = "busy"];
  string interaction_id = 9 [json_name = "interaction_id"];
  int64 updated_at_ms = 10 [json_name = "updated_at_ms"];
  optional string model = 11 [json_name = "model"]; // the managed conversation's model_id
  optional string effort = 12 [json_name = "effort"]; // its effort_id; absent for a model with none
  // "coder-desktop" for a Coder Desktop chat the daemon runs (session_id desktop-RUN); absent otherwise.
  // On one, SendMessage steers a running turn or starts a follow-up, StopTurn stops it, and
  // StopSubagent stops one of its sub-agents.
  optional string surface = 13 [json_name = "surface"];
}
// One effort level the computer's Claude takes.
message RuntimeEffort {
  string effort_id = 1 [json_name = "effort_id"]; // low, medium, high, xhigh, max, ultracode, ultrathink
  string display_name = 2 [json_name = "display_name"];
}
// One model the computer's Claude starts a turn on; "default" is the CLI's own choice.
message RuntimeModel {
  string model_id = 1 [json_name = "model_id"];
  string display_name = 2 [json_name = "display_name"];
  repeated string efforts = 3 [json_name = "efforts"]; // effort_ids it takes, each listed in the view's efforts
}
message RuntimeView {
  string schema = 1 [json_name = "schema"]; // openagents.environment.runtime.v1alpha1
  string host_pubkey = 2 [json_name = "host_pubkey"];
  string display_name = 3 [json_name = "display_name"];
  string method = 4 [json_name = "method"];
  repeated RuntimeSession sessions = 5 [json_name = "sessions"]; // at most 128
  repeated RuntimeItem items = 6 [json_name = "items"]; // bounded complete page, no silent clipping
  string error = 7 [json_name = "error"]; // closed refusal code, empty only on success
  bool complete = 8 [json_name = "complete"];
  string next_cursor = 9 [json_name = "next_cursor"];
  string command_id = 10 [json_name = "command_id"];
  string command_status = 11 [json_name = "command_status"]; // accepted, completed, unknown, refused
  string source_epoch = 12 [json_name = "source_epoch"]; // observed page cut; never a SESS generation
  // The offer: written together or not at all (an older computer sends none).
  repeated RuntimeEffort efforts = 13 [json_name = "efforts"]; // at most 8
  optional string default_effort = 14 [json_name = "default_effort"];
  repeated RuntimeModel models = 15 [json_name = "models"]; // at most 12
  // Absent from an older computer; items plus thoughts are at most 64.
  repeated RuntimeThought thoughts = 16 [json_name = "thoughts"];
  // DescribeEnvironment and ListSessions: the workspace's visible folders a session may open in, at
  // most 24; absent from an older computer.
  repeated string folders = 17 [json_name = "folders"];
}
// Private local configuration; never returned in a RuntimeView.
message RuntimeConfiguration {
  string schema = 1 [json_name = "schema"]; // openagents.environment.configuration.v1alpha1
  string device = 2 [json_name = "device"];
  string grant = 3 [json_name = "grant"];
  string workspace = 4 [json_name = "workspace"]; // canonical root selected by the local operator
  string display_name = 5 [json_name = "display_name"];
  bool enabled = 6 [json_name = "enabled"];
  string history_root = 7 [json_name = "history_root"]; // separately approved canonical read-only history tree
}
message CatalogEntry { string host_pubkey = 1 [json_name = "host_pubkey"]; string display_name = 2 [json_name = "display_name"]; }
message RuntimeCatalog {
  string schema = 1 [json_name = "schema"]; // openagents.environment.catalog.v1alpha1
  repeated CatalogEntry environments = 2 [json_name = "environments"]; // max 64, routes/secrets never included
}
