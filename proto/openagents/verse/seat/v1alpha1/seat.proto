syntax = "proto3";
package openagents.verse.seat.v1alpha1;

import "openagents/options/v1alpha1/options.proto";

// A seat in a running realm (compliance plan step E11, GitHub #13250;
// docs/metaverse/realm-seat.md): an agent's place in a made realm, opened by its
// account. coax/web/api/seats.c serves the routes; migration 0110 keeps the
// seats. coax/lib/media/seat-wire.coax is the one writer and reader of every
// body here; proto/verse/realm-seat-v1alpha1.json pins the bytes, checked
// through the codec (coax/web/api/seat-wire-goldens.coax) and through the
// running API (coax/web/api/test_room.py).
//
//   POST /api/playtest/seats             OpenRequest -> Grant
//   GET  /api/playtest/seats             SeatsReply
//   POST /api/playtest/seats/<id>/keep   Kept
//   POST /api/playtest/seats/<id>/close  Closed
// For a hosted seat the API asks the runner that holds its page
// (coax/web/agent/seat-runner.c, through coax/web/agent/seat-runner-wire.coax):
//   POST /seat/open    RunnerOpen
//   POST /seat/act     RunnerAct
//   POST /seat/close   RunnerClose -> Closed
// and the runner starts the seat's own process (oa-seat, coax/web/agent/seat.coax)
// with one line on its stdin, SeatStart.
// A refusal, the API's or the runner's, is the API's ErrorReply
// (openagents/api/v1alpha1/error.proto).
//
// The server builds Grant and SeatsReply in SQL and answers jsonb's text:
// keys by length, then by bytes, with ", " and ": " between items. The fields
// below are in that order. RunnerAct is SQL's too. What seats.c writes itself
// (Kept, Closed, RunnerClose, and RunnerOpen around the grant) is compact, and
// so is SeatStart around its player. json_name is the key on the wire.

// POST /api/playtest/seats: the made realm to sit in. `hosted` true asks for
// a seat whose page the runner holds; left out, the caller holds the page.
message OpenRequest {
  optional string slug = 1 [json_name = "slug", (openagents.options.v1alpha1.max_bytes) = 48];
  optional bool hosted = 2 [json_name = "hosted"];
}

// The seat's own player, minted for the account when the seat opens. The key
// works only while the seat is open. A hosted seat's key goes to the runner
// and is left out of what the caller gets.
message Player {
  optional string id = 1 [json_name = "id", (openagents.options.v1alpha1.max_bytes) = 64];
  optional string key = 2 [json_name = "key", (openagents.options.v1alpha1.max_bytes) = 128];
}

// 200 from POST /api/playtest/seats: the seat. `until` is the Unix time in
// milliseconds when it closes if it is not kept.
message Grant {
  optional int64 id = 1 [json_name = "id"];
  optional string slug = 2 [json_name = "slug", (openagents.options.v1alpha1.max_bytes) = 48];
  optional int64 until = 3 [json_name = "until"];
  optional bool hosted = 4 [json_name = "hosted"];
  optional Player player = 5 [json_name = "player"];
}

// One of the account's open seats.
message Seat {
  optional int64 id = 1 [json_name = "id"];
  optional string slug = 2 [json_name = "slug", (openagents.options.v1alpha1.max_bytes) = 48];
  optional bool hosted = 3 [json_name = "hosted"];
  optional int64 kept_ms = 4 [json_name = "kept_ms"];
  optional int64 opened_ms = 5 [json_name = "opened_ms"];
}

// GET /api/playtest/seats: the account's open seats, newest first; none is
// {"seats": []}.
message SeatsReply {
  repeated Seat seats = 1 [json_name = "seats"];
}

// 200 from .../keep: {"kept":true}.
message Kept {
  optional bool kept = 1 [json_name = "kept"];
}

// 200 from .../close, and from the runner's /seat/close: {"closed":true}.
message Closed {
  optional bool closed = 1 [json_name = "closed"];
}

// The API to the runner, POST /seat/open: the grant with its key, as SQL
// wrote it, and the site the seat's page loads from.
message RunnerOpen {
  optional Grant seat = 1 [json_name = "seat"];
  optional string origin = 2 [json_name = "origin"];
}

// The API to the runner, POST /seat/close: {"id":7}.
message RunnerClose {
  optional int64 id = 1 [json_name = "id"];
}

// One action for a seat: the body of POST /api/playtest/seats/<id>/act, and a
// line to a seat's own process. coax/lib/media/realm_seat_wire.coax writes it
// (seatw_action_json: the CLI and the realm's page) and reads it
// (seatw_read_action: coax/lib/media/realm_seat.coax). `op` is see, look, go,
// say, use, bye, jump, shot or leave, and the other members are the ones that
// op takes. A writer puts token first, then op, turn, pitch, x, z, to, max,
// words, tool, thing, out, shot; the server passes it on as jsonb's text.
message Action {
  optional string op = 1 [json_name = "op"];
  // look: degrees to turn right (negative: left), -180 to 180.
  optional double turn = 2 [json_name = "turn"];
  // look: degrees to look up (positive) or down, -60 to 60, in first person.
  optional double pitch = 3 [json_name = "pitch"];
  // go: a character's name, "character:0", "entity:12" or a kind; or x and z.
  optional string to = 4 [json_name = "to"];
  // go: seconds to walk at most (10 when left out, at most 30).
  optional double max = 5 [json_name = "max"];
  optional double x = 6 [json_name = "x"];
  optional double z = 7 [json_name = "z"];
  // say: the words, to the character within reach.
  optional string words = 8 [json_name = "words"];
  // use: jump, map or build, and with build the thing to place.
  optional string tool = 9 [json_name = "tool"];
  optional string thing = 10 [json_name = "thing"];
  // shot: the file a screenshot goes to; any action may carry `shot`.
  optional string out = 11 [json_name = "out"];
  optional string shot = 12 [json_name = "shot"];
  // The CLI's token for a seat it holds itself, on this computer; it sends
  // the member empty for a hosted seat, and the seat does not read it.
  optional string token = 13 [json_name = "token"];
}

// One thing near a seat: a character (`kind` "character", `id` "character:0",
// with its name and role when the realm's spec names it) or an entity (`kind`
// tree, rock, prop, building, house, dwelling, lantern, placed or centre, `id`
// "entity:12"). `d` is metres away and `bearing` degrees off the seat's
// facing (negative: left), each to one decimal place.
message Near {
  optional string kind = 1 [json_name = "kind"];
  optional string id = 2 [json_name = "id"];
  optional string name = 3 [json_name = "name", (openagents.options.v1alpha1.max_bytes) = 32];
  optional string role = 4 [json_name = "role", (openagents.options.v1alpha1.max_bytes) = 48];
  optional double d = 5 [json_name = "d"];
  optional double bearing = 6 [json_name = "bearing"];
}

// What a seat answers an action with (200 from .../act, and each line a seat
// prints): one JSON line, compact, its members in this order, every number to
// one decimal place. `ok` false: the action was refused or failed and `result`
// says why. `at` is x and z in metres and `facing` degrees; `pitch` is there
// only in a first-person camera. `camera` is third, first, top, side or
// unknown; `tools` are the realm's, of build, fly, jump, map, talk and voice.
// `talking` is the character the seat talks to and `answer` what it last said,
// each null when there is none. `others` and `agents` count who else is in
// the realm's room. `near` is nearest first, at most 16.
message Observation {
  optional string op = 1 [json_name = "op"];
  optional bool ok = 2 [json_name = "ok"];
  optional string result = 3 [json_name = "result", (openagents.options.v1alpha1.max_bytes) = 200];
  optional string realm = 4 [json_name = "realm", (openagents.options.v1alpha1.max_bytes) = 80];
  repeated double at = 5 [json_name = "at"];
  optional double facing = 6 [json_name = "facing"];
  optional double pitch = 7 [json_name = "pitch"];
  optional string camera = 8 [json_name = "camera"];
  repeated string tools = 9 [json_name = "tools"];
  optional string talking = 10 [json_name = "talking"];
  optional string answer = 11 [json_name = "answer", (openagents.options.v1alpha1.max_bytes) = 1200];
  optional int64 others = 12 [json_name = "others"];
  optional int64 agents = 13 [json_name = "agents"];
  repeated Near near = 14 [json_name = "near"];
}

// The API to the runner, POST /seat/act: the seat and one action, as SQL
// wrote them (jsonb's text; the action is the caller's object, its keys in
// jsonb's order).
message RunnerAct {
  optional int64 id = 1 [json_name = "id"];
  optional Action action = 2 [json_name = "action"];
}

// The runner to the seat's own process, the first line on its stdin: the
// site the page loads from, the realm, and the seat's player with its key
// (as the grant spelled it). `phone` true asks for a phone-sized page; the
// runner leaves it out.
message SeatStart {
  optional string origin = 1 [json_name = "origin"];
  optional string slug = 2 [json_name = "slug", (openagents.options.v1alpha1.max_bytes) = 64];
  optional Player player = 3 [json_name = "player"];
  optional bool phone = 4 [json_name = "phone"];
}
